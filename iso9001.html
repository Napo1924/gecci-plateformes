## 12.4 Système intégré

Les éléments communs aux normes gardent la même logique, avec un code propre à chaque norme (Q, E, S, H). Dans un système intégré QSE ou QSSE, on fusionne :

| Élément commun | ISO 9001 (Q) | Fusion recommandée |
|---|---|---|
| Maîtrise documentaire | PRO-Q-01 | Une procédure unique QSE, liste maîtresse commune |
| Contexte et parties intéressées | REG-Q-01, REG-Q-02 | Registres communs avec colonne « norme » |
| Risques et opportunités | REG-Q-03 | Registre commun, cotations propres à chaque norme |
| Compétences | REG-Q-05, PLAN-Q-02 | Plan de formation unique |
| Audit interne | PRO-Q-15 | Audits combinés, auditeurs multi-normes |
| Revue de direction | PRO-Q-16 | Une revue intégrée |
| NC et actions correctives | PRO-Q-17, REG-Q-09 | Un registre unique |
| Changements | PRO-Q-04 | Une procédure commune |

La correspondance est tenue dans **MAT-Q-03**.

**Référentiels agricoles** : pour une coopérative certifiée Rainforest Alliance, Fairtrade ou RSPO, ISO 9001 apporte la structure de gestion (processus, documents, audit interne, actions correctives) sur laquelle s'appuient les exigences propres à ces référentiels (traçabilité, système de gestion interne, gouvernance). Les exigences de ces référentiels restent à traiter selon leurs propres textes ; ISO 9001 ne les remplace pas.

## 12.5 Base de connaissances et modèles sectoriels

GEC-CI tient des modèles adaptés par secteur : coopérative cacao-café, usine de cajou, unité de broyage de cacao, transporteur, PME de services, hôtel-restaurant. Chaque modèle comprend une cartographie, un registre de risques pré-rempli, un plan de contrôle type et les exigences légales à vérifier. Les retours d'expérience des missions sont capitalisés (sans données confidentielles des clients).

r associé", "Bilan d'atteinte"], "registre": "PLAN-Q-01", "responsable": "Pilotes de processus", "risque": "Moyen", "question": "Chaque objectif a-t-il un plan d'actions avec responsable, échéance et moyens ?", "nouveau": "", "confirmer": false}, {"code": "6.3", "chapitre": "6", "titre": "Planification des modifications", "resume": "Tout changement du système est préparé : but, conséquences, intégrité du système, ressources, responsabilités, communication, suivi et revue après mise en place.", "doc": "", "preuves": ["Fiche de demande de changement", "Registre des changements", "Revue post-changement"], "registre": "REG-Q-11", "responsable": "Direction / RQ", "risque": "Élevé", "question": "Quand vous changez une machine, un fournisseur, un processus ou un responsable, analysez-vous l'impact par écrit avant d'agir ?", "nouveau": "Maîtrise des changements renforcée en 2026 : communication, surveillance, évaluation et revue des changements ; libellé exact À CONFIRMER.", "confirmer": true}, {"code": "7.1.1", "chapitre": "7", "titre": "Ressources — généralités", "resume": "L'entreprise détermine et fournit les ressources nécessaires, en tenant compte de ce qu'elle a déjà et de ce qu'elle doit obtenir de l'extérieur.", "doc": "", "preuves": ["Budget ou plan de ressources", "Analyse des besoins en revue de direction", "Décisions d'investissement"], "registre": "RAP-Q-02", "responsable": "Direction", "risque": "Moyen", "question": "Les besoins en personnel, matériel et budget pour la qualité sont-ils discutés et décidés chaque année ?", "nouveau": "Chapitre 7 restructuré en 2026 (peu de changements de fond annoncés) ; numérotation À CONFIRMER.", "confirmer": true}, {"code": "7.1.2", "chapitre": "7", "titre": "Ressources humaines", "resume": "Le personnel nécessaire au fonctionnement des processus et du système est disponible en nombre suffisant.", "doc": "", "preuves": ["Organigramme et effectifs", "Plan de remplacement des postes clés", "Gestion des absences et saisonniers"], "registre": "REG-Q-05", "responsable": "RH / Direction", "risque": "Moyen", "question": "Avez-vous assez de personnel formé, y compris pour remplacer les postes clés en cas d'absence ?", "nouveau": "", "confirmer": false}, {"code": "7.1.3", "chapitre": "7", "titre": "Infrastructure", "resume": "Bâtiments, équipements, véhicules, logiciels et moyens de communication nécessaires sont fournis et entretenus pour obtenir des produits et services conformes.", "doc": "", "preuves": ["Inventaire des équipements", "Plan et fiches de maintenance", "Historique des pannes"], "registre": "REG-Q-14", "responsable": "Resp. maintenance", "risque": "Élevé", "question": "Avez-vous un plan de maintenance préventive écrit et suivi pour vos équipements et véhicules ?", "nouveau": "", "confirmer": false}, {"code": "7.1.4", "chapitre": "7", "titre": "Environnement de mise en œuvre des processus", "resume": "Les conditions humaines et physiques (chaleur, propreté, éclairage, stress, relations) favorables à la conformité sont définies et maintenues.", "doc": "", "preuves": ["Conditions définies par poste", "Observations terrain", "Actions sur le climat social"], "registre": "REG-Q-14", "responsable": "Resp. production / RH", "risque": "Faible", "question": "Les conditions de travail nécessaires (propreté, température, calme) sont-elles définies et vérifiées ?", "nouveau": "La culture qualité et l'éthique sont citées pour l'environnement des processus (selon LRQA) ; À CONFIRMER.", "confirmer": true}, {"code": "7.1.5.1", "chapitre": "7", "titre": "Ressources de surveillance et de mesure — généralités", "resume": "Les instruments et méthodes de mesure sont adaptés au contrôle réalisé et maintenus en état ; les preuves de leur aptitude sont conservées.", "doc": "Information documentée conservée prouvant l'aptitude", "preuves": ["Liste des instruments", "Fiches de vie", "Contrôles d'aptitude"], "registre": "REG-Q-06", "responsable": "RQ / Resp. maintenance", "risque": "Élevé", "question": "Avez-vous la liste de tous vos instruments de mesure (balances, humidimètres, thermomètres) avec leur état ?", "nouveau": "", "confirmer": false}, {"code": "7.1.5.2", "chapitre": "7", "titre": "Traçabilité de la mesure", "resume": "Quand la fiabilité de la mesure est critique, les instruments sont étalonnés ou vérifiés à intervalles définis, identifiés, protégés ; l'impact d'un instrument faux est évalué.", "doc": "Base de l'étalonnage conservée si aucun étalon international ou national n'existe", "preuves": ["Certificats d'étalonnage / vérification", "Étiquettes de statut", "Analyse d'impact des instruments hors tolérance"], "registre": "REG-Q-06", "responsable": "RQ", "risque": "Élevé", "question": "Vos balances et appareils de mesure ont-ils un certificat d'étalonnage ou de vérification valide et une étiquette visible ?", "nouveau": "", "confirmer": false}, {"code": "7.1.6", "chapitre": "7", "titre": "Connaissances organisationnelles", "resume": "Le savoir-faire nécessaire est identifié, conservé, partagé et enrichi, y compris pour éviter les pertes lors des départs et suivre les évolutions.", "doc": "", "preuves": ["Registre des connaissances et retours d'expérience", "Modes opératoires", "Tutorat / binômes"], "registre": "REG-Q-15", "responsable": "RQ / RH", "risque": "Moyen", "question": "Si votre meilleur technicien part demain, son savoir-faire est-il écrit quelque part ?", "nouveau": "Traitement élargi des connaissances, reliées aux résultats attendus du SMQ (selon CQI) ; À CONFIRMER.", "confirmer": true}, {"code": "7.2", "chapitre": "7", "titre": "Compétences", "resume": "Les compétences requises par poste sont définies, acquises par formation ou expérience, l'efficacité des actions est évaluée et les preuves conservées.", "doc": "Preuves de compétence conservées", "preuves": ["Fiches de poste avec compétences", "Attestations, évaluations", "Évaluation de l'efficacité des formations"], "registre": "REG-Q-05", "responsable": "RH", "risque": "Élevé", "question": "Pouvez-vous prouver pour chaque poste clé que la personne a la compétence requise ?", "nouveau": "", "confirmer": false}, {"code": "7.3", "chapitre": "7", "titre": "Sensibilisation", "resume": "Chacun connaît la politique, les objectifs qui le concernent, sa contribution, les conséquences d'un écart, ainsi que la culture qualité et le comportement éthique attendus.", "doc": "", "preuves": ["Feuilles d'émargement des sensibilisations", "Entretiens avec le personnel", "Charte éthique signée"], "registre": "REG-Q-05", "responsable": "RQ / RH", "risque": "Moyen", "question": "Vos employés savent-ils ce qui arrive au client si leur travail est mal fait, et connaissent-ils les règles d'éthique ?", "nouveau": "Sensibilisation à la culture qualité et au comportement éthique ajoutée (2026) ; libellé À CONFIRMER.", "confirmer": true}, {"code": "7.4", "chapitre": "7", "titre": "Communication", "resume": "L'entreprise décide quoi communiquer, quand, à qui, comment et par qui, en interne comme en externe, pour le système qualité.", "doc": "", "preuves": ["Matrice de communication", "Comptes rendus de réunions", "Communications clients et fournisseurs"], "registre": "MAT-Q-02", "responsable": "RQ / Direction", "risque": "Faible", "question": "Avez-vous défini qui informe qui, sur quoi et par quel canal (réunion, WhatsApp, affichage) ?", "nouveau": "", "confirmer": false}, {"code": "7.5.1", "chapitre": "7", "titre": "Information documentée — généralités", "resume": "Le système contient les documents exigés par la norme et ceux que l'entreprise juge nécessaires, en quantité adaptée à sa taille et à sa complexité.", "doc": "", "preuves": ["Liste maîtresse", "Documents exigés présents", "Justification du niveau de documentation"], "registre": "REG-Q-04", "responsable": "RQ", "risque": "Moyen", "question": "Avez-vous une liste unique de tous vos documents et enregistrements qualité ?", "nouveau": "", "confirmer": false}, {"code": "7.5.2", "chapitre": "7", "titre": "Création et mise à jour", "resume": "Chaque document est identifié (titre, code, date, auteur), dans un format adapté, revu et approuvé avant diffusion.", "doc": "", "preuves": ["Cartouche avec code, version, date", "Visa de vérification et d'approbation", "Historique des modifications"], "registre": "REG-Q-04", "responsable": "RQ", "risque": "Faible", "question": "Chaque document porte-t-il un code, une version et une signature d'approbation ?", "nouveau": "", "confirmer": false}, {"code": "7.5.3", "chapitre": "7", "titre": "Maîtrise de l'information documentée", "resume": "Les documents sont disponibles là où il faut, protégés, versionnés, archivés, conservés pendant une durée définie puis éliminés ; les documents externes sont maîtrisés.", "doc": "", "preuves": ["Règles de diffusion et d'accès", "Sauvegardes informatiques", "Durées de conservation définies"], "registre": "REG-Q-04", "responsable": "RQ", "risque": "Moyen", "question": "Seule la dernière version des documents est-elle utilisée sur le terrain, et vos données sont-elles sauvegardées ?", "nouveau": "", "confirmer": false}, {"code": "8.1", "chapitre": "8", "titre": "Planification et maîtrise opérationnelles", "resume": "Les activités de réalisation sont planifiées : exigences, critères d'acceptation, ressources, contrôles, enregistrements, maîtrise des changements prévus et des processus externalisés.", "doc": "Information documentée nécessaire pour avoir confiance dans la réalisation", "preuves": ["Plans de production ou de prestation", "Plans de contrôle", "Gestion des changements imprévus"], "registre": "PLAN-Q-04", "responsable": "Resp. production / exploitation", "risque": "Élevé", "question": "Avez-vous défini par écrit, pour chaque produit ou service, ce qui doit être contrôlé et quand ?", "nouveau": "Chapitre 8 : changements limités à la terminologie et à la mise en page (selon SGS) ; numérotation À CONFIRMER.", "confirmer": true}, {"code": "8.2.1", "chapitre": "8", "titre": "Communication avec les clients", "resume": "L'entreprise informe ses clients sur les produits et services, gère demandes, contrats, retours et réclamations, protège leur propriété et prévoit les situations d'urgence.", "doc": "", "preuves": ["Catalogue / fiches techniques", "Canaux de contact définis", "Plan d'urgence client (retard, rappel)"], "registre": "REG-Q-08", "responsable": "Resp. commercial", "risque": "Moyen", "question": "Vos clients savent-ils à qui s'adresser pour une commande, un problème ou une réclamation ?", "nouveau": "", "confirmer": false}, {"code": "8.2.2", "chapitre": "8", "titre": "Détermination des exigences", "resume": "Avant de promettre, l'entreprise définit les exigences du produit ou service, y compris légales, et vérifie qu'elle peut tenir ses promesses.", "doc": "", "preuves": ["Spécifications produits/services", "Exigences légales identifiées", "Analyse de capacité"], "registre": "REG-Q-10", "responsable": "Resp. commercial / RQ", "risque": "Moyen", "question": "Connaissez-vous toutes les exigences (client, légales, normes) de ce que vous vendez ?", "nouveau": "", "confirmer": false}, {"code": "8.2.3.1", "chapitre": "8", "titre": "Revue des exigences", "resume": "Avant d'accepter une commande, l'entreprise vérifie qu'elle peut satisfaire toutes les exigences, explicites ou implicites, et lève les écarts avec le client.", "doc": "", "preuves": ["Fiche de revue de contrat signée", "Bons de commande confirmés", "Écarts résolus par écrit"], "registre": "REG-Q-04", "responsable": "Resp. commercial", "risque": "Élevé", "question": "Vérifiez-vous systématiquement délais, quantités et spécifications avant d'accepter une commande ?", "nouveau": "", "confirmer": false}, {"code": "8.2.3.2", "chapitre": "8", "titre": "Traces de la revue des exigences", "resume": "Les résultats de la revue et toute nouvelle exigence du client sont conservés par écrit.", "doc": "Information documentée conservée sur les résultats de la revue et les nouvelles exigences", "preuves": ["FOR-Q-02 archivées", "Avenants", "Échanges écrits confirmés"], "registre": "REG-Q-04", "responsable": "Resp. commercial", "risque": "Moyen", "question": "Gardez-vous une trace écrite de chaque commande acceptée et de ses modifications ?", "nouveau": "", "confirmer": false}, {"code": "8.2.4", "chapitre": "8", "titre": "Modification des exigences", "resume": "Quand une exigence change, les documents sont mis à jour et les personnes concernées informées.", "doc": "", "preuves": ["Avenants", "Diffusion aux équipes", "Documents mis à jour"], "registre": "REG-Q-11", "responsable": "Resp. commercial", "risque": "Moyen", "question": "Quand un client modifie sa commande, l'atelier ou l'équipe terrain est-il informé par écrit ?", "nouveau": "", "confirmer": false}, {"code": "8.3.1", "chapitre": "8", "titre": "Conception et développement — généralités", "resume": "Si l'entreprise crée de nouveaux produits ou services, elle met en place un processus de conception ; sinon elle justifie la non-applicabilité.", "doc": "", "preuves": ["Processus de conception défini (PRO-Q-09, bonne pratique GEC-CI) ou justification de non-applicabilité", "Liste des projets", "Responsable désigné"], "registre": "REG-Q-04", "responsable": "Direction / Resp. technique", "risque": "Moyen", "question": "Créez-vous vous-même de nouveaux produits, recettes, formules ou offres de service ?", "nouveau": "", "confirmer": false}, {"code": "8.3.2", "chapitre": "8", "titre": "Planification de la conception", "resume": "Les étapes, revues, vérifications, validations, responsabilités, ressources, implication des clients et documents attendus du projet sont planifiés.", "doc": "Information documentée pour démontrer le respect des exigences de conception", "preuves": ["Planning de projet", "Revues de conception", "Responsabilités"], "registre": "REG-Q-04", "responsable": "Resp. technique", "risque": "Moyen", "question": "Vos projets de nouveaux produits ont-ils un planning avec étapes de revue ?", "nouveau": "", "confirmer": false}, {"code": "8.3.3", "chapitre": "8", "titre": "Éléments d'entrée de la conception", "resume": "Les besoins fonctionnels, de performance, légaux, issus de l'expérience et les conséquences d'échec sont définis, complets et non contradictoires.", "doc": "Éléments d'entrée conservés", "preuves": ["Cahier des charges", "Exigences légales", "Retours d'expérience"], "registre": "REG-Q-04", "responsable": "Resp. technique", "risque": "Moyen", "question": "Avez-vous un cahier des charges écrit avant de développer un nouveau produit ?", "nouveau": "", "confirmer": false}, {"code": "8.3.4", "chapitre": "8", "titre": "Maîtrise de la conception", "resume": "Revues, vérifications et validations sont réalisées pour s'assurer que le résultat répond aux entrées et à l'usage prévu ; les problèmes sont traités.", "doc": "Enregistrements des revues, vérifications et validations", "preuves": ["Comptes rendus de revue", "Essais et prototypes", "Validation client ou terrain"], "registre": "REG-Q-04", "responsable": "Resp. technique", "risque": "Élevé", "question": "Testez-vous un nouveau produit chez un client ou en conditions réelles avant de le lancer ?", "nouveau": "", "confirmer": false}, {"code": "8.3.5", "chapitre": "8", "titre": "Éléments de sortie de la conception", "resume": "Les résultats (plans, fiches, recettes, critères d'acceptation, caractéristiques essentielles) permettent de produire et de contrôler.", "doc": "Éléments de sortie conservés", "preuves": ["Fiches techniques", "Critères d'acceptation", "Instructions de fabrication"], "registre": "REG-Q-04", "responsable": "Resp. technique", "risque": "Moyen", "question": "Le résultat de la conception est-il traduit en fiches utilisables par la production et le contrôle ?", "nouveau": "", "confirmer": false}, {"code": "8.3.6", "chapitre": "8", "titre": "Modifications de la conception", "resume": "Les modifications pendant ou après la conception sont identifiées, revues, autorisées et leurs effets maîtrisés.", "doc": "Enregistrements des modifications, revues, autorisations et actions", "preuves": ["Registre des modifications", "Autorisations", "Analyse d'impact"], "registre": "REG-Q-11", "responsable": "Resp. technique", "risque": "Moyen", "question": "Les modifications d'un produit déjà conçu sont-elles autorisées par écrit avant application ?", "nouveau": "", "confirmer": false}, {"code": "8.4.1", "chapitre": "8", "titre": "Maîtrise des prestataires externes — généralités", "resume": "Fournisseurs et sous-traitants sont sélectionnés, évalués, surveillés et réévalués selon des critères définis ; les résultats et actions sont conservés.", "doc": "Enregistrements des évaluations et actions", "preuves": ["Liste des fournisseurs approuvés", "Fiches d'évaluation", "Réévaluations annuelles"], "registre": "REG-Q-07", "responsable": "Resp. achats", "risque": "Élevé", "question": "Avez-vous une liste de fournisseurs approuvés, évalués au moins une fois par an sur des critères écrits ?", "nouveau": "", "confirmer": false}, {"code": "8.4.2", "chapitre": "8", "titre": "Type et étendue de la maîtrise", "resume": "Le niveau de contrôle d'un fournisseur dépend de son impact sur la qualité : contrôles à réception, audits, exigences contractuelles, vérifications.", "doc": "", "preuves": ["Contrôles à réception", "Audits fournisseurs", "Plans de surveillance des sous-traitants"], "registre": "REG-Q-07", "responsable": "Resp. achats / RQ", "risque": "Élevé", "question": "Contrôlez-vous davantage les fournisseurs dont une erreur toucherait directement vos clients ?", "nouveau": "", "confirmer": false}, {"code": "8.4.3", "chapitre": "8", "titre": "Informations pour les prestataires externes", "resume": "Les commandes précisent clairement produits, services, critères d'acceptation, compétences, interactions et contrôles prévus, vérifiés avant envoi.", "doc": "", "preuves": ["Bons de commande détaillés", "Cahiers des charges fournisseurs", "Contrats de sous-traitance"], "registre": "REG-Q-07", "responsable": "Resp. achats", "risque": "Moyen", "question": "Vos bons de commande précisent-ils les spécifications et critères d'acceptation, pas seulement le prix ?", "nouveau": "", "confirmer": false}, {"code": "8.5.1", "chapitre": "8", "titre": "Maîtrise de la production et de la prestation de service", "resume": "La réalisation se fait dans des conditions maîtrisées : instructions, moyens adaptés, contrôles aux bonnes étapes, personnel compétent, processus validés si non vérifiables après coup, prévention des erreurs humaines.", "doc": "Information documentée définissant les caractéristiques et résultats attendus", "preuves": ["Modes opératoires au poste", "Fiches de contrôle en cours", "Validation des processus spéciaux"], "registre": "PLAN-Q-04", "responsable": "Resp. production / exploitation", "risque": "Élevé", "question": "Vos opérateurs ont-ils des instructions claires au poste et enregistrent-ils leurs contrôles ?", "nouveau": "", "confirmer": false}, {"code": "8.5.2", "chapitre": "8", "titre": "Identification et traçabilité", "resume": "Les produits sont identifiés et leur statut (conforme, à contrôler, bloqué) visible ; si la traçabilité est exigée, l'identification unique est conservée.", "doc": "Information documentée conservée pour la traçabilité, si exigée", "preuves": ["Étiquetage des lots", "Registre de traçabilité", "Test de traçabilité réussi"], "registre": "REG-Q-13", "responsable": "Resp. production / magasin", "risque": "Élevé", "question": "Pouvez-vous retrouver en moins de 4 heures l'origine et la destination d'un lot livré ?", "nouveau": "", "confirmer": false}, {"code": "8.5.3", "chapitre": "8", "titre": "Propriété des clients ou des prestataires externes", "resume": "Ce qui appartient au client ou au fournisseur (marchandises, sacs, données, plans) est identifié, protégé ; toute perte ou détérioration lui est signalée.", "doc": "Information documentée conservée sur les pertes ou dommages", "preuves": ["Registre des biens confiés", "Notifications de perte", "Protection des données clients"], "registre": "REG-Q-12", "responsable": "Resp. magasin / exploitation", "risque": "Moyen", "question": "Les biens ou données que vos clients vous confient sont-ils enregistrés et protégés ?", "nouveau": "", "confirmer": false}, {"code": "8.5.4", "chapitre": "8", "titre": "Préservation", "resume": "Les produits sont protégés pendant la manutention, le stockage, l'emballage et le transport pour rester conformes (humidité, nuisibles, contamination, casse).", "doc": "", "preuves": ["Règles de stockage", "Relevés d'humidité/température", "Contrôles de chargement"], "registre": "PLAN-Q-04", "responsable": "Resp. magasin / logistique", "risque": "Élevé", "question": "Vos produits sont-ils stockés et transportés selon des règles écrites qui évitent leur dégradation ?", "nouveau": "", "confirmer": false}, {"code": "8.5.5", "chapitre": "8", "titre": "Activités après livraison", "resume": "Garanties, service après-vente, retours et obligations légales après livraison sont définis selon les risques, l'usage, la durée de vie et le retour client.", "doc": "", "preuves": ["Conditions de garantie", "Suivi SAV", "Retours et analyses"], "registre": "REG-Q-08", "responsable": "Resp. commercial", "risque": "Moyen", "question": "Avez-vous défini ce que vous devez au client après la livraison (garantie, SAV, retours) ?", "nouveau": "", "confirmer": false}, {"code": "8.5.6", "chapitre": "8", "titre": "Maîtrise des modifications en production", "resume": "Les modifications imprévues de production ou de prestation sont revues et maîtrisées ; les résultats, l'autorisation et les actions sont conservés.", "doc": "Information documentée conservée sur la revue, l'autorisation et les actions", "preuves": ["Fiches de changement", "Autorisations", "Vérifications après changement"], "registre": "REG-Q-11", "responsable": "Resp. production", "risque": "Élevé", "question": "Un changement de réglage, de matière ou d'équipe en production est-il autorisé et tracé ?", "nouveau": "", "confirmer": false}, {"code": "8.6", "chapitre": "8", "titre": "Libération des produits et services", "resume": "Rien n'est livré avant que les contrôles prévus soient satisfaisants, sauf accord d'une personne autorisée et, si besoin, du client ; la personne qui libère est identifiable.", "doc": "Information documentée conservée : preuve de conformité et identité de la personne qui libère", "preuves": ["Bons de libération signés", "Résultats de contrôle final", "Dérogations client écrites"], "registre": "REG-Q-13", "responsable": "RQ / Contrôle qualité", "risque": "Élevé", "question": "Un lot peut-il sortir de chez vous sans signature d'une personne autorisée ?", "nouveau": "", "confirmer": false}, {"code": "8.7.1", "chapitre": "8", "titre": "Éléments de sortie non conformes — maîtrise", "resume": "Les produits ou services non conformes sont identifiés et isolés pour éviter leur livraison, puis corrigés, retenus, retournés, déclassés ou acceptés par dérogation.", "doc": "", "preuves": ["Zone de quarantaine identifiée", "Fiches de non-conformité", "Décisions de traitement"], "registre": "REG-Q-09", "responsable": "RQ / Resp. production", "risque": "Élevé", "question": "Avez-vous une zone et une étiquette pour bloquer un produit non conforme ?", "nouveau": "", "confirmer": false}, {"code": "8.7.2", "chapitre": "8", "titre": "Éléments de sortie non conformes — traces", "resume": "Chaque non-conformité est décrite avec les actions menées, les dérogations obtenues et la personne qui a décidé.", "doc": "Information documentée conservée sur la NC, les actions, dérogations et autorité de décision", "preuves": ["Fiche NC complète", "Dérogations", "Signature du décideur"], "registre": "REG-Q-09", "responsable": "RQ", "risque": "Moyen", "question": "Chaque produit non conforme a-t-il une fiche indiquant qui a décidé de son sort ?", "nouveau": "", "confirmer": false}, {"code": "9.1.1", "chapitre": "9", "titre": "Surveillance, mesure, analyse — généralités", "resume": "L'entreprise décide quoi surveiller, comment, quand, et quand analyser les résultats ; elle conserve les preuves et évalue l'efficacité du système.", "doc": "Résultats de surveillance conservés", "preuves": ["Tableau de bord des indicateurs", "Méthodes de mesure définies", "Analyses périodiques"], "registre": "PLAN-Q-01", "responsable": "RQ", "risque": "Moyen", "question": "Avez-vous un tableau de bord qualité mis à jour au moins chaque mois ?", "nouveau": "", "confirmer": false}, {"code": "9.1.2", "chapitre": "9", "titre": "Satisfaction du client", "resume": "L'entreprise mesure ce que les clients pensent de la façon dont leurs besoins sont satisfaits, par une méthode définie (enquête, visite, retours, part de marché).", "doc": "", "preuves": ["Enquêtes de satisfaction", "Synthèse annuelle", "Actions issues des retours"], "registre": "REG-Q-08", "responsable": "Resp. commercial / RQ", "risque": "Élevé", "question": "Mesurez-vous au moins une fois par an la satisfaction de vos clients avec une méthode écrite ?", "nouveau": "", "confirmer": false}, {"code": "9.1.3", "chapitre": "9", "titre": "Analyse et évaluation", "resume": "Les données sont analysées pour juger de la conformité, de la satisfaction, de la performance des processus et fournisseurs, de l'efficacité des actions et des besoins d'amélioration.", "doc": "", "preuves": ["Rapports d'analyse", "Graphiques de tendance", "Conclusions en revue de direction"], "registre": "RAP-Q-02", "responsable": "RQ", "risque": "Moyen", "question": "Vos chiffres qualité sont-ils analysés pour en tirer des décisions, pas seulement collectés ?", "nouveau": "Accent sur l'analyse des tendances et des résultats de performance (selon SGS) ; À CONFIRMER.", "confirmer": true}, {"code": "9.2.1", "chapitre": "9", "titre": "Audit interne — objectifs", "resume": "Des audits internes à intervalles planifiés vérifient que le système respecte la norme et les règles de l'entreprise et qu'il est efficacement appliqué.", "doc": "", "preuves": ["Programme d'audit", "Rapports d'audit", "Couverture de tous les processus"], "registre": "REG-Q-16", "responsable": "RQ", "risque": "Élevé", "question": "Avez-vous réalisé un audit interne complet de votre système au cours des 12 derniers mois ?", "nouveau": "", "confirmer": false}, {"code": "9.2.2", "chapitre": "9", "titre": "Programme d'audit interne", "resume": "Un programme fixe fréquence, méthodes, critères et périmètres selon l'importance des processus ; les auditeurs sont impartiaux, les résultats remontés et traités.", "doc": "Programme et résultats d'audit conservés", "preuves": ["PLAN-Q-03", "Qualification des auditeurs", "Suivi des constats"], "registre": "REG-Q-16", "responsable": "RQ", "risque": "Élevé", "question": "Vos auditeurs internes sont-ils formés et n'auditent-ils jamais leur propre travail ?", "nouveau": "", "confirmer": false}, {"code": "9.3.1", "chapitre": "9", "titre": "Revue de direction — généralités", "resume": "La direction revoit à intervalles planifiés si le système reste adapté, suffisant, efficace et aligné sur la stratégie.", "doc": "", "preuves": ["Planning des revues", "Comptes rendus", "Présence de la direction"], "registre": "RAP-Q-02", "responsable": "Direction générale", "risque": "Élevé", "question": "La direction tient-elle au moins une revue formelle du système qualité par an ?", "nouveau": "", "confirmer": false}, {"code": "9.3.2", "chapitre": "9", "titre": "Éléments d'entrée de la revue de direction", "resume": "La revue examine les actions précédentes, les changements de contexte, la satisfaction, les objectifs, les processus, les NC, les audits, les fournisseurs, les ressources, les risques et les pistes d'amélioration.", "doc": "", "preuves": ["Dossier de revue complet", "Tableau de bord", "Synthèse des audits et réclamations"], "registre": "RAP-Q-02", "responsable": "RQ", "risque": "Moyen", "question": "Votre revue de direction couvre-t-elle toutes les données (clients, fournisseurs, audits, risques) ?", "nouveau": "", "confirmer": false}, {"code": "9.3.3", "chapitre": "9", "titre": "Éléments de sortie de la revue de direction", "resume": "La revue conclut par des décisions sur l'amélioration, les changements du système et les ressources ; ces décisions sont conservées par écrit.", "doc": "Information documentée conservée : résultats de la revue", "preuves": ["Compte rendu signé", "Plan d'actions issu de la revue", "Suivi des décisions"], "registre": "RAP-Q-02", "responsable": "Direction générale", "risque": "Moyen", "question": "La revue de direction se termine-t-elle par des décisions écrites, avec responsables et délais ?", "nouveau": "", "confirmer": false}, {"code": "10.1", "chapitre": "10", "titre": "Amélioration — généralités", "resume": "L'entreprise cherche et met en œuvre des améliorations des produits, services, processus et du système pour mieux satisfaire les clients.", "doc": "", "preuves": ["Registre des opportunités d'amélioration", "Projets d'amélioration réalisés", "Résultats mesurés"], "registre": "REG-Q-17", "responsable": "Direction / RQ", "risque": "Moyen", "question": "Pouvez-vous citer trois améliorations réalisées cette année avec leur résultat chiffré ?", "nouveau": "Orientations complémentaires sur l'amélioration continue reliées au leadership (selon SGS) ; À CONFIRMER.", "confirmer": true}, {"code": "10.2.1", "chapitre": "10", "titre": "Non-conformité et action corrective", "resume": "Face à une non-conformité ou réclamation : corriger, analyser la cause, vérifier si cela existe ailleurs, agir, vérifier l'efficacité, mettre à jour risques et système.", "doc": "", "preuves": ["Fiches NC/AC", "Analyses de causes (5 pourquoi, Ishikawa)", "Vérifications d'efficacité"], "registre": "REG-Q-09", "responsable": "RQ / pilotes", "risque": "Élevé", "question": "Pour chaque problème important, cherchez-vous la cause racine et vérifiez-vous qu'il ne se reproduit pas ?", "nouveau": "", "confirmer": false}, {"code": "10.2.2", "chapitre": "10", "titre": "Traces des non-conformités", "resume": "La nature des non-conformités, les actions menées et les résultats des actions correctives sont conservés.", "doc": "Information documentée conservée : NC, actions et résultats", "preuves": ["Registre NC/AC à jour", "Clôtures documentées", "Statistiques"], "registre": "REG-Q-09", "responsable": "RQ", "risque": "Moyen", "question": "Votre registre des non-conformités indique-t-il pour chaque cas l'action menée et son résultat ?", "nouveau": "", "confirmer": false}, {"code": "10.3", "chapitre": "10", "titre": "Amélioration continue", "resume": "Le système devient plus pertinent et efficace dans le temps, en exploitant analyses, revues et audits pour décider des priorités.", "doc": "", "preuves": ["Évolution des indicateurs sur 2-3 ans", "Décisions issues des revues", "Projets d'amélioration"], "registre": "REG-Q-17", "responsable": "Direction", "risque": "Moyen", "question": "Vos indicateurs qualité s'améliorent-ils d'une année sur l'autre ?", "nouveau": "Lien renforcé entre amélioration continue et leadership (selon SGS) ; À CONFIRMER.", "confirmer": true}], "documents": [{"code": "MAN-Q-01", "titre": "Manuel du système de management de la qualité", "type": "Manuel", "articles": ["4.3", "4.4.1", "5.3", "7.5.1"], "responsable": "RQ / Direction générale", "frequence": "Revue annuelle et à chaque changement majeur", "champs": ["Présentation de l'entreprise", "Domaine d'application et exclusions justifiées", "Cartographie des processus", "Politique qualité", "Organisation et responsabilités", "Renvois aux procédures", "Correspondance avec les articles de la norme", "Historique des versions"], "usage": "Document d'entrée qui décrit le système, son périmètre et la façon de le fusionner dans un système intégré QSE/QSSE."}, {"code": "POL-Q-01", "titre": "Politique qualité", "type": "Politique", "articles": ["5.2.1", "5.2.2"], "responsable": "Direction générale", "frequence": "Revue annuelle en revue de direction", "champs": [" icles": ["6.1.1", "6.1.2"], "responsable": "RQ / pilotes", "frequence": "Revue trimestrielle", "champs": ["Sources d'identification", "Échelle de gravité 1-4", "Échelle de probabilité 1-4", "Grille de criticité", "Traitement des opportunités (gain/faisabilité)", "Plan d'actions", "Vérification d'efficacité"], "usage": "Méthode de cotation et de traitement distinct des risques et des opportunités (6.1 réorganisé en 2026)."}, {"code": "PRO-Q-04", "titre": "Planification et maîtrise des changements", "type": "Procédure", "articles": ["6.3", "8.2.4", "8.5.6"], "responsable": "Direction / RQ", "frequence": "À chaque changement", "champs": ["Types de changements couverts", "Demande et justification", "Analyse d'impact", "Autorisation", "Plan de communication", "Surveillance après changement", "Revue de clôture"], "usage": "Encadre tout changement (machine, fournisseur, organisation, logiciel, site) avant, pendant et après."}, {"code": "PRO-Q-05", "titre": "Compétences, formation et sensibilisation", "type": "Procédure", "articles": ["7.1.2", "7.2", "7.3"], "responsable": "RH", "frequence": "Annuelle (plan) et à l'embauche", "champs": ["Définition des compétences par poste", "Accueil et intégration", "Recensement des besoins", "Plan de formation", "Évaluation à chaud et à froid", "Habilitations", "Sensibilisation éthique et culture qualité"], "usage": "Garantit que chaque poste est tenu par une personne compétente et sensibilisée."}, {"code": "PRO-Q-06", "titre": "Infrastructures, environnement de travail et maintenance", "type": "Procédure", "articles": ["7.1.3", "7.1.4"], "responsable": "Resp. maintenance", "frequence": "Permanente", "champs": ["Inventaire", "Maintenance préventive", "Maintenance curative", "Pièces critiques", "Conditions d'ambiance", "Sauvegarde informatique", "Véhicules"], "usage": "Assure la disponibilité des bâtiments, machines, véhicules et outils numériques."}, {"code": "PRO-Q-07", "titre": "Maîtrise des équipements de surveillance et de mesure", " é et de l'éthique", "type": "Check-list", "articles": ["5.1.1", "7.1.4", "7.3"], "responsable": "RQ / Direction", "frequence": "Trimestrielle (tournée terrain)", "champs": ["Comportement observé", "Lieu / poste", "Question posée au personnel", "Réponse", "Niveau (0-1-2)", "Action"], "usage": "Rend visible et mesurable la culture qualité attendue par l'édition 2026."}], "kpi": [{"code": "KPI-Q-01", "indicateur": "Taux de satisfaction client", "formule": "Nombre de réponses notées 4 ou 5 sur 5 / nombre total de réponses x 100", "source": "FOR-Q-05 / REG-Q-08", "frequence": "Annuelle (ou après chaque prestation)", "responsable": "Resp. commercial", "cible": "≥ 85 %", "alerte": "< 75 %"}, {"code": "KPI-Q-02", "indicateur": "Nombre de réclamations clients pour 100 livraisons", "formule": "Réclamations reçues dans le mois / livraisons du mois x 100", "source": "REG-Q-08", "frequence": "Mensuelle", "responsable": "Resp. commercial", "cible": "à fixer après 3 mois de mesure", "alerte": "Hausse de 50 % par rapport à la moyenne des 3 derniers mois"}, {"code": "KPI-Q-03", "indicateur": "Délai moyen de réponse aux réclamations", "formule": "Somme des jours entre réception et réponse / nombre de réclamations clôturées", "source": "REG-Q-08", "frequence": "Mensuelle", "responsable": "Resp. commercial", "cible": "≤ 5 jours ouvrés", "alerte": "> 10 jours ouvrés"}, {"code": "KPI-Q-04", "indicateur": "Taux de livraison à temps et complète (OTIF)", "formule": "Livraisons à la date convenue et en quantité complète / livraisons totales x 100", "source": "REG-Q-13 / FOR-Q-02", "frequence": "Mensuelle", "responsable": "Resp. logistique / exploitation", "cible": "≥ 95 %", "alerte": "< 90 %"}, {"code": "KPI-Q-05", "indicateur": "Taux de non-conformité produit ou prestation", "formule": "Lots ou prestations non conformes / lots ou prestations réalisés x 100", "source": "REG-Q-09 / FOR-Q-08", "frequence": "Mensuelle", "responsable": "RQ", "cible": "à fixer après 3 mois de mesure", "alerte": " e": "< 70 %"}, {"code": "KPI-Q-12", "indicateur": "Taux de réalisation du programme d'audit interne", "formule": "Audits réalisés / audits planifiés à date x 100", "source": "PLAN-Q-03 / REG-Q-16", "frequence": "Trimestrielle", "responsable": "RQ", "cible": "100 %", "alerte": "< 80 %"}, {"code": "KPI-Q-13", "indicateur": "Taux de risques élevés sous contrôle", "formule": "Risques de criticité ≥ 9 avec action en cours ou efficace / risques de criticité ≥ 9 x 100", "source": "REG-Q-03", "frequence": "Trimestrielle", "responsable": "RQ / pilotes", "cible": "100 %", "alerte": "< 90 %"}, {"code": "KPI-Q-14", "indicateur": "Taux de changements maîtrisés", "formule": "Changements avec FOR-Q-07 autorisée et revue post-changement / changements réalisés x 100", "source": "REG-Q-11", "frequence": "Trimestrielle", "responsable": "RQ", "cible": "100 %", "alerte": "< 90 %"}, {"code": "KPI-Q-15", "indicateur": "Indice de culture qualité et éthique", "formule": "Moyenne des notes 0-1-2 de CHK-Q-03 / 2 x 100", "source": "CHK-Q-03 / REG-Q-18", "frequence": "Trimestrielle", "responsable": "Direction / RQ", "cible": "à fixer après 3 mois de mesure", "alerte": "Baisse de 10 points ou signalement grave non traité sous 30 jours"}, {"code": "KPI-Q-16", "indicateur": "Taux de traçabilité réussie (test)", "formule": "Tests de traçabilité réussis dans le délai fixé (4 h) / tests réalisés x 100", "source": "REG-Q-13", "frequence": "Semestrielle", "responsable": "RQ", "cible": "100 %", "alerte": "Un test échoué"}, {"code": "KPI-Q-17", "indicateur": "Taux d'atteinte des objectifs qualité", "formule": "Objectifs atteints / objectifs fixés x 100", "source": "PLAN-Q-01", "frequence": "Semestrielle", "responsable": "Direction", "cible": "≥ 75 %", "alerte": "< 50 %"}, {"code": "KPI-Q-18", "indicateur": "Nombre d'améliorations mises en œuvre", "formule": "Opportunités d'amélioration réalisées avec résultat mesuré sur la période", "source": "REG-Q-17", "frequence": "Trimestrielle", "responsable": "RQ", "cible": "≥ 3 par trimestre", "alerte": "0 sur un trimestre"}], "extras": {"diagnostic": [["Avez-vous une politique qualité signée et des objectifs chiffrés suivis chaque mois ?", "Haute"], ["Avez-vous une liste écrite de vos risques et opportunités, cotés et suivis ?", "Haute"], ["Vérifiez-vous chaque commande (quantité, délai, spécifications) avant de l'accepter ?", "Haute"], ["Vos fournisseurs et sous-traitants sont-ils évalués au moins une fois par an ?", "Haute"], ["Vos balances et appareils de mesure ont-ils un étalonnage ou une vérification valide ?", "Haute"], ["Chaque réclamation est-elle enregistrée, analysée et suivie d'une réponse au client ?", "Haute"], ["Analysez-vous par écrit l'impact d'un changement important avant de le faire ?", "Moyenne"], ["La direction tient-elle une revue formelle du système au moins une fois par an ?", "Moyenne"]], "parcours": [["1. Diagnostic express", "45 minutes avec le dirigeant, puis visite terrain ; grille FOR-Q-01 ; décision de continuer ou non."], ["2. Cadrage", "Périmètre, sites, exclusions justifiées, équipe projet, responsable qualité nommé."], ["3. Contexte et parties intéressées", "Enjeux internes et externes, climat, exigences des clients et de l'État (REG-Q-01, REG-Q-02, REG-Q-10)."], ["4. Processus et risques", "Cartographie, fiches processus, registre des risques et opportunités coté (MAT-Q-01, REG-Q-03)."], ["5. Politique, objectifs et éthique", "Politique signée, objectifs chiffrés, charte éthique et culture qualité (POL-Q-01, POL-Q-02, PLAN-Q-01)."], ["6. Documentation utile", "Procédures, formulaires et registres strictement nécessaires, codifiés et maîtrisés (PRO-Q-01)."], ["7. Mise en œuvre et formation", "Application sur le terrain, formation des équipes, premiers enregistrements réels sur 2 à 3 mois minimum."], ["8. Audit interne", "Audit complet par auditeurs formés (ISO 19011), traitement des constats."], ["9. Revue de direction", "Décisions de la direction sur les résultats, ressources et améliorations."], ["10. Accompagnement à l'audit de certification", "Choix de l'organisme accrédité par le client, préparation J-30, présence pendant l'audit si souhaitée, plan d'actions post-audit."]], "specifiques": [["Satisfaction client mesurée", "La norme veut une méthode définie pour savoir ce que pensent les clients et une exploitation réelle des résultats."], ["Approche processus", "Chaque activité est un processus avec pilote, entrées, sorties, indicateurs et risques ; l'auditeur suit le fil du client au client."], ["Fournisseurs maîtrisés selon leur impact", "Plus un fournisseur peut nuire au client, plus il est évalué, contrôlé et suivi."], ["Libération et non-conformités", "Aucun produit ne sort sans contrôle et sans libération par une personne autorisée identifiée ; ce qui est non conforme est bloqué et tracé."], ["Culture qualité et éthique (2026)", "La direction doit promouvoir une culture qualité et un comportement éthique ; le personnel doit y être sensibilisé (libellé exact À CONFIRMER sur le texte officiel)."], ["Maîtrise des changements renforcée (2026)", "Un changement se prépare, se communique, se surveille et se revoit ; les risques et opportunités sont traités séparément."]], "profils": [["P1 · PME de services", "PME à Abidjan (maintenance, nettoyage, informatique, BTP léger)", "Elle veut gagner des appels d'offres et fidéliser ses grands comptes.", "Cartographie des processus et revue de contrat (FOR-Q-02)."], ["P2 · Usine de transformation", "Unité de broyage cacao ou décorticage cajou à San Pedro", "Elle exporte et subit des réclamations sur l'humidité, les corps étrangers ou les délais.", "Plan de contrôle (PLAN-Q-04) et étalonnage des instruments (REG-Q-06)."], ["P3 · Coopérative agricole", "Société coopérative à Soubré", "Elle veut une gestion structurée, des pesées incontestées et la confiance des acheteurs.", "Traçabilité des lots (REG-Q-13) et maîtrise des pesées."], ["P4 · Transporteur", "Société de transport de marchandises (axe San Pedro – Abidjan)", "Elle veut réduire avaries, retards et litiges avec les chargeurs.", "Maintenance des véhicules (REG-Q-14) et propriété client (REG-Q-12)."], ["P5 · Entreprise déjà certifiée", "Entreprise certifiée ISO 9001:2015", "Elle doit passer à l'édition 2026 dans la période de transition.", "Analyse d'écarts 2015 → 2026 : culture qualité, éthique, risques/opportunités, changements."]], "objections": [["« C'est trop de papier pour une petite structure. »", "La norme laisse dimensionner la documentation selon la taille. Nous gardons le strict nécessaire et utilisons les registres numériques de GEC-CI Pro."], ["« Nos clients ne demandent pas ISO 9001. »", "Le système sert d'abord à réduire les pertes et les litiges. Le certificat est un plus commercial, pas l'unique objectif."], ["« Combien de temps pour avoir le certificat ? »", "Personne ne peut le promettre. Il faut en général plusieurs mois de fonctionnement réel avant l'audit, et c'est l'organisme certificateur qui décide."], ["« Nous sommes certifiés 2015, rien ne change. »", "L'édition 2026 ajoute notamment la culture qualité, l'éthique et une maîtrise des changements renforcée ; la transition est à préparer avant l'échéance."], ["« Notre personnel ne sait pas bien lire. »", "Nous utilisons pictogrammes, fiches visuelles, sensibilisation orale en langue locale et contrôle par les chefs d'équipe."], ["« Combien cela coûte ? »", "Le prix GEC-CI se calcule après diagnostic, lot par lot. Les coûts de tiers (norme, organisme certificateur, étalonnage) sont présentés à part, sur devis de ces tiers."]], "livre": ["Un système qualité complet adapté à votre taille : manuel, procédures, formulaires et registres codifiés (préfixe Q)", "Des équipes formées : dirigeants, responsable qualité, auditeurs internes, personnel de terrain", "Un tableau de bord de conformité sur la plateforme GEC-CI Pro, avec preuves rangées article par article"], "refuse": ["Promettre un certificat ou une date de certificat : seul l'organisme certificateur accrédité décide", "Fabriquer des enregistrements ou préparer quiconque à mentir à l'auditeur"], "premier_pas": "Un diagnostic express de 45 minutes avec le dirigeant, suivi d'une visite terrain, pour mesurer vos écarts article par article et choisir les premiers lots de travail."}, "points": [["C-01", "Fin exacte de la transition 2015 → 2026 et règles IAF", "1, 3", "Organisme certificateur, IAF"], ["C-02", "Sous-numérotation 2026 de 6.1, du chapitre 7 et du chapitre 8", "1, 5", "Texte officiel"], ["C-03", "Libellé exact des exigences sur la culture qualité et l'éthique", "1, 6", "Texte officiel"], ["C-04", "Articles 97 à 107 et décrets d'application de la loi n° 2016-412", "1, 6", "Ministère du Commerce"], ["C-05", "Fréquences, tarifs et opérateur de la vérification périodique des instruments", "1, 6", "BIM, Côte d'Ivoire Métrologie"], ["C-06", "Formalités ARTCI pour les traitements de données de chaque client", "1, 6", "ARTCI"], ["C-07", "Accréditations des organismes certificateurs actifs en Côte d'Ivoire et rôle du SOAC", "1, 10", "Accréditeurs, IAF"], ["C-08", "Prix de la norme chez CODINORM", "1, 3", "CODINORM"], ["C-09", "Règles qualité et pesée de la filière cacao pour la campagne en cours", "1, 6", "Conseil du Café-Cacao"], ["C-10", "Date et contenu d'ISO 9000:2026", "1", "Catalogue ISO"], ["C-11", "Durées légales de conservation des documents (comptables, sociaux)", "4", "Textes OHADA, administration fiscale"], ["C-12", "Références du Code du travail et de la réglementation du transport routier", "1", "Ministères concernés"]], "chapitres": {"4": "Contexte", "5": "Leadership", "6": "Planification", "7": "Support", "8": "Activités opérationnelles", "9": "Évaluation des performances", "10": "Amélioration"}};window.__LOGO="data:image/webp;base64,UklGRvw/AABXRUJQVlA4IPA/AABw4wCdASq8AsAAPmEqkUWkIqQUGh6MQAYEszdsgF23OaNIVAb+U7JDv/kP8j+2P9697O0P4D++/q7+2fuB8xu9rtDze+av+h/hfy4+cH+e/4n+Q91H9V/wn/U/wH76/QH+p/+//vX+W9t31Q/4L/t+oP+s/4z9zvd5/3n7Le7/+7f7X9tf9 <script>/* IA GECI — Module Organisation, Personnel, Territoires, Preuves (commun à la console et à toutes les plateformes GEC-CI).
   Toutes les écritures passent par des fonctions serveur (geci_*) qui contrôlent les droits ; l'interface ne fait qu'afficher.
   Aucun employé n'est créé automatiquement. Aucune validation n'est faite par l'IA. */
window.GECI_ORG = (() => {
  const PROJ = { RA: 'Rainforest Alliance', FAIRTRADE: 'Fairtrade', ISO: 'Normes ISO', RSPO: 'RSPO — palmier à huile', HEVEA: 'Hévéas' };
  const PREFS = { RA: ['RAINFOREST_ALLIANCE'], FAIRTRADE: ['FAIRTRADE'], ISO: ['ISO_9001', 'ISO_14001', 'ISO_45001', 'ISO_22000'], RSPO: ['RSPO'], HEVEA: ['HEVEA'] };
  const FCT = { PILOTAGE: 'Responsable de pilotage', TECHNIQUE: 'Responsable technique', OPERATIONNEL: 'Responsable opérationnel' };
  const EV_L = { IMPORTEE: 'Importée', A_CLASSER: 'À classer', A_VERIFIER: 'À vérifier', VALIDEE: 'Validée', REJETEE: 'Rejetée', ARCHIVEE: 'Archivée' };
  const EV_K = { IMPORTEE: '', A_CLASSER: 'warn', A_VERIFIER: 'info', VALIDEE: 'ok', REJETEE: 'bad', ARCHIVEE: '' };
  const CATS = ['PHOTO', 'DOCUMENT', 'RAPPORT', 'FORMULAIRE', 'REGISTRE', 'VIDEO', 'AUDIO', 'CARTOGRAPHIE', 'FINANCIER', 'CONTRAT', 'AUTRE'];
  const ROLE_EQ = { CHEF_EQUIPE: 'Chef d’équipe', CONSULTANT: 'Consultant', AUDITEUR: 'Auditeur', FORMATEUR: 'Formateur', AGENT: 'Agent', CARTOGRAPHE: 'Cartographe', AUTRE: 'Autre' };
  const ACT_L = { PLANIFIEE: 'Planifiée', EN_COURS: 'En cours', REALISEE: 'Réalisée', ANNULEE: 'Annulée' };
  const MAXF = 52428800;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const dfr = (d) => d ? new Date(d).toLocaleDateString('fr-FR') : '—';
  const dtfr = (d) => d ? new Date(d).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
  const oct = (n) => { n = Number(n || 0); return n < 1024 ? n + ' o' : n < 1048576 ? (n / 1024).toFixed(1) + ' Ko' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' Mo' : (n / 1073741824).toFixed(2) + ' Go'; };
  const chip = (t, k = '') => `<span class="go-chip ${k}">${esc(t)}</span>`;
  const nz = (v) => (v === '' || v == null) ? null : v;
  const opt = (pairs, cur, empty) => (empty != null ? `<option value="">${esc(empty)}</option>` : '') + pairs.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(cur ?? '') ? 'selected' : ''}>${esc(l)}</option>`).join('');
  const fd = (f) => { const o = {}; new FormData(f).forEach((v, k) => { o[k] = typeof v === 'string' ? v.trim() : v; }); f.querySelectorAll('input[type=checkbox]').forEach(c => o[c.name] = c.checked); return o; };
  const clean = (m) => String(m || '').replace(/^GECI-ACCES-REFUSE : /, 'Accès refusé : ').replace(/^(GECI-[A-Z-]+) : /, '$1 · ').replace(/^ACCES-REFUSE/, 'Accès refusé');
  const catOf = (mime, name) => /^image\//.test(mime) ? 'PHOTO' : /^video\//.test(mime) ? 'VIDEO' : /^audio\//.test(mime) ? 'AUDIO' : /pdf|word|opendocument\.text/.test(mime) ? 'DOCUMENT' : /sheet|excel|csv/.test(mime) || /\.(xlsx?|csv|ods)$/i.test(name) ? 'REGISTRE' : /\.(kml|kmz|geojson|gpx|shp)$/i.test(name) ? 'CARTOGRAPHIE' : 'AUTRE';
  const safeName = (n) => n.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9._-]+/g, '_').replace(/_+/g, '_').slice(-80) || 'fichier';
  async function sha256Hex(buf) { const h = await crypto.subtle.digest('SHA-256', buf); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }

  const CSS = `.go{font-size:14px;line-height:1.5;color:#0F1B2D}.go *{box-sizing:border-box}
  .go-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.go-tabs button{border:1px solid #DCE3EC;background:#fff;color:#0A1628;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  .go-tabs button.on{background:#0A1628;color:#fff;border-color:#0A1628;box-shadow:inset 0 -3px 0 #C9A227}.go-tabs .n{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:9px;background:#C9A227;color:#0A1628;font-size:11px;font-weight:700}
  .go-sec{border:1px solid #DCE3EC;border-radius:8px;padding:14px 16px;margin:0 0 14px;background:#fff}.go-sec h3{margin:0 0 8px;font-size:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
  .go-sec h4{margin:12px 0 6px;font-size:14px}.go-note{color:#5A6B83;font-size:12.5px;margin:6px 0}.go-eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8A6B0E;font-weight:600}
  .go-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 14px}.go-tile{border:1px solid #DCE3EC;border-radius:8px;padding:10px 12px;background:#fff;border-top:3px solid #C9A227}.go-tile .v{font-size:22px;font-weight:700;color:#0A1628}.go-tile .l{font-size:12px;color:#5A6B83}.go-tile.alert{border-top-color:#B42318}
  .go-tw{overflow-x:auto}.go table{border-collapse:collapse;width:100%;font-size:13px}.go th{text-align:left;border-bottom:1px solid #DCE3EC;padding:6px 8px;font-size:11.5px;color:#5A6B83;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}.go td{padding:6px 8px;border-bottom:1px solid #EEF2F6;vertical-align:top}
  .go-chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;background:#EEF2F6;color:#0F1B2D;white-space:nowrap}.go-chip.ok{background:#E3F4EA;color:#14653A}.go-chip.warn{background:#FFF4D6;color:#7A5A00}.go-chip.bad{background:#FDE7E5;color:#B42318}.go-chip.info{background:#E4EEFA;color:#1D5FA8}
  .go-btn{border:1px solid #0A1628;background:#fff;color:#0A1628;border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;font-weight:600}.go-btn.p{background:#0A1628;color:#fff}.go-btn.g{background:#C9A227;border-color:#C9A227;color:#0A1628}.go-btn.sm{padding:3px 8px;font-size:12px}.go-btn:disabled{opacity:.5;cursor:default}.go-btn.bad{border-color:#B42318;color:#B42318}
  .go-f{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;align-items:end;margin:8px 0}.go-f label{display:grid;gap:3px;font-size:12px;color:#5A6B83}.go-f .w{grid-column:1/-1}
  .go-in{width:100%;padding:7px 9px;border:1px solid #CBD5E1;border-radius:6px;font:inherit;font-size:13px;background:#fff;color:#0F1B2D}
  .go details{border:1px dashed #CBD5E1;border-radius:8px;padding:8px 12px;margin:10px 0}.go summary{cursor:pointer;font-weight:600;color:#0A1628}
  .go-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.go-muted{color:#5A6B83}.go-mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .go-drop{border:2px dashed #C9A227;border-radius:10px;padding:22px;text-align:center;background:#FFFBEF;cursor:pointer}.go-drop.over{background:#FFF1C2}
  .go-bar{height:10px;border-radius:5px;background:#EEF2F6;overflow:hidden}.go-bar>i{display:block;height:100%;background:#C9A227;width:0;transition:width .2s}
  .go-gap{height:8px;border-radius:4px;background:#EEF2F6;overflow:hidden;min-width:80px}.go-gap>i{display:block;height:100%;background:#14653A}
  .go-tree ul{list-style:none;margin:0;padding-left:16px;border-left:1px dotted #CBD5E1}.go-tree li{margin:3px 0}
  .go-msg{padding:8px 12px;border-radius:6px;margin:0 0 10px;font-size:13px}.go-msg.bad{background:#FDE7E5;color:#B42318}.go-msg.ok{background:#E3F4EA;color:#14653A}
  @media (max-width:640px){.go-f{grid-template-columns:1fr}}`;

  function mount(el, sb, cfg = {}) {
    if (!document.getElementById('go-css')) { const s = document.createElement('style'); s.id = 'go-css'; s.textContent = CSS; document.head.appendChild(s); }
    const C = { project: cfg.project || null, lockProject: !!cfg.project, tab: cfg.tab || 'dash', toast: cfg.toast, consoleUrl: cfg.consoleUrl };
    const st = { uid: null, roles: new Set(), me: null, steer: [], zm: [], teams: [], areas: [], emps: [], cache: {} };
    const has = (...r) => r.some(x => st.roles.has(x));
    const isDir = () => has('SUPER_ADMIN', 'DIRECTEUR');
    const isRH = () => isDir() || has('RESPONSABLE_RH');
    const manages = (p) => isDir() || st.steer.some(s => s.project_code === p && ['PILOTAGE', 'OPERATIONNEL'].includes(s.fonction));
    const inSteer = (p) => isDir() || st.steer.some(s => s.project_code === p);
    const zmTeams = () => new Set(st.teams.filter(t => st.zm.some(z => z.id === t.zone_manager_id)).map(t => t.id));
    const say = (t, bad) => { if (C.toast) return C.toast(t, bad); const m = el.querySelector('#go-msg'); if (m) { m.className = 'go-msg ' + (bad ? 'bad' : 'ok'); m.textContent = t; m.hidden = false; setTimeout(() => m.hidden = true, bad ? 9000 : 4000); } };
    async function rpc(fn, args = {}, ok) { const { data, error } = await sb.rpc(fn, args); if (error) { say(clean(error.message), true); throw error; } if (ok) say(ok); return data; }
    async function sel(t, cols = '*', f = (q) => q) { const { data, error } = await f(sb.from(t).select(cols)); if (error) { say(clean(error.message), true); return []; } return data || []; }
    const empName = (id) => { const e = st.emps.find(x => x.id === id); return e ? `${e.prenoms} ${e.nom}` : '—'; };
    const areaName = (id) => st.areas.find(a => a.id === id)?.nom || '—';
    const areaOpts = (cur, empty = 'Choisir une zone') => opt(st.areas.filter(a => a.actif && a.type !== 'PAYS' && a.type !== 'GROUPE_OPERATIONNEL').sort((a, b) => a.nom.localeCompare(b.nom, 'fr')).map(a => [a.id, a.nom + (a.type === 'ZONE_INDUSTRIELLE' ? ' (ZI)' : a.type === 'VILLE' ? '' : ' · ' + a.type.toLowerCase().replace(/_/g, ' '))]), cur, empty);
    const empOpts = (cur, empty = 'Choisir un employé') => opt(st.emps.filter(e => e.statut === 'ACTIF').sort((a, b) => (a.nom + a.prenoms).localeCompare(b.nom + b.prenoms, 'fr')).map(e => [e.id, `${e.nom} ${e.prenoms} — ${e.fonction} (${e.matricule})`]), cur, empty);
    const projOpts = (cur) => opt(Object.entries(PROJ), cur);

    async function loadBase() {
      const { data: u } = await sb.auth.getUser(); st.uid = u?.user?.id || null;
      const { data: me } = await sb.rpc('geci_me'); st.me = me; st.roles = new Set((me?.roles || []).filter(r => !r.client_id).map(r => r.role));
      [st.emps, st.areas] = await Promise.all([sel('geci_employees', '*'), sel('geci_areas', '*')]);
      st.myEmp = st.emps.find(e => e.user_id === st.uid && e.statut === 'ACTIF') || null;
      const [sm, zms, teams] = await Promise.all([
        sel('geci_steering_members', 'id,fonction,employee_id,date_fin,date_debut,intitule,steering_id,geci_steering_teams(project_code)'),
        sel('geci_zone_managers', '*'), sel('geci_teams', '*')]);
      st.allSteer = sm.map(x => ({ ...x, project_code: x.geci_steering_teams?.project_code }));
      st.allZm = zms; st.teams = teams;
      st.steer = st.myEmp ? st.allSteer.filter(x => x.employee_id === st.myEmp.id && !x.date_fin) : [];
      st.zm = st.myEmp ? zms.filter(x => x.employee_id === st.myEmp.id && !x.date_fin) : [];
      const n = await sel('geci_notifications', 'id', q => q.eq('lu', false)); st.unread = n.length;
    }

    const TABS = () => [
      ['dash', 'Tableau de bord', true], ['org', 'Organisation', true], ['missions', 'Missions et activités', true], ['preuves', 'Preuves et import', true],
      ['personnel', 'Personnel (RH)', true], ['zones', 'Zones et sites', true], ['notifs', 'Notifications', true], ['stockage', 'Stockage', has('SUPER_ADMIN', 'DIRECTEUR', 'RESPONSABLE_INFORMATIQUE', 'GESTIONNAIRE_DOCUMENTAIRE')]];

    async function show(tab) {
      C.tab = tab;
      el.innerHTML = `<div class="go"><div id="go-msg" class="go-msg" hidden></div>
        <div class="go-row" style="justify-content:space-between;margin:0 0 10px"><div><div class="go-eyebrow">IA GECI — Organisation GEC-CI</div>
        <div class="go-muted" style="font-size:12.5px">${C.lockProject ? 'Projet ' + esc(PROJ[C.project]) : 'Tous les projets'} · ${st.myEmp ? 'Vous : ' + esc(st.myEmp.prenoms + ' ' + st.myEmp.nom) : 'Compte non relié à une fiche du personnel'}</div></div>
        ${C.lockProject ? '' : `<label class="go-row go-muted" style="font-size:12.5px">Projet <select class="go-in" id="go-proj" style="width:auto">${opt(Object.entries(PROJ), C.project, 'Tous les projets')}</select></label>`}</div>
        <nav class="go-tabs">${TABS().filter(t => t[2]).map(([k, l]) => `<button data-t="${k}" class="${k === tab ? 'on' : ''}">${l}${k === 'notifs' && st.unread ? `<span class="n">${st.unread}</span>` : ''}</button>`).join('')}</nav>
        <div id="go-body"><p class="go-muted">Chargement…</p></div></div>`;
      el.querySelector('.go-tabs').onclick = (e) => { const b = e.target.closest('button[data-t]'); if (b) show(b.dataset.t); };
      const ps = el.querySelector('#go-proj'); if (ps) ps.onchange = () => { C.project = ps.value || null; show(C.tab); };
      const body = el.querySelector('#go-body');
      try { await V[tab](body); } catch (e) { console.error(e); body.innerHTML = `<div class="go-sec"><b>Affichage impossible</b><p class="go-note">${esc(clean(e.message))}</p></div>`; }
    }
    function ask(title, withText, required = true) {
      return new Promise((res) => { const o = document.createElement('div');
        o.style.cssText = 'position:fixed;inset:0;background:rgba(10,22,40,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px';
        o.innerHTML = `<div class="go" style="background:#fff;border-radius:10px;max-width:440px;width:100%;padding:16px;border-top:4px solid #C9A227"><p style="margin:0 0 10px;font-weight:600">${esc(title)}</p>${withText ? '<textarea class="go-in" rows="3" id="ask-t"></textarea>' : ''}<div class="go-row" style="justify-content:flex-end;margin-top:10px"><button class="go-btn" id="ask-n">Annuler</button><button class="go-btn p" id="ask-y">Confirmer</button></div></div>`;
        document.body.appendChild(o); const t = o.querySelector('#ask-t'); if (t) t.focus();
        const end = (v) => { o.remove(); res(v); };
        o.querySelector('#ask-n').onclick = () => end(null);
        o.querySelector('#ask-y').onclick = () => { if (!withText) return end(true); const v = t.value.trim(); if (required && !v) { t.style.borderColor = '#B42318'; return; } end(v || ''); }; });
    }
    const reload = async () => { await loadBase(); show(C.tab); };
    const V = {};

    /* ---------- TABLEAU DE BORD (par niveau) ---------- */
    V.dash = async (b) => {
      if (!st.roles.size) { b.innerHTML = `<div class="go-sec"><b>Aucun rôle interne GEC-CI sur ce compte.</b><p class="go-note">L’organisation (équipes, zones, personnel, preuves internes) est réservée au personnel de GEC-CI. Demandez un rôle à la Direction${C.consoleUrl ? ` depuis la <a href="${C.consoleUrl}" target="_blank" rel="noopener">console IA GECI ↗</a>` : ''}.</p></div>`; return; }
      let d; try { d = await rpc('geci_org_dashboard', { p_project: C.project }); } catch (e) { b.innerHTML = `<div class="go-sec">${esc(clean(e.message))}</div>`; return; }
      const P = d.projets || [];
      const tot = (f) => P.reduce((a, p) => a + f(p), 0);
      const eqs = P.flatMap(p => p.equipes.map(t => ({ ...t, projet: p.projet })));
      const sous = eqs.filter(t => t.effectif < t.effectif_cible);
      const niveau = isDir() ? 'Direction générale' : st.steer.length ? 'Pilotage (siège)' : st.zm.length ? 'Responsable de zone' : st.myEmp ? 'Collaborateur' : 'Personnel';
      const myTeams = st.myEmp ? await sel('geci_team_members', 'id,team_id,role_equipe,statut,date_debut', q => q.eq('employee_id', st.myEmp.id).is('date_fin', null)) : [];
      const myActs = st.myEmp ? await sel('geci_activity_assignments', 'activity_id,role,geci_activities(titre,statut,date_prevue,service_code)', q => q.eq('employee_id', st.myEmp.id)) : [];
      b.innerHTML = `<div class="go-sec"><h3>Vue ${esc(niveau)} <span class="go-muted" style="font-size:12px;font-weight:400">Données réelles, filtrées par le serveur selon vos droits</span></h3>
        <div class="go-tiles">
          <div class="go-tile"><div class="v">${d.effectif_total}</div><div class="l">Personnel actif enregistré</div></div>
          <div class="go-tile"><div class="v">${d.disponibles}</div><div class="l">Disponibles sans équipe</div></div>
          <div class="go-tile ${tot(p => p.pilotage_postes_vacants) ? 'alert' : ''}"><div class="v">${tot(p => p.pilotage_postes_vacants)}</div><div class="l">Postes de pilotage vacants</div></div>
          <div class="go-tile"><div class="v">${eqs.length}</div><div class="l">Équipes opérationnelles</div></div>
          <div class="go-tile ${sous.length ? 'alert' : ''}"><div class="v">${sous.length}</div><div class="l">Équipes sous l’effectif cible</div></div>
          <div class="go-tile"><div class="v">${tot(p => p.missions.actives)}</div><div class="l">Missions actives</div></div>
          <div class="go-tile ${tot(p => p.missions.en_retard) ? 'alert' : ''}"><div class="v">${tot(p => p.missions.en_retard)}</div><div class="l">Missions en retard</div></div>
          <div class="go-tile ${tot(p => p.missions.sans_equipe) ? 'alert' : ''}"><div class="v">${tot(p => p.missions.sans_equipe)}</div><div class="l">Missions sans équipe</div></div>
          <div class="go-tile"><div class="v">${tot(p => p.preuves.A_VERIFIER || 0)}</div><div class="l">Preuves à vérifier</div></div>
          <div class="go-tile"><div class="v">${tot(p => p.preuves.A_CLASSER || 0)}</div><div class="l">Preuves à classer</div></div>
          <div class="go-tile"><div class="v">${d.zones_sans_equipe}</div><div class="l">Villes / ZI sans équipe</div></div>
          <div class="go-tile"><div class="v">${d.notifications_non_lues}</div><div class="l">Notifications non lues</div></div>
        </div>
        ${P.length ? `<div class="go-tw"><table><thead><tr><th>Projet</th><th>Pilotage (3)</th><th>Resp. de zone</th><th>Équipes</th><th>Effectif réel / cible</th><th>Missions actives</th><th>En retard</th><th>Preuves à vérifier</th></tr></thead><tbody>
        ${P.map(p => { const ef = p.equipes.reduce((a, t) => a + Number(t.effectif), 0), ci = p.equipes.reduce((a, t) => a + Number(t.effectif_cible), 0);
          return `<tr><td><b>${esc(p.nom)}</b></td><td>${3 - p.pilotage_postes_vacants} / 3 ${p.pilotage_postes_vacants ? chip(p.pilotage_postes_vacants + ' vacant(s)', 'warn') : chip('complet', 'ok')}</td><td>${p.responsables_zone.length}</td><td>${p.equipes.length}</td>
          <td>${ef} / ${ci || '—'} ${ci ? `<div class="go-gap"><i style="width:${Math.min(100, Math.round(ef / ci * 100))}%"></i></div>` : ''}</td><td>${p.missions.actives}</td><td>${p.missions.en_retard ? chip(p.missions.en_retard, 'bad') : 0}</td><td>${p.preuves.A_VERIFIER || 0}</td></tr>`; }).join('')}</tbody></table></div>` : '<p class="go-note">Aucun projet dans votre périmètre.</p>'}
        ${sous.length ? `<h4>Équipes à compléter</h4><p class="go-note">${sous.map(t => `${esc(t.code)} (${esc(t.zone)}) : ${t.effectif}/${t.effectif_cible}${t.propositions ? ' · ' + t.propositions + ' proposition(s) en attente' : ''}`).join(' · ')}</p>` : ''}
        <p class="go-note">L’effectif cible (13 par défaut) est un objectif d’organisation, pas une obligation : les écarts sont signalés, jamais comblés automatiquement.</p></div>
        ${st.myEmp ? `<div class="go-sec"><h3>Mes affectations</h3>
          <p>${st.steer.map(s => chip('Pilotage ' + s.project_code + ' · ' + FCT[s.fonction], 'info')).join(' ')} ${st.zm.map(z => chip('Responsable de zone ' + z.project_code + ' · ' + areaName(z.area_id), 'info')).join(' ')}
          ${myTeams.map(m => { const t = st.teams.find(x => x.id === m.team_id); return chip((t?.code || 'Équipe') + ' · ' + (ROLE_EQ[m.role_equipe] || m.role_equipe) + (m.statut === 'PROPOSEE' ? ' (proposée)' : ''), m.statut === 'VALIDEE' ? 'ok' : 'warn'); }).join(' ') || ''}
          ${!st.steer.length && !st.zm.length && !myTeams.length ? '<span class="go-muted">Aucune affectation active.</span>' : ''}</p>
          ${myActs.length ? `<div class="go-tw"><table><thead><tr><th>Activité</th><th>Prévue</th><th>Statut</th></tr></thead><tbody>${myActs.map(a => `<tr><td>${esc(a.geci_activities?.titre)}</td><td>${dfr(a.geci_activities?.date_prevue)}</td><td>${chip(ACT_L[a.geci_activities?.statut] || '', a.geci_activities?.statut === 'REALISEE' ? 'ok' : '')}</td></tr>`).join('')}</tbody></table></div>` : ''}</div>` : ''}`;
    };

    /* ---------- ORGANISATION : pilotage 3 → responsables de zone → équipes 13+ ---------- */
    V.org = async (b) => {
      const projs = C.project ? [C.project] : Object.keys(PROJ);
      const tm = await sel('geci_team_members', '*', q => q.is('date_fin', null).neq('statut', 'REFUSEE'));
      const html = projs.map(p => {
        const sm = st.allSteer.filter(x => x.project_code === p && !x.date_fin);
        const zms = st.allZm.filter(x => x.project_code === p && !x.date_fin);
        const tms = st.teams.filter(t => t.project_code === p && t.statut !== 'DISSOUTE');
        const can = manages(p);
        return `<div class="go-sec"><h3>${esc(PROJ[p])} <span class="go-row">${can ? `<button class="go-btn sm" data-rec="${p}">Recommandation d’affectation</button>` : ''}</span></h3>
        <h4>Équipe de pilotage au siège (3 fonctions)</h4>
        <div class="go-tw"><table><thead><tr><th>Fonction</th><th>Titulaire</th><th>Depuis</th>${isDir() ? '<th>Nommer / remplacer</th>' : ''}</tr></thead><tbody>
        ${Object.entries(FCT).map(([f, l]) => { const x = sm.find(s => s.fonction === f);
          return `<tr><td><b>${l}</b></td><td>${x ? esc(empName(x.employee_id)) : chip('Poste vacant', 'warn')}</td><td>${x ? dfr(x.date_debut) : '—'}</td>
          ${isDir() ? `<td><form class="go-row" data-steer="${p}|${f}"><select class="go-in" name="e" style="max-width:260px" required>${empOpts(null)}</select><button class="go-btn sm p">Nommer</button></form></td>` : ''}</tr>`; }).join('')}</tbody></table></div>
        <h4>Responsables de zone (rattachés au pilotage ${esc(p)})</h4>
        ${zms.length ? `<div class="go-tw"><table><thead><tr><th>Responsable</th><th>Zone</th><th>Depuis</th><th>Équipes</th>${can ? '<th></th>' : ''}</tr></thead><tbody>${zms.map(z => `<tr><td>${esc(empName(z.employee_id))}</td><td>${esc(areaName(z.area_id))}</td><td>${dfr(z.date_debut)}</td><td>${tms.filter(t => t.zone_manager_id === z.id).map(t => esc(t.code)).join(', ') || '—'}</td>${can ? `<td><button class="go-btn sm bad" data-zmend="${z.id}">Mettre fin</button></td>` : ''}</tr>`).join('')}</tbody></table></div>` : '<p class="go-note">Aucun responsable de zone nommé.</p>'}
        ${can ? `<details><summary>Nommer un responsable de zone</summary><form class="go-f" data-zm="${p}"><label>Employé<select class="go-in" name="e" required>${empOpts(null)}</select></label><label>Zone (ville ou zone industrielle)<select class="go-in" name="a" required>${areaOpts(null)}</select></label><label>Début<input class="go-in" type="date" name="d"></label><button class="go-btn p">Nommer</button></form></details>` : ''}
        <h4>Équipes opérationnelles (effectif cible configurable, 13 par défaut)</h4>
        ${tms.length ? tms.map(t => { const mem = tm.filter(m => m.team_id === t.id); const val = mem.filter(m => m.statut === 'VALIDEE'), prop = mem.filter(m => m.statut === 'PROPOSEE');
          const zmOk = can || zmTeams().has(t.id);
          return `<details ${tms.length === 1 ? 'open' : ''}><summary><span class="go-mono">${esc(t.code)}</span> · ${esc(t.nom)} · ${esc(areaName(t.area_id))} · ${val.length}/${t.effectif_cible} ${val.length < t.effectif_cible ? chip('à compléter', 'warn') : chip('complète', 'ok')} ${prop.length ? chip(prop.length + ' proposition(s)', 'info') : ''} ${t.statut !== 'ACTIVE' ? chip(t.statut) : ''}</summary>
            <p class="go-note">Responsable de zone : <b>${t.zone_manager_id ? esc(empName(st.allZm.find(z => z.id === t.zone_manager_id)?.employee_id)) : 'non désigné'}</b> · Pilotage : ${esc(PROJ[p])} (siège)${t.referent_technique_id ? ' · Référent technique : ' + esc(empName(t.referent_technique_id)) : ''}${t.objectifs ? ' · Objectifs : ' + esc(t.objectifs) : ''}</p>
            <div class="go-gap" style="max-width:320px"><i style="width:${Math.min(100, Math.round(val.length / t.effectif_cible * 100))}%"></i></div>
            ${mem.length ? `<div class="go-tw"><table><thead><tr><th>Membre</th><th>Rôle</th><th>Statut</th><th>Depuis</th><th></th></tr></thead><tbody>${mem.map(m => `<tr><td>${esc(empName(m.employee_id))}</td><td>${esc(ROLE_EQ[m.role_equipe] || m.role_equipe)}</td><td>${chip(m.statut === 'VALIDEE' ? 'Validée' : 'Proposée', m.statut === 'VALIDEE' ? 'ok' : 'warn')}</td><td>${dfr(m.date_debut)}</td>
              <td class="go-row">${m.statut === 'PROPOSEE' && can ? `<button class="go-btn sm p" data-ok="${m.id}">Valider</button><button class="go-btn sm bad" data-ko="${m.id}">Refuser</button>` : ''}${m.statut === 'VALIDEE' && zmOk ? `<button class="go-btn sm" data-out="${m.id}">Retirer</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<p class="go-note">Aucun membre.</p>'}
            ${zmOk && t.statut === 'ACTIVE' ? `<form class="go-f" data-add="${t.id}"><label>Ajouter un membre<select class="go-in" name="e" required>${empOpts(null)}</select></label><label>Rôle<select class="go-in" name="r">${opt(Object.entries(ROLE_EQ), 'AGENT')}</select></label><button class="go-btn p">${can ? 'Affecter (validé)' : 'Proposer au pilotage'}</button></form>` : ''}
            ${can ? `<details><summary>Modifier l’équipe</summary><form class="go-f" data-tupd="${t.id}"><label>Nom<input class="go-in" name="n" value="${esc(t.nom)}"></label><label>Zone<select class="go-in" name="a">${areaOpts(t.area_id)}</select></label>
              <label>Responsable de zone<select class="go-in" name="z">${opt(zms.map(z => [z.id, empName(z.employee_id) + ' — ' + areaName(z.area_id)]), t.zone_manager_id, 'Aucun')}</select></label><label>Effectif cible<input class="go-in" type="number" min="1" name="c" value="${t.effectif_cible}"></label>
              <label>Référent technique<select class="go-in" name="rt">${empOpts(t.referent_technique_id, 'Aucun')}</select></label><label>Statut<select class="go-in" name="s">${opt([['ACTIVE', 'Active'], ['SUSPENDUE', 'Suspendue'], ['DISSOUTE', 'Dissoute']], t.statut)}</select></label>
              <label class="w">Objectifs<input class="go-in" name="o" value="${esc(t.objectifs || '')}"></label><button class="go-btn p">Enregistrer</button></form></details>` : ''}
          </details>`; }).join('') : '<p class="go-note">Aucune équipe pour ce projet.</p>'}
        ${can ? `<details><summary>Créer une équipe ${esc(p)}</summary><form class="go-f" data-tnew="${p}"><label>Nom<input class="go-in" name="n" required placeholder="Équipe ${esc(p)} Soubré 1"></label><label>Zone<select class="go-in" name="a" required>${areaOpts(null)}</select></label>
          <label>Responsable de zone<select class="go-in" name="z">${opt(zms.map(z => [z.id, empName(z.employee_id) + ' — ' + areaName(z.area_id)]), null, 'À désigner')}</select></label><label>Effectif cible<input class="go-in" type="number" min="1" name="c" value="13"></label>
          <label class="w">Objectifs<input class="go-in" name="o"></label><button class="go-btn p">Créer l’équipe</button></form></details>` : ''}
        <div data-recout="${p}"></div></div>`; }).join('');
      b.innerHTML = (st.emps.length ? '' : `<div class="go-sec"><b>Aucun employé enregistré.</b><p class="go-note">Commencez par l’onglet « Personnel (RH) » : saisissez ou importez les fiches réelles du personnel de GEC-CI. Aucune fiche n’est créée automatiquement.</p></div>`) + html;
      b.querySelectorAll('form[data-steer]').forEach(f => f.onsubmit = async (e) => { e.preventDefault(); const [p, fc] = f.dataset.steer.split('|'); await rpc('geci_steering_set', { p_project: p, p_fonction: fc, p_employee: fd(f).e, p_intitule: FCT[fc] + ' ' + p }, 'Pilotage mis à jour (l’ancien titulaire reste dans l’historique)'); reload(); });
      b.querySelectorAll('form[data-zm]').forEach(f => f.onsubmit = async (e) => { e.preventDefault(); const d = fd(f); await rpc('geci_zone_manager_assign', { p_employee: d.e, p_project: f.dataset.zm, p_area: d.a, p_principal: true, p_debut: nz(d.d) }, 'Responsable de zone nommé'); reload(); });
      b.querySelectorAll('[data-zmend]').forEach(x => x.onclick = async () => { const m = await ask('Motif de fin de responsabilité (obligatoire) :', true); if (!m) return; await rpc('geci_zone_manager_end', { p_id: x.dataset.zmend, p_motif: m }, 'Responsabilité close'); reload(); });
      b.querySelectorAll('form[data-tnew]').forEach(f => f.onsubmit = async (e) => { e.preventDefault(); const d = fd(f); await rpc('geci_team_create', { p_project: f.dataset.tnew, p_nom: d.n, p_area: d.a, p_zone_manager: nz(d.z), p_effectif_cible: Number(d.c) || null, p_referent: null, p_objectifs: nz(d.o) }, 'Équipe créée'); reload(); });
      b.querySelectorAll('form[data-tupd]').forEach(f => f.onsubmit = async (e) => { e.preventDefault(); const d = fd(f); await rpc('geci_team_update', { p_team: f.dataset.tupd, p_nom: d.n, p_area: d.a, p_zone_manager: nz(d.z), p_effectif_cible: Number(d.c) || null, p_referent: nz(d.rt), p_objectifs: nz(d.o), p_statut: d.s }, 'Équipe mise à jour'); reload(); });
      b.querySelectorAll('form[data-add]').forEach(f => f.onsubmit = async (e) => { e.preventDefault(); const d = fd(f); await rpc('geci_team_add_member', { p_team: f.dataset.add, p_employee: d.e, p_role: d.r }, 'Affectation enregistrée'); reload(); });

        if (!Object.keys(patch).length) return say('Renseignez au moins un champ à appliquer.', true);
