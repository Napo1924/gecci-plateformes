:root{
  --navy:#0A1628; --gold:#C9A227; --gold-ink:#8A6B0E; --norm:#1F5FA8;
  --bg:#F1F4F8; --surface:#FFFFFF; --surface2:#F6F8FB; --fg:#0F1B2D; --muted:#5A6B83; --line:#DCE3EC;
  --accent:#1D5FA8; --accent-bg:#E6EFFA;
  --ok:#0E7A4C; --ok-bg:#E1F4EA; --warn:#9A5B00; --warn-bg:#FFF0D4; --bad:#B42318; --bad-bg:#FDE7E5;
  --rail-fg:#C8D4E5; --rail-muted:#7F91AD;
  --f-ui:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Century Schoolbook","GEC Schola",Georgia,serif;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111F; --surface:#0F1D33; --surface2:#132440; --fg:#E6ECF5; --muted:#93A4BD; --line:#22385A;
  --accent:#7DB3F0; --accent-bg:#16304F; --gold-ink:#E2C15A;
  --ok:#5CD39A; --ok-bg:#0E3326; --warn:#F1B957; --warn-bg:#3A2A0C; --bad:#FF8A80; --bad-bg:#3D1512; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111F; --surface:#0F1D33; --surface2:#132440; --fg:#E6ECF5; --muted:#93A4BD; --line:#22385A;
  --accent:#7DB3F0; --accent-bg:#16304F; --gold-ink:#E2C15A;
  --ok:#5CD39A; --ok-bg:#0E3326; --warn:#F1B957; --warn-bg:#3A2A0C; --bad:#FF8A80; --bad-bg:#3D1512; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;margin:0}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:252px 1fr;min-height:100%}
.rail{background:var(--navy);color:var(--rail-fg);padding:16px 12px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow:auto}
.rail img{width:100%;border-radius:6px}
.rail .norm{border-left:4px solid var(--norm);padding:6px 10px;background:#13284A;border-radius:4px}
.rail .norm b{display:block;color:#fff;font-size:15px}
.rail .norm span{font-size:11.5px;color:var(--rail-muted)}
.rail .who{font-size:12px;color:var(--rail-muted);border-top:1px solid #1E3354;padding-top:10px}
.rail .who b{color:#fff;display:block;font-weight:600}
.rail a{color:#D9B23A;font-weight:600;text-decoration:none;font-size:12.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--rail-muted);margin:10px 8px 4px}
.nav button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.nav button:hover{background:#13284A}
.nav button.on{background:#13284A;color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav button:focus-visible{outline:2px solid var(--gold)}
.nav .cnt{font-size:11px;background:#1E3354;border-radius:99px;padding:0 7px;color:#fff}
.main{min-width:0;padding-block:22px 40px;padding-inline:28px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:22px;font-weight:600}
.top p{margin:4px 0 0;color:var(--muted);font-family:var(--f-read);font-size:15px;max-width:72ch}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px;min-width:0}
.sec>h2{font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sec.norm{border-top:3px solid var(--norm)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.grid{display:grid;gap:12px} .g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))} .g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .n{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted)}
.tile.alert{border-color:var(--bad)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--norm)}
.tw{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:bottom}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.info{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.chip.gold{background:var(--navy);color:var(--gold);border-color:transparent}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;font-size:13px;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .btn.primary{background:var(--gold);color:#0A1628;border-color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--gold);color:#0A1628;border-color:var(--gold)}}
.btn.danger{color:var(--bad)} .btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;align-items:end}
form.f label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
form.f .wide{grid-column:1/-1}
.inp{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--surface);font-size:13.5px;color:var(--fg)}
textarea.inp{min-height:70px;resize:vertical}
details.add{border:1px dashed var(--line);border-radius:6px;padding:8px 12px;margin-top:10px}
details.add summary{cursor:pointer;font-weight:500;color:var(--accent)}
details.add[open] summary{margin-bottom:10px}
.note{font-family:var(--f-read);font-size:14px;color:var(--muted);margin:6px 0 0}
.alertbox{border-left:4px solid var(--bad);background:var(--bad-bg);padding:8px 12px;border-radius:4px;font-size:13px;margin:8px 0}
.goldbox{border-left:4px solid var(--gold);background:var(--surface2);padding:8px 12px;border-radius:4px;font-family:var(--f-read);font-size:14px;margin:8px 0}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(440px,calc(100% - 32px));background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.25);border-left:4px solid var(--gold)}
.toast.bad{border-left-color:#FF6B5E}
.auth{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:var(--navy)}
.auth .card{background:var(--surface);border-radius:12px;max-width:460px;width:100%;overflow:hidden}
.auth .card .brand{background:var(--navy);padding:18px 22px;border-bottom:4px solid var(--norm)}
.auth .card .body{padding:20px 22px;display:grid;gap:12px}
.auth p.foot{color:var(--rail-muted);font-size:12px;text-align:center;max-width:460px;margin:14px auto 0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:170px 1fr;gap:4px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.md{font-family:var(--f-read);font-size:15px;line-height:1.6;max-width:84ch;overflow-wrap:break-word}
.md h1{font-family:var(--f-ui);font-size:20px;background:var(--navy);color:#fff;padding:10px 14px;border-left:6px solid var(--gold);border-radius:6px;margin:28px 0 12px}
.md h2{font-family:var(--f-ui);font-size:17px;border-bottom:2px solid var(--gold);padding-bottom:4px;margin:22px 0 8px}
.md h3{font-family:var(--f-ui);font-size:15px;color:var(--gold-ink);margin:16px 0 6px}
.md table{font-family:var(--f-ui);font-size:12.5px;margin:8px 0}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:4px solid var(--gold);background:var(--surface2)}
.toc{display:flex;flex-direction:column;gap:2px;font-size:13px}
.toc a{color:var(--accent);text-decoration:none}
.tag-loi{color:var(--bad);font-weight:700}
.tag-conf{color:var(--bad);font-weight:700}
.mobbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto}
  .rail .nav,.rail .norm,.rail .who{display:none}
  .rail.open .nav,.rail.open .who{display:flex;flex-direction:column}
  .mobbar{display:flex}
  .rail img{max-width:240px}
  .main{padding-inline:16px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

## À quoi sert ce kit

Ce kit est le contenu de référence de GEC-CI pour accompagner une entreprise ou une coopérative vers un système de management de la qualité (SMQ) conforme à ISO 9001. Il sert à quatre usages :

- **vendre** : expliquer au dirigeant ce que la norme lui apporte, sans promesse de certificat ;
- **diagnostiquer** : mesurer les écarts article par article en 45 minutes puis sur le terrain ;
- **mettre en œuvre** : disposer des procédures, formulaires, registres et indicateurs codifiés (préfixe **Q**) ;
- **auditer** : préparer l'audit interne et l'audit de certification avec des preuves réelles.

Le kit vise l'édition **ISO 9001:2026**, publiée le 16 septembre 2026. Pendant la transition, l'édition **ISO 9001:2015 + Amendement 1:2024** reste valable. La numérotation utilisée dans la matrice (Partie 5) est celle de 2015 ; les changements 2026 sont signalés article par article.

## Les quatre situations clients couvertes

| Cas | Client type | Situation de départ | Ce que le kit apporte en premier |
|---|---|---|---|
| 1 | PME de services à Abidjan (maintenance, nettoyage industriel, informatique, sécurité) | Croissance rapide, tout passe par le patron, réclamations répétées des grands comptes, appels d'offres qui demandent un système qualité | Cartographie des processus, revue de contrat, suivi des réclamations |
| 2 | Usine de transformation à San Pedro (broyage de cacao, décorticage de noix de cajou) | Réclamations d'acheteurs sur l'humidité, les corps étrangers ou les délais ; pesées contestées ; personnel saisonnier | Plan de contrôle, étalonnage des instruments, libération des lots, traçabilité |
| 3 | Société coopérative agricole à Soubré | Gestion encore informelle, conflits sur les pesées, exigences d'acheteurs et de référentiels (Rainforest Alliance, Fairtrade), besoin de confiance des membres | Structuration des processus (collecte, pesée, stockage, vente), traçabilité, gouvernance, éthique |
| 4 | Transporteur de marchandises (axe San Pedro – Abidjan, desserte des zones de production) | Avaries, retards, litiges avec les chargeurs, pannes de camions | Maintenance des véhicules, propriété du client, évaluation des sous-traitants, maîtrise des changements |

Une cinquième situation est fréquente : l'entreprise **déjà certifiée ISO 9001:2015** qui doit passer à l'édition 2026. Le kit prévoit pour elle une analyse d'écarts ciblée (voir Partie 3).

## Convention de lecture : catégories A à E et niveaux N1 à N6

Chaque exigence citée dans le kit est classée. Cela évite de confondre une obligation légale avec un conseil.

| Catégorie | Niveau | Origine | Exemple ISO 9001 | Conséquence si non respectée |
|---|---|---|---|---|
| **A** | N1 | Loi ou règlement ivoirien (ou OHADA, UEMOA) | Vérification périodique des balances utilisées dans les transactions (loi n° 2016-411) | Sanction légale possible |
| **B** | N2 | Norme ISO 9001 | Conserver les preuves de la revue des exigences client | Non-conformité d'audit |
| **C** | N3-N4 | Client, contrat, marché, cahier des charges acheteur, référentiel volontaire | Taux d'humidité maximal exigé par un acheteur de cacao | Litige, perte du client |
| **D** | N5 | Bonne pratique GEC-CI | Test de traçabilité semestriel en moins de 4 heures | Fragilité du système |
| **E** | N6 | Recommandation du consultant | Indice de culture qualité trimestriel (KPI-Q-15) | Opportunité manquée |

Règle simple : **A et B sont obligatoires** (A par la loi, B pour la certification) ; **C** l'est par contrat ; **D et E** se discutent avec le client.

## Règles d'usage GEC-CI

1. **Aucune promesse de certification ni de date de certificat.** L'organisme certificateur accrédité décide seul, après ses audits.
2. **Aucune préparation à mentir.** Une preuve fabriquée est une faute grave ; elle est en outre contraire à la charte POL-Q-02 que nous faisons signer.
3. **Aucun prix GEC-CI dans ce kit.** Le prix se calcule après diagnostic, lot par lot. Les coûts de tiers (achat de la norme, organisme certificateur, étalonnage, laboratoire) sont présentés sur devis de ces tiers.
4. **Rien n'est inventé.** Tout point non vérifié porte la mention : **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**.
5. **Le système doit servir l'entreprise.** On documente ce qui est utile ; on ne copie pas un modèle d'une autre société.
6. **Les preuves sont codifiées** : PRV-Q-[code client]-[article]-[rang], par exemple PRV-Q-PME-0007-8.4.1-02.

## Avertissement droit d'auteur

Le texte des normes ISO est protégé. Ce kit ne reproduit **aucun** passage de la norme. Pour chaque article, il donne le numéro, un titre court usuel et une reformulation GEC-CI de l'intention, orientée sur ce que l'auditeur veut voir. Chaque client doit acheter son exemplaire officiel de la norme auprès de l'ISO ou de CODINORM : c'est un coût réel du projet, à prévoir dès le départ.

# Partie 1 — Cadre de référence vérifié (au 9 octobre 2026)

## 1.1 Documents qui font foi

| ISO 9004 — Gestion des performances durables | Guide (non certifiable) | Aller au-delà de la conformité | Édition en vigueur À CONFIRMER |
| ISO 19011 — Lignes directrices pour l'audit des systèmes de management | Guide | Méthode d'audit interne (PRO-Q-15) | Édition en vigueur À CONFIRMER |
| ISO 31000 — Management du risque | Guide | Méthode de cotation des risques (PRO-Q-03) | Édition 2018 en vigueur À CONFIRMER |

| ISO 14001:2026, ISO 45001:2018 + Amd 1:2024, ISO 22000:2018 | Normes sœurs | Intégration QSE / QSSE (MAT-Q-03) | Voir kits E, S, H de GEC-CI |

## 1.2 Ce qui change avec ISO 9001:2026

Les sources consultées (LRQA, SGS, CQI, NSF) concordent sur les points suivants. Le détail exact des formulations doit être lu dans le texte officiel.

| Thème | Ce qui est annoncé | Articles concernés (numérotation 2015) | Statut |
|---|---|---|---|
| Culture qualité et comportement éthique | La direction doit les promouvoir ; le personnel doit y être sensibilisé ; mentionnés aussi pour l'environnement des processus | 5.1, 7.3, 7.1.4 | Annoncé ; libellé À CONFIRMER |
| Risques et opportunités | Déterminés et traités dans des exigences distinctes ; 6.1 réorganisé | 6.1 | Annoncé ; sous-numérotation À CONFIRMER |
| Maîtrise des changements | Renforcée : communication, surveillance, évaluation et revue des changements | 6.3 (et liens avec 8.5.6) | Annoncé ; libellé À CONFIRMER |
| Termes et définitions | Une sélection de termes essentiels intégrée dans la norme elle-même | 3 | Annoncé |
| Annexe A | Enrichie pour clarifier les exigences ; Annexe B supprimée (selon CQI) | Annexes | Annoncé ; suppression de l'Annexe B À CONFIRMER |
| Politique qualité | Doit refléter plus explicitement la stratégie et le contexte (selon SGS) | 5.2 | À CONFIRMER |
| Connaissances organisationnelles | Traitement élargi, reliées aux résultats attendus (selon CQI) | 7.1.6 | À CONFIRMER |
| Climat | Intégration de l'Amd 1:2024 | 4.1, 4.2 | Vérifié |
| Chapitres 7 et 8 | Chapitre 7 restructuré, chapitre 8 : terminologie et mise en page | 7, 8 | Numérotation 2026 À CONFIRMER |

**Ce qui ne change pas** : la structure harmonisée (chapitres 4 à 10), l'approche processus, l'orientation client, l'audit interne, la revue de direction, l'amélioration continue. Une entreprise bien certifiée en 2015 n'a pas à tout refaire : elle complète.

## 1.3 Transition d'édition

- Période de transition annoncée : **environ 3 ans**, soit jusque vers **septembre 2029** (LRQA, SGS). Les règles exactes de l'IAF (date d'arrêt des audits initiaux selon 2015, durée minimale d'audit de transition) : **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**.
- Les certificats ISO 9001:2015 restent valables pendant la transition, puis deviennent caducs à son terme s'ils n'ont pas été transférés.
- Conseil GEC-CI (E) : une entreprise qui démarre aujourd'hui construit directement selon 2026, même si l'audit initial peut encore, selon les règles de l'organisme, se faire sur 2015 (À CONFIRMER).

| ARTCI | Autorité de protection des données personnelles (loi n° 2013-450) | Vérifié |

## 1.5 Contexte légal ivoirien utile pour un système qualité

ISO 9001 demande de connaître et respecter les exigences légales applicables aux produits et services (catégorie A). Voici celles qui reviennent le plus souvent chez nos clients. Elles alimentent le registre **REG-Q-10**.

| Texte | Ce qui compte pour la qualité | Articles ISO 9001 liés | Statut |
|---|---|---|---|
| Loi n° 2016-412 du 15 juin 2016 relative à la consommation | Information précontractuelle du consommateur (art. 3) ; délais de livraison et résiliation (art. 6) ; certification réservée à des organismes accrédités et agréés (art. 7 à 9) ; garantie légale de conformité (art. 93) ; garantie commerciale écrite (art. 94) ; prolongation de garantie en cas de réparation tardive (art. 95) ; service après-vente et information écrite sur les réparations (art. 96) ; obligation générale de conformité et de sécurité (art. 97 et suivants) ; mesures d'urgence (art. 104 à 107) | 8.2.1, 8.2.2, 8.5.5, 8.7 | Articles 3 à 96 lus sur le texte consolidé (civlii) ; contenu des articles 97 à 107 et décrets d'application À CONFIRMER |
| Loi n° 2016-411 du 15 juin 2016 relative au système national de métrologie | Vérification primitive avant mise en service (art. 23-24) ; vérification périodique, généralement annuelle, des instruments utilisés dans les transactions (art. 26-27) ; obligation d'instruments adaptés (art. 30) ; unités légales (art. 4) ; sanctions pénales lourdes pour instruments faux ou non vérifiés (art. 34 et 35) | 7.1.5 | Vérifié sur le texte consolidé ; fréquences et tarifs par type d'instrument À CONFIRMER |
| Loi n° 2013-450 du 19 juin 2013 relative à la protection des données à caractère personnel | Déclaration préalable à l'ARTCI de la plupart des traitements ; autorisation pour certains (biométrie, transferts hors du pays…) ; information des personnes ; sécurité ; correspondant à la protection des données facultatif | 8.5.3 (données confiées par le client), 7.5.3 | Vérifié (DLA Piper) ; formalités exactes pour chaque client À CONFIRMER auprès de l'ARTCI |
| Décret n° 2016-1152 (conformité aux Normes Ivoiriennes de certaines catégories de produits) et programme de vérification de conformité des importations | Certains produits doivent respecter des NI obligatoires | 8.2.2, 8.4 | Cité par trade.gov ; portée exacte À CONFIRMER |
| Acte uniforme OHADA relatif au droit des sociétés coopératives (15 décembre 2010) | Gouvernance des coopératives (organes, registres, assemblées) ; utile pour 5.3 et 4.2 dans une société coopérative | 4.2, 5.3 | Date vérifiée ; exigences précises À CONFIRMER |
| Réglementation de la filière café-cacao (Conseil du Café-Cacao) | Règles de qualité, de commercialisation et de pesée des fèves | 8.2.2, 8.5, 8.6 | À CONFIRMER (textes en vigueur pour la campagne en cours) |
| Code du travail (loi n° 2015-532 du 20 juillet 2015) | Contrats, durée du travail, travail saisonnier ; utile pour 7.1.2 et 7.2 | 7.1.2, 7.2 | Référence À CONFIRMER |
| Réglementation des transports routiers de marchandises (charge à l'essieu, visites techniques, assurances) | Conditions de transport des marchandises des clients | 7.1.3, 8.5.4 | À CONFIRMER |

**Ce qu'il faut retenir pour le dirigeant** : la norme ne remplace pas la loi. Un auditeur ISO 9001 n'est pas un inspecteur, mais il vérifiera que vous connaissez vos obligations et que vous les suivez. Une balance non vérifiée dans un magasin de coopérative est à la fois un risque pénal (loi n° 2016-411) et une non-conformité ISO (7.1.5).

## 2.2 Calcul de valeur (sans prix GEC-CI)

Le dirigeant ne paie pas pour un certificat : il paie pour moins de pertes et plus de contrats. Avec lui, on chiffre **ses propres** pertes. GEC-CI ne donne pas de chiffre de gain garanti ; on mesure la situation de départ, puis l'évolution.

### Grille de calcul à remplir avec le client

| Poste de perte | Comment le mesurer | Source après mise en place |
|---|---|---|
| Lots refusés ou déclassés | Nombre de lots x tonnage x écart de prix | REG-Q-09 |
| Retraitements (re-séchage, re-tri, reprise de prestation) | Heures de travail x coût horaire + énergie | REG-Q-09 |
| Pénalités de retard | Montants facturés par les clients | REG-Q-08 |
| Pannes en pleine campagne | Heures d'arrêt x production horaire perdue | REG-Q-14 |
| Écarts de pesée | Écart entre poids départ et poids arrivée x prix | REG-Q-13, REG-Q-06 |
| Clients perdus | Chiffre d'affaires annuel des clients partis | REG-Q-08 |
| Temps du dirigeant | Heures par semaine passées à « éteindre des feux » | Entretien |

**Exemple de raisonnement (chiffres fictifs, à remplacer par ceux du client)** : une unité de cajou de San Pedro qui se voit déclasser 4 lots par campagne pourra calculer le coût réel de ces déclassements (tonnage x écart de prix), y ajouter les heures de re-tri, et comparer ce total au coût de son projet qualité (temps du personnel, étalonnage, formation, norme, audit). Le but est que le dirigeant fasse lui-même le calcul.

### Gains qualitatifs à faire reconnaître

- accès à des appels d'offres et à des acheteurs qui demandent un système qualité (catégorie C) ;
- moins de dépendance au dirigeant ou à un technicien clé ;
- un langage commun avec les acheteurs internationaux ;
- une base solide pour ajouter ISO 14001, ISO 45001, ISO 22000 ou les référentiels agricoles ;
- des données fiables pour négocier avec les banques et les partenaires.

### Coûts implicites à annoncer dès le départ

- **temps du personnel** : responsable qualité (souvent à mi-temps dans une PME), pilotes de processus, participation aux formations et audits ;
- **mesures** : étalonnage et vérification des balances, ponts-bascules, humidimètres, thermomètres (devis des prestataires ; vérification légale selon la loi n° 2016-411, tarifs À CONFIRMER) ;
- **analyses de laboratoire** si les clients en exigent (humidité, grainage, taux de défauts) ;
- **achat de la norme** auprès de CODINORM ou de l'ISO (prix À CONFIRMER) ;
- **frais de l'organisme certificateur** : audit initial (étapes 1 et 2), surveillances annuelles, renouvellement, frais de déplacement (sur devis de l'organisme) ;
- **petits investissements** : étiquettes de statut, zone de quarantaine, armoires d'archives, sauvegarde informatique.

## 2.3 Argumentaires par secteur

### Sociétés coopératives agricoles

- **Ce que vit le gérant** : membres qui contestent les pesées, retards de paiement, sacs mélangés, exigences croissantes des acheteurs et des référentiels.
- **Ce qu'ISO 9001 apporte** : des processus écrits pour la collecte, la pesée, le stockage et la vente ; des balances vérifiées ; une traçabilité par section et par producteur ; un traitement écrit des plaintes des membres ; une gouvernance plus transparente.
- **Phrase clé** : « Une coopérative bien organisée se défend mieux devant ses membres comme devant ses acheteurs. »
- **Point d'attention** : ISO 9001 ne remplace pas Rainforest Alliance ou Fairtrade. Il structure la gestion et peut porter les deux (voir Partie 12).

### PME de services

- **Ce que vit le dirigeant** : tout passe par lui, les équipes changent, les grands comptes exigent des preuves.
- **Ce qu'ISO 9001 apporte** : des responsabilités claires (MAT-Q-02), des offres vérifiées avant signature (FOR-Q-02), des réclamations suivies (REG-Q-08), des sous-traitants évalués (REG-Q-07).
- **Phrase clé** : « Votre entreprise doit pouvoir tourner une semaine sans vous. »

### Industrie et transformation

- **Ce que vit le directeur d'usine** : lots refusés, pesées contestées, pannes en campagne, personnel saisonnier.
- **Ce qu'ISO 9001 apporte** : plan de contrôle, instruments fiables, libération signée, quarantaine des non-conformes, maintenance préventive, retours d'expérience écrits.
- **Phrase clé** : « Chaque lot qui sort doit avoir une signature et une preuve. »
- **Lien** : pour les produits alimentaires, ISO 22000 ou FSSC 22000 est souvent attendu par les acheteurs ; ISO 9001 en est une bonne base mais ne le remplace pas.

### Transport et logistique

- **Ce que vit le transporteur** : avaries, retards, camions immobilisés, chauffeurs qui changent, litiges.
- **Ce qu'ISO 9001 apporte** : maintenance planifiée, contrôle de chargement, suivi des marchandises confiées, évaluation des sous-traitants, réponse écrite aux réclamations.
- **Phrase clé** : « Le chargeur veut savoir que sa marchandise arrive entière, à l'heure, et que vous savez prouver ce qui s'est passé. »

## 2.4 Diagnostic express de 45 minutes

Déroulé avec le dirigeant (ou le gérant et le président du conseil d'administration pour une coopérative) :

| Temps | Contenu | Support |
|---|---|---|
| 0-5 min | Objectif, règles (pas de promesse de certificat, pas de prix avant diagnostic complet) | — |
| 5-15 min | Activité, clients, sites, effectif, problèmes du moment | Notes |
| 15-35 min | Les 8 questions clés (extras.json), avec demande de voir une preuve pour chaque « oui » | FOR-Q-01 version courte |
| 35-40 min | Restitution : 3 points forts, 3 priorités | — |
| 40-45 min | Proposition de suite : diagnostic complet sur site, lots possibles | — |

Les 8 questions clés : politique et objectifs suivis ; risques cotés ; revue des commandes ; évaluation des fournisseurs ; étalonnage des instruments ; traitement des réclamations ; analyse des changements ; revue de direction annuelle. Un « oui » sans preuve compte comme un « non ».

## 2.5 Objections fréquentes et réponses

| Objection | Réponse GEC-CI |
|---|---|
| « C'est trop de papier. » | La norme laisse adapter la documentation à la taille. On garde le minimum utile, souvent en registres numériques sur GEC-CI Pro. |
| « Nos clients ne le demandent pas. » | Le système réduit d'abord vos pertes. Le certificat est un atout commercial supplémentaire. |
| « En combien de temps aurons-nous le certificat ? » | Personne ne peut le promettre. Il faut plusieurs mois de fonctionnement réel et c'est l'organisme certificateur qui décide. |
| « Nous sommes déjà certifiés. » | L'édition 2026 ajoute notamment culture qualité, éthique et maîtrise renforcée des changements ; la transition se prépare. |
| « Notre personnel lit peu. » | Pictogrammes, fiches visuelles, sensibilisation orale en langue locale, contrôle par les chefs d'équipe. |
| « C'est cher. » | Le prix se calcule après diagnostic, lot par lot. On compare avec vos pertes réelles chiffrées ensemble. |
| « Le consultant fera tout à notre place. » | Non : l'auditeur interroge votre personnel. Nous construisons avec vous, vous appliquez. |

## 2.6 Erreurs à ne pas commettre

1. **Vendre un certificat** au lieu d'un système. Cela crée des attentes impossibles et un système qui s'effondre après l'audit.
2. **Copier le manuel d'une autre entreprise.** L'auditeur le voit immédiatement (mauvais noms de processus, procédures inutiles).
3. **Écrire des procédures que personne n'applique.** Une procédure non appliquée est une non-conformité assurée.
4. **Oublier les exigences légales** (balances, données personnelles, garanties) : l'auditeur demande comment elles sont identifiées.
5. **Nommer un responsable qualité sans temps ni autorité.**
6. **Négliger la revue de direction** ou la faire sans le dirigeant.
7. **Lancer l'audit de certification trop tôt**, sans enregistrements réels sur plusieurs mois.
8. **Ignorer les nouveautés 2026** (culture qualité, éthique, changements) dans un projet démarré aujourd'hui.

# Partie 3 — Parcours de certification

> Reformulation GEC-CI. Le texte officiel de la norme, acheté auprès de l'ISO ou de CODINORM, fait foi.

## 3.1 Qui décide : l'organisme certificateur accrédité

GEC-CI accompagne ; **il ne certifie pas**. Le certificat ISO 9001 est délivré par un **organisme certificateur** indépendant, choisi et payé par le client. Pour que le certificat soit reconnu par les acheteurs, cet organisme doit être **accrédité** pour ISO 9001 par un organisme d'accréditation membre de l'accord de reconnaissance mutuelle de l'IAF. Le client vérifie lui-même : nom de l'accréditeur, périmètre (ISO 9001 et secteur d'activité), validité. Liste des organismes actifs en Côte d'Ivoire : **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**.

Un consultant qui a conçu le système ne peut pas l'auditer pour la certification : c'est une règle d'impartialité.

## 3.2 Étapes de l'audit initial

| Étape | Objectif | Où | Ce que l'auditeur regarde | Issue |
|---|---|---|---|---|
| Étape 1 | Vérifier que le système est prêt à être audité | Souvent sur site, parfois en partie à distance | Périmètre, documentation, contexte, risques, audit interne et revue de direction réalisés, compréhension des exigences légales | Rapport listant les points à régler avant l'étape 2 |
| Étape 2 | Vérifier que le système est appliqué et efficace | Sur site, tous les processus | Entretiens avec le personnel à tous les niveaux, observation, enregistrements sur plusieurs mois | Constats : non-conformités majeures, mineures, observations |
| Traitement des constats | Corriger et prouver | Client | Plan d'actions, analyse des causes, preuves | Validation par l'organisme |
| Décision | Certifier ou non | Organisme (personne indépendante de l'auditeur) | Dossier complet | Certificat valable 3 ans, ou refus |

Le délai entre étape 1 et étape 2 et le délai de traitement des non-conformités sont fixés par l'organisme (À CONFIRMER au contrat).

## 3.3 Cycle de 3 ans

| Année | Audit | Contenu |
|---|---|---|
| Année 0 | Audit initial (étapes 1 et 2) | Tout le système |
| Année 1 | Surveillance 1 | Échantillon de processus + éléments obligatoires (audit interne, revue de direction, réclamations, actions correctives, usage du certificat) |
| Année 2 | Surveillance 2 | Autre échantillon + éléments obligatoires |
| Année 3 | Renouvellement | Tout le système, avant l'échéance du certificat |

Une surveillance non réalisée à temps peut conduire à la suspension du certificat.

## 3.4 Transition 2015 → 2026

- Période annoncée d'environ 3 ans, vers septembre 2029 ; règles IAF précises **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**.
- La transition se fait en général lors d'un audit de surveillance ou de renouvellement, avec du temps d'audit supplémentaire (À CONFIRMER auprès de l'organisme).
- **Analyse d'écarts GEC-CI pour une entreprise certifiée 2015** (environ 8 points) :
  1. la direction promeut-elle une culture qualité et un comportement éthique de façon visible ? (POL-Q-02, CHK-Q-03) ;
  2. le personnel est-il sensibilisé à ces sujets ? (REG-Q-05) ;
  3. les risques et les opportunités sont-ils déterminés et traités séparément ? (REG-Q-03, REG-Q-17) ;
  4. les changements sont-ils planifiés, communiqués, surveillés et revus ? (PRO-Q-04, REG-Q-11) ;
  5. le climat a-t-il été examiné comme enjeu ? (REG-Q-01) ;
  6. la politique reflète-t-elle la stratégie ? (POL-Q-01) ;
  7. les connaissances organisationnelles sont-elles gérées ? (REG-Q-15) ;
  8. le vocabulaire des documents est-il aligné sur les termes de l'édition 2026 ? (REG-Q-04).

## 3.5 Méthode GEC-CI en 10 étapes, avec décisions

À la fin de chaque étape, une décision est prise avec le client : **on continue**, **on ajuste**, ou **on s'arrête**. S'arrêter n'est pas un échec : un système interne utile, même non certifié, garde sa valeur.

| N° | Étape | Livrables | Décision « on continue » si… | On s'arrête ou on ajuste si… |
|---|---|---|---|---|
| 1 | Diagnostic express (45 min) puis diagnostic complet sur site | FOR-Q-01 rempli, rapport d'écarts | Le dirigeant s'engage et nomme un responsable qualité | Pas d'engagement de la direction |
| 2 | Cadrage du projet | Périmètre, exclusions justifiées, équipe, planning | Périmètre validé, ressources libérées | Périmètre trop flou ou ressources absentes |
| 3 | Contexte, parties intéressées, exigences légales | REG-Q-01, REG-Q-02, REG-Q-10 | Exigences légales connues | Exigence légale critique non respectée : traiter d'abord |
| 4 | Processus et risques | MAT-Q-01, REG-Q-03 | Pilotes nommés et acceptés | Pilotes non disponibles |
| 5 | Politique, objectifs, éthique | POL-Q-01, POL-Q-02, PLAN-Q-01 | Politique signée, objectifs chiffrés | Désaccord de la direction sur les objectifs |
| 6 | Documentation utile | Procédures, formulaires, registres, REG-Q-04 | Documents validés par les utilisateurs | Documents rejetés par le terrain : simplifier |
| 7 | Mise en œuvre et formation | PLAN-Q-02, enregistrements réels | Au moins 2 à 3 mois d'enregistrements réels | Registres vides : prolonger |
| 8 | Audit interne | PLAN-Q-03, RAP-Q-01, REG-Q-16 | NC traitées ou en cours de traitement | NC majeures non traitées |
| 9 | Revue de direction | RAP-Q-02 | Décisions prises et suivies | Direction absente |
| 10 | Accompagnement à l'audit de certification | CHK-Q-02, plan post-audit | Client prêt selon CHK-Q-02 | Report de l'audit, sans pénalité de notre part |

## 3.6 Planning type selon la taille

Ces durées sont **indicatives**. Elles dépendent de la disponibilité du client et de son point de départ. Elles ne sont pas une promesse de date de certificat.

| Taille | Exemple | Durée indicative jusqu'à la préparation de l'audit externe |
|---|---|---|
| Très petite structure (moins de 20 personnes, 1 site) | PME de services à Abidjan | 6 à 8 mois |
| PME (20 à 100 personnes) | Transporteur, coopérative de taille moyenne | 8 à 10 mois |
| Usine ou multi-sites | Usine de cajou à San Pedro avec magasins délocalisés ; coopérative avec plusieurs sections | 10 à 12 mois |

**Exemple de déroulé sur 9 mois (PME)** :

| Mois | Activités |
|---|---|
| M1 | Diagnostic, cadrage, nomination du RQ, achat de la norme |
| M2 | Contexte, parties intéressées, veille légale, cartographie |
| M3 | Risques et opportunités, politique, objectifs, charte éthique |
| M4 | Rédaction des procédures et registres, formation des pilotes |
| M5-M6 | Mise en œuvre, premiers enregistrements, étalonnages, évaluation fournisseurs |
| M7 | Formation des auditeurs internes, audit interne complet |
| M8 | Traitement des constats, revue de direction |
| M9 | Contact organisme certificateur (choisi par le client), préparation J-30 |

## 3.7 Coûts implicites pour le client

| Poste | Nature | Ordre de grandeur |
|---|---|---|
| Temps du RQ | Souvent 30 à 50 % d'un poste dans une PME pendant le projet | Selon salaire interne |
| Temps des pilotes et du personnel | Ateliers, formations, audit | À estimer au diagnostic |
| Achat de la norme | CODINORM ou ISO | À CONFIRMER |

| Organisme certificateur | Audit initial, 2 surveillances, renouvellement, déplacements | Sur devis de l'organisme |
| Petits équipements | Étiquettes, zone de quarantaine, classeurs, sauvegarde | Selon l'existant |

# Partie 4 — Construire le système

## 4.1 Diagnostic initial

### Méthode

1. **Entretien avec la direction** (1 à 2 h) : stratégie, clients, problèmes, ressources.
2. **Visite terrain** : on suit un produit ou une commande du début à la fin (réception, transformation ou prestation, contrôle, stockage, livraison, facturation).
3. **Entretiens par processus** avec les responsables, et quelques questions aux opérateurs.
4. **Revue des documents existants** : contrats, bons de commande, fiches de pesée, factures, registres de maintenance.
5. **Notation** article par article avec FOR-Q-01.
6. **Restitution** : points forts, écarts prioritaires, proposition de lots.

### Grille de maturité 0-1-2

| Note | Signification | Exemple pour 7.1.5 (instruments de mesure) |
|---|---|---|
| **0** | Rien n'existe ou pratique non maîtrisée | Les balances ne sont jamais vérifiées ; personne ne sait quand elles l'ont été |
| **1** | La pratique existe mais n'est pas écrite, pas complète ou pas prouvée | Le technicien vérifie la balance avec un sac de 50 kg « connu », sans enregistrement |
| **2** | Pratique définie, appliquée, prouvée et suivie | Liste REG-Q-06, masses étalons certifiées, vérification hebdomadaire enregistrée, vérification légale à jour |

Le taux de maturité est la moyenne des notes divisée par 2. Il est calculé automatiquement sur GEC-CI Pro et suivi à mi-parcours.

### Formulaires du diagnostic

- **FOR-Q-01** : grille complète (64 lignes, issues de clauses.json), avec colonnes constat, preuve vue, note, priorité.
- **REG-Q-10** : amorce de la liste des exigences légales relevées pendant la visite.
- **REG-Q-03** : premiers risques relevés.

## 4.2 Contexte : enjeux internes et externes

L'entreprise liste ce qui peut l'aider ou la gêner à livrer un produit ou un service conforme. La méthode : SWOT (forces, faiblesses, opportunités, menaces) complété par PESTEL (politique, économique, social, technologique, écologique, légal). On consigne dans **REG-Q-01**.

### Exemples terrain

| Enjeu | Interne / externe | Usine de cajou (San Pedro) | Coopérative (Soubré) | PME de services (Abidjan) |
|---|---|---|---|---|
| Marché | Externe | Exigences des acheteurs sur le taux d'humidité et les amandes cassées | Prix fixé par la filière, concurrence des pisteurs | Appels d'offres exigeant un système qualité |
| Climat | Externe | Saison des pluies : humidité des stocks, routes coupées | Sécheresse ou pluies tardives : baisse et variabilité des volumes | Coupures d'électricité, chaleur dans les locaux techniques |
| Légal | Externe | Métrologie légale, règles d'export | Droit OHADA des coopératives, règles de la filière (À CONFIRMER) | Loi sur la consommation, données personnelles |
| Compétences | Interne | Personnel saisonnier peu formé | Magasiniers et peseurs à former | Rotation du personnel |
| Équipements | Interne | Décortiqueuses anciennes | Balances non vérifiées | Logiciel de gestion non sauvegardé |

**Climat** : depuis l'Amd 1:2024, l'entreprise doit **décider** si le changement climatique est un enjeu pertinent. Pour une coopérative ou une usine agro-industrielle en Côte d'Ivoire, la réponse sera presque toujours « oui » (saisons, rendements, qualité des fèves, logistique). Pour une PME de services, ce peut être « oui » (chaleur, inondations à Abidjan) ou « non » justifié. La décision et sa justification sont écrites.

## 4.3 Parties intéressées

Méthode : lister, garder celles qui ont une influence sur la qualité, noter leurs exigences, décider lesquelles deviennent des obligations. On consigne dans **REG-Q-02**.

| Partie intéressée | Exemple d'exigence | Devient obligation ? |
|---|---|---|
| Clients / acheteurs | Taux d'humidité maximal, délais, certificats d'analyse | Oui (contrat, catégorie C) |
| État (Commerce, BIM, ARTCI…) | Balances vérifiées, déclaration des fichiers de données | Oui (catégorie A) |
| Membres de la coopérative | Pesée juste, paiement à temps, transparence | Oui (statuts, catégorie A/C) |
| Personnel | Formation, sécurité, respect | Partiellement |
| Fournisseurs, transporteurs | Paiement, informations claires | Partiellement |
| Banques, bailleurs | Comptes et preuves de bonne gestion | Selon contrat |
| Organismes de référentiels (RA, Fairtrade) | Traçabilité, gouvernance | Si certifié (catégorie C) |
| Riverains, communautés | Pas de nuisance | Relève surtout d'ISO 14001 |

Exigences liées au climat (Amd 1:2024) : par exemple, un acheteur qui demande des informations sur les pratiques agricoles face au climat, ou un bailleur qui conditionne un financement. Elles sont notées dans une colonne dédiée.

## 4.4 Cartographie des processus

### Exemple : usine de transformation de noix de cajou à San Pedro

| Type | Processus | Pilote | Entrées | Sorties | Indicateur clé |
|---|---|---|---|---|---|
| Pilotage | Direction et stratégie | DG | Contexte, résultats | Politique, objectifs, décisions | KPI-Q-17 |
| Pilotage | Amélioration (audits, NC, revues) | RQ | Constats, réclamations | Actions | KPI-Q-07 |
| Réalisation | Vente et revue des contrats | Resp. commercial | Demandes acheteurs | Contrats validés | KPI-Q-04 |
| Réalisation | Achat de noix brutes | Resp. achats | Besoins, fournisseurs | Noix réceptionnées | KPI-Q-08 |
| Réalisation | Réception, pesée, contrôle | Chef magasin | Camions de noix | Lots identifiés et contrôlés | KPI-Q-09 |
| Réalisation | Transformation (calibrage, cuisson, décorticage, séchage, dépelliculage, tri) | Resp. production | Lots de noix | Amandes triées | KPI-Q-05 |
| Réalisation | Conditionnement, libération, expédition | RQ / Resp. logistique | Amandes | Cartons libérés, conteneurs | KPI-Q-16 |
| Support | Ressources humaines et compétences | RH | Besoins | Personnel compétent | KPI-Q-11 |
| Support | Maintenance et instruments | Resp. maintenance | Équipements | Équipements disponibles | KPI-Q-10 |
| Support | Documentation et informatique | RQ | Documents | Documents maîtrisés | — |

### Variante coopérative (Soubré)

Processus de réalisation : adhésion et suivi des membres → collecte et pesée en section → transport vers le magasin central → stockage, séchage, tri → vente et livraison à l'exportateur → paiement des membres. Processus support : gestion des balances, formation des délégués, comptabilité. La cartographie est consignée dans **MAT-Q-01**.

### Variante transporteur

Réalisation : cotation et contrat → planification des tournées → chargement et contrôle → transport et suivi → livraison et preuve de livraison → facturation. Support : maintenance des véhicules, recrutement et formation des chauffeurs, sous-traitance d'affrètement.

## 4.5 Politique et objectifs

- **Politique** (POL-Q-01) : une page, signée par le dirigeant, propre à l'entreprise. Elle dit pourquoi l'entreprise existe, ce qu'elle promet à ses clients, son engagement à respecter la loi et les contrats, à s'améliorer, et (édition 2026) son lien avec la stratégie. Elle est affichée et expliquée.
- **Charte éthique et culture qualité** (POL-Q-02) : comportements attendus, interdits concrets (falsifier un résultat de contrôle, « arranger » une pesée, accepter un cadeau d'un fournisseur pour fermer les yeux), droit d'arrêter un travail non conforme sans sanction, canal de signalement (FOR-Q-09, REG-Q-18).
- **Objectifs** (PLAN-Q-01) : 3 à 6 objectifs chiffrés, datés, avec plan d'actions.

| Exemple d'objectif | Indicateur | Cible proposée |
|---|---|---|
| Réduire les lots déclassés à l'export | KPI-Q-05 | À fixer après 3 mois de mesure |
| Livrer à temps et complet | KPI-Q-04 | ≥ 95 % |
| Répondre vite aux réclamations | KPI-Q-03 | ≤ 5 jours ouvrés |
| Instruments tous à jour | KPI-Q-09 | 100 % |

## 4.6 Risques et opportunités

L'édition 2026 sépare la détermination et le traitement des **risques** et des **opportunités** (sous-numérotation À CONFIRMER). GEC-CI propose deux méthodes simples, décrites dans **PRO-Q-03** et consignées dans **REG-Q-03**.

### Cotation des risques (G x P)

| Gravité (G) | Signification |
|---|---|
| 1 | Gêne interne sans effet client |
| 2 | Effet client mineur (retard court, réclamation simple) |
| 3 | Lot refusé, pénalité, client mécontent |
| 4 | Perte de client, sanction légale, atteinte à la réputation |

| Probabilité (P) | Signification |
|---|---|
| 1 | Jamais vu, très peu probable |
| 2 | Déjà arrivé une fois en quelques années |
| 3 | Arrive chaque année ou chaque campagne |
| 4 | Arrive chaque mois ou plus |

**Criticité = G x P** (1 à 16). Règle GEC-CI (catégorie D) : 1 à 4 = acceptable, surveiller ; 6 à 8 = action planifiée ; 9 à 16 = action prioritaire et suivi en revue de direction (KPI-Q-13).

### Évaluation des opportunités (gain x faisabilité)

| Note | Gain | Faisabilité |
|---|---|---|
| 1 | Faible | Difficile, coûteuse |
| 2 | Moyen | Possible avec effort |
| 3 | Fort | Facile, rapide |

Score = gain x faisabilité (1 à 9). À partir de 6 : décision formelle d'exploiter ou non, notée dans REG-Q-17.

### Exemples

| Processus | Risque ou opportunité | G | P | Criticité / score | Action |
|---|---|---|---|---|---|
| Réception (coopérative) | Balance faussée, pesées contestées | 4 | 3 | 12 | Vérification hebdomadaire avec masses étalons, vérification légale, double pesée en cas de contestation |
| Stockage (usine cajou) | Reprise d'humidité en saison des pluies | 3 | 3 | 9 | Palettes, aération, relevés d'humidité, rotation premier entré premier sorti |
| Transport | Panne de camion en route | 3 | 3 | 9 | Maintenance préventive, contrat de dépannage |
| Vente (PME) | Offre acceptée sans vérifier la capacité | 3 | 2 | 6 | FOR-Q-02 systématique (règle interne, catégorie D) |
| Opportunité (coopérative) | Prime qualité offerte par un acheteur pour des fèves bien séchées | Gain 3 | Faisabilité 2 | 6 | Formation des producteurs au séchage, tri renforcé |

## 4.7 Obligations légales et autres exigences

La norme demande de connaître les exigences légales applicables aux produits et services et de les respecter. GEC-CI tient pour cela un **registre de veille** : **REG-Q-10**, alimenté selon **PRO-Q-02**.

| Colonne | Contenu |
|---|---|
| Texte | Loi, décret, arrêté, norme, contrat, cahier des charges |
| Référence et date | Ex. loi n° 2016-411 du 15 juin 2016 |
| Catégorie | A à E |
| Exigence applicable | Reformulée en une phrase |
| Processus concerné | Ex. réception, pesée |
| Preuve de conformité | Ex. certificat de vérification |
| Statut | Conforme / écart / **À CONFIRMER** |
| Date de vérification | Date et nom du vérificateur |

**Sources de veille** : Journal officiel, sites des ministères, CODINORM, ARTCI, chambres de commerce, organisations professionnelles, acheteurs et référentiels. Fréquence : trimestrielle, et à chaque nouveau contrat.

## 4.8 Plan documentaire et maîtrise des documents

### Codification

| Préfixe | Type | Exemple |
|---|---|---|
| MAN-Q | Manuel | MAN-Q-01 |
| POL-Q | Politique | POL-Q-01, POL-Q-02 |
| PRO-Q | Procédure | PRO-Q-01 à PRO-Q-17 |
| FOR-Q | Formulaire | FOR-Q-01 à FOR-Q-09 |
| REG-Q | Registre | REG-Q-01 à REG-Q-19 |
| PLAN-Q | Plan | PLAN-Q-01 à PLAN-Q-04 |
| RAP-Q | Rapport | RAP-Q-01, RAP-Q-02 |
| MAT-Q | Matrice | MAT-Q-01 à MAT-Q-03 |
| CHK-Q | Check-list | CHK-Q-01 à CHK-Q-03 |
| PRV-Q | Preuve | PRV-Q-[client]-[article]-[rang] |

### Règles de maîtrise (PRO-Q-01)

- **Versions** : chaque document porte code, version, date, rédacteur, vérificateur, approbateur. Toute modification incrémente la version et est notée dans l'historique.
- **Accès** : la dernière version est disponible au poste (papier plastifié ou tablette) ; les anciennes versions sont retirées ou marquées « PÉRIMÉ ».
- **Documents externes** : normes, contrats, fiches techniques des fournisseurs, textes légaux sont listés dans REG-Q-04.
- **Conservation** : durées définies dans REG-Q-04, par exemple 3 ans minimum pour les enregistrements qualité afin de couvrir un cycle de certification (catégorie D) ; plus long si la loi ou le contrat l'exige (À CONFIRMER au cas par cas : obligations comptables, fiscales, sociales).
- **Protection** : sauvegarde informatique hebdomadaire hors site ; archives papier à l'abri de l'humidité et des termites ; accès restreint aux données personnelles (loi n° 2013-450).
- **Élimination** : destruction tracée des documents dont la durée est échue.

# Partie 5 — Matrice des exigences ISO 9001 et dossiers de preuve

Reformulation GEC-CI. Le texte officiel de la norme, acheté auprès de l'ISO ou de CODINORM, fait foi.

**Base de numérotation :** Numérotation et structure de l'édition ISO 9001:2015 + Amd 1:2024 (encore valable pendant la transition), avec renvois aux changements annoncés pour ISO 9001:2026 (publiée le 16 septembre 2026). La structure harmonisée (chapitres 4 à 10) est conservée ; la sous-numérotation exacte de l'édition 2026 (notamment 6.1, chapitre 7 restructuré, mise en page du chapitre 8) est À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT, sur le texte officiel acheté.

Cette matrice couvre 64 articles et sous-articles des chapitres 4 à 10. Pour chacun : ce que l'auditeur veut voir (reformulation GEC-CI), l'information documentée exigée par la norme lorsqu'elle existe, les preuves que GEC-CI conseille de préparer, le registre, le responsable et le niveau de risque en audit. La plateforme GEC-CI Pro ISO 9001 et le classeur Excel reprennent la même matrice, avec un statut par article.

# Partie 6 — Exigences propres à ISO 9001, en profondeur

> Reformulation GEC-CI. Le texte officiel de la norme, acheté auprès de l'ISO ou de CODINORM, fait foi.

Cette partie traite à fond ce qui fait la spécificité d'ISO 9001 par rapport aux autres normes de systèmes de management : le client, les processus de réalisation, les fournisseurs, la libération et les non-conformités, ainsi que les nouveautés 2026 (culture qualité, éthique, changements).

## 6.1 Satisfaction et écoute du client

### Ce que l'auditeur veut voir

- une **méthode définie** pour savoir ce que pensent les clients (écrite dans PRO-Q-14 : bonne pratique GEC-CI, catégorie D) ;
- des **résultats** (enquête, synthèse des réclamations, visites) ;
- une **exploitation** : analyse en revue de direction, actions décidées, retour vers le client ;
- un **circuit des réclamations** de la réception à la réponse (FOR-Q-04, REG-Q-08).

### Quatre sources d'information client

| Source | Exemple | Fréquence conseillée |
|---|---|---|
| Réclamations et retours | Lot refusé, prestation contestée, avarie | Continue |
| Enquête de satisfaction | FOR-Q-05, 5 à 8 questions, échelle 1 à 5 | Annuelle (ou après prestation pour les services) |
| Visites et entretiens | Rendez-vous avec les 5 principaux clients | Annuelle |
| Données indirectes | Commandes répétées, clients perdus, délais de paiement, rapports d'inspection de l'acheteur | Trimestrielle |

### Traitement d'une réclamation en 7 étapes

1. **Recevoir** par tout canal (téléphone, WhatsApp, courriel, visite) et ouvrir FOR-Q-04.
2. **Accuser réception** dans un délai fixé (catégorie D : 48 heures).
3. **Protéger le client** : correction immédiate (remplacement, reprise, avoir).
4. **Analyser** : la réclamation est-elle fondée ? Si oui, ouvrir FOR-Q-06.
5. **Chercher la cause** (5 pourquoi) et agir.
6. **Répondre par écrit** au client.
7. **Mesurer** : délai (KPI-Q-03), nombre (KPI-Q-02), satisfaction après traitement.

### Exemples terrain

- **Usine de cajou (San Pedro)** : un acheteur signale un taux d'amandes cassées supérieur au contrat. Réclamation enregistrée, lot tracé (REG-Q-13), cause trouvée (réglage de la décortiqueuse après changement d'opérateur), action : fiche de réglage au poste et contrôle horaire.
- **Coopérative (Soubré)** : les « clients » sont les acheteurs, mais les membres sont aussi des parties intéressées. Les plaintes des producteurs sur les pesées sont traitées avec le même circuit, ce qui renforce la confiance.
- **PME de services (Abidjan)** : enquête après chaque intervention par message court ; trois questions ; synthèse mensuelle.

### Lien avec la loi

La loi n° 2016-412 relative à la consommation impose notamment l'information précontractuelle (art. 3), la garantie légale de conformité (art. 93) et des règles sur le service après-vente (art. 96). Pour les entreprises qui vendent au consommateur final, ces obligations sont inscrites dans REG-Q-10 (catégorie A). Détails des décrets d'application : **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**.

### Erreurs fréquentes

- une enquête envoyée mais jamais analysée ;
- des réclamations « verbales » jamais enregistrées ;
- confondre satisfaction et absence de réclamation ;
- un questionnaire changé chaque année, qui empêche de comparer.

## 6.2 Maîtrise des processus

### Ce que l'auditeur veut voir

L'auditeur suit le fil : il prend une commande récente et remonte toute la chaîne. À chaque étape, il demande : qui pilote ? quelle instruction ? quel contrôle ? quelle preuve ? quel indicateur ? Il vérifie aussi que les processus externalisés (sous-traitance de transport, d'analyse, de séchage) sont maîtrisés.

### Fiche processus type (MAT-Q-01)

| Rubrique | Exemple : « Réception, pesée, contrôle » (coopérative) |
|---|---|
| Finalité | Recevoir les fèves des membres avec une pesée juste et un contrôle qualité fiable |
| Pilote | Magasinier principal |
| Entrées | Sacs des producteurs, bons de livraison des délégués |
| Activités | Identification du producteur, contrôle visuel, test d'humidité, pesée, étiquetage du lot, saisie |
| Sorties | Lots identifiés, reçus de pesée, données de traçabilité |
| Ressources | Balance vérifiée, humidimètre étalonné, magasin sec |
| Indicateurs | KPI-Q-09, écarts de pesée, plaintes de membres |
| Risques | Balance faussée, humidité mal mesurée, fraude |
| Documents | PRO-Q-07, PRO-Q-11, REG-Q-13, FOR-Q-08 |

### Processus validés

Quand on ne peut pas vérifier le résultat après coup (par exemple la cuisson à la vapeur des noix de cajou, un séchage, une soudure, une désinfection), le processus doit être **validé** : paramètres définis (temps, température, pression), personnel qualifié, enregistrement des paramètres à chaque lot, revalidation après changement.

### Prévention des erreurs humaines

La norme demande des actions pour prévenir l'erreur humaine. En pratique : détrompeurs, check-lists de démarrage, double contrôle des pesées importantes, codes couleur, pictogrammes, rotation pour éviter la fatigue en campagne.

## 6.3 Conception et développement (si applicable)

Beaucoup d'entreprises ivoiriennes accompagnées par GEC-CI **ne conçoivent pas** : elles transforment selon les spécifications de l'acheteur ou exécutent une prestation standard. L'article 8.3 est alors déclaré **non applicable**, avec une justification écrite dans MAN-Q-01 (par exemple : « les spécifications sont fournies par le client »).

Il devient applicable quand l'entreprise crée un nouveau produit (nouvelle recette de boisson, nouvel emballage, nouveau service de stockage sous douane) ou adapte ses produits à un nouveau marché. On applique alors PRO-Q-09 : cahier des charges, planning avec revues, essais, validation chez le client, fiches techniques finales, maîtrise des modifications.

**Erreur fréquente** : exclure 8.3 alors que l'entreprise développe réellement des produits pour ses clients. L'auditeur le découvre en entretien.

## 6.4 Fournisseurs et prestataires externes

### Classer avant d'évaluer

| Catégorie | Définition | Exemples | Niveau de maîtrise |
|---|---|---|---|
| Critique | Une défaillance touche directement le client | Fournisseur de noix brutes, transporteur vers le port, laboratoire d'analyse, prestataire d'étalonnage | Évaluation initiale, cahier des charges, contrôle à réception renforcé, réévaluation annuelle, audit possible |
| Important | Effet indirect sur la qualité | Fournisseur d'emballages, maintenance externe | Évaluation initiale et annuelle, contrôle à réception |
| Courant | Pas d'effet sur la qualité | Fournitures de bureau | Pas d'évaluation formelle |

### Cas particulier de la coopérative

Pour une coopérative, les **producteurs membres** sont la source de la matière. On ne les « évalue » pas comme des fournisseurs commerciaux, mais on maîtrise ce qu'ils livrent : formation au séchage et au tri, contrôle à la réception par lot, retour d'information individuel, appui technique. Les **pisteurs** ou intermédiaires, s'il y en a, sont traités comme des prestataires externes à évaluer.

### Évaluation (FOR-Q-03)

Critères pondérés proposés (catégorie D) : qualité des livraisons 40 %, respect des délais 25 %, réactivité aux réclamations 15 %, conformité documentaire 10 %, prix et conditions 10 %. Note ≥ 80 : approuvé ; 60 à 79 : sous surveillance avec plan d'actions ; < 60 : retiré ou suspendu. Résultat dans REG-Q-07 et suivi par KPI-Q-08.

### Ce qu'une commande doit dire (8.4.3)

Désignation précise, spécifications et tolérances, quantités, délais et lieu de livraison, documents à fournir (certificat d'analyse, bon de pesée), contrôles prévus à réception, exigences de compétence (chauffeur, laborantin), et le cas échéant le droit d'audit.

### Exemple transporteur

Un transporteur qui sous-traite une partie de ses voyages à des affréteurs reste responsable devant son client. Il évalue ses affréteurs (état du camion, assurances, historique d'avaries), leur remet des consignes écrites (bâchage, interdiction de surcharge, contacts), et contrôle les livraisons (preuve de livraison signée, photos du chargement).

## 6.5 Production et prestation de service

### Plan de contrôle (PLAN-Q-04) — exemple usine de broyage de cacao

| Étape | Caractéristique | Critère | Méthode / instrument | Fréquence | Réaction si écart |
|---|---|---|---|---|---|
| Réception fèves | Humidité | Selon contrat acheteur et règles de la filière (À CONFIRMER) | Humidimètre étalonné | Chaque lot | Refus ou séchage, FOR-Q-06 |
| Réception fèves | Défauts (moisies, ardoisées, insectes) | Selon contrat | Épreuve à la coupe | Chaque lot | Déclassement ou refus |
| Torréfaction | Température / durée | Paramètres validés | Enregistreur | Chaque cycle | Blocage du lot |
| Broyage | Finesse de la masse | Spécification client | Méthode labo | Chaque lot | Ajustement, re-contrôle |
| Conditionnement | Poids net | Tolérance contractuelle et légale | Balance vérifiée | Échantillonnage | Re-pesée, isolement |
| Expédition | Étiquetage, intégrité | Conforme au contrat | Contrôle visuel | Chaque palette | Reprise |

Les valeurs exactes viennent des contrats et des textes de la filière ; elles sont inscrites dans REG-Q-10.

### Identification et traçabilité (REG-Q-13)

- Chaque lot porte un numéro unique : par exemple `COOP-SOU-S03-2026-0145` (coopérative de Soubré, section 3, lot 145).
- Le statut est visible : étiquette verte « conforme », jaune « en attente de contrôle », rouge « bloqué ».
- **Test de traçabilité** deux fois par an (KPI-Q-16) : on prend un lot livré et on doit retrouver en 4 heures les producteurs ou fournisseurs d'origine, les contrôles, la personne qui a libéré et le client destinataire.

### Propriété du client (REG-Q-12)

- Transporteur : marchandises transportées, conteneurs, scellés.
- Usine travaillant à façon : fèves ou noix appartenant à l'exportateur.
- PME de services : clés, équipements, **données** des clients.
- Coopérative : sacs fournis par l'acheteur, produits des membres en attente de paiement.

Toute perte ou détérioration est enregistrée et le propriétaire est informé par écrit. Pour les données personnelles confiées, la loi n° 2013-450 s'applique (REG-Q-19 ; formalités ARTCI À CONFIRMER).

### Préservation

Règles écrites pour la manutention, le stockage et le transport : palettes à distance des murs, magasin aéré, lutte contre les nuisibles, premier entré premier sorti, bâchage, interdiction de stocker près des produits chimiques. Relevés d'humidité et de température en saison des pluies.

### Après livraison

Ce que l'entreprise doit encore au client : garantie, SAV, reprise, information. La norme demande de le définir selon les risques, la nature et la durée de vie du produit, les attentes du client et la loi (art. 93 à 96 de la loi n° 2016-412 pour les ventes aux consommateurs).

### Maîtrise des modifications en production

Un changement imprévu (opérateur remplaçant, matière d'un nouveau fournisseur, réglage modifié, camion de remplacement) est revu et autorisé avant de produire, puis vérifié. On utilise FOR-Q-07 et REG-Q-11.

## 6.6 Libération des produits et services

- **Principe** : rien ne part chez le client tant que les contrôles prévus ne sont pas satisfaisants (FOR-Q-08), sauf accord d'une personne autorisée et, le cas échéant, du client.
- **Preuve** : résultats de contrôle et **identité** de la personne qui libère (exigence ISO) ; nom et signature sur FOR-Q-08 (pratique GEC-CI).
- **Autorité** : la liste des personnes autorisées à libérer figure dans MAT-Q-02 ; la pression commerciale ne doit pas les contourner (lien avec l'éthique).
- **Exemple** : à San Pedro, un conteneur doit partir pour tenir la date du navire, mais le contrôle de l'humidité n'est pas terminé. Seul le responsable qualité peut décider ; s'il libère sous réserve, il obtient l'accord écrit du client (dérogation) et l'enregistre.

## 6.7 Éléments de sortie non conformes

| Étape | Action | Document |
|---|---|---|
| Détecter | Contrôle, réclamation, audit, signalement | FOR-Q-08, FOR-Q-04 |
| Identifier et isoler | Étiquette rouge, zone de quarantaine | — |
| Décider | Correction, tri, retraitement, déclassement, retour fournisseur, destruction, dérogation client | FOR-Q-06 |
| Informer | Le client si le produit est déjà livré | FOR-Q-06 |
| Enregistrer | Nature, décision, décideur | REG-Q-09 |
| Prévenir | Action corrective si récurrent ou grave | PRO-Q-17 |

Pour un **service** (prestation de nettoyage mal faite, livraison en retard), la non-conformité se découvre souvent après la prestation : on corrige (reprise, geste commercial), on informe et on traite la cause.

## 6.8 Culture qualité et comportement éthique (nouveauté 2026)

### Ce qui est annoncé

L'édition 2026 attend de la direction qu'elle **promeuve une culture qualité et un comportement éthique**, et du personnel qu'il y soit **sensibilisé**. Le libellé exact et les articles concernés sont **À CONFIRMER** sur le texte officiel (sources : LRQA, SGS, CQI).

### Comment le rendre concret et auditable

| Pratique | Preuve | Document |
|---|---|---|
| Le dirigeant parle de qualité et d'éthique aux réunions et sur le terrain | Comptes rendus, tournées terrain | CHK-Q-03 |
| Une charte signée par tout le personnel | Signatures | POL-Q-02 |
| Le droit d'arrêter un travail non conforme sans sanction | Cas réels enregistrés | REG-Q-09 |
| Un canal de signalement confidentiel | Fiches et suivi | FOR-Q-09, REG-Q-18 |
| Pas de falsification des contrôles ni des pesées | Audits, recoupements | REG-Q-16 |
| Reconnaissance des bonnes idées du personnel | Idées enregistrées et récompensées | REG-Q-17 |
| Mesure trimestrielle | Indice de culture | KPI-Q-15 |

### Exemples terrain

- **Coopérative** : un peseur à qui l'on propose de l'argent pour « arranger » une pesée doit pouvoir le signaler sans risque. La charte prévoit la protection du lanceur d'alerte et la sanction de la fraude.
- **Usine** : un contrôleur qui bloque un lot avant le départ du navire est soutenu par la direction, même si cela coûte un retard.
- **PME de services** : un technicien qui découvre une erreur dans son propre travail la déclare ; elle est traitée comme une occasion d'apprendre, pas comme une faute.

### Erreurs fréquentes

Une charte affichée mais jamais expliquée ; un canal de signalement géré par la personne mise en cause ; des sanctions contre ceux qui signalent ; une direction qui demande en privé de « faire passer » un lot.

## 6.9 Maîtrise des changements (renforcée en 2026)

### Quels changements

Nouveau site ou magasin, nouvelle machine, nouveau logiciel, changement de fournisseur critique, départ d'un responsable, nouveau produit, réorganisation, fusion de coopératives, passage à une nouvelle norme.

### Le circuit (PRO-Q-04, FOR-Q-07, REG-Q-11)

1. **Demande** : quoi, pourquoi, pour quand.
2. **Analyse** : processus et documents touchés, risques et opportunités, ressources, compétences.
3. **Autorisation** par la personne désignée.
4. **Communication** aux personnes concernées (annoncé comme renforcé en 2026).
5. **Mise en œuvre** avec mise à jour des documents.
6. **Surveillance et évaluation** des effets pendant une période définie.
7. **Revue** de clôture : objectif atteint ? effets imprévus ?

### Exemple

Une PME d'Abidjan remplace son logiciel de facturation. Analyse : risque de perte de données clients (loi n° 2013-450), formation des utilisateurs, période de double saisie de 2 semaines, sauvegarde complète avant migration. Revue un mois après : écarts relevés et corrigés. KPI-Q-14 mesure la part des changements ainsi maîtrisés.

## 6.10 Équipements de surveillance et de mesure

C'est souvent le point le plus faible dans les coopératives et les usines.

- Inventaire complet dans REG-Q-06 (balances, ponts-bascules, humidimètres, thermomètres, chronomètres, manomètres).
- Distinction **critique / non critique** et **soumis ou non à la métrologie légale** (loi n° 2016-411 : vérification primitive et périodique des instruments utilisés dans les transactions ; organisation pratique via le BIM et Côte d'Ivoire Métrologie, À CONFIRMER).
- Vérification interne fréquente avec des masses étalons certifiées (par exemple chaque semaine en campagne, catégorie D).
- Étiquette de statut sur chaque instrument.
- **Si un instrument est trouvé faux** : bloquer l'instrument, évaluer les lots mesurés depuis la dernière vérification bonne, informer les clients ou membres concernés si nécessaire, ouvrir FOR-Q-06.

# Partie 7 — Compétences, formation et sensibilisation

## 7.1 Principe

Pour chaque poste qui influence la qualité, l'entreprise définit la compétence requise (formation, expérience, savoir-faire), vérifie que la personne l'a, comble les manques et vérifie que la formation a été efficace. Preuves dans REG-Q-05, programme dans PLAN-Q-02, méthode dans PRO-Q-05.

## 7.2 Plan de formation type

| Module | Public | Durée indicative | Évaluation |
|---|---|---|---|
| M1 — ISO 9001:2026 pour les dirigeants : enjeux, rôle, culture qualité et éthique | Direction, conseil d'administration de la coopérative | 0,5 jour | Engagement écrit, objectifs fixés |
| M2 — Responsable qualité : exigences article par article, documentation, pilotage | RQ et adjoint | 3 jours | Quiz, rédaction d'un registre |
| M3 — Pilotes de processus : fiches processus, indicateurs, risques | Pilotes | 1 jour | Fiche processus remplie |
| M4 — Risques, opportunités et changements | RQ, pilotes | 0,5 jour | Cotation d'un cas réel |
| M5 — Auditeur interne (méthode ISO 19011) | 2 à 4 personnes | 2 jours | Audit à blanc observé |
| M6 — Métrologie pratique : balances, humidimètres, vérification interne | Magasiniers, peseurs, contrôleurs | 0,5 jour | Vérification réalisée devant le formateur |
| M7 — Contrôle, libération et produits non conformes | Contrôleurs, chefs d'équipe | 0,5 jour | Cas pratique |
| M8 — Écoute client et réclamations | Commerciaux, accueil | 0,5 jour | Simulation de réclamation |
| M9 — Sensibilisation générale : politique, rôle de chacun, éthique, signalement | Tout le personnel, y compris saisonniers | 1 à 2 heures | Questions orales, émargement |

Pour le personnel qui lit peu : supports visuels, démonstrations au poste, sensibilisation en langue locale par un chef d'équipe formé.

## 7.3 Évaluation de l'efficacité

| Niveau | Question | Exemple |
|---|---|---|
| À chaud | La formation a-t-elle été comprise ? | Quiz, questions orales |
| Au poste (1 à 3 mois) | La pratique a-t-elle changé ? | Observation par le chef d'équipe |
| Résultat | L'indicateur s'est-il amélioré ? | Moins d'écarts de pesée après M6 |

Le résultat est noté dans REG-Q-05 (colonne « Évaluation de l'efficacité »). Le taux de réalisation est suivi par KPI-Q-11.

## 7.4 Connaissances organisationnelles

Le savoir-faire clé (réglage d'une décortiqueuse, repérage des fèves défectueuses, itinéraires sûrs pour les camions) est listé dans REG-Q-15 avec ses détenteurs et un relais formé. On capitalise par fiches courtes, vidéos sur téléphone, binômes et retours d'expérience après chaque campagne.

# Partie 8 — Indicateurs, audit interne et revue de direction

## 8.1 Tableau de bord

Les 18 indicateurs de kpi.json sont regroupés en quatre familles pour le tableau de bord (PLAN-Q-01, GEC-CI Pro) :

| Famille | Indicateurs |
|---|---|
| Client | KPI-Q-01, KPI-Q-02, KPI-Q-03, KPI-Q-04 |
| Produit et processus | KPI-Q-05, KPI-Q-06, KPI-Q-09, KPI-Q-10, KPI-Q-16 |
| Système | KPI-Q-07, KPI-Q-11, KPI-Q-12, KPI-Q-13, KPI-Q-14, KPI-Q-17, KPI-Q-18 |
| Fournisseurs et culture | KPI-Q-08, KPI-Q-15 |

Conseil : ne pas suivre les 18 dès le premier mois. Commencer par 6 à 8, puis élargir. Pour les cibles marquées « à fixer après 3 mois de mesure », on mesure d'abord la situation réelle.

## 8.2 Programme d'audit interne

- **Couverture** : tous les processus et tous les articles au moins une fois par cycle de 12 mois (règle GEC-CI, catégorie D : la norme demande des intervalles planifiés selon l'importance des processus) ; plus souvent pour les processus à risque (réception et pesée, libération).
- **Auditeurs** : formés (module M5), indépendants de l'activité auditée. Dans une petite structure, on peut faire appel à un auditeur externe ou croiser avec une autre entreprise.
- **Méthode** (ISO 19011) : préparation avec CHK-Q-01, réunion d'ouverture, entretiens et observations sur le terrain, recoupement des preuves, réunion de clôture, rapport RAP-Q-01, constats dans REG-Q-16, actions dans REG-Q-09.

| Mois | Processus audités (exemple coopérative) |
|---|---|
| M1 | Direction, contexte, risques |
| M2 | Réception, pesée, instruments |
| M3 | Stockage, traçabilité, propriété du client |
| M4 | Vente, revue des contrats, satisfaction |
| M5 | Achats, prestataires (transport), compétences |
| M6 | Documentation, NC, amélioration, éthique |

Classement des constats : **NC majeure** (exigence absente ou défaillance qui met en cause la conformité des produits), **NC mineure** (écart ponctuel), **observation** (risque d'écart), **point fort**.

## 8.3 Revue de direction

**Éléments d'entrée** (RAP-Q-02) :

1. suivi des décisions de la revue précédente ;
2. changements du contexte et des parties intéressées (y compris climat) ;
3. satisfaction et retours clients ;
4. atteinte des objectifs qualité ;
5. performance des processus et conformité des produits et services ;
6. non-conformités et actions correctives ;
7. résultats de surveillance et de mesure ;
8. résultats des audits internes et externes ;
9. performance des prestataires externes ;
10. adéquation des ressources ;
11. efficacité des actions face aux risques et opportunités ;
12. changements réalisés ou prévus et culture qualité (ajout GEC-CI, catégorie D ; place dans l'édition 2026 À CONFIRMER) ;
13. opportunités d'amélioration.

**Éléments de sortie** : décisions sur les améliorations, sur les changements du système, sur les ressources ; objectifs de l'année suivante. Chaque décision a un responsable et un délai, et elle est suivie à la revue suivante.

Exemple : la revue d'une usine de San Pedro décide de remplacer l'humidimètre principal, d'ajouter un contrôleur pendant la campagne et de faire réévaluer le transporteur principal sous 3 mois.

# Partie 9 — Non-conformités, actions correctives et amélioration continue

## 9.1 Correction ou action corrective ?

| Terme | Ce que c'est | Exemple |
|---|---|---|
| Correction | On répare l'effet | Re-trier le lot contenant des amandes cassées |
| Action corrective | On supprime la cause pour que cela ne revienne pas | Fiche de réglage au poste, formation, contrôle horaire |
| Action préventive (traitée par les risques) | On agit avant que le problème n'arrive | Maintenance préventive avant la campagne |

## 9.2 Méthode des 5 pourquoi — exemple transporteur

Problème : 3 avaries sur des sacs de cacao en un mois (sacs mouillés).

1. Pourquoi les sacs étaient-ils mouillés ? La bâche laissait passer la pluie.
2. Pourquoi ? La bâche était déchirée.
3. Pourquoi n'a-t-elle pas été changée ? Personne ne contrôle les bâches avant le départ.
4. Pourquoi ? Il n'existe pas de contrôle de chargement écrit.
5. Pourquoi ? Le processus de chargement n'a jamais été formalisé.

Action corrective : check-list de départ incluant l'état de la bâche, stock de bâches de rechange, formation des chauffeurs. Vérification d'efficacité : zéro avarie liée à l'eau pendant 3 mois de saison des pluies.

## 9.3 Diagramme d'Ishikawa (causes en 5 M)

| Famille | Questions à poser (exemple : écarts de pesée à la coopérative) |
|---|---|
| Main-d'œuvre | Le peseur est-il formé ? sous pression ? |
| Matériel | La balance est-elle vérifiée ? posée à plat ? |
| Méthode | La tare des sacs est-elle déduite de la même façon partout ? |
| Milieu | Vent, pluie, sol instable sous la balance ? |
| Matière | Sacs humides, poids variable des sacs vides ? |

On retient les causes prouvées, pas les suppositions.

## 9.4 Vérifier l'efficacité

Une action corrective n'est close que si l'on a vérifié, après un délai fixé, que le problème **ne s'est pas reproduit**. La preuve est notée dans FOR-Q-06 et REG-Q-09. Le taux est suivi par KPI-Q-07. Si l'action n'est pas efficace, on rouvre l'analyse.

On vérifie aussi si le même problème peut exister ailleurs (autres sections de la coopérative, autres lignes, autres camions) et on met à jour REG-Q-03 si un nouveau risque est apparu.

## 9.5 Amélioration continue

Sources d'amélioration : analyse des indicateurs, revues de direction, audits, idées du personnel (REG-Q-17), retours clients, veille. Outils simples : PDCA (planifier, faire, vérifier, agir), 5S pour les magasins et ateliers, réunions quotidiennes de 10 minutes en campagne. KPI-Q-18 compte les améliorations réalisées avec un résultat mesuré.

# Partie 10 — Préparation à l'audit de certification et maintien

## 10.1 Choisir l'organisme certificateur

Le client choisit librement. Critères à vérifier :

- accréditation valide pour ISO 9001 et pour son secteur d'activité (code IAF), par un accréditeur reconnu ;
- auditeurs francophones, connaissant le secteur et si possible la région ;
- capacité à réaliser l'audit de transition 2026 ;
- devis détaillé : jours d'audit, frais de déplacement, frais de certificat, surveillances ;
- délais de disponibilité.

GEC-CI peut aider à comparer les devis, mais le choix revient au client et GEC-CI ne garantit jamais la décision de l'organisme.

## 10.2 Check-list J-30 (CHK-Q-02)

| N° | Point à vérifier | Responsable |

| 1 | Périmètre et exclusions écrits dans MAN-Q-01 | RQ |
| 2 | Politique signée, affichée, connue | Direction |
| 3 | Objectifs chiffrés avec au moins 3 mois de suivi | RQ |
| 4 | REG-Q-01, REG-Q-02, REG-Q-03 revus depuis moins de 6 mois | RQ |
| 5 | REG-Q-10 à jour, sans exigence légale critique en écart | RQ |
| 6 | Instruments critiques à jour (REG-Q-06, 100 %) | RQ |
| 7 | Fournisseurs critiques évalués (REG-Q-07) | Achats |
| 8 | Réclamations enregistrées et traitées (REG-Q-08) | Commercial |
| 9 | Audit interne complet réalisé, constats traités ou en cours | RQ |
| 10 | Revue de direction tenue et signée | Direction |
| 11 | Personnel sensibilisé (politique, éthique) ; émargements | RH |
| 12 | Liste maîtresse à jour, aucun document périmé au poste | RQ |
| 13 | Test de traçabilité réussi récemment | RQ |
| 14 | Changements récents passés par FOR-Q-07 | RQ |
| 15 | Logistique de l'audit : salle, agenda, guides, EPI pour les auditeurs | Direction |

## 10.3 Déroulé de l'audit

- **Réunion d'ouverture** : l'auditeur présente le plan ; la direction est présente.
- **Audit sur le terrain** : l'auditeur interroge le personnel à tous les niveaux. On répond **honnêtement** ; « je ne sais pas, je vais chercher » vaut mieux qu'une invention.
- **Guides** : un guide par auditeur, qui accompagne et va chercher les preuves, sans répondre à la place des personnes interrogées.
- **Réunion de clôture** : constats présentés ; on peut demander des précisions, pas négocier la vérité.

## 10.4 Après l'audit

- Pour chaque non-conformité : correction, analyse des causes, action corrective, preuves, dans le délai fixé par l'organisme.
- Enregistrement dans REG-Q-09 avec la référence du constat externe.
- Décision de certification par l'organisme ; GEC-CI n'intervient pas dans cette décision.

## 10.5 Programme de maintien

| Fréquence | Activité |
|---|---|
| Hebdomadaire | Vérification interne des instruments en campagne ; point quotidien ou hebdomadaire des équipes |
| Mensuelle | Tableau de bord ; suivi des NC et réclamations |
| Trimestrielle | Revue des risques et changements ; tournée culture qualité (CHK-Q-03) ; veille réglementaire |
| Semestrielle | Test de traçabilité ; revue des enjeux et parties intéressées |
| Annuelle | Audit interne complet ; revue de direction ; enquête de satisfaction ; réévaluation fournisseurs ; plan de formation |
| Selon cycle | Audits de surveillance (années 1 et 2), renouvellement (année 3) |

## 10.6 Gestion des modifications de normes

Toute nouvelle édition ou tout amendement est traité comme un **changement** (PRO-Q-04) : achat du nouveau texte, analyse d'écarts, plan de transition, formation, audit interne ciblé, revue de direction, accord avec l'organisme sur la date de l'audit de transition. Pour ISO 9001:2026, voir la Partie 3.4.

| Documents | Liste maîtresse, versions, approbations, diffusion | documents.json, REG-Q-04 |

| Indicateurs | Saisie et calcul automatique des KPI | kpi.json |
| Audits | Programme, check-list, constats, rapports | PLAN-Q-03, CHK-Q-01, REG-Q-16 |
| Actions | NC, actions correctives, opportunités, changements | REG-Q-09, REG-Q-11, REG-Q-17 |

## 11.2 Flux

1. Le consultant crée le client, son code (par ex. PME-0007) et son périmètre.
2. Le diagnostic est saisi ; le taux de maturité initial est calculé.
3. Les documents sont générés à partir des modèles, adaptés, puis approuvés en ligne.
4. Le personnel saisit les registres sur le terrain (téléphone, tablette).
5. Les preuves sont déposées et rattachées à un article.
6. Le RQ valide ; le consultant contrôle par échantillonnage.
7. Le tableau de bord est mis à jour automatiquement et sert à la revue de direction.

## 11.3 Rôles

| Rôle | Droits |
|---|---|
| Direction du client | Consultation de tout, validation de la politique, des objectifs et de la revue |
| Responsable qualité | Gestion des documents, registres, preuves, audits |
| Pilote de processus | Saisie et consultation sur ses processus |
| Opérateur / magasinier | Saisie des enregistrements de son poste |
| Référent éthique | Accès exclusif aux signalements |
| Consultant GEC-CI | Accompagnement, contrôle, commentaires ; pas de saisie à la place du client pour les enregistrements opérationnels |
| Auditeur (lecture) | Accès temporaire en lecture si le client le décide |

## 11.4 Ce que la plateforme calcule

- **taux de maturité** par chapitre et global (notes 0-1-2) ;
- **taux de couverture des preuves** : articles avec au moins une preuve validée / articles applicables ;
- valeurs des **KPI** et alertes quand un seuil est franchi ;
- **échéances** : étalonnages, réévaluations fournisseurs, formations, audits, actions ;
- **criticité** des risques et score des opportunités ;
- liste des **points À CONFIRMER** encore ouverts.

Le tableau de bord ne dit jamais « certifiable » : il montre l'état du système. La décision appartient à l'organisme certificateur.
