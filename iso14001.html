:root{
  --navy:#0A1628; --gold:#C9A227; --gold-ink:#8A6B0E; --norm:#2E7D4F;
  --bg:#F1F4F8; --surface:#FFFFFF; --surface2:#F6F8FB; --fg:#0F1B2D; --muted:#5A6B83; --line:#DCE3EC;
  --accent:#1D5FA8; --accent-bg:#E6EFFA;
  --ok:#0E7A4C; --ok-bg:#E1F4EA; --warn:#9A5B00; --warn-bg:#FFF0D4; --bad:#B42318; --bad-bg:#FDE7E5;
  --rail-fg:#C8D4E5; --rail-muted:#7F91AD;
  --f-ui:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Century Schoolbook","GEC Schola",Georgia,serif;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111F; --surface:#0F1D33; --surface2:#132440; --fg:#E6ECF5; --muted:#93A4BD; --line:#22385A;
  --accent:#7DB3F0; --accent-bg:#16304F; --gold-ink:#E2C15A;
  --ok:#5CD39A; --ok-bg:#0E3326; --warn:#F1B957; --warn-bg:#3A2A0C; --bad:#FF8A80; --bad-bg:#3D1512; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111F; --surface:#0F1D33; --surface2:#132440; --fg:#E6ECF5; --muted:#93A4BD; --line:#22385A;
  --accent:#7DB3F0; --accent-bg:#16304F; --gold-ink:#E2C15A;
  --ok:#5CD39A; --ok-bg:#0E3326; --warn:#F1B957; --warn-bg:#3A2A0C; --bad:#FF8A80; --bad-bg:#3D1512; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;margin:0}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:252px 1fr;min-height:100%}
.rail{background:var(--navy);color:var(--rail-fg);padding:16px 12px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow:auto}
.rail img{width:100%;border-radius:6px}
.rail .norm{border-left:4px solid var(--norm);padding:6px 10px;background:#13284A;border-radius:4px}
.rail .norm b{display:block;color:#fff;font-size:15px}
.rail .norm span{font-size:11.5px;color:var(--rail-muted)}
.rail .who{font-size:12px;color:var(--rail-muted);border-top:1px solid #1E3354;padding-top:10px}
.rail .who b{color:#fff;display:block;font-weight:600}
.rail a{color:#D9B23A;font-weight:600;text-decoration:none;font-size:12.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--rail-muted);margin:10px 8px 4px}
.nav button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.nav button:hover{background:#13284A}
.nav button.on{background:#13284A;color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav button:focus-visible{outline:2px solid var(--gold)}
.nav .cnt{font-size:11px;background:#1E3354;border-radius:99px;padding:0 7px;color:#fff}
.main{min-width:0;padding-block:22px 40px;padding-inline:28px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:22px;font-weight:600}
.top p{margin:4px 0 0;color:var(--muted);font-family:var(--f-read);font-size:15px;max-width:72ch}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px;min-width:0}
.sec>h2{font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sec.norm{border-top:3px solid var(--norm)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.grid{display:grid;gap:12px} .g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))} .g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .n{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted)}
.tile.alert{border-color:var(--bad)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--norm)}
.tw{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:bottom}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.info{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.chip.gold{background:var(--navy);color:var(--gold);border-color:transparent}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;font-size:13px;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .btn.primary{background:var(--gold);color:#0A1628;border-color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--gold);color:#0A1628;border-color:var(--gold)}}
.btn.danger{color:var(--bad)} .btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;align-items:end}
form.f label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
form.f .wide{grid-column:1/-1}
.inp{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--surface);font-size:13.5px;color:var(--fg)}
textarea.inp{min-height:70px;resize:vertical}
details.add{border:1px dashed var(--line);border-radius:6px;padding:8px 12px;margin-top:10px}
details.add summary{cursor:pointer;font-weight:500;color:var(--accent)}
details.add[open] summary{margin-bottom:10px}
.note{font-family:var(--f-read);font-size:14px;color:var(--muted);margin:6px 0 0}
.alertbox{border-left:4px solid var(--bad);background:var(--bad-bg);padding:8px 12px;border-radius:4px;font-size:13px;margin:8px 0}
.goldbox{border-left:4px solid var(--gold);background:var(--surface2);padding:8px 12px;border-radius:4px;font-family:var(--f-read);font-size:14px;margin:8px 0}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(440px,calc(100% - 32px));background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.25);border-left:4px solid var(--gold)}
.toast.bad{border-left-color:#FF6B5E}
.auth{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:var(--navy)}
.auth .card{background:var(--surface);border-radius:12px;max-width:460px;width:100%;overflow:hidden}
.auth .card .brand{background:var(--navy);padding:18px 22px;border-bottom:4px solid var(--norm)}
.auth .card .body{padding:20px 22px;display:grid;gap:12px}
.auth p.foot{color:var(--rail-muted);font-size:12px;text-align:center;max-width:460px;margin:14px auto 0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:170px 1fr;gap:4px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.md{font-family:var(--f-read);font-size:15px;line-height:1.6;max-width:84ch;overflow-wrap:break-word}
.md h1{font-family:var(--f-ui);font-size:20px;background:var(--navy);color:#fff;padding:10px 14px;border-left:6px solid var(--gold);border-radius:6px;margin:28px 0 12px}
.md h2{font-family:var(--f-ui);font-size:17px;border-bottom:2px solid var(--gold);padding-bottom:4px;margin:22px 0 8px}
.md h3{font-family:var(--f-ui);font-size:15px;color:var(--gold-ink);margin:16px 0 6px}
.md table{font-family:var(--f-ui);font-size:12.5px;margin:8px 0}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:4px solid var(--gold);background:var(--surface2)}
.toc{display:flex;flex-direction:column;gap:2px;font-size:13px}
.toc a{color:var(--accent);text-decoration:none}
.tag-loi{color:var(--bad);font-weight:700}
.tag-conf{color:var(--bad);font-weight:700}
.mobbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto}
  .rail .nav,.rail .norm,.rail .who{display:none}
  .rail.open .nav,.rail.open .who{display:flex;flex-direction:column}
  .mobbar{display:flex}
  .rail img{max-width:240px}
  .main{padding-inline:16px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script type="text/plain" id="md-manuel"># Présentation, objectifs et convention de lecture

Ce kit ISO 14001 de GROUPE EXPERTISE CONSULTING-CI (GEC-CI) sert à quatre usages : vendre une démarche environnementale honnête, diagnostiquer une entreprise, construire son système de management environnemental (SME) et préparer l'audit de l'organisme certificateur. Il est rédigé pour un dirigeant de PME, un directeur d'usine ou un gérant de coopérative, pas pour un spécialiste.

**Reformulation GEC-CI. Le texte officiel de la norme, acheté auprès de l'ISO ou de CODINORM, fait foi.** Aucun passage de la norme n'est reproduit ici. Chaque article est résumé avec nos mots, du point de vue de ce que l'auditeur veut voir. Pour mettre en œuvre ou auditer, il faut acheter la norme officielle.

**Éditeur :** GROUPE EXPERTISE CONSULTING-CI (GEC-CI) · Mr SIDIBE ABDOULAYE — ATN RA, Manager général (Président-Directeur Général), formateur-auditeur ISO 9001, 14001, 45001 · Rue Hermankono, Quartier Divo, BP 04 Divo 8754, Côte d'Ivoire · +225 05 55 49 45 94 (WhatsApp) · +225 07 57 88 13 49 · RCCM 123-B-02-G-C-334-ABD-0112 · NCC 93499661S · « La satisfaction, notre priorité ».

## Objectifs du kit

- Donner une vision claire d'ISO 14001:2026 et de ce qui change par rapport à l'édition 2015.
- Relier la norme au droit ivoirien de l'environnement, en distinguant ce qui est vérifié de ce qui reste à confirmer.
- Fournir une méthode de cotation des aspects environnementaux simple et reproductible.
- Livrer une base documentaire codifiée (préfixe E) prête à adapter : procédures PRO-E, registres REG-E, formulaires FOR-E, plans PLAN-E, matrices MAT-E, check-lists CHK-E, rapports RAP-E.
- Alimenter la plateforme GEC-CI Pro, le manuel Word/PDF, le classeur Excel, la présentation et le site.

## Quatre situations clients couvertes

| Cas | Situation de départ | Ce que le kit apporte en priorité |

| Cas 1 — Usine de transformation de cacao à San Pedro | Exportateur, chaudière, eaux de lavage, coques, acheteurs européens exigeants | Analyse environnementale complète, évaluation de conformité, maîtrise des effluents et des émissions, cycle de vie amont (plantations) |
| Cas 2 — Huilerie de palme ou usine d'hévéa | Effluents très chargés en matière organique, lagunes, odeurs, biomasse | Plan de surveillance analytique, procédure effluents, plan d'urgence « débordement de lagune », relations avec les riverains |

| Cas 4 — Société coopérative (Soubré, Méagui, Duékoué…) | Magasins, intrants, produits phytosanitaires, sacs, transport, déjà RA ou Fairtrade | Système léger, réutilisation des preuves des référentiels agricoles, emballages vides, stockage sécurisé |

## Convention de lecture : catégories A à E et niveaux N1 à N6

Chaque exigence citée dans ce kit porte une catégorie. Elle dit d'où vient l'obligation et donc ce qui se passe si on ne la respecte pas.

| Catégorie | Niveau | Origine | Conséquence si non respectée |
|---|---|---|---|
| **A** | N1 | Loi ou règlement ivoirien (Code de l'environnement, décrets, arrêtés) | Sanction administrative ou pénale, fermeture possible |
| **B** | N2 | Norme ISO 14001 | Non-conformité d'audit, certificat refusé ou suspendu |
| **C** | N3-N4 | Client, contrat, marché, référentiel acheteur (N3 : contrat signé ; N4 : exigence du marché, par exemple acheteur européen) | Perte de marché, pénalité contractuelle |
| **D** | N5 | Bonne pratique reconnue (GEC-CI, guides professionnels) | Risque accru, pas de sanction directe |
| **E** | N6 | Recommandation du consultant | Choix de l'entreprise |

Exemple : « Remettre les huiles usagées à un collecteur agréé » est en catégorie A si un texte l'impose (à vérifier dans le registre de veille), « tenir à jour une information documentée sur les aspects (par exemple un registre) » est en B, « fournir la géolocalisation des parcelles » est en C pour un exportateur de cacao vers l'Union européenne, « tournée d'inspection mensuelle » est en D, « répondre à toute plainte sous 7 jours » est en E.

## Règles d'usage GEC-CI

1. **Ne jamais inventer.** Toute date, tout chiffre ou toute référence non vérifiés par une source officielle portent la mention : **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**.
2. **Aucune promesse de certification** en 30 ou 60 jours, ni de date de certificat. L'organisme certificateur accrédité décide seul.
3. **Aucune préparation au mensonge.** On ne cache pas un rejet, un incident ou une autorisation manquante. On l'identifie, on agit, on le montre.
4. **Aucun prix GEC-CI dans ce kit.** Le prix se calcule après diagnostic, lot par lot. Les coûts de tiers (organisme certificateur, achat de la norme, analyses de laboratoire) sont indiqués comme postes à prévoir, montants À CONFIRMER.
5. **Adapter, pas copier.** Les modèles sont des points de départ. Une coopérative de 300 membres n'a pas le même système qu'une huilerie de 200 salariés.
6. **Preuves codées.** Chaque preuve archivée suit le code PRV-E-[code client]-[article]-[rang], par exemple PRV-E-HUI-0003-8.2-01 pour le premier compte rendu d'exercice d'urgence d'une huilerie.
7. **Système intégré possible.** Les procédures communes (documents, audit interne, revue de direction, non-conformités, compétences) gardent la même logique que dans les kits Q, S et H et peuvent être fusionnées en QSE ou QSSE (voir Partie 12).

## Avertissement droit d'auteur

ISO 14001 est une publication protégée de l'Organisation internationale de normalisation. En Côte d'Ivoire, les normes s'achètent auprès de CODINORM (Côte d'Ivoire Normalisation) ou directement auprès de l'ISO. Ce kit n'en reproduit aucun passage. Les titres d'articles sont des formulations courtes et usuelles ; les résumés sont des reformulations GEC-CI de 35 mots au plus. **Reformulation GEC-CI. Le texte officiel de la norme, acheté auprès de l'ISO ou de CODINORM, fait foi.**

## 1.2 Ce qui change avec ISO 14001:2026

La structure harmonisée (chapitres 4 à 10) est conservée. Les sources consultées (ANSI, DQS, Amtivo, DEKRA, LRQA via le brief commun) annoncent les évolutions suivantes :

- **Conditions environnementales** dans l'analyse du contexte : changement climatique, biodiversité, santé des écosystèmes, niveau de pollution, disponibilité des ressources naturelles.
- **Risques et opportunités** traités plus clairement ; selon DQS, un article autonome 6.1.4 les sépare des aspects environnementaux. Les situations d'urgence sont explicitement prises en compte. Numérotation exacte : **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**.
- **Gestion des modifications** : nouvel article (6.3 selon DQS, numérotation À CONFIRMER) pour identifier, évaluer et maîtriser les changements qui touchent le SME.
- **Perspective cycle de vie** renforcée, de la matière première à la fin de vie.
- **Maîtrise opérationnelle** élargie aux processus, produits et services fournis par des prestataires externes (8.1).
- **Leadership** : soutien annoncé à d'autres rôles pertinents du système (portée exacte À CONFIRMER sur le texte).
- **Audit interne** : chaque audit doit avoir des objectifs définis, en plus du périmètre et des critères (9.2.2 selon DQS, sous-numérotation À CONFIRMER).
- **Revue de direction** : entrées et sorties plus structurées, centrées sur la performance environnementale.
- **Informations documentées** clarifiées, terminologie alignée, Annexe A enrichie d'exemples.

| Jalon | Date annoncée | Source | Statut |

| Publication ISO 14001:2026 | 15 avril 2026 | ANSI, Amtivo | Vérifié (sources concordantes) |
| Audits de transition possibles | À partir du 1er juin 2026 | Amtivo (pour ses clients) | À CONFIRMER pour chaque organisme |
| Fin des renouvellements selon 2015 | Après le 31 octobre 2027 | Amtivo | À CONFIRMER (règles IAF) |

## 1.5 Contexte légal ivoirien de l'environnement

Les références ci-dessous servent à amorcer le registre de veille REG-E-03. Elles ne remplacent pas une vérification juridique. **Tout texte marqué À CONFIRMER doit être vérifié au Journal officiel ou auprès de l'ANDE, du CIAPOL ou du ministère avant mise en œuvre ou audit.**

### Code de l'environnement : un nouveau code depuis 2023

La **loi n° 2023-900 du 23 novembre 2023 portant Code de l'environnement** remplace le Code de 1996 (loi n° 96-766 du 3 octobre 1996). La référence et la date sont confirmées par la base UNEP-LEAP et par l'Université Alassane Ouattara (atelier LEDD-CI). Selon Fraternité Matin, le nouveau code compte **sept titres et 260 articles** contre 113 en 1996. Une campagne nationale de vulgarisation a été lancée le 18 octobre 2024 par le ministre chargé de l'environnement.

Innovations rapportées par la presse et l'université (à vérifier sur le texte) :

- responsabilité des fabricants et distributeurs pour les déchets de leurs produits (responsabilité élargie du producteur) ;
- principes de non-régression, d'usager-payeur, d'économie circulaire, de compensation écologique ;
- changement climatique (adaptation, atténuation, énergies renouvelables), biodiversité, mangroves, milieux fragiles ;
- risques technologiques, gestion des catastrophes ;
- police de l'environnement, fonds de l'environnement à guichets, statut renforcé de l'ANDE et du CIAPOL ;
- sanctions alourdies (Fraternité Matin cite l'article 249 sur le déversement non autorisé de déchets dangereux).

**À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT :** date de publication au Journal officiel, dispositions transitoires, maintien en vigueur des décrets d'application de 1996 jusqu'à leur remplacement. Point d'attention : des rapports d'EIES publiés en 2025 citent encore la loi de 1996 ; un registre de veille sérieux cite désormais la loi de 2023 et vérifie le statut de chaque décret.

### Ce que dit le décret 96-894 (lu sur le texte)

- **Annexe I : étude d'impact obligatoire.** On y trouve notamment les industries des corps gras végétaux et animaux (donc les huileries de palme), les conserveries, brasseries, sucreries, féculeries, abattoirs, et les défrichements ou exploitations agricoles intensives de plus de 999 ha.
- **Annexe II : constat d'impact.** On y trouve notamment le traitement de produits à base d'élastomères (caoutchouc), le stockage de produits chimiques, l'aquaculture, les élevages. Le constat permet à l'administration de décider si une étude complète est nécessaire.
- **Annexe III : sites sensibles** (aires protégées, zones humides, mangroves, périmètres de protection des points d'eau, espaces maritimes) : un projet sur ou près de ces zones est concerné même s'il n'est pas listé.
- Le coût de l'étude est à la charge du promoteur ; une enquête publique est prévue ; l'autorisation peut être retirée si les mesures ne sont pas respectées.
- Une usine de transformation de cacao n'est pas citée nommément : son classement est à vérifier au cas par cas avec l'ANDE (À CONFIRMER).

### Conséquences pour un projet ISO 14001

- Une entreprise qui ne connaît pas son statut au regard de l'EIES et des installations classées ne peut pas démontrer l'article 6.1.3. C'est le premier point du diagnostic.
- Un écart légal ne bloque pas automatiquement la certification s'il est identifié, traité et suivi ; un écart caché ou ignoré, si. La décision appartient à l'organisme certificateur.
- Le registre de veille distingue toujours : référence vérifiée, référence citée par une source secondaire, référence À CONFIRMER.

## 1.6 Autres exigences fréquentes (catégorie C)

- **Règlement européen sur la déforestation (EUDR, règlement (UE) 2023/1115)** : concerne cacao, café, palmier à huile, caoutchouc et certains dérivés. Dates d'application reportées à plusieurs reprises : **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**.
- **Rainforest Alliance V1.4, Fairtrade, RSPO** : exigences environnementales au niveau des exploitations et des groupes. Elles complètent ISO 14001 sans la remplacer.
- **Codes de conduite fournisseurs** des acheteurs (questionnaires environnementaux, données carbone).

## 1.7 Points à confirmer (synthèse Partie 1)

1. Numérotation exacte des articles d'ISO 14001:2026 (6.1.4 autonome, 6.3 modifications, 9.2.2, découpage éventuel de 9.3).
2. Calendrier IAF de transition et date d'arrêt des audits selon 2015.
3. Date de publication au JO, entrée en vigueur et dispositions transitoires de la loi n° 2023-900.
4. Objet et portée du décret n° 2024-595 du 26 juin 2024 ; statut du décret n° 96-894.
5. Nomenclature des installations classées, régime (autorisation ou déclaration) de chaque activité, valeurs limites de rejet de l'arrêté de 2008.
6. Textes de création et missions exactes de l'ANDE, du CIAPOL et de l'ANAGED ; agréments des collecteurs de déchets.
7. Taxes, redevances et frais d'examen liés aux EIES et aux installations classées.
8. Prix de la norme chez CODINORM et tarifs des organismes certificateurs.
9. Dates d'application de l'EUDR.

## 2.2 Calcul de valeur : ce que l'entreprise peut gagner

GEC-CI ne vend pas un certificat. Elle aide à construire un système qui produit des résultats mesurables. La valeur se calcule avec les chiffres du client, jamais avec des promesses.

### Valeur quantifiable (à mesurer avec l'entreprise)

| Levier | Comment le mesurer | Exemple de calcul (illustratif) |
|---|---|---|
| Électricité | kWh/t avant et après (REG-E-13) | Une fuite d'air comprimé repérée et réparée : kWh économisés × prix du kWh facturé |
| Carburant | L/t ou L/100 km | Écart entre camions, suivi par chauffeur, entretien : litres évités × prix du litre |
| Eau | m³/t | Fuites de réseau ou de forage repérées par relevé de compteur |
| Déchets valorisés | t valorisées / t produites (REG-E-09) | Coques de cacao ou fibres de palme utilisées en combustible au lieu d'être stockées |
| Évitement de sanctions | Écarts légaux traités (REG-E-03) | Risque d'amende ou d'arrêt d'activité évité : non chiffrable à l'avance, mais réel |
| Marchés | Questionnaires acheteurs remplis avec preuves | Contrats maintenus ou gagnés |

### Valeur qualitative

- Relations apaisées avec les riverains et les autorités.
- Image auprès des acheteurs, des banques et des bailleurs (qui demandent souvent un système de gestion environnementale et sociale).
- Personnel mieux formé, moins d'incidents.
- Décisions d'investissement mieux fondées (station d'épuration, chaudière biomasse, solaire).

### Coûts implicites à annoncer honnêtement

- Temps du responsable environnement (souvent 30 à 50 % d'un poste dans une PME, proposition GEC-CI à ajuster).
- Analyses de laboratoire des effluents, mesures de bruit ou de fumées : montants À CONFIRMER selon le laboratoire.
- Étalonnage des appareils (pH-mètre, débitmètre, compteurs).
- Investissements de mise en conformité : bacs de rétention, aire de stockage des déchets, kits antidéversement, séparateur d'hydrocarbures.
- Achat de la norme (CODINORM ou ISO) et frais de l'organisme certificateur : À CONFIRMER.
- Formalités administratives (EIES, constat, autorisation ICPE) : frais et délais À CONFIRMER auprès de l'ANDE et du CIAPOL.

## 2.3 Argumentaires par secteur

### Sociétés coopératives

Message : « Vous faites déjà beaucoup pour l'environnement grâce à Rainforest Alliance ou Fairtrade. ISO 14001 organise ce que vous faites au magasin, au transport et au bureau, et montre aux acheteurs que la coopérative est gérée comme une entreprise. »
Points concrets : stockage sécurisé des produits phytosanitaires, emballages vides collectés, sacs et bâches réutilisés, carburant des camions suivi, déchets du magasin triés. Les preuves RA (registres d'intrants, formations) sont réutilisées.

### PME (logistique, services, petite industrie)

Message : « Chaque litre de gasoil et chaque fût d'huile usagée se suivent. ISO 14001 vous donne une méthode simple pour réduire vos coûts et éviter les problèmes avec l'administration. »
Points concrets : huiles usagées, filtres, batteries, pneus, eaux de lavage, carburant par 100 km.

### Industrie (usines, ateliers mécaniques, emballages)

Message : « Votre site est une installation classée probablement soumise au contrôle du CIAPOL. Le système ISO 14001 vous permet de prouver à tout moment que vous respectez vos autorisations. »
Points concrets : autorisation d'exploiter, effluents, émissions, produits chimiques, plan d'urgence.

### Transformation agro-industrielle (cacao, palme, hévéa, cajou)

Message : « Vos acheteurs suivent maintenant toute la chaîne, de la plantation au port. L'édition 2026 d'ISO 14001 vous demande justement de regarder le cycle de vie. Vous serez prêts avant qu'on vous le demande. »
Points concrets : effluents (POME pour la palme, eaux de lavage et de coagulation pour l'hévéa), biomasse, fumées de chaudière, odeurs, traçabilité amont.

## 2.4 Diagnostic express de 45 minutes

| Minutes | Contenu | Résultat |
|---|---|---|
| 0-5 | Présentation, objectifs du dirigeant (marché, conformité, coûts) | Motivation claire |
| 5-15 | Activités, effectif, sites, flux (eau, énergie, déchets, rejets) | Premier schéma des flux |
| 15-25 | Situation légale : EIES ou constat, autorisation ICPE, inspections reçues, plaintes | Niveau de risque légal |
| 25-35 | Les 8 questions de diagnostic (voir extras), maturité 0-1-2 | Score indicatif |
| 35-42 | Douleurs prioritaires et ressources disponibles (responsable, budget mesures) | Faisabilité |
| 42-45 | Prochaine étape : visite terrain (CHK-E-01) ou arrêt | Décision écrite |

Règle : si le dirigeant ne peut pas nommer une personne responsable ou refuse de regarder ses autorisations, GEC-CI le dit franchement et propose de commencer par la mise en conformité légale.

## 2.5 Objections et réponses

| Objection | Réponse GEC-CI |
|---|---|
| « C'est trop cher. » | Le coût dépend de la taille et de l'état de départ ; il se calcule après diagnostic, lot par lot. Une partie des dépenses (eau, énergie) se rembourse par les économies mesurées. |
| « On a déjà RA ou Fairtrade. » | Complémentaires : les référentiels agricoles visent les exploitations ; ISO 14001 vise le système de management de l'usine ou de la coopérative. |
| « L'auditeur va voir nos problèmes. » | Oui, et c'est normal. Un problème identifié avec un plan d'action vaut mieux qu'un problème caché. On ne cache rien. |
| « On attendra la fin de la transition. » | La norme 2026 est publiée ; construire selon 2015 aujourd'hui, c'est refaire le travail plus tard. |
| « Nos voisins se plaignent déjà. » | Le système prévoit un traitement écrit des plaintes et des actions mesurées : c'est un outil d'apaisement. |
| « Combien de temps pour le certificat ? » | Le planning type va de 6 à 12 mois de préparation selon la taille ; la décision de certification et sa date appartiennent à l'organisme certificateur. |

## 2.6 Erreurs à ne pas commettre

- Copier un registre des aspects d'une autre usine : l'auditeur le voit en dix minutes sur le terrain.
- Lister des textes de loi sans dire ce qu'ils exigent concrètement pour le site.
- Déclarer « conforme » sans preuve (pas d'analyse, pas de bordereau).
- Oublier les situations anormales (démarrage, arrêt, maintenance) et d'urgence.
- Ignorer les sous-traitants (vidangeurs, collecteurs, transporteurs) dont on reste responsable.
- Fixer des objectifs sans valeur de départ mesurée.
- Faire porter tout le système par une seule personne sans temps réservé.
- Promettre un délai de certificat au client.

# Partie 3 — Parcours de certification

**Reformulation GEC-CI. Le texte officiel de la norme, acheté auprès de l'ISO ou de CODINORM, fait foi.**

## 3.1 Qui certifie ?

La certification ISO 14001 est délivrée par un **organisme certificateur** indépendant, de préférence accrédité pour ISO 14001 par un organisme d'accréditation membre des accords internationaux (en Afrique de l'Ouest, le SOAC ; ailleurs, des accréditeurs nationaux). GEC-CI n'est pas un organisme certificateur et ne peut pas l'être pour un client qu'elle accompagne : ce serait un conflit d'intérêts.

Ce que l'organisme certificateur fait :
- il réalise l'audit en deux étapes ;
- il décide de délivrer, maintenir, suspendre ou retirer le certificat ;
- il fixe ses tarifs et la durée d'audit (calculée selon l'effectif, les sites et la complexité environnementale) ;
- il applique les règles de transition vers l'édition 2026.

Avant de choisir, vérifier : l'accréditation couvre-t-elle ISO 14001 et le secteur d'activité ? Les auditeurs parlent-ils français ? Peuvent-ils venir sur le site (San Pedro, Soubré, Man) ? Le certificat sera-t-il reconnu par les acheteurs ? **Liste des organismes accrédités : À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT.**

## 3.2 Étapes de l'audit de certification

| Étape | Objet | Où | Ce que l'auditeur regarde surtout en ISO 14001 |
|---|---|---|---|
| Étape 1 | Vérifier que le système est prêt | Sur site ou en partie à distance | Domaine d'application, registre des aspects, registre de veille, évaluation de conformité, audit interne et revue de direction réalisés, autorisations administratives, visite rapide des zones à risque |
| Écart entre étapes | Corriger les points soulevés en étape 1 | — | Durée fixée avec l'organisme |
| Étape 2 | Vérifier que le système est appliqué et efficace | Sur site | Terrain : déchets, rétentions, effluents, chaudière ; entretiens avec opérateurs ; preuves de surveillance ; traitement des incidents ; performance |
| Décision | L'organisme décide | Siège de l'organisme | Rapport d'audit, traitement des non-conformités majeures |

Non-conformité majeure : absence ou défaillance d'une exigence qui remet en cause la capacité du système à atteindre ses résultats (exemple : aucune évaluation de conformité ; rejets non surveillés alors qu'ils sont significatifs). Elle doit être corrigée, avec preuves, avant la décision. Non-conformité mineure : écart ponctuel, traité par un plan d'actions accepté.

## 3.3 Cycle de trois ans

- **Année 1** : audit initial (étapes 1 et 2), décision, certificat valable trois ans.
- **Années 2 et 3** : audits de surveillance (au moins un par an), plus courts.
- **Fin d'année 3** : audit de renouvellement, avant l'expiration du certificat.
- **Entre-temps** : l'entreprise prévient l'organisme de tout changement important (nouveau site, nouvelle activité, incident grave, procédure administrative). Un incident environnemental majeur peut déclencher un audit spécial.

## 3.4 Transition vers ISO 14001:2026

- Une entreprise certifiée 2015 doit passer à 2026 avant la fin de la transition (30 avril 2029 annoncé par Amtivo et LRQA, **À CONFIRMER** selon le document IAF).
- La transition se fait en général lors d'un audit de surveillance ou de renouvellement, avec du temps d'audit supplémentaire (à confirmer avec l'organisme).
- Points à préparer : conditions environnementales dans REG-E-01, risques et opportunités séparés dans REG-E-04, procédure de modification PRO-E-05 avec registre REG-E-05, prestataires externes dans PRO-E-12, objectifs d'audit dans PLAN-E-04, entrées de revue de direction dans RAP-E-02, perspective cycle de vie dans MAT-E-02.

## 3.5 Méthode GEC-CI en 10 étapes avec points de décision

| Étape | Contenu | Livrables | Décision |
|---|---|---|---|
| 1. Diagnostic express | 45 minutes, objectifs et contraintes | Fiche de synthèse | On continue si un dirigeant porte le projet |

## 3.6 Planning type

Les durées ci-dessous sont des ordres de grandeur pour la préparation, pas une promesse. Elles dépendent de l'état de départ, de la disponibilité du personnel et des démarches administratives.

| Taille | Préparation indicative | Particularités |
|---|---|---|
| Coopérative ou PME < 50 personnes, un site | 6 à 8 mois | Système léger, 8 à 10 procédures, peu de mesures analytiques |
| PME industrielle 50 à 200 personnes | 8 à 10 mois | Effluents et émissions à mesurer, plan d'urgence complet |
| Usine > 200 personnes ou plusieurs sites | 10 à 12 mois | Plusieurs ateliers, autorisations multiples, nombreux prestataires |

Facteur de retard le plus fréquent : la régularisation administrative (EIES, constat d'impact, autorisation d'installation classée), dont les délais dépendent de l'administration et ne sont pas maîtrisés par GEC-CI.

# Partie 4 — Construire le système

## 4.1 Diagnostic initial

### Méthode

1. Réunion d'ouverture avec la direction (30 minutes).
2. Visite complète du site en suivant les flux : réception des matières, ateliers, chaufferie, station d'épuration ou lagunes, magasin de produits chimiques, aire de déchets, atelier mécanique, parc de camions, limites de propriété (voisins, cours d'eau, lagune).
3. Revue des documents existants : autorisations, rapports d'inspection, analyses, factures d'énergie et d'eau, contrats de collecte.
4. Entretiens avec 5 à 10 personnes de terrain.
5. Cotation article par article avec la check-list CHK-E-01.
6. Restitution à la direction avec la carte des écarts et les priorités.

### Grille de maturité 0-1-2

| Note | Signification | Exemple pour 6.1.3 (obligations de conformité) |
|---|---|---|
| 0 | Rien n'existe ou c'est inconnu | Personne ne sait quels textes s'appliquent |
| 1 | Existe en partie, non formalisé ou non appliqué | Quelques textes connus, pas de registre, pas de lien avec le site |
| 2 | Existe, formalisé, appliqué, prouvé | Registre REG-E-03 à jour, exigences traduites, évaluation datée |

Le score global (somme des notes / (nombre d'articles × 2) × 100) donne un pourcentage de maturité. Il sert à suivre l'avancement, pas à promettre une certification.

### Formulaires du diagnostic

- CHK-E-01 : check-list de diagnostic par article.
- FOR-E-01 : fiches terrain d'identification des aspects, déjà utilisables pendant la visite.
- REG-E-03 : amorce du registre de veille avec les textes repérés.

## 4.2 Contexte de l'organisme (enjeux internes et externes, dont le climat)

L'entreprise liste ses enjeux dans REG-E-01 selon la procédure PRO-E-02. GEC-CI propose de croiser deux grilles : une analyse forces-faiblesses-opportunités-menaces et une liste de **conditions environnementales**, exigée de façon plus nette par l'édition 2026.

| Type | Exemples pour une usine de cacao à San Pedro | Exemples pour une coopérative à Soubré |
|---|---|---|
| Climat | Fortes pluies et inondation de la zone de stockage ; chaleur qui augmente la consommation de froid | Saisons des pluies décalées, baisse de rendement, routes impraticables |
| Biodiversité | Proximité de mangroves ou de zones humides côtières | Exploitations proches de forêts classées ; exigences zéro déforestation |
| Pollution | Qualité de l'eau de la lagune ou de la mer recevant les rejets | Résidus de produits phytosanitaires |
| Ressources | Disponibilité de l'eau de forage, coupures électriques | Bois de chauffe, eau pour les pépinières |
| Réglementaire | Nouveau Code de l'environnement 2023, inspections | Exigences RA/Fairtrade, EUDR |
| Marché | Acheteurs européens exigeant des données | Primes liées aux certifications |
| Interne | Compétences, budget, état des équipements | Gouvernance, temps des délégués |

Pour chaque enjeu : effet sur l'entreprise, effet de l'entreprise sur l'environnement, lien vers un risque ou une opportunité (REG-E-04). Mise à jour annuelle et lors de la revue de direction.

## 4.4 Cartographie des processus (exemple : huilerie de palme)

**Processus de management** : M1 Direction et stratégie (politique, revue de direction) ; M2 Pilotage du SME (contexte, aspects, conformité, audits, amélioration).

**Processus de réalisation** : R1 Approvisionnement en régimes (plantations propres et planteurs villageois) ; R2 Réception et stérilisation ; R3 Égrappage, digestion et pressage ; R4 Clarification et stockage de l'huile ; R5 Traitement des effluents (POME) et des sous-produits (rafles, fibres, coques) ; R6 Expédition.

**Processus de support** : S1 Ressources humaines et formation ; S2 Maintenance et énergie (chaudière biomasse, turbine, groupes) ; S3 Achats et prestataires ; S4 Magasin et produits chimiques ; S5 Sécurité et urgences ; S6 Documentation et informatique.

Interactions clés : R3 produit les effluents traités par R5 ; R5 fournit la biomasse brûlée par S2 ; S2 produit les fumées et les cendres ; S3 encadre le collecteur d'huiles usagées. Chaque processus a un pilote, des aspects (REG-E-02) et au moins un indicateur. Le tout est décrit dans MAT-E-03.

## 4.5 Politique et objectifs

### Politique (POL-E-01)

Une page maximum, signée par le dirigeant, avec : les activités et le site, les trois engagements (protection de l'environnement dont prévention de la pollution, respect des obligations de conformité, amélioration continue), deux ou trois priorités propres à l'entreprise (exemple : « réduire la charge organique de nos rejets », « valoriser 100 % de nos coques »), le cadre pour fixer des objectifs. Affichage à l'entrée, en atelier, diffusion aux prestataires.

### Objectifs (PLAN-E-01)

| Objectif | Indicateur | Départ | Cible | Échéance |
|---|---|---|---|---|
| Réduire la consommation d'eau de l'usine de cacao | m³/t (KPI-E-05) | Mesuré sur 3 mois | À fixer après mesure | 12 mois |
| Atteindre 100 % de traçabilité des déchets dangereux | KPI-E-08 | Constat diagnostic | 100 % | 6 mois |
| Conformité des analyses d'effluents de l'usine d'hévéa | KPI-E-09 | Dernières analyses | 100 % | 12 mois |
| Réduire le gasoil de la flotte logistique | L/100 km (KPI-E-04) | Mesuré sur 3 mois | À fixer après mesure | 12 mois |

Règle : pas d'objectif sans valeur de départ mesurée ; pas d'objectif sans responsable ni budget.

## 4.6 Risques et opportunités

La méthode de cotation des **aspects environnementaux** est détaillée en Partie 6. Pour les **risques et opportunités du système** (REG-E-04, PRO-E-05), GEC-CI utilise une grille simple :

| Probabilité (P) | Impact (I) sur l'environnement, la conformité ou l'entreprise |
|---|---|
| 1 : peu probable sur 3 ans | 1 : faible, réversible, sans suite administrative |
| 2 : possible | 2 : notable, plainte ou coût modéré |
| 3 : probable dans l'année | 3 : grave, mise en demeure, perte de client |
| 4 : déjà arrivé ou certain | 4 : très grave, arrêt d'activité, pollution durable |

Criticité = P × I. 1 à 4 : surveiller ; 5 à 8 : action planifiée ; 9 à 16 : action prioritaire validée par la direction.

Exemples :
- Risque : refus de renouvellement de contrat par un acheteur faute de données carbone (P3 × I3 = 9, prioritaire).
- Risque : inondation de l'aire de stockage de produits chimiques en saison des pluies (P2 × I4 = 8).
- Opportunité : valoriser la biomasse (coques, fibres, rafles) pour réduire le fioul de la chaudière.
- Opportunité : installation solaire sur les toits des magasins de la coopérative.

Les situations d'urgence possibles (déversement, incendie, débordement de lagune) sont inscrites dans REG-E-04 et traitées par PRO-E-13.

## 4.7 Obligations de conformité et registre de veille

### Construire le registre REG-E-03

| Colonne | Exemple |
|---|---|
| Texte | Loi n° 98-755 du 23 décembre 1998 portant Code de l'eau |
| Article | À identifier sur le texte |
| Exigence en clair | Prélèvement d'eau par forage : vérifier s'il faut une autorisation ou une déclaration |
| Catégorie | A |
| Application au site | Forage de 40 m³/jour à l'usine |
| Preuve attendue | Copie d'autorisation ou de déclaration |
| Statut | À CONFIRMER |
| Date d'évaluation | — |
| Action | Demander l'information au service compétent |
| Responsable | Responsable environnement |

### Méthode de veille

- Sources : Journal officiel, site du ministère chargé de l'environnement, ANDE, CIAPOL, CODINORM, bases UNEP-LEAP et FAOLEX, fédérations professionnelles, acheteurs.
- Fréquence : revue mensuelle des nouveautés, mise à jour du registre, information des responsables concernés.
- Chaque exigence doit être **traduite** en action concrète pour le site : un texte sans traduction n'aide personne.
- Les exigences clients (catégorie C) et volontaires (référentiels agricoles) figurent dans le même registre.

### Évaluation de la conformité

Au moins une fois par an (plus souvent pour les rejets), chaque ligne reçoit un statut avec preuve : conforme, écart, à confirmer. Le résultat est formalisé dans RAP-E-03 et présenté en revue de direction. Détails en Partie 6.

# Partie 5 — Matrice des exigences ISO 14001 et dossiers de preuve

Reformulation GEC-CI. Le texte officiel de la norme, acheté auprès de l'ISO ou de CODINORM, fait foi.

**Base de numérotation :** Numérotation ISO 14001:2015 + Amd 1:2024 (encore valable pendant la transition), avec renvois vers ISO 14001:2026 publiée le 15 avril 2026. Les numéros propres à l'édition 2026 non vérifiés sur le texte officiel portent "confirmer": true.

Cette matrice couvre 33 articles et sous-articles des chapitres 4 à 10. Pour chacun : ce que l'auditeur veut voir (reformulation GEC-CI), l'information documentée exigée par la norme lorsqu'elle existe, les preuves que GEC-CI conseille de préparer, le registre, le responsable et le niveau de risque en audit. La plateforme GEC-CI Pro ISO 14001 et le classeur Excel reprennent la même matrice, avec un statut par article.

# Partie 6 — Exigences propres à la norme, en profondeur

**Reformulation GEC-CI. Le texte officiel de la norme, acheté auprès de l'ISO ou de CODINORM, fait foi.**

Cette partie traite ce qui fait la spécificité d'ISO 14001 par rapport aux autres normes de systèmes de management. C'est là que l'auditeur passe le plus de temps et que les entreprises ivoiriennes ont le plus d'écarts.

## 6.1 Aspects et impacts environnementaux (article 6.1.2)

### Les mots à maîtriser

- **Aspect** : ce que l'activité fait sortir ou consomme et qui touche l'environnement. Exemple : « rejet des eaux de lavage des fèves ».
- **Impact** : la modification de l'environnement qui en résulte. Exemple : « pollution organique du cours d'eau, mortalité de poissons ».
- **Aspect significatif** : aspect qui a ou peut avoir un impact important, selon des critères écrits par l'entreprise.
- **Direct / indirect** : direct si l'entreprise le maîtrise (sa chaudière) ; indirect si elle l'influence seulement (le camion du transporteur, l'usage d'engrais par les planteurs).

### Étape 1 — Découper et observer

Découper le site en activités (réception, process, chaufferie, station, magasin, atelier, bureaux, cantine, transport). Pour chaque activité, remplir la fiche terrain FOR-E-01 : entrées (eau, énergie, matières, produits chimiques) et sorties (déchets, rejets liquides, fumées, poussières, bruit, odeurs). Le faire **sur place**, avec le chef d'atelier.

Pour chaque activité, examiner trois situations :
- **N — Normale** : production habituelle ;
- **A — Anormale** : démarrage, arrêt, nettoyage, maintenance, panne, pic de campagne ;
- **U — Urgence** : déversement, incendie, débordement, rupture.

Et trois temps : passé (pollution historique du sol), présent, futur (projet d'extension).

### Étape 2 — Coter avec la grille MAT-E-01

**Gravité (G)** — ampleur de l'impact :

| G | Critère |
|---|---|
| 1 | Négligeable, aucun effet visible, ressource abondante |
| 2 | Limité au site, réversible rapidement |
| 3 | Atteint l'extérieur (sol, eau, air, voisins), réversible à moyen terme |
| 4 | Grave, durable ou dangereux (déchet dangereux, rejet dans la lagune ou une zone sensible, atteinte à la santé) |

**Fréquence ou probabilité (F)** :

| F | Situation normale ou anormale | Situation d'urgence |
|---|---|---|
| 1 | Moins d'une fois par an | Très improbable |
| 2 | Quelques fois par an | Possible, jamais arrivé |
| 3 | Chaque semaine ou chaque campagne | Déjà arrivé ailleurs dans le secteur |
| 4 | Continu ou quotidien | Déjà arrivé sur le site |

**Sensibilité du milieu (S)** :

| S | Critère |
|---|---|
| 1 | Zone industrielle sans enjeu particulier |
| 2 | Habitations, cours d'eau ou nappe proches |
| 3 | Zone sensible : lagune, mangrove, zone humide, aire protégée, captage d'eau potable (voir annexe III du décret 96-894) |

**Score = G × F × S** (de 1 à 48).

| Score | Classement | Conséquence |
|---|---|---|
| 1 à 8 | Non significatif | Surveillance générale |
| 9 à 17 | À surveiller | Bonne pratique, revue annuelle |
| 18 à 48 | **Significatif** | Maîtrise opérationnelle, surveillance, objectif possible |

**Règles de significativité d'office** (quel que soit le score) :
1. l'aspect est encadré par une obligation de conformité (rejet réglementé, déchet dangereux, émission soumise à valeur limite) ;
2. l'aspect a fait l'objet d'une plainte ou d'une remarque d'inspection dans les trois dernières années ;
3. situation d'urgence avec G = 4 ;
4. exigence explicite d'un client ou d'un référentiel (catégorie C).

Les seuils (9 et 18) sont une proposition GEC-CI (catégorie E). L'entreprise peut les ajuster, mais elle doit les écrire et les garder stables d'une année sur l'autre, sinon les comparaisons n'ont pas de sens.

**Le niveau de maîtrise** ne fait pas baisser la significativité : un rejet bien traité reste significatif, mais il est maîtrisé. C'est l'erreur la plus fréquente : « on a une station, donc ce n'est pas significatif ». Si la station tombe en panne, l'impact revient.

### Erreurs fréquentes

- Registre fait au bureau, sans visite.
- Oublier les bureaux, la cantine, le garage, le gardiennage (déchets, eau, groupe).
- Ne coter que la situation normale.
- Changer les seuils chaque année.
- Aucun lien entre aspect significatif et maîtrise opérationnelle.

## 6.2 Obligations de conformité et évaluation périodique (6.1.3 et 9.1.2)

### Identifier

Partir des aspects significatifs : pour chacun, quel texte s'applique ? Puis ajouter les textes « horizontaux » (Code de l'environnement 2023, EIES, installations classées, eau, air, déchets, plastiques). Ajouter les obligations des autorisations du site (arrêté, avis de conformité environnementale, plan de gestion environnementale et sociale de l'EIES), qui sont souvent **plus précises** que les textes généraux. Ajouter les exigences clients et référentiels.

### Traduire

Une ligne du registre REG-E-03 = une exigence précise et vérifiable. « Respecter le Code de l'eau » n'est pas une exigence ; « disposer d'une autorisation de prélèvement pour le forage F1 » en est une (à confirmer sur le texte).

### Évaluer

| Élément | Règle GEC-CI (catégorie D/E) |
|---|---|
| Fréquence | Au moins annuelle pour tout le registre ; à chaque résultat d'analyse pour les rejets ; à chaque nouveau texte |
| Méthode | Preuve documentaire (autorisation, bordereau, bulletin d'analyse) + constat terrain + entretien |
| Qui | Responsable environnement ; regard extérieur (GEC-CI ou juriste) recommandé une fois par cycle |
| Résultat | RAP-E-03 avec taux de conformité (KPI-E-01), liste des écarts, des points à confirmer, actions |
| Écart | Fiche FOR-E-05, action datée, information de la direction ; si l'écart touche l'administration, démarche officielle |

### Ce que veut voir l'auditeur

- Que l'entreprise **connaît son état de conformité** à la date de l'audit.
- Que chaque écart connu a une action réelle (pas seulement une ligne dans un tableau).
- Que les résultats d'analyse sont comparés aux valeurs applicables.
- Que les autorisations couvrent les activités réellement exercées (capacité, lignes nouvelles).

## 6.3 Maîtrise opérationnelle (8.1)

Pour chaque aspect significatif : une consigne écrite, un responsable, un critère, un enregistrement. Les procédures PRO-E-07 à PRO-E-12 couvrent les flux principaux.

### Déchets (PRO-E-07, REG-E-09, FOR-E-02)

- Inventaire de tous les déchets par atelier ; distinction dangereux / non dangereux.
- Tri à la source avec des contenants identifiés par couleur et pictogramme.
- Aire de stockage couverte, sur sol étanche, avec rétention pour les déchets liquides dangereux.
- **Interdiction de brûler** des déchets à l'air libre et d'enfouir sur site sans autorisation.
- Valorisation prioritaire : coques de cacao, fibres et coques de palme en combustible ; rafles en paillage ; sacs de jute réemployés ; ferraille vendue à un récupérateur identifié.
- Déchets dangereux (huiles usagées, filtres, batteries, emballages souillés, néons, déchets de laboratoire) remis uniquement à un collecteur dont l'agrément est vérifié et archivé (REG-E-14). Organisme d'agrément et liste : **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**.
- Chaque enlèvement : bordereau FOR-E-02 signé et preuve du traitement final.
- Responsabilité élargie du producteur annoncée par le Code 2023 : modalités À CONFIRMER.

### Eaux usées et effluents (PRO-E-08, REG-E-10)

- Plan des réseaux : eaux pluviales, eaux sanitaires, eaux industrielles. Réseaux séparés autant que possible.
- Prétraitement : dégrillage, dessablage, déshuilage (séparateur d'hydrocarbures pour l'aire de lavage et l'atelier).
- Traitement adapté : lagunes anaérobies puis aérobies pour les huileries ; bassins de décantation et lagunage pour l'hévéa ; neutralisation du pH si besoin.
- Consignes d'exploitation : niveaux des lagunes, curage des boues, interdiction de by-pass.
- Plan de surveillance PLAN-E-03 : points de prélèvement, paramètres (pH, température, DCO, DBO5, MES, huiles et graisses, azote, phosphore selon le cas), fréquence, laboratoire. **Valeurs limites applicables : celles de l'arrêté d'autorisation du site et de la réglementation sur les rejets des installations classées, À CONFIRMER sur le texte.**
- Conduite en cas de dépassement : information immédiate, recherche de cause, action (FOR-E-05).
- Erreur fréquente : faire une analyse « pour l'audit » un jour où l'usine ne tourne pas.

### Émissions atmosphériques, bruit, odeurs (PRO-E-09, REG-E-11)

- Chaudières et groupes électrogènes : entretien planifié, réglage de la combustion, ramonage, suivi des heures de marche.
- Mesures de fumées par un prestataire compétent selon la fréquence prévue par l'autorisation ou décidée par l'entreprise (À CONFIRMER).
- Poussières : capotage des convoyeurs, arrosage des pistes, bâchage.
- Bruit : mesure en limite de propriété, de jour et de nuit, si riverains proches.
- Odeurs : couverture des stocks odorants (fonds de tasse d'hévéa), gestion des lagunes, registre des plaintes REG-E-07.
- Fluides frigorigènes (climatisation, chambres froides) : entretien par technicien qualifié, pas de dégazage à l'air libre.

### Produits chimiques et hydrocarbures (PRO-E-10, REG-E-12, FOR-E-08)

- Inventaire avec fiche de données de sécurité à jour pour chaque produit.
- Stockage sur rétention de capacité suffisante (règle courante de bonne pratique : au moins le plus grand contenant ou une fraction du volume total ; règle exacte applicable À CONFIRMER).
- Séparation des produits incompatibles (acides / bases, oxydants / combustibles).
- Dépotage contrôlé avec FOR-E-08 : vanne de sortie fermée, kit antidéversement à proximité, présence d'un agent.
- Emballages vides : jamais réutilisés pour l'eau ou les aliments ; rincés si la procédure le prévoit puis remis à un collecteur.
- Coopératives : magasin d'intrants fermé, ventilé, sol étanche, éloigné des points d'eau et du stock de fèves.

### Énergie (PRO-E-11, REG-E-13)

- Compteurs : électricité générale et principaux postes ; carburant par équipement ou par véhicule.
- Ratios mensuels rapportés à la production (KPI-E-03, KPI-E-04).
- Actions simples : fuites d'air comprimé, éclairage, isolation des tuyauteries de vapeur, arrêt des machines à vide, entretien des moteurs, suivi par chauffeur.
- Opportunités : biomasse, solaire, récupération de chaleur. Ces projets demandent une étude technique et économique propre.

### Eau (PRO-E-11, REG-E-13)

- Inventaire des sources : réseau public, forage, puits, cours d'eau.
- Statut administratif des prélèvements au regard du Code de l'eau : À CONFIRMER.
- Compteurs sur chaque source et sur les gros postes.
- Chasse aux fuites, recyclage des eaux de refroidissement, nettoyage à sec avant lavage.

### Prestataires externes (PRO-E-12, REG-E-14, FOR-E-04)

L'édition 2026 vise tous les processus, produits et services fournis par l'extérieur. Liste des prestataires critiques : collecteurs de déchets, vidangeurs de fosses, transporteurs, laboratoires, sous-traitants de maintenance, fournisseurs de produits chimiques. Pour chacun : agrément vérifié, exigences écrites dans le contrat, évaluation annuelle, accueil environnemental sur le site.

## 6.4 Situations d'urgence (8.2)

### Scénarios types

| Scénario | Sites concernés | Moyens clés |
|---|---|---|
| Déversement de gasoil ou de fioul au dépotage | Tous | Kit antidéversement, obturateur de regard, sable absorbant |
| Fuite de produit chimique au magasin | Usines, coopératives | Rétention, EPI, FDS, kit |
| Incendie de stock (fèves, sacs, caoutchouc, biomasse) | Usines, coopératives | Extinction, **confinement des eaux d'extinction**, évacuation |
| Débordement ou rupture de lagune | Huileries, usines d'hévéa | Surveillance des niveaux, revanche, pompe de secours, digue |
| Panne de la station d'épuration | Industries | Bassin tampon, réduction de production |
| Accident de camion transportant des produits | Logistique, coopératives | Consignes chauffeur, numéros d'urgence |

### Plan d'urgence (PLAN-E-02, PRO-E-13)

Une fiche réflexe par scénario : déclencheur, qui alerte qui, actions des cinq premières minutes, moyens et emplacement, contacts externes (sapeurs-pompiers, CIAPOL, autorités : numéros À CONFIRMER et à afficher), confinement, nettoyage, élimination des déchets de l'incident, information des voisins si nécessaire.

### Tester

Au moins un exercice par an pour chaque scénario majeur (proposition GEC-CI). Compte rendu dans REG-E-15 : délai de réaction, moyens trouvés ou non, erreurs, actions. Un exercice qui « se passe parfaitement » n'a souvent pas été assez réaliste.

### Après un incident réel

Fiche FOR-E-03, actions immédiates, analyse de cause (Partie 9), révision du plan, information des autorités si un texte l'exige (À CONFIRMER selon le cas).

## 6.5 Performance environnementale et indicateurs (9.1.1)

- Choisir des indicateurs liés aux aspects significatifs et aux objectifs (19 indicateurs proposés dans kpi.json, de KPI-E-01 à KPI-E-19).
- Rapporter à la production (par tonne, par 100 km) pour neutraliser l'effet volume.
- Mesurer d'abord trois mois avant de fixer une cible.
- Étalonner les appareils (REG-E-16) : un pH-mètre non étalonné rend toutes les analyses internes contestables.
- Analyser les tendances, pas seulement les valeurs du mois.
- Communiquer : affichage interne, rapport annuel aux acheteurs, réponses aux questionnaires.

## 6.6 Perspective cycle de vie et chaîne de valeur

La norme ne demande pas une analyse de cycle de vie chiffrée (ISO 14040/14044) mais de **regarder chaque étape** et d'agir là où l'entreprise a du contrôle ou de l'influence. L'édition 2026 renforce ce point.

| Étape | Exemple cacao | Ce que l'entreprise peut faire |
|---|---|---|
| Matières premières | Fèves de plantations, risque de déforestation | Exigences d'achat, traçabilité, appui aux coopératives (lien RA, EUDR) |
| Intrants | Produits de nettoyage, emballages | Choisir des produits moins dangereux, emballages réutilisables |
| Transport amont | Camions des coopératives | Regrouper les livraisons, exigences aux transporteurs |
| Production | Usine | Maîtrise opérationnelle (section 6.3 ci-dessus, article 8.1) |
| Distribution | Conteneurs vers l'Europe | Optimiser le chargement |
| Utilisation | Chez le chocolatier | Informations sur le produit si demandé |
| Fin de vie | Sacs, big-bags, palettes, coques | Réemploi, reprise, valorisation |

Outil : MAT-E-02. Pour une coopérative, l'amont (pratiques des producteurs) est souvent le plus grand impact : formation, zones tampons, gestion des emballages de pesticides.

## 6.7 Conditions environnementales

Depuis l'Amd 1:2024, le climat doit être examiné ; en 2026, l'analyse s'élargit aux conditions environnementales. Questions à poser :
- **Climat** : le site est-il exposé aux inondations, aux fortes chaleurs, aux sécheresses ? Les approvisionnements agricoles sont-ils menacés ?
- **Biodiversité** : le site ou les fournisseurs sont-ils proches de forêts classées, de mangroves, de zones humides ?
- **Pollution** : l'eau, l'air ou le sol autour du site sont-ils déjà dégradés ?
- **Ressources** : l'eau de forage baisse-t-elle ? L'électricité est-elle fiable ?

Les réponses alimentent REG-E-01, REG-E-04 et le plan d'urgence.

## 6.8 Gestion des modifications (6.3 en 2026, À CONFIRMER pour la numérotation)

Toute modification (nouvelle ligne, nouveau produit chimique, nouveau fournisseur critique, extension, changement de combustible) passe par FOR-E-06 avant réalisation : aspects nouveaux, autorisations à modifier (une extension peut exiger un nouveau constat d'impact ou une modification d'autorisation, À CONFIRMER), formation, mise à jour des documents. Trace dans REG-E-05.

# Partie 7 — Compétences, formation et sensibilisation

## 7.1 Qui doit être compétent ?

Toute personne dont le travail touche un aspect significatif ou une obligation de conformité : opérateur de station, chauffeur de chaudière, magasinier, chef d'atelier, mécanicien, chauffeur de camion, responsable des achats, gestionnaire de magasin de coopérative. La compétence se prouve par la formation, l'expérience et l'observation au poste (REG-E-06).

## 7.2 Plan de formation type (PLAN-E-05)

| Module | Public | Durée indicative | Évaluation |
|---|---|---|---|
| M1 — ISO 14001:2026 pour la direction | Dirigeants, cadres | ½ jour | Quiz + engagements écrits |
| M2 — Analyse environnementale et cotation des aspects | Responsable environnement, chefs d'atelier | 1 jour | Cotation d'un atelier réel |
| M3 — Veille et évaluation de conformité | Responsable environnement, juriste | 1 jour | Remplissage de 10 lignes REG-E-03 |
| M4 — Gestion des déchets et des produits chimiques | Magasiniers, mécaniciens, agents d'entretien | ½ jour | Démonstration pratique de tri et de dépotage |
| M5 — Exploitation de la station d'épuration ou des lagunes | Opérateurs | 1 jour | Observation au poste + prélèvement |
| M6 — Réponse aux situations d'urgence | Équipes d'intervention | ½ jour + exercice | Exercice chronométré |
| M7 — Écoconduite et gestion du carburant | Chauffeurs | ½ jour | Suivi des L/100 km sur 3 mois |
| M8 — Auditeur interne ISO 14001 selon ISO 19011 | 2 à 4 auditeurs internes | 2 jours | Audit blanc encadré |
| M9 — Sensibilisation générale | Tout le personnel, journaliers inclus | 30 min à l'accueil + causeries mensuelles | Questions orales au poste |

Les durées sont des propositions GEC-CI (catégorie E), à adapter. Pour les coopératives, les modules M4 et M9 se font en langue locale si besoin, avec images et démonstrations.

## 7.3 Sensibilisation : ce que chacun doit savoir dire

1. Notre politique environnementale en une phrase.
2. Le principal impact de mon poste.
3. Ce que je dois faire (consigne) et ce qui arrive si je ne le fais pas.
4. Quoi faire en cas de fuite ou d'incendie.

## 7.4 Évaluer l'efficacité

Une feuille de présence n'est pas une preuve de compétence. Méthodes : questions au poste trois semaines après, observation, indicateurs (moins de déchets mal triés, moins de dépassements), résultats d'audit interne.

# Partie 8 — Indicateurs, audit interne et revue de direction

## 8.1 Tableau de bord

| Domaine | Indicateurs (kpi.json) | Fréquence de revue |
|---|---|---|
| Conformité | KPI-E-01, KPI-E-09, KPI-E-08 | Mensuelle |

| Déchets | KPI-E-06, KPI-E-07 | Mensuelle |

Présentation mensuelle à la direction avec RAP-E-04 : valeur, cible, tendance, alerte, action.

## 8.2 Programme d'audit interne (PLAN-E-04, PRO-E-15)

- Couvrir tous les articles et tous les processus sur un cycle ; auditer plus souvent les processus à aspects significatifs (station, magasin chimique, chaufferie).
- Pour chaque audit : **objectifs** (exigence 2026 annoncée), critères (norme, procédures, autorisations), périmètre, dates, auditeurs.
- Impartialité : un auditeur n'audite pas son propre travail.
- Méthode selon ISO 19011 : préparation, réunion d'ouverture, terrain d'abord, entretiens, échantillonnage des enregistrements, constats factuels, réunion de clôture, rapport RAP-E-01, suivi dans REG-E-17.
- Pour une petite structure, un auditeur externe (consultant ou auditeur d'une autre entreprise) peut réaliser l'audit interne.

## 8.3 Revue de direction (PRO-E-16, RAP-E-02)

**Éléments d'entrée** : suivi des décisions précédentes ; évolution des enjeux, des conditions environnementales, des attentes des parties intéressées, des obligations de conformité, des aspects significatifs, des risques et opportunités ; atteinte des objectifs ; performance environnementale (non-conformités, actions correctives, résultats de surveillance, conformité, audits) ; communications et plaintes ; adéquation des ressources ; opportunités d'amélioration.

**Éléments de sortie** : conclusions sur la pertinence et l'efficacité du système ; décisions d'amélioration ; besoins de changement, y compris ressources ; actions si des objectifs ne sont pas atteints ; liens avec la stratégie de l'entreprise.

Conseil : une revue de direction se prépare avec des chiffres, dure 2 à 3 heures, se termine par des décisions datées et un responsable par décision.

# Partie 9 — Non-conformités, actions correctives et amélioration continue

## 9.1 Sources d'écarts

Dépassement d'analyse, incident, plainte, constat d'audit interne ou externe, inspection administrative, écart d'évaluation de conformité, consigne non appliquée.

## 9.2 Méthode (PRO-E-17, FOR-E-05, REG-E-18)

1. **Réagir** : maîtriser et corriger tout de suite (arrêter la fuite, confiner, informer).
2. **Traiter les conséquences** environnementales (nettoyage, élimination des terres souillées).
3. **Analyser les causes** : 5 pourquoi pour un écart simple ; diagramme d'Ishikawa (5 M : Main-d'œuvre, Méthode, Matériel, Matière, Milieu) pour un écart complexe.
4. **Agir sur la cause racine**.
5. **Vérifier l'efficacité** après un délai défini, avec un critère mesurable.
6. **Mettre à jour** le système (aspects, risques, procédures) si nécessaire.

## 9.3 Exemple : dépassement de DCO à l'usine d'hévéa

- Constat : analyse trimestrielle de sortie de lagune au-dessus de la valeur de référence.
- Pourquoi 1 ? La lagune finale est trop chargée. Pourquoi 2 ? Le temps de séjour est réduit. Pourquoi 3 ? La première lagune est remplie de boues. Pourquoi 4 ? Aucun curage depuis deux ans. Pourquoi 5 ? Le curage n'est pas dans le plan de maintenance et n'a pas de budget.
- Action corrective : curage planifié, ajout au plan de maintenance avec mesure annuelle de l'épaisseur des boues, ligne budgétaire.
- Vérification : deux analyses consécutives conformes après curage ; indicateur KPI-E-09 suivi.

## 9.4 Amélioration continue

Le registre REG-E-18 recueille aussi les opportunités d'amélioration (suggestions du personnel, idées d'économies). La revue de direction choisit les projets. L'amélioration se démontre par la tendance des indicateurs sur plusieurs années.

# Partie 10 — Préparation à l'audit de certification et maintien

## 10.1 Choisir l'organisme certificateur

Critères : accréditation ISO 14001 valide pour le secteur (À CONFIRMER au cas par cas), auditeurs francophones et connaissant l'agro-industrie, reconnaissance par les acheteurs, disponibilité, devis détaillé (jours d'audit, déplacement, surveillance, renouvellement), règles de transition 2026. Demander au moins deux devis.

## 10.2 Check-list J-30 (CHK-E-03)

- Domaine d'application et politique signés.
- REG-E-01, REG-E-02, REG-E-03, REG-E-04 à jour et datés.
- Évaluation de conformité récente (RAP-E-03) avec écarts suivis.
- Autorisations administratives classées et accessibles.
- Au moins deux à trois mois d'enregistrements opérationnels réels (REG-E-09 à REG-E-13).
- Plan d'urgence et au moins un exercice récent (REG-E-15).
- Audit interne complet (RAP-E-01) et revue de direction (RAP-E-02) réalisés.
- Actions correctives en cours ou clôturées (REG-E-18).
- Personnel sensibilisé (REG-E-06) ; site rangé ; aire de déchets propre.
- Personnes clés disponibles les jours d'audit.

## 10.3 Pendant l'audit

Accueillir, guider, répondre honnêtement, montrer les preuves, ne jamais inventer un enregistrement. Si une preuve manque, le dire. Noter les constats pendant la réunion de clôture et demander des précisions si un constat n'est pas clair.

## 10.4 Après l'audit

Plan d'actions pour chaque non-conformité dans le délai fixé par l'organisme ; preuves de correction pour les majeures ; analyse de cause pour toutes ; suivi dans REG-E-18. La décision et la date de certification appartiennent à l'organisme.

## 10.5 Maintien

- Programme annuel : veille mensuelle, évaluation de conformité annuelle, audit interne, revue de direction, exercices d'urgence, mise à jour des aspects.
- Audit de surveillance chaque année ; renouvellement à trois ans.
- Changements de norme : suivre la transition 2026 avec l'organisme ; surveiller les futures révisions et amendements ; mettre à jour le kit.

## 12.4 Système intégré et référentiels agricoles

- **QSE / QSSE** : fusionner PRO-E-01, PRO-E-15, PRO-E-16, PRO-E-17 et la gestion des compétences avec leurs équivalents des kits ISO 9001 (Q), 45001 (S) et 22000 (H). Une seule liste maîtresse, un seul programme d'audit, une seule revue de direction, un seul registre des non-conformités avec une colonne « norme ». Les registres spécifiques restent séparés : aspects (E), dangers SST (S), dangers alimentaires (H).
- **Lien ISO 45001** : produits chimiques, urgences et incendie sont communs ; un exercice peut servir aux deux normes.
- **Rainforest Alliance V1.4, Fairtrade, RSPO** : réutiliser les preuves (formations, gestion des pesticides, emballages vides, zones tampons, cartographie des parcelles). ISO 14001 ajoute le système de management de l'usine ou de la coopérative. Ne jamais présenter un certificat agricole comme un certificat ISO ou l'inverse.

## 12.5 Base de connaissances et modèles sectoriels

Modèles disponibles à adapter : registre des aspects type pour usine de cacao, huilerie de palme, usine d'hévéa, PME logistique, coopérative ; plan d'urgence « lagune » ; plan de surveillance analytique ; registre de veille ivoirien de départ. Chaque modèle est relu à chaque évolution réglementaire.

ngagement", "resume": "Le dirigeant prouve qu'il porte le système : il rend des comptes, fournit les moyens, intègre l'environnement aux décisions métier et aide les autres responsables à exercer leur leadership.", "doc": "", "preuves": ["Revues de direction signées par le dirigeant", "Budget environnement voté (analyses, bacs, formation)", "Entretien de l'auditeur avec le dirigeant"], "registre": "RAP-E-02", "responsable": "Direction générale", "risque": "Élevé", "question": "Le dirigeant sait-il expliquer, sans papier, les trois principaux impacts du site et les actions en cours ?", "nouveau": "2026 : soutien annoncé aussi envers d'autres rôles pertinents du système (portée exacte À CONFIRMER sur le texte officiel).", "confirmer": false}, {"code": "5.2", "chapitre": "5", "titre": "Politique environnementale", "resume": "Le dirigeant établit une politique adaptée à l'activité, avec trois engagements clés : protéger l'environnement (dont prévention de la pollution), respecter les obligations de conformité, améliorer continuellement.", "doc": "À tenir à jour : politique environnementale", "preuves": ["Politique signée et datée", "Affichage à l'entrée et dans les ateliers", "Diffusion aux sous-traitants et parties intéressées"], "registre": "POL-E-01", "responsable": "Direction générale", "risque": "Moyen", "question": "Votre politique environnementale signée contient-elle les trois engagements et est-elle connue des chefs d'équipe ?", "nouveau": "", "confirmer": false}, {"code": "5.3", "chapitre": "5", "titre": "Rôles, responsabilités et autorités", "resume": "Les responsabilités environnementales sont attribuées, communiquées et comprises, notamment qui veille à la conformité du système et qui rend compte de la performance à la direction.", "doc": "", "preuves": ["Organigramme avec responsable environnement nommé", "Fiches de poste mentionnant les tâches environnementales", "Note de nomination signée"], "registre": "MAN-E-01", "responsable": "Direction générale", "risque": "Moyen", "question": "Une personne est-elle officiellement nommée pour le système environnemental, avec du temps réservé pour cette mission ?", "nouveau": "", "confirmer": false}, {"code": "6.1.1", "chapitre": "6", "titre": "Actions face aux risques et opportunités — généralités", "resume": "L'entreprise définit comment elle identifie les risques et opportunités liés à ses aspects, ses obligations et son contexte, y compris les situations d'urgence possibles, pour atteindre ses résultats.", "doc": "À tenir à jour : risques et opportunités à traiter ; processus de 6.1.1 à 6.1.4, dans la mesure nécessaire pour avoir confiance qu'ils sont réalisés comme prévu", "preuves": ["Procédure de gestion des risques et opportunités", "Registre des risques et opportunités coté", "Liste des situations d'urgence potentielles"], "registre": "REG-E-04", "responsable": "Responsable environnement", "risque": "Élevé", "question": "Avez-vous une liste à jour de ce qui peut mal tourner (ou bien tourner) pour l'environnement et pour l'entreprise ?", "nouveau": "2026 : risques et opportunités affinés, situations d'urgence explicitement considérées ; un article autonome sur les risques et opportunités est annoncé (6.1.4 selon DQS).", "confirmer": true}, {"code": "6.1.2", "chapitre": "6", "titre": "Aspects environnementaux", "resume": "L'entreprise identifie les aspects de ses activités, produits et services qu'elle maîtrise ou influence, leurs impacts, selon une perspective cycle de vie, puis détermine avec des critères écrits les aspects significatifs.", "doc": "À tenir à jour : aspects et impacts, critères de significativité, aspects significatifs", "preuves": ["Registre des aspects/impacts par atelier et situation (normale, anormale, urgence)", "Grille de cotation écrite", "Fiches terrain signées"], "registre": "REG-E-02", "responsable": "Responsable environnement / Chefs d'atelier", "risque": "Élevé", "question": "Avez-vous coté par écrit chaque aspect (rejets, déchets, fumées, bruit, énergie) avec une méthode stable et expliquée ?", "nouveau": "2026 : perspective cycle de vie renforcée, de l'approvisionnement en matières à la fin de vie.", "confirmer": false}, {"code": "6.1.3", "chapitre": "6", "titre": "Obligations de conformité", "resume": "L'entreprise identifie et accède aux exigences légales et autres engagements liés à ses aspects, sait comment ils s'appliquent à elle, et les intègre dans son système.", "doc": "À tenir à jour : obligations de conformité", "preuves": ["Registre de veille réglementaire avec article, exigence, application concrète", "Copies des autorisations (arrêté ICPE, avis EIES)", "Abonnement ou source de veille identifiée"], "registre": "REG-E-03", "responsable": "Responsable environnement / Juriste", "risque": "Élevé", "question": "Avez-vous la liste des textes ivoiriens et des exigences clients qui s'appliquent à votre site, avec ce que chacun vous oblige à faire ?", "nouveau": "", "confirmer": false}, {"code": "6.1.4", "chapitre": "6", "titre": "Planification d'actions (et risques et opportunités en 2026)", "resume": "L'entreprise planifie des actions pour ses aspects significatifs, ses obligations et ses risques et opportunités, les intègre à ses processus et prévoit comment en vérifier l'efficacité.", "doc": "", "preuves": ["Programme environnemental reliant chaque action à un aspect, une obligation ou un risque", "Responsables et échéances", "Critères d'efficacité"], "registre": "PLAN-E-01", "responsable": "Responsable environnement", "risque": "Moyen", "question": "Chaque aspect significatif et chaque obligation non respectée a-t-il une action écrite, un responsable et une date ?", "nouveau": "2026 : selon DQS, 6.1.4 devient un article autonome 'risques et opportunités', séparé des aspects ; la planification d'actions serait renumérotée.", "confirmer": true}, {"code": "6.2.1", "chapitre": "6", "titre": "Objectifs environnementaux", "resume": "L'entreprise fixe des objectifs mesurables, cohérents avec la politique, tenant compte des aspects significatifs et des obligations, suivis, communiqués et mis à jour.", "doc": "À tenir à jour : objectifs environnementaux", "preuves": ["Tableau des objectifs chiffrés", "Suivi mensuel des indicateurs", "Communication aux équipes"], "registre": "PLAN-E-01", "responsable": "Direction générale / Responsable environnement", "risque": "Moyen", "question": "Avez-vous au moins trois objectifs environnementaux chiffrés, datés et suivis chaque mois ?", "nouveau": "", "confirmer": false}, {"code": "6.2.2", "chapitre": "6", "titre": "Planification des actions pour atteindre les objectifs", "resume": "Pour chaque objectif : quoi faire, quelles ressources, qui, quand, et comment évaluer les résultats avec des indicateurs. L'objectif est intégré aux processus métier.", "doc": "", "preuves": ["Plan d'actions par objectif", "Budget associé", "Indicateur de suivi"], "registre": "PLAN-E-01", "responsable": "Responsable environnement", "risque": "Moyen", "question": "Pour chaque objectif, savez-vous qui fait quoi, avec quel budget et pour quand ?", "nouveau": "", "confirmer": false}, {"code": "6.3", "chapitre": "6", "titre": "Planification et maîtrise des modifications", "resume": "Avant une modification (nouvelle ligne, nouveau produit chimique, extension, sous-traitant), l'entreprise évalue ses effets sur l'environnement et le système, puis la planifie et la maîtrise.", "doc": "", "preuves": ["Fiches de demande de modification analysées", "Mise à jour des aspects et autorisations après modification", "Registre des modifications"], "registre": "REG-E-05", "responsable": "Direction générale / Responsable environnement", "risque": "Élevé", "question": "Quand vous ajoutez une machine, un produit ou un bâtiment, vérifiez-vous d'abord l'impact environnemental et les autorisations ?", "nouveau": "Nouvel article 2026 annoncé (DQS : 6.3, gestion des modifications). En 2015, ce sujet était seulement traité dans 8.1. Numéro exact à vérifier sur le texte.", "c
