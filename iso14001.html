 À CONFIRMER selon la source retenue", "alerte": "Hausse > 10 % sur un trimestre"}, {"code": "KPI-E-19", "indicateur": "Réalisation du programme d'audit interne", "formule": "Audits réalisés / audits programmés × 100", "source": "PLAN-E-04", "frequence": "Trimestrielle", "responsable": "Responsable environnement", "cible": "100 %", "alerte": "Audit reporté de plus de 30 jours"}], "extras": {"diagnostic": [["Avez-vous la liste écrite des textes environnementaux ivoiriens qui s'appliquent à votre site ?", "Critique — risque légal immédiat"], ["Disposez-vous des autorisations requises (avis EIES ou constat d'impact, régime des installations classées) pour toutes vos activités ?", "Critique — À CONFIRMER avec l'ANDE et le CIAPOL"], ["Vos eaux usées industrielles sont-elles traitées et analysées par un laboratoire selon un calendrier fixé ?", "Haute"], ["Vos déchets dangereux (huiles usagées, emballages de produits chimiques, batteries) partent-ils avec un collecteur dont vous avez vérifié l'agrément ?", "Haute"], ["Vos produits chimiques et carburants sont-ils stockés sur rétention avec un kit antidéversement à proximité ?", "Haute"], ["Avez-vous fait un exercice de déversement ou d'incendie dans les 12 derniers mois ?", "Moyenne"], ["Suivez-vous chaque mois vos consommations d'électricité, de carburant et d'eau rapportées à la production ?", "Moyenne"], ["La direction a-t-elle signé une politique environnementale et tenu une revue avec décisions écrites ?", "Moyenne"]], "parcours": [["1. Diagnostic express", "45 minutes pour situer l'entreprise et décider de la visite."], ["2. Diagnostic initial terrain", "Visite des ateliers, rejets, déchets, stockages ; grille de maturité 0-1-2 par article. Décision : on continue ou on s'arrête."], ["3. Cadrage", "Domaine d'application, équipe projet, responsable environnement nommé, calendrier."], ["4. Analyse environnementale initiale", "Contexte et conditions environnementales, parties intéressées, aspects et impacts cotés, cycle de vie."], ["5. Conformité légale", "Registre de veille, vérification des autorisations, évaluation de conformité. Décision si un écart légal bloquant existe."], ["6. Planification", "Politique, risques et opportunités, objectifs, programme environnemental, budget."], ["7. Maîtrise opérationnelle et urgences", "Consignes déchets, effluents, émissions, produits chimiques, énergie ; plan d'urgence et premier exercice."], ["8. Formation et mise en œuvre", "Formation des pilotes, sensibilisation de tous, 2 à 3 mois d'enregistrements réels."], ["9. Audit interne et revue de direction", "Audit complet selon ISO 19011, actions correctives, revue de direction. Décision : prêt ou pas pour l'organisme certificateur."], ["10. Accompagnement à la certification et maintien", "Préparation étapes 1 et 2, traitement des écarts, surveillance annuelle, transition 2026."]], "specifiques": [["Aspects significatifs cotés", "Chaque activité est analysée en situation normale, anormale et d'urgence, puis cotée avec une grille stable ; un aspect encadré par une obligation de conformité ou ayant fait l'objet d'une plainte est significatif d'office."], ["Conformité légale prouvée", "La norme exige de connaître ses obligations et de vérifier périodiquement qu'on les respecte. En Côte d'Ivoire, le nouveau Code de l'environnement (loi n° 2023-900) rend ce travail indispensable."], ["Maîtrise des rejets et déchets", "Effluents, fumées, déchets dangereux, carburants : chaque flux a une consigne, un responsable, une mesure et une preuve."], ["Situations d'urgence testées", "Déversement d'hydrocarbure, incendie avec eaux d'extinction, débordement de lagune : on prépare, on exerce, on corrige."], ["Cycle de vie et chaîne de valeur", "L'édition 2026 insiste sur l'amont (plantations, intrants, fournisseurs) et l'aval (transport, emballages, fin de vie) que l'entreprise influence."], ["Conditions environnementales", "Climat (chaleur, inondations, sécheresse), biodiversité, pollution et ressources en eau entrent dans l'analyse du contexte depuis 2024 et plus encore en 2026."]], "profils": [["P1 · Usine agro-industrielle", "Transformation cacao, café, cajou", "Effluents de lavage, chaudière, coques et emballages : beaucoup d'aspects, forte pression des acheteurs.", "Analyse environnementale initiale et évaluation de conformité"], ["P2 · Huilerie et usine d'hévéa", "Effluents à forte charge organique", "Les lagunes de traitement et les odeurs sont le premier risque légal et de voisinage.", "Bilan des effluents et plan de surveillance analytique"], ["P3 · PME logistique", "Flotte, entrepôts, atelier mécanique", "Carburant, huiles usagées, pneus, lavage des camions : impacts dispersés mais réels.", "Inventaire déchets dangereux et plan carburant"], ["P4 · Société coopérative", "Magasins, intrants, transport", "Stockage de produits phytosanitaires, emballages vides, sacs et camions : la coopérative peut bâtir sur ses acquis RA ou Fairtrade.", "Diagnostic croisé ISO 14001 / référentiel agricole"], ["P5 · Exportateur certifié qualité", "Déjà ISO 9001 ou 22000", "L'entreprise veut un système intégré QSE sans doubler les documents.", "Revue d'intégration et analyse d'écart 14001"]], "objections": [["Nous sommes une petite structure, ISO 14001 est pour les multinationales.", "La norme s'adapte à la taille. Une PME de 30 personnes peut avoir un système léger de quelques procédures et registres, piloté sur la plateforme."], ["L'environnement coûte cher et ne rapporte rien.", "Le suivi de l'eau, de l'énergie et des déchets révèle souvent des pertes évitables ; la conformité évite fermetures et sanctions. Les gains se mesurent avec vos propres compteurs."], ["Nous avons déjà Rainforest Alliance ou Fairtrade.", "Ces référentiels couvrent surtout la production agricole. ISO 14001 couvre l'usine, le magasin, le transport et le système de management. Les preuves communes sont réutilisées."], ["Nos autorisations ne sont pas à jour, l'audit va nous bloquer.", "C'est justement le premier chantier. On identifie les écarts, on engage les démarches auprès de l'ANDE ou du CIAPOL ; on ne cache rien à l'auditeur."], ["La norme vient de changer, il vaut mieux attendre.", "ISO 14001:2026 est publiée. Construire directement selon 2026 évite une double transition ; la période de transition laisse le temps mais pas de raison d'attendre."], ["Nous n'avons personne pour s'en occuper.", "GEC-CI forme un responsable environnement interne et l'outille. Il faut du temps réservé : c'est un coût réel, à prévoir dès le départ."]], "livre": ["Un système documenté complet et adapté à votre taille : politique, registres des aspects et de la conformité, procédures opérationnelles, plan d'urgence.", "Des équipes formées et un audit interne réalisé, avec revue de direction et actions correctives suivies.", "Un tableau de bord environnemental (eau, énergie, déchets, effluents, conformité) suivi sur la plateforme GEC-CI Pro."], "refuse": ["Promettre un certificat ou une date de certificat : seul l'organisme certificateur accrédité décide.", "Fabriquer des enregistrements ou préparer vos équipes à cacher un rejet ou un incident à l'auditeur ou à l'administration."], "premier_pas": "Un diagnostic express de 45 minutes sur site ou à distance, suivi d'une visite terrain pour voir vos rejets, vos déchets et vos autorisations. Vous recevez une carte d'écarts article par article et une proposition par lots."}, "points": [["1", "Numérotation exacte ISO 14001:2026 (6.1.4, 6.3, 9.2.2, 9.3)", "Texte officiel (CODINORM / ISO)", ""], ["2", "Calendrier IAF de transition, fin des audits selon 2015", "Organisme certificateur / IAF", ""], ["3", "Publication au JO, entrée en vigueur et transition de la loi n° 2023-900", "Ministère chargé de l'environnement", ""], ["4", "Objet du décret n° 2024-595 et statut du décret n° 96-894", "ANDE", ""], ["5", "Classement de chaque activité (EIE, constat d'impact, installation classée)", "ANDE, CIAPOL", ""], ["6", "Valeurs limites de rejets et d'émissions applicables", "CIAPOL, autorisation du site", ""], ["7", "Agrément des collecteurs de déchets, rôle de l'ANAGED, modalités de la REP", "Ministère, ANAGED", ""], ["8", "Autorisation des prélèvements d'eau (Code de l'eau)", "Ministère chargé de l'eau", ""], ["9", "Durées de conservation réglementaires des enregistrements", "Textes applicables", ""], ["10", "Frais d'examen, taxes et redevances environnementales", "ANDE, CIAPOL", ""], ["11", "Prix de la norme, tarifs des organismes certificateurs, accréditations", "CODINORM, organismes", ""], ["12", "Dates d'application de l'EUDR", "Commission européenne, acheteurs", ""], ["13", "Numéros d'urgence à afficher", "Autorités locales", ""], ["14", "Textes cités par sources secondaires (88-651, 2012-1047, 2014-390, 98-505, arrêté 2008, arrêté 0462)", "Journal officiel", ""]], "chapitres": {"4": "Contexte", "5": "Leadership", "6": "Planification", "7": "Support", "8": "Activités opérationnelles", "9": "Évaluation des performances", "10": "Amélioration"}};window.__LOGO="data:image/webp;base64,UklGRvw/AABXRUJQVlA4IPA/AABw4wCdASq8AsAAPmEqkUWkIqQUGh6MQAYEszdsgF23OaNIVAb+U7JDv/kP8j+2P9697O0P4D++/q7+2fuB8xu9rtDze+av+h/hfy4+cH+e/4n+Q91H9V/wn/U/wH76/QH+p/+//vX+W9t31Q/4L/t+oP+s/4z9zvd5/3n7Le7/+7f7X9tf9p8hH9K/2n/67E392/YY/cT//+vD+5Xw1/1n/kfud7Tv/t7PToz+zv9+/HD3z/G/3L/N/3L9qv3J8y/2j+K/u/7V+x/YT6mvyb7kfpP8J+3v+K/br5q/3f5VeePyp/zPUI/JP5r/gP7n+6P+R/czkapzvUC9g/nn+7/wH7yf5H0r/8X/Hep/2S/235qf5b7AP6D/V/97/e/3m/xvtU+DR6x7An89/wH/a/03+K/db6Z/7L/2f7j8vvcx+ef6b/1/7X4Df5r/av+l/iP3x/0vzy+0P94PZu/dlF6+t29DYhh19bwJyTJY/n9hrDveu5bxf72NBX/r19yUiHPNcIpUfbJJiVGEr4Yj4pTucCanZ97vTJ92HprcZg2b7KPomgL/0CmdfRwc0wksZ3fa45F/c5E+fB0rS0bUUv/axFX41VLl6YyRu2GGfJw/VJVnvqBBrVHIvMDHVr8A9Lyydv+bcXLoNCSrhSZFybMmj4flX/vSb9LZyUXF67mWe5lULK0z77IaQYAeDrsa5zRsp45GDbogu8VrHdeWw9l4wdY7ktvRMG/XalqOEv+GosJTBBOWUk9lthfe0CaJRe5dAvMcxJeuo91AmZ8WdQ9eCVtcNT3/BPHVsLJDt0IwMIzj/bg1dE2hlA01Q4vzxncKLgUqdXdEjWF3/YblP5ubOlcuyjqHS19aEIQV/URiXZ28fRuGkwamXo1iO7/fTxx7+XLC3Cw9YTnHgtFDhilSf6CwUws <script>/* IA GECI — Module Organisation, Personnel, Territoires, Preuves (commun à la console et à toutes les plateformes GEC-CI).
   Toutes les écritures passent par des fonctions serveur (geci_*) qui contrôlent les droits ; l'interface ne fait qu'afficher.
   Aucun employé n'est créé automatiquement. Aucune validation n'est faite par l'IA. */
window.GECI_ORG = (() => {
  const PROJ = { RA: 'Rainforest Alliance', FAIRTRADE: 'Fairtrade', ISO: 'Normes ISO', RSPO: 'RSPO — palmier à huile', HEVEA: 'Hévéas' };
  const PREFS = { RA: ['RAINFOREST_ALLIANCE'], FAIRTRADE: ['FAIRTRADE'], ISO: ['ISO_9001', 'ISO_14001', 'ISO_45001', 'ISO_22000'], RSPO: ['RSPO'], HEVEA: ['HEVEA'] };
  const FCT = { PILOTAGE: 'Responsable de pilotage', TECHNIQUE: 'Responsable technique', OPERATIONNEL: 'Responsable opérationnel' };
  const EV_L = { IMPORTEE: 'Importée', A_CLASSER: 'À classer', A_VERIFIER: 'À vérifier', VALIDEE: 'Validée', REJETEE: 'Rejetée', ARCHIVEE: 'Archivée' };
  const EV_K = { IMPORTEE: '', A_CLASSER: 'warn', A_VERIFIER: 'info', VALIDEE: 'ok', REJETEE: 'bad', ARCHIVEE: '' };
  const CATS = ['PHOTO', 'DOCUMENT', 'RAPPORT', 'FORMULAIRE', 'REGISTRE', 'VIDEO', 'AUDIO', 'CARTOGRAPHIE', 'FINANCIER', 'CONTRAT', 'AUTRE'];
  const ROLE_EQ = { CHEF_EQUIPE: 'Chef d’équipe', CONSULTANT: 'Consultant', AUDITEUR: 'Auditeur', FORMATEUR: 'Formateur', AGENT: 'Agent', CARTOGRAPHE: 'Cartographe', AUTRE: 'Autre' };
  const ACT_L = { PLANIFIEE: 'Planifiée', EN_COURS: 'En cours', REALISEE: 'Réalisée', ANNULEE: 'Annulée' };
  const MAXF = 52428800;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const dfr = (d) => d ? new Date(d).toLocaleDateString('fr-FR') : '—';
  const dtfr = (d) => d ? new Date(d).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
  const oct = (n) => { n = Number(n || 0); return n < 1024 ? n + ' o' : n < 1048576 ? (n / 1024).toFixed(1) + ' Ko' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' Mo' : (n / 1073741824).toFixed(2) + ' Go'; };
  const chip = (t, k = '') => `<span class="go-chip ${k}">${esc(t)}</span>`;
  const nz = (v) => (v === '' || v == null) ? null : v;
  const opt = (pairs, cur, empty) => (empty != null ? `<option value="">${esc(empty)}</option>` : '') + pairs.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(cur ?? '') ? 'selected' : ''}>${esc(l)}</option>`).join('');
  const fd = (f) => { const o = {}; new FormData(f).forEach((v, k) => { o[k] = typeof v === 'string' ? v.trim() : v; }); f.querySelectorAll('input[type=checkbox]').forEach(c => o[c.name] = c.checked); return o; };
  const clean = (m) => String(m || '').replace(/^GECI-ACCES-REFUSE : /, 'Accès refusé : ').replace(/^(GECI-[A-Z-]+) : /, '$1 · ').replace(/^ACCES-REFUSE/, 'Accès refusé');
  const catOf = (mime, name) => /^image\//.test(mime) ? 'PHOTO' : /^video\//.test(mime) ? 'VIDEO' : /^audio\//.test(mime) ? 'AUDIO' : /pdf|word|opendocument\.text/.test(mime) ? 'DOCUMENT' : /sheet|excel|csv/.test(mime) || /\.(xlsx?|csv|ods)$/i.test(name) ? 'REGISTRE' : /\.(kml|kmz|geojson|gpx|shp)$/i.test(name) ? 'CARTOGRAPHIE' : 'AUTRE';
  const safeName = (n) => n.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9._-]+/g, '_').replace(/_+/g, '_').slice(-80) || 'fichier';
  async function sha256Hex(buf) { const h = await crypto.subtle.digest('SHA-256', buf); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }

  const CSS = `.go{font-size:14px;line-height:1.5;color:#0F1B2D}.go *{box-sizing:border-box}

  @media (max-width:640px){.go-f{grid-template-columns:1fr}}`;

  function mount(el, sb, cfg = {}) {
    if (!document.getElementById('go-css')) { const s = document.createElement('style'); s.id = 'go-css'; s.textContent = CSS; document.head.appendChild(s); }
    const C = { project: cfg.project || null, lockProject: !!cfg.project, tab: cfg.tab || 'dash', toast: cfg.toast, consoleUrl: cfg.consoleUrl };
    const st = { uid: null, roles: new Set(), me: null, steer: [], zm: [], teams: [], areas: [], emps: [], cache: {} };
    const has = (...r) => r.some(x => st.roles.has(x));
    const isDir = () => has('SUPER_ADMIN', 'DIRECTEUR');
    const isRH = () => isDir() || has('RESPONSABLE_RH');
    const manages = (p) => isDir() || st.steer.some(s => s.project_code === p && ['PILOTAGE', 'OPERATIONNEL'].includes(s.fonction));
    const inSteer = (p) => isDir() || st.steer.some(s => s.project_code === p);
    const zmTeams = () => new Set(st.teams.filter(t => st.zm.some(z => z.id === t.zone_manager_id)).map(t => t.id));
    const say = (t, bad) => { if (C.toast) return C.toast(t, bad); const m = el.querySelector('#go-msg'); if (m) { m.className = 'go-msg ' + (bad ? 'bad' : 'ok'); m.textContent = t; m.hidden = false; setTimeout(() => m.hidden = true, bad ? 9000 : 4000); } };
    async function rpc(fn, args = {}, ok) { const { data, error } = await sb.rpc(fn, args); if (error) { say(clean(error.message), true); throw error; } if (ok) say(ok); return data; }
    async function sel(t, cols = '*', f = (q) => q) { const { data, error } = await f(sb.from(t).select(cols)); if (error) { say(clean(error.message), true); return []; } return data || []; }
    const empName = (id) => { const e = st.emps.find(x => x.id === id); return e ? `${e.prenoms} ${e.nom}` : '—'; };
    const areaName = (id) => st.areas.find(a => a.id === id)?.nom || '—';
    const areaOpts = (cur, empty = 'Choisir une zone') => opt(st.areas.filter(a => a.actif && a.type !== 'PAYS' && a.type !== 'GROUPE_OPERATIONNEL').sort((a, b) => a.nom.localeCompare(b.nom, 'fr')).map(a => [a.id, a.nom + (a.type === 'ZONE_INDUSTRIELLE' ? ' (ZI)' : a.type === 'VILLE' ? '' : ' · ' + a.type.toLowerCase().replace(/_/g, ' '))]), cur, empty);
    const empOpts = (cur, empty = 'Choisir un employé') => opt(st.emps.filter(e => e.statut === 'ACTIF').sort((a, b) => (a.nom + a.prenoms).localeCompare(b.nom + b.prenoms, 'fr')).map(e => [e.id, `${e.nom} ${e.prenoms} — ${e.fonction} (${e.matricule})`]), cur, empty);
    const projOpts = (cur) => opt(Object.entries(PROJ), cur);

    async function loadBase() {
      const { data: u } = await sb.auth.getUser(); st.uid = u?.user?.id || null;
      const { data: me } = await sb.rpc('geci_me'); st.me = me; st.roles = new Set((me?.roles || []).filter(r => !r.client_id).map(r => r.role));
      [st.emps, st.areas] = await Promise.all([sel('geci_employees', '*'), sel('geci_areas', '*')]);
      st.myEmp = st.emps.find(e => e.user_id === st.uid && e.statut === 'ACTIF') || null;
      const [sm, zms, teams] = await Promise.all([
        sel('geci_steering_members', 'id,fonction,employee_id,date_fin,date_debut,intitule,steering_id,geci_steering_teams(project_code)'),
        sel('geci_zone_managers', '*'), sel('geci_teams', '*')]);
      st.allSteer = sm.map(x => ({ ...x, project_code: x.geci_steering_teams?.project_code }));
      st.allZm = zms; st.teams = teams;
      st.steer = st.myEmp ? st.allSteer.filter(x => x.employee_id === st.myEmp.id && !x.date_fin) : [];
      st.zm = st.myEmp ? zms.filter(x => x.employee_id === st.myEmp.id && !x.date_fin) : [];
      const n = await sel('geci_notifications', 'id', q => q.eq('lu', false)); st.unread = n.length;
    }

    const TABS = () => [
      ['dash', 'Tableau de bord', true], ['org', 'Organisation', true], ['missions', 'Missions et activités', true], ['preuves', 'Preuves et import', true],
      ['personnel', 'Personnel (RH)', true], ['zones', 'Zones et sites', true], ['notifs', 'Notifications', true], ['stockage', 'Stockage', has('SUPER_ADMIN', 'DIRECTEUR', 'RESPONSABLE_INFORMATIQUE', 'GESTIONNAIRE_DOCUMENTAIRE')]];

    async function show(tab) {
      C.tab = tab;
      el.innerHTML = `<div class="go"><div id="go-msg" class="go-msg" hidden></div>
        <div class="go-row" style="justify-content:space-between;margin:0 0 10px"><div><div class="go-eyebrow">IA GECI — Organisation GEC-CI</div>
        <div class="go-muted" style="font-size:12.5px">${C.lockProject ? 'Projet ' + esc(PROJ[C.project]) : 'Tous les projets'} · ${st.myEmp ? 'Vous : ' + esc(st.myEmp.prenoms + ' ' + st.myEmp.nom) : 'Compte non relié à une fiche du personnel'}</div></div>
        ${C.lockProject ? '' : `<label class="go-row go-muted" style="font-size:12.5px">Projet <select class="go-in" id="go-proj" style="width:auto">${opt(Object.entries(PROJ), C.project, 'Tous les projets')}</select></label>`}</div>
        <nav class="go-tabs">${TABS().filter(t => t[2]).map(([k, l]) => `<button data-t="${k}" class="${k === tab ? 'on' : ''}">${l}${k === 'notifs' && st.unread ? `<span class="n">${st.unread}</span>` : ''}</button>`).join('')}</nav>
        <div id="go-body"><p class="go-muted">Chargement…</p></div></div>`;
      el.querySelector('.go-tabs').onclick = (e) => { const b = e.target.closest('button[data-t]'); if (b) show(b.dataset.t); };

    function ask(title, withText, required = true) {
      return new Promise((res) => { const o = document.createElement('div');

        o.innerHTML = `<div class="go" style="background:#fff;border-radius:10px;max-width:440px;width:100%;padding:16px;border-top:4px solid #C9A227"><p style="margin:0 0 10px;font-weight:600">${esc(title)}</p>${withText ? '<textarea class="go-in" rows="3" id="ask-t"></textarea>' : ''}<div class="go-row" style="justify-content:flex-end;margin-top:10px"><button class="go-btn" id="ask-n">Annuler</button><button class="go-btn p" id="ask-y">Confirmer</button></div></div>`;

        o.querySelector('#ask-n').onclick = () => end(null);
        o.querySelector('#ask-y').onclick = () => { if (!withText) return end(true); const v = t.value.trim(); if (required && !v) { t.style.borderColor = '#B42318'; return; } end(v || ''); }; });
    }
    const reload = async () => { await loadBase(); show(C.tab); };
    const V = {};

    /* ---------- TABLEAU DE BORD (par niveau) ---------- */
    V.dash = async (b) => {
      if (!st.roles.size) { b.innerHTML = `<div class="go-sec"><b>Aucun rôle interne GEC-CI sur ce compte.</b><p class="go-note">L’organisation (équipes, zones, personnel, preuves internes) est réservée au personnel de GEC-CI. Demandez un rôle à la Direction${C.consoleUrl ? ` depuis la <a href="${C.consoleUrl}" target="_blank" rel="noopener">console IA GECI ↗</a>` : ''}.</p></div>`; return; }
      let d; try { d = await rpc('geci_org_dashboard', { p_project: C.project }); } catch (e) { b.innerHTML = `<div class="go-sec">${esc(clean(e.message))}</div>`; return; }
      const P = d.projets || [];
      const tot = (f) => P.reduce((a, p) => a + f(p), 0);
      const eqs = P.flatMap(p => p.equipes.map(t => ({ ...t, projet: p.projet })));
      const sous = eqs.filter(t => t.effectif < t.effectif_cible);
      const niveau = isDir() ? 'Direction générale' : st.steer.length ? 'Pilotage (siège)' : st.zm.length ? 'Responsable de zone' : st.myEmp ? 'Collaborateur' : 'Personnel';
      const myTeams = st.myEmp ? await sel('geci_team_members', 'id,team_id,role_equipe,statut,date_debut', q => q.eq('employee_id', st.myEmp.id).is('date_fin', null)) : [];
      const myActs = st.myEmp ? await sel('geci_activity_assignments', 'activity_id,role,geci_activities(titre,statut,date_prevue,service_code)', q => q.eq('employee_id', st.myEmp.id)) : [];
      b.innerHTML = `<div class="go-sec"><h3>Vue ${esc(niveau)} <span class="go-muted" style="font-size:12px;font-weight:400">Données réelles, filtrées par le serveur selon vos droits</span></h3>

          <div class="go-tile ${tot(p => p.pilotage_postes_vacants) ? 'alert' : ''}"><div class="v">${tot(p => p.pilotage_postes_vacants)}</div><div class="l">Postes de pilotage vacants</div></div>
          <div class="go-tile"><div class="v">${eqs.length}</div><div class="l">Équipes opérationnelles</div></div>

          <div class="go-tile"><div class="v">${tot(p => p.preuves.A_VERIFIER || 0)}</div><div class="l">Preuves à vérifier</div></div>
          <div class="go-tile"><div class="v">${tot(p => p.preuves.A_CLASSER || 0)}</div><div class="l">Preuves à classer</div></div>
          <div class="go-tile"><div class="v">${d.zones_sans_equipe}</div><div class="l">Villes / ZI sans équipe</div></div>
          <div class="go-tile"><div class="v">${d.notifications_non_lues}</div><div class="l">Notifications non lues</div></div>
        </div>
        ${P.length ? `<div class="go-tw"><table><thead><tr><th>Projet</th><th>Pilotage (3)</th><th>Resp. de zone</th><th>Équipes</th><th>Effectif réel / cible</th><th>Missions actives</th><th>En retard</th><th>Preuves à vérifier</th></tr></thead><tbody>
        ${P.map(p => { const ef = p.equipes.reduce((a, t) => a + Number(t.effectif), 0), ci = p.equipes.reduce((a, t) => a + Number(t.effectif_cible), 0);
          return `<tr><td><b>${esc(p.nom)}</b></td><td>${3 - p.pilotage_postes_vacants} / 3 ${p.pilotage_postes_vacants ? chip(p.pilotage_postes_vacants + ' vacant(s)', 'warn') : chip('complet', 'ok')}</td><td>${p.responsables_zone.length}</td><td>${p.equipes.length}</td>

        ${sous.length ? `<h4>Équipes à compléter</h4><p class="go-note">${sous.map(t => `${esc(t.code)} (${esc(t.zone)}) : ${t.effectif}/${t.effectif_cible}${t.propositions ? ' · ' + t.propositions + ' proposition(s) en attente' : ''}`).join(' · ')}</p>` : ''}

          ${myActs.length ? `<div class="go-tw"><table><thead><tr><th>Activité</th><th>Prévue</th><th>Statut</th></tr></thead><tbody>${myActs.map(a => `<tr><td>${esc(a.geci_activities?.titre)}</td><td>${dfr(a.geci_activities?.date_prevue)}</td><td>${chip(ACT_L[a.geci_activities?.statut] || '', a.geci_activities?.statut === 'REALISEE' ? 'ok' : '')}</td></tr>`).join('')}</tbody></table></div>` : ''}</div>` : ''}`;
    };

    /* ---------- ORGANISATION : pilotage 3 → responsables de zone → équipes 13+ ---------- */
    V.org = async (b) => {
      const projs = C.project ? [C.project] : Object.keys(PROJ);
      const tm = await sel('geci_team_members', '*', q => q.is('date_fin', null).neq('statut', 'REFUSEE'));
      const html = projs.map(p => {
        const sm = st.allSteer.filter(x => x.project_code === p && !x.date_fin);
        const zms = st.allZm.filter(x => x.project_code === p && !x.date_fin);
        const tms = st.teams.filter(t => t.project_code === p && t.statut !== 'DISSOUTE');

        return `<div class="go-sec"><h3>${esc(PROJ[p])} <span class="go-row">${can ? `<button class="go-btn sm" data-rec="${p}">Recommandation d’affectation</button>` : ''}</span></h3>

        ${zms.length ? `<div class="go-tw"><table><thead><tr><th>Responsable</th><th>Zone</th><th>Depuis</th><th>Équipes</th>${can ? '<th></th>' : ''}</tr></thead><tbody>${zms.map(z => `<tr><td>${esc(empName(z.employee_id))}</td><td>${esc(areaName(z.area_id))}</td><td>${dfr(z.date_debut)}</td><td>${tms.filter(t => t.zone_manager_id === z.id).map(t => esc(t.code)).join(', ') || '—'}</td>${can ? `<td><button class="go-btn sm bad" data-zmend="${z.id}">Mettre fin</button></td>` : ''}</tr>`).join('')}</tbody></table></div>` : '<p class="go-note">Aucun responsable de zone nommé.</p>'}
        ${can ? `<details><summary>Nommer un responsable de zone</summary><form class="go-f" data-zm="${p}"><label>Employé<select class="go-in" name="e" required>${empOpts(null)}</select></label><label>Zone (ville ou zone industrielle)<select class="go-in" name="a" required>${areaOpts(null)}</select></label><label>Début<input class="go-in" type="date" name="d"></label><button class="go-btn p">Nommer</button></form></details>` : ''}
        <h4>Équipes opérationnelles (effectif cible configurable, 13 par défaut)</h4>
        ${tms.length ? tms.map(t => { const mem = tm.filter(m => m.team_id === t.id); const val = mem.filter(m => m.statut === 'VALIDEE'), prop = mem.filter(m => m.statut === 'PROPOSEE');

        ${can ? `<details><summary>Créer une équipe ${esc(p)}</summary><form class="go-f" data-tnew="${p}"><label>Nom<input class="go-in" name="n" required placeholder="Équipe ${esc(p)} Soubré 1"></label><label>Zone<select class="go-in" name="a" required>${areaOpts(null)}</select></label>

          <label class="w">Objectifs<input class="go-in" name="o"></label><button class="go-btn p">Créer l’équipe</button></form></details>` : ''}

      b.innerHTML = (st.emps.length ? '' : `<div class="go-sec"><b>Aucun employé enregistré.</b><p class="go-note">Commencez par l’onglet « Personnel (RH) » : saisissez ou importez les fiches réelles du personnel de GEC-CI. Aucune fiche n’est créée automatiquement.</p></div>`) + html;

    /* ---------- MISSIONS ET ACTIVITÉS ---------- */

          <h4>Activités (${A.length})</h4>
          ${A.length ? `<div class="go-tw"><table><thead><tr><th>Prestation</th><th>Activité</th><th>Prévue</th><th>Affectés</th><th>Statut</th><th></th></tr></thead><tbody>${A.map(a => `<tr><td>${esc(svc.find(s => s.code === a.service_code)?.libelle || a.service_code)}</td><td>${esc(a.titre)}</td><td>${dfr(a.date_prevue)}</td>
            <td>${(a.geci_activity_assignments || []).map(x => esc(empName(x.employee_id))).join(', ') || '—'}${canAct ? `<form class="go-row" data-aass="${a.id}" style="margin-top:4px"><select class="go-in" name="e" style="max-width:200px">${empOpts(null)}</select><button class="go-btn sm">Affecter</button></form>` : ''}</td>

            <td><select class="go-in" data-ast="${a.id}" style="width:auto">${opt(Object.entries(ACT_L), a.statut)}</select></td></tr>`).join('')}</tbody></table></div>` : '<p class="go-note">Aucune activité.</p>'}
          ${canAct && !['CLOTUREE', 'ANNULEE'].includes(m.statut) ? `<form class="go-f" data-anew="${m.id}"><label>Prestation<select class="go-in" name="s">${opt(svc.filter(s => s.projets.includes(p)).map(s => [s.code, s.libelle]))}</select></label><label>Activité<input class="go-in" name="t" required placeholder="Inspection interne de 20 exploitations"></label><label>Date prévue<input class="go-in" type="date" name="d"></label><button class="go-btn p">Planifier</button></form>` : ''}

      b.querySelectorAll('form[data-link]').forEach(f => f.onsubmit = async (e) => { e.preventDefault(); await rpc('geci_mission_link', { p_mission: f.dataset.link, p_team: nz(fd(f).t), p_area: null, p_site: null }, 'Mission confiée'); show('missions'); });

        try { await rpc('geci_activity_status', { p_activity: s.dataset.ast, p_statut: s.value, p_motif: m }, 'Statut mis à jour'); } catch (e) { } show('missions'); });

    /* ---------- PREUVES : import individuel et groupé ---------- */
    V.preuves = async (b) => {
      const P = C.project || st.cache.evP || 'RA';

      const [ms, evs, batches] = await Promise.all([
        sel('geci_missions', 'id,code,objet,referentiel,team_id', q => q.in('referentiel', refs).not('statut', 'in', '(CLOTUREE,ANNULEE)')),
        sel('geci_evidence_records', '*, geci_files(path,nom_original,mime,taille,sha256)', q => q.eq('project_code', P).order('created_at', { ascending: false }).limit(500)),

        <p class="go-note">Un ou plusieurs fichiers à la fois (photos, PDF, tableurs, vidéos, audio, cartographies), 50 Mo maximum par fichier. Chaque fichier reçoit une empreinte SHA-256 ; un contenu déjà importé dans le projet est signalé comme doublon. Les métadonnées communes s’appliquent à tout le lot et restent modifiables preuve par preuve.</p>

          <label>Collaborateur concerné<select class="go-in" name="e">${empOpts(null, 'Aucun')}</select></label>

        </form>

        <div class="go-tw"><table><thead><tr><th></th><th>Code</th><th>Titre</th><th>Fichier</th><th>Exigence</th><th>Rattachement</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="ev-t">
        ${evs.filter(r => (!filt || r.statut === filt) && (!st.cache.evB || r.batch_id === st.cache.evB)).map(r => { const mine = r.created_by === st.uid; return `<tr><td>${['VALIDEE', 'ARCHIVEE'].includes(r.statut) ? '' : `<input type="checkbox" data-sel="${r.id}">`}</td><td class="go-mono">${esc(r.code)}</td><td>${esc(r.titre)}<div class="go-muted" style="font-size:11.5px">${esc(r.categorie)}${r.suggestion_ia ? ' · suggestion IA : ' + esc(JSON.stringify(r.suggestion_ia)) : ''}</div></td>
          <td>${esc(r.geci_files?.nom_original)}<div class="go-muted go-mono">${oct(r.geci_files?.taille)} · ${esc((r.geci_files?.sha256 || '').slice(0, 10))}…</div></td><td>${esc(r.exigence_ref || '—')}</td>
          <td style="font-size:12px">${r.mission_id ? esc(ms.find(m => m.id === r.mission_id)?.code || 'mission') : ''} ${r.team_id ? esc(st.teams.find(t => t.id === r.team_id)?.code || '') : ''} ${r.area_id ? esc(areaName(r.area_id)) : ''}</td>
          <td>${chip(EV_L[r.statut], EV_K[r.statut])}${r.motif_decision ? `<div class="go-muted" style="font-size:11.5px">${esc(r.motif_decision)}</div>` : ''}${r.verifie_le ? `<div class="go-muted" style="font-size:11.5px">${dtfr(r.verifie_le)}</div>` : ''}</td>

      const ps = b.querySelector('#ev-p'); if (ps) ps.onchange = () => { st.cache.evP = ps.value; show('preuves'); };

      b.querySelector('#ev-bulk').onsubmit = async (e) => { e.preventDefault(); const ids = sels(); if (!ids.length) return say('Sélectionnez au moins une preuve.', true); const d = fd(e.target); const patch = {};

      b.querySelectorAll('[data-rej]').forEach(x => x.onclick = async () => { const m = await ask('Motif du rejet (obligatoire) :', true); if (!m) return; await rpc('geci_evidence_decide', { p_id: x.dataset.rej, p_decision: 'REJETEE', p_motif: m }, 'Preuve rejetée'); show('preuves'); });

    async function runImport(P, files) {
      if (!files.length) return;
      const q = el.querySelector('#ev-q'); const meta = fd(el.querySelector('#ev-meta'));
      const rows = files.map((f, i) => ({ i, f, st: f.size > MAXF ? 'ERREUR' : 'EN ATTENTE', msg: f.size > MAXF ? 'Fichier supérieur à 50 Mo : le compresser ou le scinder' : '' }));
      let done = 0;
      const paint = () => { const ok = rows.filter(r => r.st === 'IMPORTÉE').length, du = rows.filter(r => r.st === 'DOUBLON').length, er = rows.filter(r => r.st === 'ERREUR').length;
        q.innerHTML = `<div class="go-row" style="justify-content:space-between"><b>${done}/${rows.length} traité(s)</b><span class="go-muted">${ok} importée(s) · ${du} doublon(s) · ${er} échec(s)</span></div><div class="go-bar"><i style="width:${Math.round(done / rows.length * 100)}%"></i></div>
        <div class="go-tw" style="max-height:280px;overflow:auto;margin-top:8px"><table><thead><tr><th>Fichier</th><th>Taille</th><th>État</th><th>Détail</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.f.name)}</td><td>${oct(r.f.size)}</td><td>${chip(r.st, r.st === 'IMPORTÉE' ? 'ok' : r.st === 'ERREUR' ? 'bad' : r.st === 'DOUBLON' ? 'warn' : 'info')}</td><td style="font-size:12px">${esc(r.msg)}</td></tr>`).join('')}</tbody></table></div>
        ${done === rows.length && er ? '<button class="go-btn sm" id="ev-retry" style="margin-top:8px">Relancer les fichiers en échec</button>' : ''}${done === rows.length ? ' <button class="go-btn sm p" id="ev-see" style="margin-top:8px">Voir le registre</button>' : ''}`;
        const rt = q.querySelector('#ev-retry'); if (rt) rt.onclick = () => runImport(P, rows.filter(r => r.st === 'ERREUR' && r.f.size <= MAXF).map(r => r.f));
        const se = q.querySelector('#ev-see'); if (se) se.onclick = () => show('preuves'); };
      done = rows.filter(r => r.st === 'ERREUR').length; paint();
      let batch = null;
      if (meta.lot || rows.length > 1) { try { batch = await rpc('geci_evidence_batch_create', { p_project: P, p_titre: meta.lot || ('Import du ' + new Date().toLocaleString('fr-FR')), p_mission: nz(meta.m) }); } catch (e) { rows.forEach(r => { if (r.st === 'EN ATTENTE') { r.st = 'ERREUR'; r.msg = clean(e.message); } }); done = rows.length; return paint(); } }
      const now = new Date(); const yy = now.getFullYear(), mm = String(now.getMonth() + 1).padStart(2, '0');
      const work = rows.filter(r => r.st === 'EN ATTENTE');
      const one = async (r) => {
        try {
          r.st = 'EMPREINTE'; paint(); const sha = await sha256Hex(await r.f.arrayBuffer());
          const path = `${P}/${yy}/${mm}/${sha}__${safeName(r.f.name)}`;
          r.st = 'ENVOI'; paint();
          const up = await sb.storage.from('geci-preuves').upload(path, r.f, { upsert: false, contentType: r.f.type || 'application/octet-stream' });
          let existed = false;
          if (up.error) { if (/exist|duplicate|409/i.test(up.error.message + (up.error.statusCode || ''))) existed = true; else throw up.error; }
          r.st = 'ENREGISTREMENT'; paint();
          const reg = await sb.rpc('geci_file_register', { p_path: path, p_nom: r.f.name, p_mime: r.f.type || null, p_taille: r.f.size, p_sha256: sha, p_project: P });
          if (reg.error) throw reg.error;
          const dup = reg.data.doublon_de || (existed ? reg.data.file_id : null);
          if (dup && !meta.dup) { r.st = 'DOUBLON'; r.msg = 'Contenu identique déjà importé dans ce projet : preuve non recréée'; return; }
          const ev = await sb.rpc('geci_evidence_create', { p_file: reg.data.file_id, p_titre: r.f.name.replace(/\.[^.]+$/, ''), p_categorie: meta.c || catOf(r.f.type || '', r.f.name), p_description: null,
            p_batch: batch, p_mission: nz(meta.m), p_team: nz(meta.t), p_employee: nz(meta.e), p_area: nz(meta.a), p_exigence: nz(meta.x), p_date: nz(meta.d), p_referentiel: nz(meta.r), p_suggestion: null });
          if (ev.error) throw ev.error;
          r.st = 'IMPORTÉE'; r.msg = meta.x ? 'À vérifier' : 'À classer (exigence à renseigner)';
        } catch (e) { r.st = 'ERREUR'; r.msg = clean(e.message || String(e)); }
        finally { done++; paint(); }
      };
      const pool = 3; let k = 0;
      await Promise.all(Array.from({ length: Math.min(pool, work.length) }, async () => { while (k < work.length) await one(work[k++]); }));
      say(`Import terminé : ${rows.filter(r => r.st === 'IMPORTÉE').length} importée(s), ${rows.filter(r => r.st === 'DOUBLON').length} doublon(s), ${rows.filter(r => r.st === 'ERREUR').length} échec(s)`, rows.some(r => r.st === 'ERREUR'));
    }

    }
    function parseCSV(txt) {
      const first = txt.split(/\r?\n/)[0] || ''; const sep = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
      const rows = []; let row = [], cur = '', q = false;
      for (let i = 0; i < txt.length; i++) { const c = txt[i];
        if (q) { if (c === '"') { if (txt[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
        else if (c === '"') q = true; else if (c === sep) { row.push(cur); cur = ''; } else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; } else if (c !== '\r') cur += c; }
      if (cur || row.length) { row.push(cur); rows.push(row); }

async function dl(name, text, type) {
  let D = null; try { D = window.claude?.use ? await window.claude.use('downloads') : null; } catch (e) { }
  if (D) { try { await D.save({ filename: name, data: '\ufeff' + text }); toast('Fichier enregistré : ' + name); } catch (e) { toast(e.code === 'declined' ? 'Téléchargement annulé.' : 'Téléchargement impossible ici (' + (e.code || e.message) + ').', e.code !== 'declined'); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast('Fichier téléchargé : ' + name);
}
const csvOf = (head, rows) => [head, ...rows].map(r => r.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(';')).join('\r\n');

const get = (c, id) => { const d = col(c)[id]; return d && !d._annule ? d : null; };
async function loadStore() {
  S.store = {};
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from('iso_docs').select('collection,id,data').eq('group_id', S.group.id).range(from, from + 999);
    if (error) throw error; data.forEach(r => col(r.collection)[r.id] = r.data); if (data.length < 1000) break;
  }
}
async function put(c, id, data) {
  if (!canEdit()) { toast('Lecture seule : votre rôle dans ce groupe ne permet pas de saisir.', true); throw new Error('ro'); }
  const prev = col(c)[id]; col(c)[id] = data;
  const { error } = await sb.from('iso_docs').upsert({ group_id: S.group.id, collection: c, id, data }, { onConflict: 'group_id,collection,id' });
  if (error) { col(c)[id] = prev; toast('Enregistrement refusé : ' + error.message, true); throw error; }
}
const merge = (c, id, patch) => put(c, id, { ...(get(c, id) || {}), ...patch, _maj: new Date().toISOString(), _par: S.user.email });
const cancel = (c, id) => put(c, id, { ...(col(c)[id] || {}), _annule: true, _annule_le: new Date().toISOString(), _par: S.user.email });

/* ---------- calculs ---------- */
const STATUTS = ['Conforme', 'Partiel', 'Non conforme', 'Non applicable', 'À évaluer'];
const stK = (s) => s === 'Conforme' ? 'ok' : s === 'Partiel' ? 'warn' : s === 'Non conforme' ? 'bad' : s === 'Non applicable' ? '' : 'info';
function matrixStats() {
  const r = { total: D.clauses.length, eval: 0, conf: 0, part: 0, nc: 0, na: 0, retard: 0 };
  D.clauses.forEach(c => { const m = get('matrice', c.code) || {}; const s = m.statut || 'À évaluer';
    if (s !== 'À évaluer') r.eval++; if (s === 'Conforme') r.conf++; if (s === 'Partiel') r.part++; if (s === 'Non conforme') r.nc++; if (s === 'Non applicable') r.na++;
    if (m.echeance && m.echeance < today && !['Conforme', 'Non applicable'].includes(s)) r.retard++; });
  r.taux = r.total - r.na ? Math.round(100 * (r.conf + 0.5 * r.part) / (r.total - r.na)) : 0;
  return r;
}
function diagStats() {
  const by = {}; let pts = 0, max = 0;
  D.clauses.forEach(c => { const m = get('matrice', c.code) || {}; const v = m.diag; if (v === undefined || v === '' || v === 'NA') return;
    by[c.chapitre] = by[c.chapitre] || { p: 0, m: 0 }; by[c.chapitre].p += +v; by[c.chapitre].m += 2; pts += +v; max += 2; });
  return { by, pct: max ? Math.round(100 * pts / max) : null, n: Object.values(by).reduce((a, x) => a + x.m / 2, 0) };
}
const isRegister = (d) => !['Manuel', 'Politique', 'Procédure'].includes(d.type);
const regRows = (code) => live('reg_' + code);

const docK = (s) => s === 'Approuvé' ? 'ok' : s === 'En revue' || s === 'En rédaction' ? 'warn' : 'bad';

PAGES.matrice = (m) => { setTimeout(() => { const b = $('#mcsv'); if (b) b.onclick = () => { dl(fname('matrice') + '.csv', csvOf(['Article', 'Titre', 'Statut', 'Note diagnostic', 'Preuve constatée', 'Écart', 'Action', 'Responsable', 'Échéance', 'Référence officielle'], D.clauses.map(c => { const x = get('matrice', c.code) || {}; return [c.code, c.titre, x.statut || 'À évaluer', x.diag ?? '', x.preuve || '', x.ecart || '', x.action || '', x.responsable || '', x.echeance || '', x.reference || '']; })), 'text/csv;charset=utf-8'); }; }, 0);

const COMP = [
  ['Base des exigences officielles', 'matrice', null, 'Référencement par numéro d’article ; texte officiel à acquérir (CODINORM / ISO).'],

  ['Programme de mise en œuvre', 'parcours', null], ['Plan documentaire', 'docs', null], ['Procédures nécessaires', 'docs', 'Procédure'],
  ['Formulaires et registres', 'registres', null], ['Indicateurs de performance', 'kpi', null], ['Plan de formation', 'docs', /formation|compétence|sensibilisation/i],
  ['Plan d’audit interne', 'docs', /audit interne|programme d.audit|audit/i], ['Gestion des non-conformités', 'docs', /non-conformit|non conformit|incident/i],
  ['Actions correctives', 'docs', /action.? corrective|actions correctives/i], ['Revue de direction', 'docs', /revue de direction/i],
  ['Préparation à l’audit de certification', 'parcours', null, 'Étapes finales du parcours et audit blanc.'], ['Plan de surveillance et d’amélioration', 'docs', /surveillance|amélioration|mesure/i],
  ['Gestion des modifications des normes', 'confirmer', null, 'Points à confirmer et veille de l’édition.'], ['Tableau de bord de conformité', 'dash', null],
  ['Base de connaissances et modèles sectoriels', 'manuel', null], ['Programme de maintien du système', 'docs', /maintien|veille|changement|modification/i],
];
function compState(c) {
  const [, page, rx] = c;
  if (rx) { const ds = rx === 'Procédure' ? D.documents.filter(d => d.type === 'Procédure') : D.documents.filter(d => rx.test(d.titre));
    if (!ds.length) return { s: 'Voir manuel', k: 'info', docs: [] };
    const st = ds.map(d => docState(d.code)); const a = st.filter(s => s === 'Approuvé').length;
    return { s: a === ds.length ? 'En place' : st.some(s => s !== 'À rédiger') ? `En cours (${a}/${ds.length})` : 'À faire', k: a === ds.length ? 'ok' : st.some(s => s !== 'À rédiger') ? 'warn' : 'bad', docs: ds }; }
  if (page === 'matrice') { const s = matrixStats(); return { s: `${s.eval}/${s.total} évalués`, k: s.eval === s.total ? 'ok' : s.eval ? 'warn' : 'bad' }; }
  if (page === 'diag') { const s = diagStats(); return { s: s.pct == null ? 'À faire' : `Fait (${s.pct} %)`, k: s.pct == null ? 'bad' : 'ok' }; }
  if (page === 'parcours') { const n = D.parcours.filter((_, i) => (get('parcours', String(i)) || {}).fait).length; return { s: `${n}/${D.parcours.length} étapes`, k: n === D.parcours.length ? 'ok' : n ? 'warn' : 'bad' }; }
  if (page === 'registres') { const r = D.documents.filter(isRegister); const u = r.filter(d => regRows(d.code).length).length; return { s: `${u}/${r.length} en service`, k: u === r.length ? 'ok' : u ? 'warn' : 'bad' }; }
  if (page === 'kpi') { const u = D.kpi.filter(k => Object.keys((get('kpi', k.code) || {}).valeurs || {}).length).length; return { s: `${u}/${D.kpi.length} alimentés`, k: u === D.kpi.length ? 'ok' : u ? 'warn' : 'bad' }; }
  if (page === 'confirmer') { const o = D.points.filter(p => (get('points', p[0]) || {}).statut !== 'Confirmé').length; return { s: o ? `${o} point(s) ouverts` : 'À jour', k: o ? 'warn' : 'ok' }; }
  return { s: 'Disponible', k: 'ok' };
}

function mdHtml(md) {
  const inl = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/(À CONFIRMER[^.;|]*)/g, '<span class="tag-conf">$1</span>');
  const L = md.split('\n'); let h = '', i = 0, toc = [];
  while (i < L.length) { const l = L[i];
    if (!l.trim()) { i++; continue; }
    let mm = /^(#{1,3}) (.*)/.exec(l);
    if (mm) { const id = 'h' + i; if (mm[1].length <= 2) toc.push([mm[1].length, mm[2], id]); h += `<h${mm[1].length} id="${id}">${inl(mm[2])}</h${mm[1].length}>`; i++; continue; }
    if (l.startsWith('|')) { const rows = []; while (i < L.length && L[i].startsWith('|')) rows.push(L[i++]); const sp = (r) => r.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map(c => c.trim());
      h += `<div class="tw"><table><thead><tr>${sp(rows[0]).map(c => `<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(2).map(r => `<tr>${sp(r).map(c => `<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; continue; }
    if (/^[-*] /.test(l)) { h += '<ul>'; while (i < L.length && /^[-*] /.test(L[i])) h += `<li>${inl(L[i++].slice(2))}</li>`; h += '</ul>'; continue; }
    if (/^\d+\. /.test(l)) { h += '<ol>'; while (i < L.length && /^\d+\. /.test(L[i])) h += `<li>${inl(L[i++].replace(/^\d+\. /, ''))}</li>`; h += '</ol>'; continue; }
    if (l.startsWith('> ')) { h += `<blockquote>${inl(l.slice(2))}</blockquote>`; i++; continue; }
    h += `<p>${inl(l)}</p>`; i++; }
  return { h, toc };
}
