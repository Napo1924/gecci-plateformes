:root{
  --navy:#0A1628; --gold:#C9A227; --gold-ink:#8A6B0E; --norm:#B7791F;
  --bg:#F1F4F8; --surface:#FFFFFF; --surface2:#F6F8FB; --fg:#0F1B2D; --muted:#5A6B83; --line:#DCE3EC;
  --accent:#1D5FA8; --accent-bg:#E6EFFA;
  --ok:#0E7A4C; --ok-bg:#E1F4EA; --warn:#9A5B00; --warn-bg:#FFF0D4; --bad:#B42318; --bad-bg:#FDE7E5;
  --rail-fg:#C8D4E5; --rail-muted:#7F91AD;
  --f-ui:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Century Schoolbook","GEC Schola",Georgia,serif;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111F; --surface:#0F1D33; --surface2:#132440; --fg:#E6ECF5; --muted:#93A4BD; --line:#22385A;
  --accent:#7DB3F0; --accent-bg:#16304F; --gold-ink:#E2C15A;
  --ok:#5CD39A; --ok-bg:#0E3326; --warn:#F1B957; --warn-bg:#3A2A0C; --bad:#FF8A80; --bad-bg:#3D1512; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111F; --surface:#0F1D33; --surface2:#132440; --fg:#E6ECF5; --muted:#93A4BD; --line:#22385A;
  --accent:#7DB3F0; --accent-bg:#16304F; --gold-ink:#E2C15A;
  --ok:#5CD39A; --ok-bg:#0E3326; --warn:#F1B957; --warn-bg:#3A2A0C; --bad:#FF8A80; --bad-bg:#3D1512; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;margin:0}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:252px 1fr;min-height:100%}
.rail{background:var(--navy);color:var(--rail-fg);padding:16px 12px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow:auto}
.rail img{width:100%;border-radius:6px}
.rail .norm{border-left:4px solid var(--norm);padding:6px 10px;background:#13284A;border-radius:4px}
.rail .norm b{display:block;color:#fff;font-size:15px}
.rail .norm span{font-size:11.5px;color:var(--rail-muted)}
.rail .who{font-size:12px;color:var(--rail-muted);border-top:1px solid #1E3354;padding-top:10px}
.rail .who b{color:#fff;display:block;font-weight:600}
.rail a{color:#D9B23A;font-weight:600;text-decoration:none;font-size:12.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--rail-muted);margin:10px 8px 4px}
.nav button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.nav button:hover{background:#13284A}
.nav button.on{background:#13284A;color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav button:focus-visible{outline:2px solid var(--gold)}
.nav .cnt{font-size:11px;background:#1E3354;border-radius:99px;padding:0 7px;color:#fff}
.main{min-width:0;padding-block:22px 40px;padding-inline:28px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:22px;font-weight:600}
.top p{margin:4px 0 0;color:var(--muted);font-family:var(--f-read);font-size:15px;max-width:72ch}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px;min-width:0}
.sec>h2{font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sec.norm{border-top:3px solid var(--norm)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.grid{display:grid;gap:12px} .g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))} .g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .n{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted)}
.tile.alert{border-color:var(--bad)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--norm)}
.tw{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:bottom}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.info{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.chip.gold{background:var(--navy);color:var(--gold);border-color:transparent}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;font-size:13px;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .btn.primary{background:var(--gold);color:#0A1628;border-color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--gold);color:#0A1628;border-color:var(--gold)}}
.btn.danger{color:var(--bad)} .btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;align-items:end}
form.f label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
form.f .wide{grid-column:1/-1}
.inp{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--surface);font-size:13.5px;color:var(--fg)}
textarea.inp{min-height:70px;resize:vertical}
details.add{border:1px dashed var(--line);border-radius:6px;padding:8px 12px;margin-top:10px}
details.add summary{cursor:pointer;font-weight:500;color:var(--accent)}
details.add[open] summary{margin-bottom:10px}
.note{font-family:var(--f-read);font-size:14px;color:var(--muted);margin:6px 0 0}
.alertbox{border-left:4px solid var(--bad);background:var(--bad-bg);padding:8px 12px;border-radius:4px;font-size:13px;margin:8px 0}
.goldbox{border-left:4px solid var(--gold);background:var(--surface2);padding:8px 12px;border-radius:4px;font-family:var(--f-read);font-size:14px;margin:8px 0}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(440px,calc(100% - 32px));background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.25);border-left:4px solid var(--gold)}
.toast.bad{border-left-color:#FF6B5E}
.auth{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:var(--navy)}
.auth .card{background:var(--surface);border-radius:12px;max-width:460px;width:100%;overflow:hidden}
.auth .card .brand{background:var(--navy);padding:18px 22px;border-bottom:4px solid var(--norm)}
.auth .card .body{padding:20px 22px;display:grid;gap:12px}
.auth p.foot{color:var(--rail-muted);font-size:12px;text-align:center;max-width:460px;margin:14px auto 0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:170px 1fr;gap:4px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.md{font-family:var(--f-read);font-size:15px;line-height:1.6;max-width:84ch;overflow-wrap:break-word}
.md h1{font-family:var(--f-ui);font-size:20px;background:var(--navy);color:#fff;padding:10px 14px;border-left:6px solid var(--gold);border-radius:6px;margin:28px 0 12px}
.md h2{font-family:var(--f-ui);font-size:17px;border-bottom:2px solid var(--gold);padding-bottom:4px;margin:22px 0 8px}
.md h3{font-family:var(--f-ui);font-size:15px;color:var(--gold-ink);margin:16px 0 6px}
.md table{font-family:var(--f-ui);font-size:12.5px;margin:8px 0}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:4px solid var(--gold);background:var(--surface2)}
.toc{display:flex;flex-direction:column;gap:2px;font-size:13px}
.toc a{color:var(--accent);text-decoration:none}
.tag-loi{color:var(--bad);font-weight:700}
.tag-conf{color:var(--bad);font-weight:700}
.mobbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto}
  .rail .nav,.rail .norm,.rail .who{display:none}
  .rail.open .nav,.rail.open .who{display:flex;flex-direction:column}
  .mobbar{display:flex}
  .rail img{max-width:240px}
  .main{padding-inline:16px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

GROUPE EXPERTISE CONSULTING-CI (GEC-CI) · Mr SIDIBE ABDOULAYE — ATN RA, Manager général (Président-Directeur Général), formateur-auditeur ISO 9001, 14001, 45001.

## À quoi sert ce kit

Ce kit est le contenu de référence de GEC-CI pour accompagner une entreprise vers la certification ISO 22000. Il sert à quatre usages :

- **Vendre** : comprendre les douleurs du client et lui expliquer ce que la norme lui apporte, sans promesse de délai.
- **Diagnostiquer** : mesurer l'écart article par article avec une grille simple.
- **Mettre en œuvre** : construire les programmes prérequis, l'analyse des dangers, le plan de maîtrise et le système autour.
- **Auditer** : préparer l'audit interne et l'audit de certification avec des preuves réelles.

ISO 22000 est une norme de système de management. Elle combine trois choses : les **programmes prérequis** (l'hygiène de base), la **méthode HACCP** du Codex Alimentarius (analyse des dangers et points critiques) et un **système de management** (direction, objectifs, audits, amélioration). Elle s'applique à tout organisme de la chaîne alimentaire : production primaire, transformation, emballage, stockage, transport, distribution, restauration.

## Situations clients couvertes (4 cas)

| Cas | Exemple terrain | Besoin principal | Point d'entrée GEC-CI |
|---|---|---|---|
| 1. Exportateur-transformateur | Usine de broyage de cacao à San Pedro (masse, beurre, poudre) ou unité de transformation de noix de cajou à Bouaké ou Korhogo | Certificat reconnu exigé par l'acheteur européen ; maîtrise des contaminants (ochratoxine A, résidus de pesticides, cadmium, HAP, corps étrangers) | Diagnostic ISO 22000 / FSSC 22000, plan de surveillance analytique, traçabilité jusqu'aux coopératives |
| 2. Industriel du marché local et régional | Boulangerie-pâtisserie industrielle ou biscuiterie à Abidjan | Allergènes multiples, produits périssables, grande distribution qui audite ses fournisseurs | PRP, matrice allergènes, CCP cuisson / refroidissement / détection des métaux |
| 3. Boissons | Embouteillage d'eau ou de jus à Abidjan (Yopougon, Koumassi, PK 24) | Qualité de l'eau, hygiène des lignes, microbiologie, pasteurisation des jus | PRP eau et nettoyage, validation de la pasteurisation, plan de prélèvement |
| 4. Logistique et stockage | Entrepôt sous douane au Port d'Abidjan ou de San Pedro, magasin de stockage de fèves | Nuisibles, humidité, fumigation, contamination croisée, traçabilité des lots clients | PRP stockage et transport, exercice de traçabilité, gestion des urgences |

Les coopératives agricoles déjà accompagnées par GEC-CI en Rainforest Alliance ou Fairtrade ne sont pas, en général, la cible directe d'ISO 22000. Elles peuvent cependant en adopter les briques (séchage, stockage, traçabilité des lots) pour mieux répondre aux exigences des exportateurs.

## Convention A–E / N1–N6

Chaque exigence citée dans ce kit est classée selon sa source. Cela permet au dirigeant de savoir ce qui est obligatoire et ce qui est conseillé.

| Catégorie | Niveau | Source | Exemple pour ISO 22000 | Conséquence si non respecté |
|---|---|---|---|---|
| A | N1 | Loi ou règlement ivoirien | Inspection sanitaire des denrées d'origine animale (Code de la santé publique vétérinaire) | Sanction administrative ou pénale, fermeture |
| B | N2 | Norme ISO 22000 et normes associées | Analyse des dangers, plan de maîtrise, traçabilité | Non-conformité d'audit, refus ou suspension du certificat |
| C | N3-N4 | Client, contrat, marché, schéma (ex. FSSC 22000, limites UE de contaminants) | Teneur maximale en ochratoxine A dans la poudre de cacao exportée vers l'UE | Lot refusé, déréférencement |
| D | N5 | Bonne pratique GEC-CI | Exercice de traçabilité en moins de 4 heures | Fragilité du système |
| E | N6 | Recommandation du consultant | Passer d'un relevé papier à des sondes enregistreuses | Perte d'efficacité |

Une exigence de catégorie C devient obligatoire dès qu'elle figure dans un contrat ou dans la réglementation du pays de destination. Pour un exportateur de cacao, les limites de contaminants de l'Union européenne sont en pratique aussi contraignantes qu'une loi.

## Règles d'usage GEC-CI

1. **Droit d'auteur** : aucun passage de la norme n'est reproduit. Les articles sont présentés par leur numéro, un titre court et une reformulation GEC-CI. L'entreprise doit acheter la norme officielle (ISO ou CODINORM) ; c'est un coût à prévoir.
2. **Rien n'est inventé** : toute référence non vérifiée par une source officielle porte la mention **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**.
3. **Aucune promesse de délai ni de certificat** : seul l'organisme certificateur accrédité décide.
4. **Aucun prix GEC-CI dans ce kit** : le prix se calcule après diagnostic, lot par lot.
5. **Jamais de faux enregistrements** : GEC-CI ne prépare personne à dire à l'auditeur ce qui n'est pas fait. Un écart honnête se corrige ; une fraude détruit la certification et la réputation.
6. **Terrain d'abord** : chaque document doit pouvoir être rempli par un chef d'équipe à 5 heures du matin sur une ligne de production.
7. **Compétence de l'équipe** : le PDG de GEC-CI est formateur-auditeur ISO 9001, 14001 et 45001. Pour ISO 22000 et FSSC 22000, GEC-CI mobilise un expert sécurité des aliments qualifié (formation HACCP et auditeur ISO 22000 ou FSSC 22000) ; sa qualification est vérifiée et jointe au dossier de chaque mission.

## Avertissement droit d'auteur

**Reformulation GEC-CI. Le texte officiel de la norme, acheté auprès de l'ISO ou de CODINORM, fait foi.** Les numéros d'articles et titres courts sont utilisés comme repères. Les résumés sont des reformulations orientées « ce que l'auditeur veut voir ». Ils ne remplacent pas la lecture de la norme.

## 1.2 Transition d'édition

- **Aujourd'hui** : la certification ISO 22000 se fait sur l'édition 2018 (avec l'amendement 2024). Un système bien construit sur 2018 reste valable jusqu'à la publication de la nouvelle édition et pendant la période de transition qui suivra.
- **Après publication de la révision (attendue en 2027)** : l'IAF fixera une période de transition. Sa durée n'est pas connue au 9 octobre 2026. **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**.
- **Conseil GEC-CI (E)** : commencer dès maintenant à travailler la culture de la sécurité des aliments, la fraude et la défense alimentaires. FSSC 22000 les exige déjà, et la révision d'ISO 22000 les annonce. Ce n'est pas du travail perdu.
- **FSSC 22000** : un client qui démarre aujourd'hui un projet FSSC devrait viser directement la version 7, puisque les audits initiaux de 2027 se feront en v7 (règles exactes **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT** avec l'organisme certificateur).

## 1.4 Contexte légal ivoirien (catégorie A)

Nos recherches au 9 octobre 2026 n'ont **pas permis d'identifier une loi-cadre unique et récente** sur la sécurité sanitaire de toutes les denrées alimentaires en Côte d'Ivoire. Le dispositif apparaît réparti entre plusieurs ministères et textes. Les éléments ci-dessous doivent être vérifiés au Journal officiel avant tout usage en audit.

| Référence | Objet | Statut |
|---|---|---|
| Loi n° 2020-995 du 30 décembre 2020 portant Code de la santé publique vétérinaire | Encadre la production, la transformation, le stockage et la distribution des denrées animales et d'origine animale ; son livre IV traite de la sécurité sanitaire des aliments selon le Gouvernement | Référence vérifiée par la presse et par CIVLII ; contenu article par article **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT** |
| Loi de 1996 relative à l'inspection sanitaire et qualitative des denrées animales et d'origine animale | Inspection sanitaire, agrément des établissements, sanctions | Indiquée comme **abrogée** par la loi n° 2020-995 selon CIVLII ; à ne plus citer comme texte en vigueur |
| Loi n° 2016-412 du 15 juin 2016 relative à la consommation | Protection du consommateur (sécurité des produits, information) | Référence listée par la base LEAP (PNUE) ; dispositions sur le retrait, le rappel et l'étiquetage **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT** |
| Plan d'action national de sécurité sanitaire des aliments (2010) | Document de politique, non contraignant ; proposait une agence de coordination | Vérifié (FAOLEX) ; statut actuel d'une agence nationale **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT** |
| Autorités compétentes | Ministère des Ressources animales et halieutiques (denrées animales), ministère de l'Agriculture (LANADA, produits végétaux), ministère du Commerce (consommation, qualité), ministère de la Santé (hygiène publique, eau de boisson) | Répartition exacte des compétences **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT** |
| Conseil du Café-Cacao | Régulation de la filière, contrôle qualité à l'export | Exigences de qualité et procédures de contrôle des fèves **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT** |
| Eau conditionnée et boissons | Autorisation de mise sur le marché, normes ivoiriennes éventuelles (CODINORM) | **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT** |
| Agrément sanitaire des établissements, certificats de santé du personnel | Exigences habituelles dans la région | **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT** |

**Conséquence pratique** : le registre de veille REG-H-03 doit contenir, pour chaque texte, la colonne « statut de vérification ». Un auditeur ne reprochera pas à une PME de ne pas connaître un texte introuvable ; il lui reprochera de ne pas avoir de méthode de veille.

## 1.5 Exigences export (catégorie C)

Pour les exportateurs, les limites du pays de destination s'imposent par contrat. Exemples pour l'Union européenne :

| Contaminant | Produit | Repère | Statut |
|---|---|---|---|
| Ochratoxine A (OTA) | Poudre de cacao | 3 µg/kg, règlement (UE) 2022/1370, applicable depuis le 1er janvier 2023 | Règlement et date vérifiés (AGRINFO) ; valeur issue d'une source professionnelle ; vérifier sur EUR-Lex |
| Ochratoxine A | Fèves de cacao | Pas de limite UE spécifique aux fèves selon la source professionnelle consultée (avril 2024) ; les acheteurs fixent souvent leurs propres critères | **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT** |
| Cadmium | Chocolat et poudre de cacao (selon teneur en cacao) | De 0,10 à 0,80 mg/kg selon le produit ; 0,60 mg/kg pour la poudre vendue au consommateur | Source professionnelle ; règlement de référence (UE) 2023/915 **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT** sur EUR-Lex |
| Hydrocarbures aromatiques polycycliques (HAP) | Fèves et beurre de cacao | Benzo[a]pyrène 5,0 µg/kg et somme de 4 HAP 30 µg/kg de matière grasse | Source professionnelle ; produits visés **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT** |
| Résidus de pesticides | Fèves de cacao, noix de cajou | Limites maximales de résidus fixées par l'UE (base de données pesticides de la Commission) | Valeurs à consulter molécule par molécule |
| Aflatoxines | Noix de cajou, arachides, fruits à coque | Limites UE existantes | Valeurs **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT** sur EUR-Lex |

Ces limites sont des **niveaux acceptables** naturels pour l'analyse des dangers (article 8.5.2.2) : on les inscrit dans la matrice MAT-H-01 avec leur source.

## 1.6 Points à confirmer (synthèse de la Partie 1)

1. Date exacte de publication de la révision d'ISO 22000 et durée de la transition IAF.
2. Numérotation et contenu définitifs des nouveautés de la révision (culture, fraude, défense, réclamations).
3. Date exacte de publication de FSSC 22000 v7 (1er ou 7 mai 2026 selon les sources).
4. Intitulé exact de la série ISO 22002-x:2025 (norme ou spécification technique) et liste des parties.
5. Édition en vigueur d'ISO 22003-1.
6. Existence d'une loi-cadre ivoirienne sur la sécurité sanitaire des aliments et répartition des autorités compétentes.
7. Contenu de la loi n° 2016-412 sur le retrait et le rappel.
8. Accréditations ISO/IEC 17025 du LANADA et des laboratoires privés pour l'OTA, les aflatoxines, les pesticides et les métaux.
9. Organismes certificateurs accrédités pour ISO 22000 et FSSC 22000 intervenant en Côte d'Ivoire.
10. Valeurs exactes des limites UE (cadmium, HAP, aflatoxines) sur EUR-Lex.

Chaque point porte la mention : **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**.

## 2.1 Profils clients

| P1 · Exportateur-transformateur | Broyeur de cacao à San Pedro, transformateur de cajou | Refus d'un conteneur, audit fournisseur d'un chocolatier européen, perte d'un contrat | Un système solide, des analyses ciblées, une traçabilité jusqu'aux coopératives |
| P2 · Agro-industriel local | Boulangerie-pâtisserie industrielle, biscuiterie | Réclamation pour corps étranger, allergène non déclaré, audit de la grande distribution | Des PRP clairs, une matrice allergènes, un plan HACCP compris par les équipes |
| P3 · Boissons | Eau en sachet ou en bouteille, jus pasteurisés | Contamination microbiologique, contrôle des autorités, image de marque | Maîtrise de l'eau et du nettoyage, validation de la pasteurisation |
| P4 · Logistique | Entrepôt sous douane, magasin de fèves | Infestation, humidité, mélange de lots, perte de clients exportateurs | PRP stockage, lutte contre les nuisibles, traçabilité des lots clients |
| P5 · Coopérative en montée en gamme | Coopérative avec séchage et stockage | Lots déclassés pour moisissures ou humidité, primes perdues | Bonnes pratiques de séchage et de stockage, traçabilité des lots |

## 2.2 Calcul de valeur (sans prix GEC-CI)

Le dirigeant ne paie pas « une norme ». Il paie pour éviter des pertes et gagner des marchés. La méthode GEC-CI de calcul de valeur se fait avec ses propres chiffres :

| Poste | Comment le calculer avec le client | Exemple de raisonnement (chiffres à remplacer par ceux du client) |
|---|---|---|
| Coût d'un lot refusé | Valeur du lot + transport retour ou destruction + pénalités contractuelles | Un conteneur de poudre ou de beurre de cacao refusé représente la valeur marchande de son contenu plus les frais logistiques |
| Coût d'un rappel | Produits récupérés + logistique + communication + temps de la direction | Un rappel de biscuits en grande distribution mobilise l'équipe pendant plusieurs jours |
| Marchés accessibles | Chiffre d'affaires des clients qui exigent un certificat | Liste des appels d'offres ou acheteurs perdus faute de certificat |
| Pertes internes | Produits déclassés, retraités, détruits | Taux de déclassement avant / après maîtrise des PRP |
| Coûts d'analyse | Analyses réalisées sans plan / analyses ciblées par le risque | Un plan de surveillance basé sur le risque évite les analyses inutiles et les oublis coûteux |
| Productivité | Temps perdu en arrêts, nettoyages refaits, recherches de documents | Heures récupérées par semaine |

**Coûts implicites à annoncer honnêtement** : temps du personnel (équipe SDA, opérateurs CCP), achat de la norme (prix ISO ou CODINORM **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**), analyses de laboratoire (prix des laboratoires **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**), étalonnage des thermomètres, balances et détecteurs, prestataire nuisibles, travaux sur les locaux (portes, moustiquaires, siphons, peinture alimentaire), tenues et équipements d'hygiène, frais de l'organisme certificateur (sur devis, **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**).

## 2.3 Argumentaires par secteur

### Coopératives agricoles

- **Message** : « Vos fèves sont la matière première d'un aliment. Ce que vous faites au séchage et au stockage se retrouve dans la tasse du consommateur. »
- **Arguments** : réduction des moisissures et de l'ochratoxine A par un bon séchage et un stockage sec ; lots tracés qui gardent leur prime ; meilleure position face aux exportateurs qui auditent leurs fournisseurs.
- **Ce qu'on propose** : un module PRP (séchage, stockage, nuisibles, sacs propres, traçabilité), en lien avec les exigences Rainforest Alliance déjà en place. La certification ISO 22000 complète n'est pas toujours pertinente pour une coopérative.

### PME agroalimentaires (Abidjan)

- **Message** : « La grande distribution et les hôtels vous auditent déjà. Autant avoir un système qui répond une fois pour toutes. »
- **Arguments** : réponses claires aux questionnaires clients, moins de réclamations, personnel qui sait quoi faire, base pour un éventuel FSSC 22000.

### Industrie de transformation export (cacao, cajou)

- **Message** : « Votre acheteur européen veut une preuve, pas une promesse. »
- **Arguments** : certificat reconnu (ISO 22000 ou FSSC 22000 selon le client), plan de surveillance des contaminants, dossier de validation de la torréfaction ou de la stérilisation, traçabilité amont jusqu'aux coopératives, rappel testé.

### Boissons et eau

- **Message** : « Dans l'eau et le jus, la microbiologie ne pardonne pas. »
- **Arguments** : maîtrise de la source d'eau, du traitement, du nettoyage en place et du conditionnement ; validation de la pasteurisation ; preuves pour les contrôles officiels.

### Logistique et entreposage

- **Message** : « Votre client exportateur est responsable de son produit, mais c'est dans votre entrepôt qu'il peut se dégrader. »
- **Arguments** : PRP selon ISO 22002-5 (transport et stockage), lutte contre les nuisibles, gestion des fumigations, séparation des lots, traçabilité.

## 2.4 Diagnostic express de 45 minutes

| Temps | Contenu | Avec qui |
|---|---|---|
| 0-5 min | Présentation, objectif, rappel : pas de promesse de certificat | Dirigeant |
| 5-15 min | Produits, marchés, clients qui exigent un certificat, incidents des 2 dernières années | Dirigeant, commercial |
| 15-30 min | Les 8 questions du diagnostic (équipe HACCP, diagrammes, CCP/PRPo, limites, traçabilité, analyses, rappel, revue de direction) | Responsable production ou qualité |
| 30-40 min | Tour rapide de la ligne : réception, zone sensible, CCP, stockage | Chef de production |
| 40-45 min | Restitution : 3 forces, 3 écarts majeurs, recommandation « on continue / on s'arrête » | Dirigeant |

**Règle de décision** : si la direction ne peut pas nommer un responsable SDA disponible au moins une partie significative de son temps, GEC-CI recommande de commencer par un lot PRP avant de parler de certification.

## 2.5 Objections fréquentes

| Objection | Réponse GEC-CI |
|---|---|
| « Nous avons déjà un plan HACCP. » | C'est une base. ISO 22000 ajoute le système autour : PRP vérifiés, traçabilité testée, urgences, revue de direction, amélioration continue. Le diagnostic montre ce qui manque. |
| « ISO 22000 ou FSSC 22000 ? » | FSSC 22000 contient ISO 22000 plus des PRP sectoriels et des exigences additionnelles. Il est reconnu par la GFSI, contrairement à ISO 22000 seule. On vérifie avec vos clients avant de choisir. |
| « La norme change en 2027, attendons. » | Les fondamentaux ne changent pas. Les certifications restent délivrées sur l'édition en vigueur, et une transition sera fixée. |
| « Les analyses coûtent trop cher. » | Un plan de surveillance basé sur le risque cible les paramètres et fréquences utiles. |
| « Nos ouvriers ne lisent pas les procédures. » | Consignes visuelles, fiches simples, formation au poste, vérification orale. |
| « Combien de temps pour être certifié ? » | Cela dépend de votre point de départ, de vos ressources et de l'organisme certificateur. Nous donnons un planning indicatif après diagnostic, sans garantie de date. |

## 2.6 Erreurs à ne pas commettre (en vente comme en mise en œuvre)

1. Vendre ISO 22000 à un client dont l'acheteur exige FSSC 22000 ou BRCGS : vérifier d'abord l'exigence du client.
2. Copier un plan HACCP d'une autre usine : l'auditeur le voit tout de suite (étapes qui n'existent pas, limites non justifiées).
3. Déclarer trop de CCP : un système avec 15 CCP est ingérable ; une bonne catégorisation PRPo / CCP est attendue.
4. Oublier les allergènes dans une boulangerie (gluten, lait, œufs, fruits à coque) ou la noix de cajou elle-même comme allergène.
5. Négliger la vérification sur site des diagrammes de fabrication.
6. Promettre une date de certificat.
7. Laisser le responsable SDA seul : sans soutien visible de la direction, le système s'effondre après l'audit.
8. Sous-estimer les travaux d'infrastructure (toitures, sols, moustiquaires) révélés par l'inspection PRP.

# Partie 3 — Parcours de certification

**Reformulation GEC-CI. Le texte officiel de la norme, acheté auprès de l'ISO ou de CODINORM, fait foi.**

## 3.1 Rôle de l'organisme certificateur accrédité

L'organisme certificateur est indépendant. Il audite le système, décide de délivrer, maintenir, suspendre ou retirer le certificat. GEC-CI ne certifie pas et ne peut pas certifier un client qu'il a accompagné.

Points à vérifier avant de signer avec un organisme :

- **Accréditation** : l'organisme doit être accrédité pour ISO 22000 (ou FSSC 22000 si c'est le schéma visé) et pour la catégorie de la chaîne alimentaire concernée (ex. transformation de produits végétaux, boissons, stockage). Demander le certificat d'accréditation et sa portée, au cas par cas : **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**.
- **Auditeurs compétents** dans le secteur (cacao, boulangerie, boissons, logistique).
- **Reconnaissance par les clients** : certains acheteurs n'acceptent que des certificats émis sous accréditation d'un membre de l'IAF.
- **Durée d'audit** : elle est calculée selon des règles internationales (ISO 22003-1) en fonction des effectifs, du nombre d'études HACCP et des sites. Demander le détail du calcul dans le devis.
- **Langue** : audit en français, rapports en français.

## 3.2 Étapes de l'audit

| Étape | Objectif | Ce que l'auditeur regarde | Conseil GEC-CI |
|---|---|---|---|
| Audit étape 1 | Vérifier que le système est prêt | Domaine d'application, documentation, analyse des dangers, plan de maîtrise, PRP, audit interne, revue de direction, conformité légale ; visite du site | Ne pas demander l'étape 1 tant que l'audit interne et la revue de direction ne sont pas faits |
| Audit étape 2 | Vérifier que le système est appliqué et efficace | Terrain, enregistrements de plusieurs mois, entretiens, traçabilité, CCP en fonctionnement | Le site doit produire le jour de l'audit ; prévoir les lignes en marche |
| Décision | Le comité de l'organisme statue | Clôture des non-conformités majeures, plans d'action pour les mineures | Répondre dans les délais fixés par l'organisme |
| Surveillance | Audits annuels (années 1 et 2) | Maintien et amélioration | Ne pas relâcher après la certification |
| Renouvellement | Audit complet avant la fin de la 3e année | Performance sur le cycle | Préparer comme une certification initiale |

**Cycle de 3 ans** : certificat valable 3 ans sous réserve des audits de surveillance. Pour FSSC 22000, des audits non annoncés sont prévus par le schéma ; règles exactes de la v7 **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**.

## 3.3 Transition d'édition

- Clients certifiés ISO 22000:2018 : rien à changer aujourd'hui, sauf intégrer l'amendement climatique (4.1, 4.2) déjà applicable.
- À la publication de la nouvelle édition (attendue en 2027) : analyse d'écart, mise à jour des documents, formation, audit de transition par l'organisme. Durée de transition **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**.
- Clients FSSC 22000 : passage à la v7 lors des audits à partir du 1er mai 2027 ; tous les certificats basculés au plus tard le 30 avril 2028 (UKAS, Bureau Veritas).

## 3.4 Méthode GEC-CI en 10 étapes

| N° | Étape | Livrables | Décision |
|---|---|---|---|
| 1 | Diagnostic express (45 min) | Fiche de restitution | **On continue** si la direction s'engage et nomme un responsable SDA ; **on s'arrête** sinon |
| 2 | Diagnostic complet | FOR-H-01 rempli, rapport d'écart, plan d'action | **On continue** si les écarts PRP sont finançables ; sinon lot PRP seul d'abord |
| 3 | Cadrage et équipe SDA | Domaine d'application, nomination, formation HACCP de l'équipe | **On s'arrête** si l'équipe n'est pas disponible |
| 4 | Programmes prérequis | PRO-H-06 à PRO-H-10, CHK-H-01, travaux | **On continue** quand le score PRP dépasse 80 % (KPI-H-03) |
| 5 | Étapes préliminaires | FOR-H-02, FOR-H-03, FOR-H-04 vérifiés sur site | Diagrammes signés obligatoires avant l'étape 6 |
| 6 | Analyse des dangers et plan de maîtrise | MAT-H-01, MAT-H-02, PLAN-H-01, RAP-H-03 | **On continue** quand chaque CCP / PRPo est validé |

## 3.5 Planning type (indicatif, sans garantie)

| Taille du site | Exemples | Durée indicative du projet | Facteurs qui allongent |
|---|---|---|---|
| Petit site (< 30 personnes, 1 ligne) | Embouteillage d'eau, petit entrepôt | 6 à 8 mois | Travaux d'infrastructure, absence de laboratoire |
| Site moyen (30 à 150 personnes, 2-4 lignes) | Boulangerie industrielle, unité de cajou | 8 à 10 mois | Allergènes multiples, saisonnalité de la campagne |
| Grand site (> 150 personnes, plusieurs ateliers) | Usine de broyage de cacao | 10 à 12 mois | Nombre d'études HACCP, traçabilité amont complexe, FSSC 22000 |

Ces durées sont des repères de planification interne. Elles ne sont ni une promesse ni un engagement de date de certificat.

# Partie 4 — Construire le système

## 4.1 Diagnostic initial

**Méthode** : entretien de direction, revue documentaire, visite de toutes les zones pendant la production, échantillon d'enregistrements, entretiens avec opérateurs. Le consultant remplit FOR-H-01 article par article.

**Grille de maturité 0-1-2** :

| Note | Signification | Exemple (8.3 Traçabilité) |
|---|---|---|
| 0 | Rien n'existe ou pratique non maîtrisée | Les sacs de fèves ne portent aucun numéro de lot |
| 1 | Pratique existante mais incomplète, non écrite ou non prouvée | Les lots sont notés, mais aucun exercice de traçabilité n'a été fait |
| 2 | Pratique écrite, appliquée, enregistrée et vérifiée | Exercice annuel réalisé, bilan matière à 99 %, actions tracées |

**Résultat** : taux de maturité par chapitre, carte des écarts, plan d'action priorisé (sécurité du consommateur d'abord, puis exigences d'audit, puis efficacité).

Formulaires : FOR-H-01 (grille), CHK-H-01 (inspection PRP), REG-H-03 (veille légale initiale).

## 4.2 Contexte (4.1) — enjeux internes et externes, dont climat

| Type | Enjeu | Exemple ivoirien | Effet possible sur la sécurité des aliments |
|---|---|---|---|
| Externe — climat | Fortes pluies, humidité | Saison des pluies à San Pedro et Soubré | Séchage insuffisant des fèves, moisissures, ochratoxine A |
| Externe — climat | Chaleur | Entrepôts sous tôle à Abidjan | Rupture de la chaîne du froid, rancissement, développement microbien |
| Externe — utilités | Coupures d'électricité ou d'eau | Délestages | Arrêt de la pasteurisation, nettoyage impossible |
| Externe — marché | Exigences UE (contaminants, déforestation) | Acheteurs de cacao et cajou | Refus de lots, exigences de traçabilité |
| Externe — réglementation | Dispositif légal dispersé | Plusieurs ministères compétents | Difficulté de veille |
| Interne | Rotation du personnel saisonnier | Campagne de cajou | Opérateurs non formés aux CCP |
| Interne | Vétusté des équipements | Torréfacteur ancien | Températures irrégulières |
| Interne | Fournisseur unique | Seul fournisseur d'emballages agréé | Rupture ou baisse de qualité |

Le climat est-il pertinent ? Pour presque toutes les entreprises alimentaires ivoiriennes, **oui** : chaleur, humidité et pluies influencent directement les dangers. La réponse et sa justification sont écrites dans REG-H-01.

| Grande distribution, hôtels | Cahiers des charges, audits fournisseurs | Oui | REG-H-14 |
| Consommateurs | Produit sûr, étiquetage correct, allergènes | Oui | Réclamations |
| Autorités ivoiriennes | Inspection, agrément, étiquetage | Oui | REG-H-03 |

| Réalisation | Achat et réception des fèves | Responsable achats | PRO-H-05, REG-H-07 |

## 4.5 Politique et objectifs

La politique POL-H-01 tient sur une page. Elle dit en mots simples : nous fabriquons des produits sûrs ; nous respectons la loi et les exigences de nos clients ; nous communiquons dans la chaîne alimentaire ; nous formons notre personnel ; nous améliorons notre système. Elle est signée par le DG et affichée.

Exemples d'objectifs (REG-H-02) :

| Objectif | Indicateur | Cible | Échéance |
|---|---|---|---|
| Zéro lot export refusé pour contaminant | Lots refusés / lots expédiés | 0 | 12 mois |
| Maîtrise des CCP | KPI-H-01 | ≥ 99 % | Mensuel |
| Traçabilité rapide | KPI-H-08 | ≤ 4 h | Exercice annuel |
| PRP de bon niveau | KPI-H-03 | ≥ 90 % | 6 mois |
| Personnel formé | KPI-H-14 | ≥ 90 % | 12 mois |

## 4.6 Risques et opportunités (6.1) — méthode de cotation

Attention : **6.1 ne remplace pas l'analyse des dangers (8.5.2)**. 6.1 traite les risques pour le système (organisation, ressources, fournisseurs) ; 8.5.2 traite les dangers pour le consommateur.

Cotation GEC-CI (REG-H-02) : Probabilité (1 faible, 2 possible, 3 probable) × Impact sur la capacité à fournir des produits sûrs (1 faible, 2 notable, 3 grave). Score 1-2 : surveiller ; 3-4 : action planifiée ; 6-9 : action prioritaire validée par la direction.

| Risque / opportunité | P | I | Score | Action |
|---|---|---|---|---|
| Départ du responsable laboratoire | 2 | 3 | 6 | Former un suppléant, documenter les méthodes |
| Délestages pendant la pasteurisation | 3 | 3 | 9 | Groupe électrogène, consigne de blocage des lots |
| Coopérative fournisseur sans séchoir | 3 | 2 | 6 | Formation au séchage, contrôle humidité à réception |
| Opportunité : plateforme numérique de traçabilité | — | — | — | Projet GEC-CI Pro |

## 4.7 Obligations légales et autres exigences (registre de veille)

REG-H-03 recense chaque exigence avec : référence, origine (CI, UE, Codex, client), catégorie A-E, produits concernés, exigence applicable, **statut de vérification**, évaluation de conformité, action. Fréquence : revue mensuelle des nouveautés (Journal officiel, ministères, CODINORM, EUR-Lex, alertes RASFF de l'UE, Codex), évaluation de conformité annuelle.

Exemples de lignes :

| Exigence | Catégorie | Statut |

| Limite OTA poudre de cacao — règlement (UE) 2022/1370 | C | Vérifié (AGRINFO) ; valeur à contrôler sur EUR-Lex |
| CXC 1-1969 (hygiène, HACCP) | B / C | Vérifié |
| Cahier des charges client chocolatier | C | Contrat signé |

## 4.8 Plan documentaire et maîtrise des documents

- **Codification** : MAN-H-01, POL-H-xx, PRO-H-xx, FOR-H-xx, REG-H-xx, PLAN-H-xx, RAP-H-xx, MAT-H-xx, CHK-H-xx. Codes de preuve : PRV-H-[code client]-[article]-[rang], ex. PRV-H-USC-0003-8.3-01.
- **Versions** : cartouche avec code, version, date, rédacteur, approbateur. Toute modification passe par REG-H-16 si elle touche le plan de maîtrise.
- **Accès** : documents en vigueur au poste (plastifiés si zone humide) ; anciennes versions retirées et archivées.
- **Conservation** : enregistrements CCP, traçabilité et analyses conservés au minimum pendant la durée de vie du produit augmentée d'une marge ; GEC-CI recommande au moins 3 ans (couvre un cycle de certification). Durée légale **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**.
- **Support** : papier au poste, saisie ou scan sur la plateforme GEC-CI Pro, sauvegarde hors site.

# Partie 5 — Matrice des exigences ISO 22000 et dossiers de preuve

Reformulation GEC-CI. Le texte officiel de la norme, acheté auprès de l'ISO ou de CODINORM, fait foi.

**Base de numérotation :** Numérotation ISO 22000:2018 + Amendement 1:2024 (action climatique, 4.1 et 4.2). La révision (DIS enregistré en 2026, publication attendue en 2027) est signalée dans le champ 'nouveau' ; ses numéros et contenus ne sont pas vérifiés (confirmer = true). Programmes prérequis : série ISO 22002-x:2025 (ex-ISO/TS 22002-x).

Cette matrice couvre 68 articles et sous-articles des chapitres 4 à 10. Pour chacun : ce que l'auditeur veut voir (reformulation GEC-CI), l'information documentée exigée par la norme lorsqu'elle existe, les preuves que GEC-CI conseille de préparer, le registre, le responsable et le niveau de risque en audit. La plateforme GEC-CI Pro ISO 22000 et le classeur Excel reprennent la même matrice, avec un statut par article.

# Partie 6 — Exigences propres à la norme, en profondeur

**Reformulation GEC-CI. Le texte officiel de la norme, acheté auprès de l'ISO ou de CODINORM, fait foi.**

Cette partie explique, avec des exemples ivoiriens, les exigences qui font la spécificité d'ISO 22000. C'est ici que se gagne ou se perd un audit. Les exemples chiffrés sont des illustrations : chaque limite réelle doit être fixée par l'équipe SDA, justifiée et validée.

## 6.1 Programmes prérequis (8.2 — série ISO 22002-x:2025)

Les programmes prérequis (PRP) sont les conditions d'hygiène de base, valables quel que soit le produit. Sans eux, le plan HACCP ne tient pas. ISO 22000 demande de les choisir en tenant compte de la réglementation, des exigences clients et des documents de référence reconnus. La série ISO 22002-x:2025 fournit ces références : une partie commune (22002-100) et des parties sectorielles (22002-1 pour la fabrication, 22002-4 pour les emballages, 22002-5 pour le transport et le stockage…). Pour FSSC 22000 v7, l'usage de cette série est exigé.

| Thème PRP | Ce que l'auditeur veut voir | Exemple ivoirien | Erreur fréquente |
|---|---|---|---|
| Construction et implantation | Bâtiments en bon état, zonage, flux sans croisement | Usine de cajou : zone de décorticage séparée de la zone de conditionnement | Toiture qui fuit au-dessus d'une ligne |
| Locaux et équipements | Surfaces lisses, nettoyables, matériaux aptes au contact alimentaire | Tables inox en boulangerie ; pas de bois brut en zone humide | Peinture qui s'écaille, rouille sur les convoyeurs |
| Utilités : eau, air, énergie | Eau potable analysée, air comprimé filtré, glace et vapeur maîtrisées | Embouteillage : analyses de l'eau du forage et de l'eau traitée | Aucune analyse de l'eau utilisée pour le nettoyage |
| Déchets | Collecte, identification, évacuation régulière | Coques de cajou et coques de cacao évacuées chaque jour | Déchets stockés contre la ligne |
| Nettoyage et désinfection | Plan, produits autorisés, vérification | Écouvillonnage après nettoyage de la ligne de crème pâtissière | Nettoyage « au jugé », sans dosage |
| Nuisibles | Plan de postes, prestataire compétent, suivi des tendances | Entrepôt sous douane : insectes des denrées stockées, rongeurs, oiseaux | Appâts toxiques à l'intérieur des zones de production |
| Hygiène du personnel | Tenue, lavage des mains, maladies à déclarer, visiteurs | Charlottes, cache-barbes, pas de bijoux, lave-mains à l'entrée | Visiteurs entrant sans tenue |
| Achats et fournisseurs | Spécifications, évaluation, contrôle à réception | Contrôle d'humidité et de moisissures des fèves à réception | Accepter des sacs souillés de produits chimiques |
| Stockage et transport | Séparation, rotation, propreté des véhicules et conteneurs | Inspection du conteneur avant chargement (odeurs, humidité, propreté) | Conteneur humide qui provoque condensation et moisissures |
| Contamination croisée | Séparation cru / cuit, allergènes, corps étrangers | Politique verre et plastique dur ; aimants, tamis | Verre non protégé au-dessus des lignes |
| Information produit et étiquetage | Étiquettes justes, allergènes déclarés, lot et date | Biscuits : mention des fruits à coque et du gluten | Ancienne étiquette utilisée après un changement de recette |
| Fraude et défense alimentaires | Évaluation de vulnérabilité, contrôle des accès | Accès au magasin d'ingrédients limité ; cadenas sur les cuves | Rien n'est prévu (exigé par FSSC, annoncé dans la révision ISO) |

**Vérification des PRP** : inspection mensuelle par zone avec CHK-H-01, enregistrements dans REG-H-09 et REG-H-10, synthèse en revue de direction.

## 6.2 Étapes préliminaires (8.5.1)

### Correspondance Codex HACCP (12 étapes, 7 principes) et ISO 22000

Le Codex (CXC 1-1969, révisé en 2020) décrit la méthode HACCP en 12 étapes : 5 étapes préliminaires, puis les 7 principes. ISO 22000 reprend cette logique et ajoute les PRPo à côté des CCP.

| Étape Codex | Principe | En résumé (mots GEC-CI) | Article ISO 22000:2018 |
|---|---|---|---|

### Équipe de sécurité des denrées alimentaires

L'équipe SDA est pluridisciplinaire : production, maintenance, qualité/laboratoire, achats, logistique, et si besoin un expert externe. Son responsable est nommé par la direction (5.3). Les membres sont formés aux principes HACCP et connaissent les produits et procédés. Erreur fréquente : une seule personne qualité qui écrit tout dans son bureau.

### Description des matières premières, ingrédients et matériaux au contact (8.5.1.2)

Pour chaque intrant, une fiche FOR-H-02. Exemples :

| Matière | Dangers connus à noter | Critères d'acceptation possibles |
|---|---|---|
| Fèves de cacao (coopératives de Soubré, Méagui) | Moisissures et ochratoxine A, résidus de pesticides, cadmium, HAP (séchage à la fumée), Salmonella, corps étrangers (pierres, métal) | Humidité, épreuve à la coupe (moisissures, ardoisées), absence d'odeur de fumée ; valeurs selon contrat ou norme de commercialisation **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT** |
| Noix de cajou brutes | Aflatoxines, moisissures, insectes, pierres | Humidité, taux de défauts, comptage de noix |
| Farine de blé | Gluten (allergène), mycotoxines, insectes | Certificat d'analyse fournisseur, contrôle visuel |
| Eau de forage | Contamination microbiologique, nitrates, métaux | Analyses périodiques selon PLAN-H-04 |
| Emballages (bouteilles PET, sachets, sacs en jute, cartons) | Migration chimique, corps étrangers | Déclaration d'aptitude au contact alimentaire |

### Description des produits finis (8.5.1.3) et usage prévu (8.5.1.4)

FOR-H-03 précise la composition, les caractéristiques (humidité, activité de l'eau, pH), la durée de vie, l'emballage, l'étiquetage, la distribution, puis l'usage. Exemple : la poudre de cacao est utilisée par des industriels et peut être consommée sans cuisson (boisson chocolatée) : un danger microbiologique comme Salmonella reste donc significatif jusqu'au produit fini. Pour les biscuits, les consommateurs vulnérables incluent les enfants et les personnes allergiques.

### Diagrammes de fabrication vérifiés sur site (8.5.1.5)

Le diagramme montre toutes les étapes, entrées (matières, eau, emballages, auxiliaires) et sorties (produits, sous-produits, déchets, recyclages). L'équipe SDA le **vérifie sur la ligne en marche**, de préférence à des heures et équipes différentes, puis signe FOR-H-04.

Exemple simplifié — usine de broyage de cacao à San Pedro :
réception des fèves → stockage → nettoyage (tamis, aimant, épierreur) → torréfaction ou traitement thermique → concassage et vannage (séparation des coques) → broyage (masse de cacao) → alcalinisation éventuelle → pressage (beurre et tourteau) → filtration du beurre → broyage du tourteau (poudre) → tamisage → détection des métaux → conditionnement → stockage → expédition.

Exemple simplifié — unité de cajou :
réception → séchage et stockage → calibrage → cuisson à la vapeur → décorticage → séparation coques / amandes → séchage des amandes → dépelliculage → tri et grading → (torréfaction éventuelle) → détection des métaux → conditionnement sous vide ou gaz → stockage → expédition.

Erreurs fréquentes : oublier le retraitement des produits déclassés, l'eau de nettoyage, le recyclage des brisures, ou une étape faite de nuit par une autre équipe.

## 6.3 Analyse des dangers (8.5.2)

### Identification des dangers et niveaux acceptables

Pour chaque étape, l'équipe SDA liste les dangers raisonnablement prévisibles, en utilisant : historique des réclamations, littérature, guides Codex, alertes de l'UE (RASFF), données fournisseurs, réglementation. Chaque danger reçoit un **niveau acceptable dans le produit fini**, justifié (limite légale, client, Codex ou décision de l'équipe).

| Famille | Exemples | Où | Niveau acceptable (exemples de sources) |
|---|---|---|---|
| Biologiques | Salmonella (cacao, cajou, poudre), Listeria (crèmes pâtissières), E. coli et coliformes (eau, jus), levures et moisissures | Matières, environnement, personnel | Critères microbiologiques client ou réglementaires **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT** par produit |
| Chimiques — mycotoxines | Ochratoxine A (cacao), aflatoxines (cajou, arachide) | Matières, séchage, stockage humide | OTA poudre de cacao : 3 µg/kg (UE 2022/1370) ; aflatoxines : limites UE **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT** |
| Chimiques — pesticides | Résidus de produits phytosanitaires sur fèves | Matières (pratiques agricoles) | LMR de l'UE par molécule |
| Chimiques — métaux et autres | Cadmium (cacao), HAP (séchage à la fumée), résidus de fumigation (phosphine), lubrifiants, produits de nettoyage | Matières, stockage, maintenance | Limites UE (cadmium, HAP) **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT** ; lubrifiants de qualité alimentaire |
| Allergènes | Gluten, lait, œufs, arachide, fruits à coque (dont cajou), soja, sésame | Recettes, lignes partagées | Absence de contact croisé non déclaré ; étiquetage conforme |
| Physiques | Pierres, métal, verre, plastique dur, coques, bois, insectes | Matières, équipements, personnel | Absence de corps étranger dangereux ; taille de référence pour les métaux selon détecteur validé |
| Radiologiques | Rare dans le contexte ivoirien | — | À considérer seulement si une source existe |

**Cas de l'ochratoxine A dans le cacao** : elle se forme surtout lors d'une fermentation ou d'un séchage mal conduits et d'un stockage humide. La transformation en usine ne la détruit pas de manière fiable. La maîtrise se fait donc surtout en amont : bonnes pratiques de séchage et de stockage chez les coopératives, contrôle d'humidité et épreuve à la coupe à la réception, analyses par plan d'échantillonnage, rejet des lots douteux. Le Codex a publié un code d'usages pour la prévention de l'OTA dans le cacao (référence CXC 72-2013 selon nos informations, **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**).

### Évaluation des dangers

Méthode GEC-CI (MAT-H-01), appliquée **avant** prise en compte des mesures de maîtrise :

| Note | Probabilité (P) | Gravité (G) |
|---|---|---|
| 1 | Jamais observé dans la filière | Gêne légère, aucun effet sur la santé |
| 2 | Possible, déjà observé dans la filière | Effet passager, sans soins |
| 3 | Probable, déjà observé chez nous ou chez nos fournisseurs | Maladie nécessitant des soins, effet chronique possible (mycotoxines) |
| 4 | Fréquent | Hospitalisation, décès, réaction allergique grave |

**Règle** : le danger est significatif si P × G ≥ 8 (ce qui couvre tout danger de gravité 4 dès qu'il est possible). La règle doit être écrite et appliquée de façon cohérente ; l'auditeur vérifie la logique, pas la formule elle-même.

### Choix et catégorisation des mesures de maîtrise (8.5.2.4)

Pour chaque danger significatif, l'équipe choisit une ou plusieurs mesures de maîtrise, puis les classe en **CCP** ou **PRPo**. La norme demande une méthode logique qui tient compte de plusieurs critères. GEC-CI les traduit en questions :

1. La mesure agit-elle vraiment sur ce danger, et de combien ?
2. Peut-on la surveiller, et peut-on détecter un écart assez vite pour agir sur le produit ?
3. Où se situe-t-elle par rapport aux autres mesures (y a-t-il une étape plus loin qui rattrape) ?
4. Risque-t-elle de défaillir ou de varier fortement ?
5. Que se passe-t-il pour le consommateur si elle échoue ?
6. A-t-elle été conçue spécialement pour éliminer ou réduire ce danger ?
7. Agit-elle en combinaison avec d'autres mesures ?

**Résultat type** : si la mesure a une limite mesurable, une surveillance en temps réel qui permet de bloquer le produit, et que son échec rend le produit dangereux → **CCP**. Si elle est importante mais surveillée par observation ou par critère d'action, et son échec n'entraîne pas forcément un produit dangereux → **PRPo**.

| Exemple | Danger | Mesure | Classement probable | Pourquoi |
|---|---|---|---|---|
| Broyage de cacao | Salmonella | Torréfaction ou traitement thermique validé (couple temps/température) | CCP | Étape conçue pour réduire le danger, mesurable, échec grave |
| Broyage de cacao | OTA | Contrôle à réception (humidité, épreuve à la coupe, analyses) | PRPo | Maîtrise en amont, critère d'action, rattrapage possible par rejet |
| Cajou | Corps étrangers métalliques | Détecteur de métaux en fin de ligne | CCP | Dernière barrière, surveillable, test avec étalons |
| Cajou | Coques et pierres | Tri optique et manuel | PRPo | Critère d'action (taux de défauts), contrôle par échantillonnage |
| Boulangerie | Allergènes (contact croisé) | Ordonnancement et nettoyage validé entre recettes | PRPo | Surveillance visuelle et documentaire |
| Boulangerie | Survie de pathogènes | Cuisson (température à cœur) | CCP ou PRPo selon le produit et la validation | À décider par l'équipe et justifier |
| Jus | Pathogènes végétatifs | Pasteurisation (température, temps) | CCP | Limite mesurable, enregistrement continu |
| Eau embouteillée | Contamination microbiologique | Filtration et désinfection (UV, ozone…) | CCP ou PRPo selon conception | Selon surveillance possible en continu |
| Entrepôt sous douane | Résidus de fumigation | Respect des délais d'aération et contrôle avant remise | PRPo | Critère d'action, mesure de gaz |

**Erreur fréquente** : tout classer en CCP « pour être sûr ». Un système avec trop de CCP n'est plus surveillé correctement.

## 6.4 Validation des mesures de maîtrise (8.5.3)

Valider, c'est **prouver avant** que la mesure atteint le niveau acceptable. Sources de preuve : études scientifiques, guides de bonnes pratiques, données du fabricant de l'équipement, essais internes (ex. inoculation par un laboratoire spécialisé, cartographie de température d'un four ou d'un torréfacteur), historique d'analyses.

Exemples :
- Torréfaction de cacao : cartographie des températures dans le torréfacteur, étude de réduction de Salmonella, choix du couple temps/température avec marge de sécurité.
- Détecteur de métaux : taille minimale détectée sur le produit réel, avec étalons ferreux, non ferreux et inox.
- Nettoyage entre recettes allergènes : tests de surface spécifiques avant et après nettoyage.
- Pasteurisation de jus : valeur pasteurisatrice obtenue au point le plus froid.

Revalider après tout changement (nouvelle machine, nouvelle recette, nouveau fournisseur). Rapport : RAP-H-03.

## 6.5 Plan de maîtrise des dangers (plan HACCP) — 8.5.4

Le plan PLAN-H-01 regroupe, pour chaque CCP et chaque PRPo : danger, mesure, limite critique ou critère d'action, surveillance (quoi, comment, fréquence, qui), correction, action corrective, responsabilités, enregistrements.

Exemple de ligne (usine de cajou, illustration) :

| Élément | Contenu |
|---|---|
| Étape | Détection des métaux avant conditionnement |
| Danger | Fragments métalliques (usure du décortiqueur) |
| Type | CCP |
| Limite critique | Rejet automatique de chaque étalon de test, aux tailles validées pour le produit |
| Surveillance | Test avec les 3 étalons au démarrage, toutes les heures, à chaque changement de produit et en fin de poste ; opérateur habilité ; FOR-H-05 |
| Correction | Arrêt, blocage de tout le produit depuis le dernier test conforme, repassage au détecteur réparé |
| Action corrective | Recherche de la cause (réglage, panne, rejet défaillant) ; FOR-H-06 |
| Vérification | Revue quotidienne des fiches par le responsable SDA ; vérification fonctionnelle mensuelle ; étalonnage annuel |

### Limites critiques et critères d'action (8.5.4.2)

- **Limite critique (CCP)** : un seuil chiffré ; au-delà, le produit ne peut plus être considéré comme sûr et il est traité comme potentiellement dangereux. Exemple : température minimale à cœur pendant un temps minimal.
- **Critère d'action (PRPo)** : mesurable ou observable, déclenche une action. Exemple : humidité des fèves au-dessus de la valeur contractuelle → lot mis en quarantaine et analysé.
- La justification est conservée (étude de validation, réglementation, client).

### Surveillance (8.5.4.3)

La surveillance d'un CCP doit détecter un écart à temps pour isoler le produit. Elle précise : méthode, appareil, fréquence, responsable, enregistrement. Les appareils sont étalonnés (8.7, REG-H-11). Les fiches sont remplies **au moment du contrôle**, visées par l'opérateur puis par un vérificateur.

### Actions en cas de dépassement (8.5.4.4)

Dépassement d'une limite critique → le produit concerné est traité comme potentiellement dangereux (8.9.4). Dépassement d'un critère d'action → évaluation du produit et correction. Dans les deux cas : enregistrement, analyse de cause si répétition.

## 6.6 Vérification et analyse des résultats (8.8)

Vérifier, c'est **confirmer après coup** que tout a été fait et fonctionne : revue des fiches CCP par une autre personne que l'opérateur, inspections PRP, analyses de produits finis (contaminants, microbiologie), analyses d'environnement et d'eau, audit interne. PLAN-H-04 fixe objets, fréquences et responsables.

**Différences à expliquer au client** :

| Activité | Question | Quand | Exemple |
|---|---|---|---|
| Validation | Cette mesure est-elle capable de maîtriser le danger ? | Avant mise en place et après changement | Étude de la torréfaction |
| Surveillance | La mesure est-elle appliquée en ce moment ? | En continu | Relevé de température toutes les heures |
| Vérification | Ce qui était prévu a-t-il été fait et a-t-il marché ? | Après coup, périodiquement | Analyse Salmonella du lot de poudre, revue des fiches |

Analyse des résultats (8.8.2) : synthèse trimestrielle des résultats d'analyses et des écarts, tendances (ex. hausse de l'OTA en saison des pluies), décisions de mise à jour.

## 6.7 Traçabilité amont / aval et exercice de traçabilité (8.3)

Le système relie : lot fournisseur (coopérative, sac, camion) → lot interne de réception (REG-H-07) → lot de production (REG-H-08) → lot fini → client et conteneur. Il inclut aussi les emballages et ingrédients secondaires.

**Exercice de traçabilité** (FOR-H-08), au moins une fois par an dans les deux sens :
1. Choisir un lot fini au hasard (ou un lot de matière).
2. Retrouver toutes les matières et emballages utilisés et leurs fournisseurs.
3. Retrouver tous les clients livrés et les quantités.
4. Faire le bilan matière : entrées, sorties, stocks, pertes.
5. Mesurer la durée et l'écart.
6. Enregistrer les anomalies et les actions.

Repères GEC-CI (catégorie D) : durée cible 4 heures, bilan matière ≥ 99 %. Les exigences du schéma FSSC ou des clients peuvent être différentes : **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT** au cas par cas.

Particularité cacao et cajou : les lots de coopératives sont souvent mélangés à la réception. Il faut définir clairement à quel moment un nouveau lot interne est créé, et garder la liste des lots fournisseurs qui le composent. Les systèmes de traçabilité Rainforest Alliance déjà en place peuvent être réutilisés comme base.

## 6.8 Retrait / rappel (8.9.5)

- **Retrait** : récupérer des produits encore dans la chaîne (chez un distributeur, en entrepôt).
- **Rappel** : récupérer des produits déjà chez le consommateur, avec information du public.

La procédure PRO-H-16 précise : cellule de crise (DG, responsable SDA, commercial, logistique), critères de décision, liste de contacts (clients, autorités compétentes, organisme certificateur, assureur), modèles de messages, récupération et stockage des produits retournés, devenir des produits, retour d'expérience. Autorité à informer en Côte d'Ivoire selon le produit : **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**.

Simulation au moins annuelle, enregistrée dans REG-H-15 : durée, taux de produit localisé, efficacité des contacts.

## 6.9 Communication dans la chaîne alimentaire (7.4)

**Externe** (7.4.2) : fournisseurs (spécifications, alertes, exigences de séchage), clients (fiches techniques, certificats d'analyse, allergènes, durée de vie, alertes), consommateurs (étiquetage, réclamations), autorités (inspections, déclarations, rappels), organisme certificateur (incidents graves selon ses règles). Les échanges sensibles sont tracés dans REG-H-14. La révision d'ISO 22000 annonce une exigence dédiée au traitement des réclamations (**À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**).

**Interne** (7.4.3) : l'équipe SDA est informée **avant** tout changement : nouveau produit, matière, fournisseur, équipement, local, nettoyage, personnel clé, exigence légale ou client, réclamation, danger émergent. Moyen simple : toute demande de changement passe par REG-H-16.

## 6.10 Allergènes

Les allergènes sont un danger chimique grave (G = 4 dans la grille GEC-CI) et une cause majeure de rappels. Dans le contexte ivoirien :
- **Boulangerie-pâtisserie** : gluten, lait, œufs, fruits à coque, arachide, soja, sésame.
- **Cajou** : la noix de cajou est elle-même un allergène (fruit à coque). Toute ligne partagée avec d'autres produits doit être maîtrisée.
- **Cacao** : lait (chocolat au lait si l'usine en produit), soja (lécithine), fruits à coque.

Outils : MAT-H-02 (matrice), PRO-H-10, nettoyage validé, ordonnancement (sans allergène en premier), étiquetage vérifié à chaque changement de recette. Le Codex a publié un code d'usages sur la gestion des allergènes pour les exploitants (référence CXC 80-2020 selon nos informations, **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**). La liste réglementaire ivoirienne des allergènes à déclarer : **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT** ; pour l'export, appliquer la liste du pays de destination.

## 6.11 Gestion des urgences (8.4)

Scénarios typiques : coupure d'électricité pendant une pasteurisation ou une torréfaction, coupure d'eau empêchant le nettoyage, inondation d'un magasin de fèves, incendie, contamination volontaire, épidémie touchant le personnel, défaillance d'un fournisseur clé. Pour chaque scénario : effet sur les produits, conduite à tenir (blocage des lots en cours, évaluation), contacts, moyens. Test annuel par exercice ; enregistrement et retour d'expérience dans REG-H-15.

## 6.12 Maîtrise des produits et procédés non conformes (8.9)

1. **Corrections** : isoler et identifier les produits touchés, corriger la cause immédiate, remonter jusqu'au dernier contrôle conforme.
2. **Actions correctives** : analyse de cause pour les écarts significatifs ou répétés, vérification d'efficacité.
3. **Produits potentiellement dangereux** : blocage (FOR-H-07), aucune sortie sans décision documentée.
4. **Évaluation pour libération** : seulement si des preuves montrent que le danger est au niveau acceptable (analyses représentatives, efficacité d'une autre mesure).
5. **Devenir** : retraitement validé, déclassement vers un usage sûr (ex. alimentation animale si la réglementation le permet, **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**), ou destruction avec procès-verbal.

# Partie 7 — Compétences, formation et sensibilisation

## 7.1 Qui doit être compétent

| Public | Compétences attendues | Preuve |
|---|---|---|
| Direction | Enjeux, responsabilités, revue de direction, culture SDA | Émargement, participation à la revue |
| Responsable de l'équipe SDA | ISO 22000, HACCP approfondi, PRP, réglementation, gestion de crise | Attestations, expérience |
| Équipe SDA | Principes HACCP, analyse des dangers, validation | Attestations, participation aux réunions |
| Opérateurs CCP / PRPo | Surveillance, enregistrement, réaction en cas d'écart | Habilitation au poste (REG-H-05) |
| Tout le personnel | Hygiène, allergènes, signalement | Émargement, vérification orale |
| Auditeurs internes | ISO 22000, ISO 19011, techniques d'audit | Attestation, audit en binôme |
| Prestataires (nettoyage, nuisibles, maintenance) | Règles d'hygiène du site | Accueil sécurité des aliments |

## 7.2 Plan de formation type (PLAN-H-02)

| Module | Public | Durée indicative | Évaluation |
|---|---|---|---|
| M1 — Sensibilisation sécurité des aliments et hygiène | Tout le personnel, saisonniers | 2 h | Questions orales, observation au poste |
| M2 — Bonnes pratiques d'hygiène et PRP | Production, nettoyage, magasin | 4 h | Quiz, CHK-H-01 |
| M3 — Allergènes | Production, achats, étiquetage | 2 h | Étude de cas |
| M4 — HACCP et analyse des dangers | Équipe SDA | 2 à 3 jours | Exercice sur un produit du site |
| M5 — Surveillance des CCP et PRPo | Opérateurs concernés | 2 h par poste | Démonstration au poste, habilitation |
| M6 — ISO 22000 : exigences du système | Responsable SDA, cadres | 2 jours | Test écrit |
| M7 — Audit interne (ISO 19011) | Auditeurs internes | 2 jours | Audit en binôme |
| M8 — Traçabilité, retrait / rappel, crise | Direction, logistique, commercial | 3 h | Simulation |
| M9 — Culture SDA, fraude et défense alimentaires (anticipation) | Cadres, équipe SDA | 3 h | Évaluation de vulnérabilité réalisée |

## 7.3 Évaluation de l'efficacité

Une formation n'est efficace que si le comportement change : observation au poste après 1 mois, résultats d'inspection PRP, taux de fiches CCP complètes, questions de l'auditeur aux opérateurs. Les saisonniers de la campagne de cajou ou de cacao sont formés **avant** leur prise de poste ; un opérateur non habilité ne surveille pas un CCP.

## 7.4 Sensibilisation au quotidien

Pictogrammes aux entrées, consignes en images, réunion de 5 minutes en début de poste, affichage des résultats (score PRP, réclamations), valorisation des signalements. Utiliser les langues comprises par le personnel.

# Partie 8 — Indicateurs, audit interne et revue de direction

## 8.1 Tableau de bord

| Indicateur | Source | Fréquence |

| Complétude des enregistrements (KPI-H-02) | FOR-H-05 | Hebdomadaire |
| Score PRP (KPI-H-03) | CHK-H-01 | Mensuelle |
| Conformité contaminants (KPI-H-04) | REG-H-12 | Mensuelle |
| Réclamations sécurité (KPI-H-07) | REG-H-14 | Mensuelle |

| Étalonnage à jour (KPI-H-13) | REG-H-11 | Mensuelle |

Les cibles sans historique sont fixées « après 3 mois de mesure ».

## 8.2 Programme d'audit interne (PLAN-H-03, PRO-H-20)

- Couvrir tous les articles et toutes les zones au moins une fois par an ; plus souvent pour les processus à risque (CCP, réception des matières, allergènes) ou après incident.
- Auditeurs formés (ISO 19011), indépendants de l'activité auditée. Dans une PME, échanger les auditeurs entre services ou faire appel à un auditeur externe.
- Méthode : préparation (check-list issue de clauses.json), observation terrain pendant la production, entretiens, échantillonnage d'enregistrements, traçage d'un lot de bout en bout.
- Rapport RAP-H-01 : points forts, non-conformités (avec preuve), observations ; actions suivies dans REG-H-13.

## 8.3 Revue de direction (PRO-H-21, RAP-H-02)

**Éléments d'entrée** : suivi des décisions précédentes ; changements de contexte (climat, marchés, réglementation) ; indicateurs et objectifs ; résultats de vérification et d'analyses ; audits internes et externes ; réclamations et communications externes ; urgences, incidents, retraits et rappels ; performance des fournisseurs ; adéquation des ressources ; risques et opportunités ; efficacité des mises à jour du système.

**Éléments de sortie** : décisions d'amélioration ; mises à jour du système (analyse des dangers, PRP, plan) ; ressources (budget analyses, travaux, recrutements) ; révision de la politique et des objectifs ; pilotes et échéances.

Fréquence : la norme demande des intervalles planifiés ; GEC-CI recommande au moins une revue par an (catégorie D) et une revue semestrielle la première année.

# Partie 9 — Non-conformités, actions correctives et amélioration continue

## 9.1 Méthode

1. **Détecter et enregistrer** (FOR-H-06, REG-H-13) : source, description factuelle, lots concernés.
2. **Corriger** : traiter le produit (FOR-H-07) et la situation immédiate.
3. **Analyser la cause** :
   - **5 pourquoi** : exemple — « Température de pasteurisation trop basse. Pourquoi ? Vanne vapeur mal réglée. Pourquoi ? Réglage modifié après maintenance. Pourquoi ? Aucune vérification après intervention. Pourquoi ? La procédure de maintenance n'inclut pas de remise en service contrôlée. Pourquoi ? La maintenance n'a pas été associée à l'équipe SDA. » → action : remise en service contrôlée et maintenance intégrée à l'équipe SDA.
   - **Ishikawa (5M)** : Matière (fèves humides), Méthode (séchage insuffisant), Milieu (saison des pluies, magasin mal ventilé), Main-d'œuvre (contrôleur non formé), Matériel (humidimètre non étalonné).
4. **Agir** : action corrective proportionnée, pilote, échéance.
5. **Vérifier l'efficacité** : après un délai défini, l'écart a-t-il disparu ? (KPI-H-12).
6. **Mettre à jour** le système si nécessaire (REG-H-16).

## 9.2 Amélioration continue

Sources d'amélioration : tendances des indicateurs, audits, réclamations, retours d'expérience des simulations, nouvelles technologies (sondes enregistreuses, détecteurs plus sensibles, plateforme numérique), suggestions du personnel. Chaque année, montrer au moins quelques améliorations concrètes et mesurées.

## 9.3 Erreurs fréquentes

- Clore une NC sans vérifier l'efficacité.
- Confondre correction (« on a nettoyé ») et action corrective (« on a changé le plan de nettoyage »).
- Analyser les causes seul, sans le terrain.
- Ne jamais relier les NC aux tendances.

## 10.1 Choix de l'organisme certificateur

Comparer au moins deux organismes : accréditation (ISO 22000 et/ou FSSC 22000, catégories concernées), reconnaissance par vos clients, auditeurs francophones expérimentés dans votre secteur, transparence du calcul de durée d'audit, délais, frais de déplacement. Les coûts sont sur devis : **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**.

## 10.3 Déroulé de l'audit

Réunion d'ouverture → visite du site (l'auditeur commence souvent par la réception et les zones sensibles) → revue documentaire et des enregistrements → entretiens avec opérateurs → traçage d'un lot → réunion de clôture. Conseils : répondre honnêtement, montrer les preuves, ne jamais inventer ni compléter un enregistrement pendant l'audit. Le consultant GEC-CI peut être présent en observateur selon les règles de l'organisme ; il ne répond pas à la place de l'entreprise.

## 10.4 Après l'audit

Analyser chaque non-conformité (cause, action, preuve), respecter les délais de réponse de l'organisme, mettre à jour le système. Communiquer le résultat au personnel.

## 10.5 Maintien

Programme de maintien annuel : audits internes, revues de direction, exercices de traçabilité, simulations de rappel et d'urgence, revue annuelle de l'analyse des dangers, réévaluation des fournisseurs, recyclage des formations, préparation des audits de surveillance. Pour FSSC 22000, se préparer aux audits non annoncés (règles **À CONFIRMER AUPRÈS DE L'ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT**).

## 10.6 Gestion des modifications de normes

Veille sur : révision d'ISO 22000 (publication attendue en 2027), éventuels amendements, FSSC 22000 v7 (audits à partir du 1er mai 2027), parties de la série ISO 22002-x, évolutions des limites UE de contaminants. À chaque nouveauté : analyse d'écart, plan de mise à jour, formation, information de l'organisme certificateur.
