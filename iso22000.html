é (analyses, nuisibles, formation, maintenance)"], "registre": "RAP-H-02", "responsable": "Direction générale", "risque": "Élevé", "question": "La direction consacre-t-elle du temps et un budget identifiable à la sécurité des aliments ?", "nouveau": "Révision en cours (DIS) : introduction annoncée de la culture de la sécurité des aliments. Contenu et numérotation non vérifiés.", "confirmer": true}, {"code": "5.2.1", "chapitre": "5", "titre": "Établir la politique de sécurité des denrées alimentaires", "resume": "Rédiger une politique adaptée à l'entreprise, qui engage à respecter les exigences légales et clients, à communiquer, à améliorer et qui donne un cadre aux objectifs.", "doc": "Information à tenir à jour : politique SDA", "preuves": ["Politique signée et datée", "Lien visible entre politique et objectifs chiffrés"], "registre": "REG-H-04", "responsable": "Direction générale", "risque": "Faible", "question": "Avez-vous une politique de sécurité des aliments signée par la direction et adaptée à votre activité ?", "nouveau": "", "confirmer": false}, {"code": "5.2.2", "chapitre": "5", "titre": "Communiquer la politique", "resume": "Rendre la politique disponible, la faire comprendre à tous les niveaux et la mettre à disposition des parties intéressées concernées. L'auditeur interroge des opérateurs.", "doc": "Information à tenir à jour : politique accessible", "preuves": ["Affichage en langue comprise par le personnel", "Feuilles d'émargement de sensibilisation"], "registre": "REG-H-05", "responsable": "Responsable SDA / RH", "risque": "Faible", "question": "Un opérateur de ligne peut-il expliquer en ses mots ce que la politique lui demande ?", "nouveau": "", "confirmer": false}, {"code": "5.3", "chapitre": "5", "titre": "Rôles, responsabilités et autorités", "resume": "Attribuer et communiquer les responsabilités, nommer le responsable de l'équipe SDA et donner à chacun l'autorité de signaler les problèmes et de déclencher les actions nécessaires.", "doc": "Information à tenir à jour (recommandée) : organigramme, fiches de fonction", "preuves": ["Note de nomination du responsable de l'équipe SDA", "Fiches de fonction incluant l'arrêt de ligne en cas de danger"], "registre": "REG-H-05", "responsable": "Direction générale", "risque": "Moyen", "question": "Chaque personne sait-elle qui alerter et a-t-elle le droit d'arrêter la production en cas de danger ?", "nouveau": "", "confirmer": false}, {"code": "6.1", "chapitre": "6", "titre": "Actions face aux risques et opportunités", "resume": "À partir du contexte et des parties intéressées, identifier les risques et opportunités du système (pas les dangers produits), planifier des actions proportionnées et vérifier leur efficacité.", "doc": "", "preuves": ["Registre des risques et opportunités coté", "Actions intégrées dans le plan d'action annuel"], "registre": "REG-H-02", "responsable": "Direction / Responsable SDA", "risque": "Moyen", "question": "Avez-vous identifié ce qui peut empêcher votre système de fonctionner (départ d'une personne clé, panne labo, fournisseur unique) ?", "nouveau": "", "confirmer": false}, {"code": "6.2", "chapitre": "6", "titre": "Objectifs du SMSDA et planification", "resume": "Fixer des objectifs mesurables, cohérents avec la politique, suivis et communiqués, avec responsable, moyens, échéance et méthode d'évaluation des résultats.", "doc": "Information à conserver : objectifs du SMSDA", "preuves": ["Tableau des objectifs avec cible, pilote, échéance", "Suivi mensuel des indicateurs"], "registre": "REG-H-02", "responsable": "Direction / Responsable SDA", "risque": "Moyen", "question": "Avez-vous des objectifs chiffrés de sécurité des aliments suivis chaque mois ?", "nouveau": "", "confirmer": false}, {"code": "6.3", "chapitre": "6", "titre": "Planification des modifications", "resume": "Avant tout changement du système (nouveau produit, nouvelle ligne, nouveau fournisseur, réorganisation), en évaluer les conséquences, les ressources et les responsabilités, puis l'exécuter de façon maîtrisée.", "doc": "", "preuves": ["Fiches de changement avec revue de l'analyse des dangers", "Validation avant démarrage"], "registre": "REG-H-16", "responsable": "Responsable SDA / Production", "risque": "Élevé", "question": "Revoyez-vous l'analyse des dangers avant de lancer un nouveau produit, un nouvel ingrédient ou une nouvelle machine ?", "nouveau": "", "confirmer": false}, {"code": "7.1.1", "chapitre": "7", "titre": "Ressources — généralités", "resume": "Déterminer et fournir les ressources internes et externes nécessaires au système : personnes, locaux, équipements, laboratoires, prestataires, budget. Tenir compte des contraintes réelles.", "doc": "", "preuves": ["Budget SDA validé", "Plan d'investissement lié aux écarts PRP"], "registre": "RAP-H-02", "responsable": "Direction générale", "risque": "Moyen", "question": "Les moyens (personnel, matériel, analyses) sont-ils prévus avant que les problèmes surviennent ?", "nouveau": "", "confirmer": false}, {"code": "7.1.2", "chapitre": "7", "titre": "Personnes", "resume": "Disposer de personnes compétentes pour faire fonctionner le système. Quand un expert externe intervient (consultant, laboratoire), un accord écrit précise sa compétence et ses responsabilités.", "doc": "Information à conserver : accords avec experts externes", "preuves": ["Contrat ou lettre de mission de l'expert externe", "Preuves de compétence (CV, attestations)"], "registre": "REG-H-05", "responsable": "RH / Direction", "risque": "Moyen", "question": "Si vous faites appel à un consultant ou à un expert HACCP externe, son rôle est-il défini par écrit ?", "nouveau": "", "confirmer": false}, {"code": "7.1.3", "chapitre": "7", "titre": "Infrastructure", "resume": "Fournir et entretenir bâtiments, équipements, utilités (eau, électricité, air, vapeur), transport et systèmes d'information nécessaires pour respecter les exigences de sécurité des aliments.", "doc": "", "preuves": ["Plan de maintenance préventive", "Plan des locaux avec zonage hygiénique"], "registre": "REG-H-11", "responsable": "Maintenance / Production", "risque": "Élevé", "question": "Vos bâtiments et machines sont-ils entretenus selon un plan, avec des matériaux adaptés au contact alimentaire ?", "nouveau": "", "confirmer": false}, {"code": "7.1.4", "chapitre": "7", "titre": "Environnement de travail", "resume": "Maîtriser l'environnement de travail (températures, humidité, poussières, propreté, flux personnes et produits) pour qu'il ne contamine pas les produits.", "doc": "", "preuves": ["Relevés température / humidité des zones sensibles", "Plan de circulation propre / sale"], "registre": "REG-H-09", "responsable": "Production / Responsable SDA", "risque": "Moyen", "question": "Les zones de production sont-elles séparées et maîtrisées (température, poussière, circulation) ?", "nouveau": "", "confirmer": false}, {"code": "7.1.5", "chapitre": "7", "titre": "Éléments du SMSDA développés en externe", "resume": "Si un élément du système vient de l'extérieur (guide HACCP sectoriel, modèle de consultant, plan type), vérifier qu'il est adapté au site, conforme à la norme et réellement appliqué.", "doc": "Information à tenir à jour : éléments externes adaptés", "preuves": ["Revue documentée d'adaptation au site", "Version datée et approuvée par l'équipe SDA"], "registre": "REG-H-04", "responsable": "Équipe SDA", "risque": "Moyen", "question": "Les documents fournis par un consultant ou un guide ont-ils été adaptés à votre usine et validés par votre équipe ?", "nouveau": "", "confirmer": false}, {"code": "7.1.6", "chapitre": "7", "titre": "Maîtrise des processus, produits et services externes", "resume": "Choisir, évaluer, surveiller et réévaluer les fournisseurs et prestataires (matières, emballages, transport, nuisibles, laboratoires) selon leur impact sur la sécurité, et leur communiquer les exigences.", "doc": "Information à conserver : évaluations et réévaluations", "preuves": ["Liste des fournisseurs approuvés avec notes", "Cahiers des charges et certificats d'analyse"], "registre": "REG-H-06", "responsable": "Achats / Responsable SDA", "risque": "Élevé", "question": "Évaluez-vous vos fournisseurs de matières, d'emballages et vos prestataires (nuisibles, transport, laboratoire) au moins une fois par an ?", "nouveau": "", "confirmer": false}, {"code": "7.2", "chapitre": "7", "titre": "Compétences", "resume": "Définir les compétences nécessaires (équipe SDA, opérateurs CCP, prestataires), former, évaluer l'efficacité et garder les preuves. L'équipe SDA doit couvrir HACCP, produits, process et réglementation.", "doc": "Information à conserver : preuves de compétence", "preuves": ["Matrice des compétences par poste", "Attestations de formation HACCP de l'équipe SDA"], "registre": "REG-H-05", "responsable": "RH / Responsable SDA", "risque": "Élevé", "question": "Les personnes qui surveillent les CCP ont-elles été formées et évaluées sur ce poste ?", "nouveau": "", "confirmer": false}, {"code": "7.3", "chapitre": "7", "titre": "Sensibilisation", "resume": "Chaque personne connaît la politique, sa contribution au système, les conséquences d'un écart et son rôle pour la sécurité des aliments.", "doc": "", "preuves": ["Sessions de sensibilisation émargées", "Entretiens terrain avec opérateurs"], "registre": "REG-H-05", "responsable": "Responsable SDA", "risque": "Moyen", "question": "Vos opérateurs savent-ils ce qui peut arriver au consommateur s'ils ne respectent pas une consigne ?", "nouveau": "", "confirmer": false}, {"code": "7.4.1", "chapitre": "7", "titre": "Communication — généralités", "resume": "Organiser qui communique quoi, quand, à qui et comment, en interne et en externe, sur les sujets liés à la sécurité des aliments.", "doc": "", "preuves": ["Matrice de communication", "Liste des contacts clés (autorités, clients, laboratoires)"], "registre": "REG-H-14", "responsable": "Responsable SDA / Direction", "risque": "Faible", "question": "Savez-vous qui parle aux clients et aux autorités en cas de problème sanitaire ?", "nouveau": "", "confirmer": false}, {"code": "7.4.2", "chapitre": "7", "titre": "Communication externe", "resume": "Échanger avec fournisseurs, clients, consommateurs et autorités les informations utiles sur les dangers : étiquetage, allergènes, durée de vie, réclamations, alertes. Garder les preuves.", "doc": "Information à conserver : communications externes", "preuves": ["Registre des réclamations et réponses", "Fiches techniques transmises aux clients"], "registre": "REG-H-14", "responsable": "Commercial / Responsable SDA", "risque": "Moyen", "question": "Enregistrez-vous les réclamations et les échanges avec les autorités et clients sur la sécurité de vos produits ?", "nouveau": "Révision en cours (DIS) : ajout annoncé d'une exigence spécifique sur le traitement des réclamations. Non vérifié.", "confirmer": true}, {"code": "7.4.3", "chapitre": "7", "titre": "Communication interne", "resume": "Informer l'équipe SDA à temps des changements (produits, matières, process, locaux, exigences légales, réclamations, nouveaux dangers) pour mettre à jour le système.", "doc": "", "preuves": ["Comptes rendus des réunions équipe SDA", "Fiches de changement transmises à l'équipe SDA"], "registre": "REG-H-16", "responsable": "Responsable de l'équipe SDA", "risque": "Moyen", "question": "L'équipe SDA est-elle prévenue avant chaque changement de recette, de fournisseur ou de machine ?", "nouveau": "", "confirmer": false}, {"code": "7.5.1", "chapitre": "7", "titre": "Informations documentées — généralités", "resume": "Disposer des documents et enregistrements exigés par la norme, par la loi et par les clients, ainsi que de ceux que l'entreprise juge nécessaires.", "doc": "Selon besoins de l'organisme", "preuves": ["Liste maîtresse des documents", "Liste des enregistrements avec durée de conservation"], "registre": "REG-H-04", "responsable": "Responsable SDA", "risque": "Moyen", "question": "Avez-vous une liste à jour de tous vos documents et enregistrements HACCP ?", "nouveau": "", "confirmer": false}, {"code": "7.5.2", "chapitre": "7", "titre": "Création et mise à jour", "resume": "Identifier, mettre en forme, revoir et approuver chaque document avant diffusion (titre, code, version, date, approbateur).", "doc": "", "preuves": ["Cartouche de version sur chaque document", "Trace d'approbation"], "registre": "REG-H-04", "responsable": "Responsable SDA", "risque": "Faible", "question": "Chaque document porte-t-il un code, une version et une signature d'approbation ?", "nouveau": "", "confirmer": false}, {"code": "7.5.3", "chapitre": "7", "titre": "Maîtrise des informations documentées", "resume": "Rendre les documents disponibles au poste, les protéger, maîtriser les versions, conserver les enregistrements sur une durée adaptée à la durée de vie du produit et aux exigences légales.", "doc": "", "preuves": ["Absence de versions périmées au poste", "Sauvegardes et archives des enregistrements"], "registre": "REG-H-04", "responsable": "Responsable SDA", "risque": "Moyen", "question": "Retrouvez-vous en moins de 10 minutes un enregistrement CCP d'il y a 12 mois ?", "nouveau": "", "confirmer": false}, {"code": "8.1", "chapitre": "8", "titre": "Planification et maîtrise opérationnelles", "resume": "Planifier, mettre en œuvre et maîtriser les processus de réalisation : critères, PRP, plan de maîtrise des dangers, changements, processus externalisés. Le terrain doit correspondre aux documents.", "doc": "Information nécessaire pour démontrer la maîtrise", "preuves": ["Plan de maîtrise des dangers en vigueur", "Enregistrements de production complets"], "registre": "PLAN-H-01", "responsable": "Production / Responsable SDA", "risque": "Élevé", "question": "Ce qui est écrit dans votre plan HACCP correspond-il exactement à ce qui se fait sur la ligne ?", "nouveau": "", "confirmer": false}, {"code": "8.2", "chapitre": "8", "titre": "Programmes prérequis (PRP)", "resume": "Mettre en place et maintenir les PRP adaptés au site, en s'appuyant sur ISO 22002 et la réglementation : locaux, eau, nettoyage, nuisibles, hygiène, allergènes, fournisseurs, stockage, transport. Les vérifier.", "doc": "Information à tenir à jour : sélection, mise en œuvre et vérification des PRP", "preuves": ["Programmes PRP écrits par thème", "Inspections PRP et enregistrements (nettoyage, nuisibles, eau)"], "registre": "REG-H-09", "responsable": "Responsable SDA / Production / Maintenance", "risque": "Élevé", "question": "Vos bonnes pratiques d'hygiène (nettoyage, nuisibles, eau, personnel) sont-elles écrites, appliquées et vérifiées ?", "nouveau": "Série ISO 22002-x:2025 publiée (dont 22002-100 tronc commun) ; exigée par FSSC 22000 v7. Révision ISO 22000 : fraude et défense alimentaires annoncées, numérotation non vérifiée.", "confirmer": true}, {"code": "8.3", "chapitre": "8", "titre": "Système de traçabilité", "resume": "Identifier les lots de matières, d'emballages et de produits, relier amont et aval, conserver les enregistrements et tester le système par des exercices réguliers.", "doc": "Information à conserver : preuves de traçabilité, résultats d'exercices", "preuves": ["Fiches lot réception-production-expédition", "Rapport d'exercice de traçabilité avec bilan matière"], "registre": "REG-H-08", "responsable": "Responsable SDA / Logistique", "risque": "Élevé", "question": "Pouvez-vous retrouver en moins de 4 heures tous les clients ayant reçu un lot donné et ses matières d'origine ?", "nouveau": "", "confirmer": false}, {"code": "8.4.1", "chapitre": "8", "titre": "Préparation et réponse aux situations d'urgence — généralités", "resume": "Prévoir les urgences pouvant toucher la sécurité des aliments (incendie, inondation, coupure d'eau ou d'électricité, contamination, sabotage, épidémie) et les réponses associées.", "doc": "Information à tenir à jour : procédures d'urgence", "preuves": ["Liste des scénarios d'urgence SDA", "Procédure de réponse avec contacts"], "registre": "REG-H-15", "responsable": "Direction / Responsable SDA", "risque": "Moyen", "question": "Savez-vous quoi faire de vos produits en cours en cas de coupure d'eau ou de courant prolongée ?", "nouveau": "", "confirmer": false}, {"code": "8.4.2", "chapitre": "8", "titre": "Traitement des urgences et incidents", "resume": "Réagir aux urgences réelles, limiter les conséquences, informer les parties concernées, tester périodiquement les plans et les revoir après chaque incident ou exercice.", "doc": "Information à tenir à jour : retours d'expérience", "preuves": ["Comptes rendus d'exercice", "Revue du plan après incident"], "registre": "REG-H-15", "responsable": "Direction / Responsable SDA", "risque": "Moyen", "question": "Avez-vous testé au moins un scénario d'urgence cette année et tiré des leçons écrites ?", "nouveau": "", "confirmer": false}, {"code": "8.5.1.1", "chapitre": "8", "titre": "Étapes préliminaires — généralités", "resume": "Rassembler, tenir à jour et conserver toutes les informations de base nécessaires à l'analyse des dangers : exigences légales, clients, produits, process, équipements, dangers connus.", "doc": "Information à tenir à jour : données préliminaires", "preuves": ["Dossier préliminaire HACCP", "Composition de l'équipe SDA"], "registre": "MAT-H-01", "responsable": "Équipe SDA", "risque": "Élevé", "question": "Votre équipe HACCP dispose-t-elle d'un dossier complet (produits, process, exigences) avant l'analyse des dangers ?", "nouveau": "", "confirmer": false}, {"code": "8.5.1.2", "chapitre": "8", "titre": "Caractéristiques des matières premières, ingrédients et matériaux au contact", "resume": "Décrire chaque matière, ingrédient et emballage : origine, composition, caractéristiques, mode d'obtention, conditionnement, conservation, critères d'acceptation, exigences légales.", "doc": "Information à tenir à jour : fiches matières", "preuves": ["Fiches techniques matières et emballages", "Certificats d'aptitude au contact alimentaire"], "registre": "REG-H-07", "responsable": "Achats / Responsable SDA", "risque": "Élevé", "question": "Avez-vous une fiche descriptive à jour pour chaque matière première, ingrédient et emballage ?", "nouveau": "", "confirmer": false}, {"code": "8.5.1.3", "chapitre": "8", "titre": "Caractéristiques des produits finis", "resume": "Décrire chaque produit fini : composition, caractéristiques physico-chimiques et microbiologiques, durée de vie, conditionnement, étiquetage, mode de distribution et exigences légales applicables.", "doc": "Information à tenir à jour : fiches produits finis", "preuves": ["Fiches produits finis signées", "Étiquettes conformes"], "registre": "FOR-H-03", "responsable": "Responsable SDA / Qualité", "risque": "Moyen", "question": "Chaque produit vendu a-t-il une fiche technique décrivant composition, durée de vie et conditions de conservation ?", "nouveau": "", "confirmer": false}, {"code": "8.5.1.4", "chapitre": "8", "titre": "Usage prévu", "resume": "Préciser l'usage normal du produit, les mauvais usages raisonnablement prévisibles et les consommateurs vulnérables (enfants, allergiques, malades).", "doc": "Information à tenir à jour : usage prévu", "preuves": ["Rubrique usage prévu dans chaque fiche produit", "Identification des populations sensibles"], "registre": "FOR-H-03", "responsable": "Équipe SDA", "risque": "Moyen", "question": "Avez-vous défini qui consomme votre produit et comment il peut être mal utilisé ?", "nouveau": "", "confirmer": false}, {"code": "8.5.1.5.1", "chapitre": "8", "titre": "Élaboration des diagrammes de fabrication", "resume": "Établir pour chaque produit ou catégorie un diagramme complet : étapes, entrées, sorties, recyclages, retraitements, sous-traitance, déchets, eau, emballages.", "doc": "Information à tenir à jour : diagrammes", "preuves": ["Diagrammes datés par ligne", "Entrées et sorties identifiées"], "registre": "FOR-H-04", "responsable": "Équipe SDA / Production", "risque": "Élevé", "question": "Avez-vous un diagramme de fabrication complet pour chaque ligne, y compris les retraitements et déchets ?", "nouveau": "", "confirmer": false}, {"code": "8.5.1.5.2", "chapitre": "8", "titre": "Confirmation des diagrammes sur site", "resume": "L'équipe SDA vérifie les diagrammes sur le terrain, pendant la production, et les met à jour. C'est un point très contrôlé en audit.", "doc": "Information à conserver : diagrammes vérifiés", "preuves": ["Diagramme signé « vérifié sur site » avec date et noms", "Écarts corrigés"], "registre": "FOR-H-04", "responsable": "Équipe SDA", "risque": "Élevé", "question": "Vos diagrammes ont-ils été vérifiés sur la ligne en marche, avec date et signatures ?", "nouveau": "", "confirmer": false}, {"code": "8.5.1.5.3", "chapitre": "8", "titre": "Description des procédés et de l'environnement", "resume": "Décrire l'implantation, les équipements, les paramètres de procédé, les PRP existants, les exigences externes et les variations saisonnières ou d'équipes pouvant influencer les dangers.", "doc": "", "preuves": ["Plan d'implantation et flux", "Paramètres de procédé par étape"], "registre": "FOR-H-04", "responsable": "Équipe SDA / Production", "risque": "Moyen", "question": "Les paramètres du procédé (temps, température, humidité) sont-ils décrits pour chaque étape ?", "nouveau": "", "confirmer": false}, {"code": "8.5.2.1", "chapitre": "8", "titre": "Analyse des dangers — généralités", "resume": "L'équipe SDA réalise l'analyse des dangers à partir des informations préliminaires pour décider quels dangers doivent être maîtrisés et comment.", "doc": "", "preuves": ["Matrice d'analyse des dangers approuvée", "Compte rendu de réunion de l'équipe SDA"], "registre": "MAT-H-01", "responsable": "Équipe SDA", "risque": "Élevé", "question": "L'analyse des dangers a-t-elle été faite en équipe pluridisciplinaire et non par une seule personne ?", "nouveau": "", "confirmer": false}, {"code": "8.5.2.2", "chapitre": "8", "titre": "Identification des dangers et niveaux acceptables", "resume": "Lister, étape par étape, les dangers biologiques, chimiques (dont allergènes, mycotoxines, pesticides) et physiques raisonnablement prévisibles, et fixer pour chacun un niveau acceptable dans le produit fini.", "doc": "Information à conserver : dangers identifiés et niveaux acceptables", "preuves": ["Liste des dangers par étape avec source", "Niveaux acceptables justifiés (loi, client, Codex, UE)"], "registre": "MAT-H-01", "responsable": "Équipe SDA", "risque": "Élevé", "question": "Pour chaque danger, avez-vous un niveau acceptable chiffré et justifié (loi, client, Codex) ?", "nouveau": "", "confirmer": false}, {"code": "8.5.2.3", "chapitre": "8", "titre": "Évaluation des dangers", "resume": "Évaluer chaque danger selon la probabilité et la gravité avant maîtrise, pour décider s'il est significatif et doit être maîtrisé par des mesures spécifiques.", "doc": "Information à conserver : méthode et résultats", "preuves": ["Méthode de cotation écrite", "Résultats de cotation et justification"], "registre": "MAT-H-01", "responsable": "Équipe SDA", "risque": "Élevé", "question": "Avez-vous une méthode écrite pour décider qu'un danger est significatif ?", "nouveau": "", "confirmer": false}, {"code": "8.5.2.4", "chapitre": "8", "titre": "Choix et catégorisation des mesures de maîtrise", "resume": "Pour chaque danger significatif, choisir des mesures de maîtrise et les classer en PRPo ou CCP selon une méthode logique (faisabilité, limites mesurables, gravité, défaillance, détection).", "doc": "Information à tenir à jour : méthode de catégorisation et résultats", "preuves": ["Grille de catégorisation PRPo / CCP", "Justification écrite pour chaque mesure"], "registre": "MAT-H-01", "responsable": "Équipe SDA", "risque": "Élevé", "question": "Pouvez-vous expliquer pourquoi telle étape est un CCP et telle autre un PRPo ?", "nouveau": "Révision en cours (DIS) : annexe informative annoncée sur le choix des mesures de maîtrise. Non vérifiée.", "confirmer": true}, {"code": "8.5.3", "chapitre": "8", "titre": "Validation des mesures de maîtrise", "resume": "Avant mise en œuvre et après tout changement, démontrer par des preuves (essais, littérature, données fournisseurs, études) que les mesures permettent d'atteindre le niveau acceptable.", "doc": "Information à conserver : méthode et preuves de validation", "preuves": ["Dossier de validation (essais, études, références)", "Revalidation après modification"], "registre": "RAP-H-03", "responsable": "Équipe SDA", "risque": "Élevé", "question": "Avez-vous prouvé, par des essais ou des références, que votre torréfaction / pasteurisation / tamisage élimine réellement le danger ?", "nouveau": "", "confirmer": false}, {"code": "8.5.4.1", "chapitre": "8", "titre": "Plan de maîtrise des dangers — généralités", "resume": "Établir un plan qui, pour chaque CCP et PRPo, précise dangers, mesures, limites critiques ou critères d'action, surveillance, corrections, actions correctives, responsables et enregistrements.", "doc": "Information à tenir à jour : plan de maîtrise des dangers", "preuves": ["Plan HACCP / PRPo signé", "Version en vigueur au poste"], "registre": "PLAN-H-01", "responsable": "Équipe SDA", "risque": "Élevé", "question": "Votre plan HACCP indique-t-il, pour chaque point critique, la limite, qui surveille, comment et quoi faire en cas d'écart ?", "nouveau": "", "confirmer": false}, {"code": "8.5.4.2", "chapitre": "8", "titre": "Limites critiques et critères d'action", "resume": "Fixer des limites critiques mesurables pour les CCP et des critères d'action mesurables ou observables pour les PRPo, et conserver la justification de leur choix.", "doc": "Information à conserver : justification des limites et critères", "preuves": ["Limites chiffrées (ex. °C, minutes, mm de grille)", "Références de justification"], "registre": "PLAN-H-01", "responsable": "Équipe SDA", "risque": "Élevé", "question": "Vos limites critiques sont-elles chiffrées et justifiées par une source ?", "nouveau": "", "confirmer": false}, {"code": "8.5.4.3", "chapitre": "8", "titre": "Systèmes de surveillance des CCP et PRPo", "resume": "Surveiller chaque CCP pour détecter à temps tout dépassement et chaque PRPo selon une méthode, une fréquence, un responsable et un enregistrement définis. Équipements de mesure maîtrisés.", "doc": "Information à conserver : enregistrements de surveillance", "preuves": ["Fiches de surveillance remplies en temps réel", "Signatures et heures"], "registre": "FOR-H-05", "responsable": "Opérateurs CCP / Chefs d'équipe", "risque": "Élevé", "question": "Les relevés CCP sont-ils remplis au moment du contrôle, et non recopiés en fin de journée ?", "nouveau": "", "confirmer": false}, {"code": "8.5.4.4", "chapitre": "8", "titre": "Actions en cas de dépassement", "resume": "Définir à l'avance quoi faire si une limite critique ou un critère d'action n'est pas respecté : isoler le produit, corriger, rechercher la cause, et ne pas libérer un produit potentiellement dangereux.", "doc": "Information à conserver : actions réalisées", "preuves": ["Fiches de non-conformité liées aux écarts CCP/PRPo", "Décisions sur les produits concernés"], "registre": "REG-H-13", "responsable": "Chef de production / Responsable SDA", "risque": "Élevé", "question": "Quand une température ou un détecteur de métaux est en défaut, savez-vous quels lots bloquer et qui décide ?", "nouveau": "", "confirmer": false}, {"code": "8.5.4.5", "chapitre": "8", "titre": "Mise en œuvre du plan de maîtrise des dangers", "resume": "Appliquer et maintenir le plan sur le terrain et en garder les preuves. L'auditeur compare le plan, les fiches de surveillance et les pratiques observées.", "doc": "Information à conserver : preuves de mise en œuvre", "preuves": ["Enregistrements de surveillance complets", "Observations terrain conformes"], "registre": "FOR-H-05", "responsable": "Production / Responsable SDA", "risque": "Élevé", "question": "Tous les CCP et PRPo de votre plan sont-ils effectivement surveillés chaque jour de production ?", "nouveau": "", "confirmer": false}, {"code": "8.6", "chapitre": "8", "titre": "Mise à jour des informations relatives aux PRP et au plan de maîtrise", "resume": "Après toute modification (produit, matière, process, exigence légale, nouveau danger), mettre à jour les informations préliminaires, les PRP et le plan de maîtrise des dangers.", "doc": "Information à tenir à jour : PRP et plan actualisés", "preuves": ["Historique des versions du plan HACCP", "Lien entre changements et mises à jour"], "registre": "REG-H-16", "responsable": "Responsable de l'équipe SDA", "risque": "Moyen", "question": "Votre plan HACCP a-t-il été mis à jour après le dernier changement de recette ou de fournisseur ?", "nouveau": "", "confirmer": false}, {"code": "8.7", "chapitre": "8", "titre": "Maîtrise de la surveillance et de la mesure", "resume": "Étalonner ou vérifier les thermomètres, balances, sondes, détecteurs de métaux et logiciels de mesure ; évaluer les résultats passés si un appareil est trouvé hors tolérance.", "doc": "Information à conserver : étalonnages et vérifications", "preuves": ["Certificats d'étalonnage raccordés", "Vérifications internes (ex. thermomètre contre référence)"], "registre": "REG-H-11", "responsable": "Maintenance / Responsable SDA", "risque": "Élevé", "question": "Vos thermomètres et détecteurs de métaux sont-ils vérifiés et étalonnés selon un calendrier ?", "nouveau": "", "confirmer": false}, {"code": "8.8.1", "chapitre": "8", "titre": "Vérification des PRP et du plan de maîtrise", "resume": "Planifier des activités de vérification (revue des enregistrements, analyses de laboratoire, inspections) pour confirmer que PRP et plan sont appliqués et efficaces. Le vérificateur n'est pas le surveillant.", "doc": "Information à conserver : résultats de vérification", "preuves": ["Plan de vérification", "Bulletins d'analyses et revues signées"], "registre": "PLAN-H-04", "responsable": "Responsable SDA", "risque": "Élevé", "question": "Une personne autre que l'opérateur relit-elle et vise-t-elle les fiches CCP ?", "nouveau": "", "confirmer": false}, {"code": "8.8.2", "chapitre": "8", "titre": "Analyse des résultats de vérification", "resume": "L'équipe SDA analyse les résultats de vérification pour juger de la performance du système et alimenter la revue de direction et la mise à jour.", "doc": "", "preuves": ["Synthèse périodique des vérifications", "Tendances analytiques (contaminants, microbiologie)"], "registre": "PLAN-H-04", "responsable": "Équipe SDA", "risque": "Moyen", "question": "Faites-vous chaque trimestre une synthèse des résultats d'analyses et de contrôles ?", "nouveau": "", "confirmer": false}, {"code": "8.9.1", "chapitre": "8", "titre": "Maîtrise des non-conformités produits et procédés — généralités", "resume": "Analyser les données de surveillance des PRPo et CCP par des personnes compétentes et autorisées, capables de déclencher corrections et actions correctives.", "doc": "", "preuves": ["Désignation des personnes habilitées", "Revue des données de surveillance"], "registre": "REG-H-13", "responsable": "Responsable SDA", "risque": "Moyen", "question": "Les personnes qui décident du sort d'un produit non conforme sont-elles nommément désignées ?", "nouveau": "", "confirmer": false}, {"code": "8.9.2", "chapitre": "8", "titre": "Corrections", "resume": "En cas de dépassement, identifier et maîtriser les produits touchés, corriger immédiatement, revoir les produits depuis le dernier contrôle conforme et enregistrer.", "doc": "Information à conserver : corrections et produits concernés", "preuves": ["Fiches de correction avec lots concernés", "Preuves d'isolement physique (étiquette « bloqué »)"], "registre": "REG-H-13", "responsable": "Chef de production", "risque": "Élevé", "question": "Bloquez-vous systématiquement tout ce qui a été produit depuis le dernier contrôle conforme ?", "nouveau": "", "confirmer": false}, {"code": "8.9.3", "chapitre": "8", "titre": "Actions correctives", "resume": "Rechercher les causes des écarts répétés ou significatifs, agir pour éviter leur retour, et vérifier l'efficacité. Analyser aussi tendances, réclamations et résultats d'audit.", "doc": "Information à conserver : actions correctives", "preuves": ["Analyse de cause (5 pourquoi, Ishikawa)", "Vérification d'efficacité datée"], "registre": "REG-H-13", "responsable": "Responsable SDA / Pilotes", "risque": "Moyen", "question": "Après un écart CCP, cherchez-vous la cause racine et vérifiez-vous que l'action a marché ?", "nouveau": "", "confirmer": false}, {"code": "8.9.4.1", "chapitre": "8", "titre": "Produits potentiellement dangereux — généralités", "resume": "Empêcher qu'un produit potentiellement dangereux entre dans la chaîne alimentaire, sauf preuve que le danger est déjà au niveau acceptable ou qu'il y sera ramené avant cette entrée.", "doc": "", "preuves": ["Zone ou étiquetage de blocage", "Registre des lots bloqués"], "registre": "FOR-H-07", "responsable": "Responsable SDA", "risque": "Élevé", "question": "Avez-vous une zone et une étiquette de blocage pour les produits douteux ?", "nouveau": "", "confirmer": false}, {"code": "8.9.4.2", "chapitre": "8", "titre": "Évaluation en vue de la libération", "resume": "Ne libérer un lot touché que sur preuves : efficacité d'autres mesures, analyses représentatives, ou démonstration que le danger est au niveau acceptable.", "doc": "Information à conserver : décision de libération et preuves", "preuves": ["Bulletins d'analyse du lot", "Décision signée par personne habilitée"], "registre": "FOR-H-07", "responsable": "Responsable SDA", "risque": "Élevé", "question": "Lorsqu'un lot bloqué est libéré, la décision est-elle appuyée par des analyses et signée ?", "nouveau": "", "confirmer": false}, {"code": "8.9.4.3", "chapitre": "8", "titre": "Devenir des produits non conformes", "resume": "Retraiter, déclasser vers un autre usage sûr, ou détruire les produits non libérables, et enregistrer la décision et l'identité des personnes qui l'ont prise.", "doc": "Information à conserver : devenir des produits", "preuves": ["PV de destruction ou de retraitement", "Identification des décideurs"], "registre": "FOR-H-07", "responsable": "Responsable SDA / Direction", "risque": "Moyen", "question": "Gardez-vous la preuve de destruction ou de retraitement des produits non conformes ?", "nouveau": "", "confirmer": false}, {"code": "8.9.5", "chapitre": "8", "titre": "Retrait / rappel", "resume": "Pouvoir retirer ou rappeler rapidement des lots dangereux, informer autorités et clients, gérer les produits récupérés, tester le dispositif par simulation et en garder la preuve.", "doc": "Information à conserver : résultats de simulation et retraits réels", "preuves": ["Procédure retrait/rappel avec contacts", "Rapport de simulation avec taux de récupération"], "registre": "REG-H-15", "responsable": "Direction / Responsable SDA", "risque": "Élevé", "question": "Avez-vous simulé un rappel de produit cette année et mesuré le temps et le taux de récupération ?", "nouveau": "", "confirmer": false}, {"code": "9.1.1", "chapitre": "9", "titre": "Surveillance, mesure, analyse et évaluation — généralités", "resume": "Décider quoi mesurer, comment, quand, et quand analyser les résultats pour évaluer la performance du système SDA.", "doc": "Information à conserver : résultats", "preuves": ["Tableau de bord des indicateurs", "Plan de mesure"], "registre": "PLAN-H-04", "responsable": "Responsable SDA", "risque": "Moyen", "question": "Avez-vous un tableau de bord mensuel de la sécurité des aliments ?", "nouveau": "", "confirmer": false}, {"code": "9.1.2", "chapitre": "9", "titre": "Analyse et évaluation", "resume": "Analyser les données (vérifications, audits, réclamations, analyses) pour juger si le système fonctionne, si des mises à jour sont nécessaires et si les tendances se dégradent.", "doc": "Information à conserver : résultats d'analyse", "preuves": ["Analyses de tendance", "Rapport présenté en revue de direction"], "registre": "RAP-H-02", "responsable": "Responsable SDA", "risque": "Moyen", "question": "Analysez-vous les tendances (réclamations, écarts CCP, résultats labo) et non seulement les cas isolés ?", "nouveau": "", "confirmer": false}, {"code": "9.2.1", "chapitre": "9", "titre": "Audit interne — objectifs", "resume": "Réaliser des audits internes planifiés pour vérifier que le système est conforme à la norme et aux exigences internes, et qu'il est appliqué efficacement.", "doc": "", "preuves": ["Programme d'audit annuel", "Rapports d'audit"], "registre": "PLAN-H-03", "responsable": "Responsable SDA", "risque": "Moyen", "question": "Réalisez-vous des audits internes planifiés qui couvrent tous les articles et toutes les zones sur le cycle prévu ?", "nouveau": "", "confirmer": false}, {"code": "9.2.2", "chapitre": "9", "titre": "Programme d'audit interne", "resume": "Planifier selon l'importance des processus, les changements et les résultats passés ; choisir des auditeurs indépendants ; transmettre les résultats à l'équipe SDA et à la direction ; corriger sans délai.", "doc": "Information à conserver : programme et résultats", "preuves": ["Qualification des auditeurs internes", "Suivi des constats jusqu'à clôture"], "registre": "RAP-H-01", "responsable": "Responsable SDA", "risque": "Moyen", "question": "Vos auditeurs internes sont-ils formés et n'auditent-ils pas leur propre travail ?", "nouveau": "", "confirmer": false}, {"code": "9.3.1", "chapitre": "9", "titre": "Revue de direction — généralités", "resume": "La direction revoit le système à intervalles planifiés pour s'assurer qu'il reste adapté, suffisant et efficace. GEC-CI recommande au moins une revue par an.", "doc": "", "preuves": ["Convocation et liste de présence", "Compte rendu signé"], "registre": "RAP-H-02", "responsable": "Direction générale", "risque": "Moyen", "question": "La direction a-t-elle tenu une revue formelle du système SDA dans les 12 derniers mois ?", "nouveau": "", "confirmer": false}, {"code": "9.3.2", "chapitre": "9", "titre": "Éléments d'entrée de la revue", "resume": "Examiner actions précédentes, changements de contexte, indicateurs, résultats de vérification, audits, réclamations, urgences, retraits, fournisseurs, ressources, risques et opportunités.", "doc": "", "preuves": ["Dossier d'entrée complet", "Données chiffrées de la période"], "registre": "RAP-H-02", "responsable": "Responsable SDA", "risque": "Faible", "question": "Votre revue de direction examine-t-elle tous les sujets requis, chiffres à l'appui ?", "nouveau": "", "confirmer": false}, {"code": "9.3.3", "chapitre": "9", "titre": "Éléments de sortie de la revue", "resume": "Conclure par des décisions : améliorations, mises à jour du système, ressources, révision de la politique ou des objectifs. Conserver les preuves.", "doc": "Information à conserver : résultats de la revue", "preuves": ["Décisions datées avec responsables", "Plan d'action issu de la revue"], "registre": "RAP-H-02", "responsable": "Direction générale", "risque": "Faible", "question": "La revue débouche-t-elle sur des décisions écrites avec responsables et échéances ?", "nouveau": "", "confirmer": false}, {"code": "10.1", "chapitre": "10", "titre": "Non-conformité et action corrective", "resume": "Réagir à toute non-conformité du système (audit, réclamation, écart), corriger, analyser la cause, agir pour éviter la répétition, vérifier l'efficacité et enregistrer.", "doc": "Information à conserver : NC et actions", "preuves": ["Registre des NC avec causes et actions", "Clôtures vérifiées"], "registre": "REG-H-13", "responsable": "Responsable SDA / Pilotes", "risque": "Moyen", "question": "Toutes vos non-conformités ont-elles une cause identifiée et une action vérifiée ?", "nouveau": "", "confirmer": false}, {"code": "10.2", "chapitre": "10", "titre": "Amélioration continue", "resume": "Améliorer en continu l'adéquation et l'efficacité du système grâce à la communication, la revue de direction, l'audit, l'analyse des r tion lors des simulations de rappel", "formule": "Quantité localisée et récupérable / quantité expédiée × 100", "source": "REG-H-15", "frequence": "À chaque simulation", "responsable": "Direction / Responsable SDA", "cible": "100 % localisé", "alerte": "< 95 % localisé"}, {"code": "KPI-H-11", "indicateur": "Délai de clôture des non-conformités", "formule": "Moyenne (date de clôture − date d'ouverture) en jours", "source": "REG-H-13", "frequence": "Mensuelle", "responsable": "Responsable SDA", "cible": "≤ 30 jours (≤ 7 jours pour un écart CCP)", "alerte": "NC ouverte > 60 jours"}, {"code": "KPI-H-12", "indicateur": "Efficacité des actions correctives", "formule": "Actions vérifiées efficaces / actions vérifiées × 100", "source": "REG-H-13", "frequence": "Trimestrielle", "responsable": "Responsable SDA", "cible": "≥ 85 %", "alerte": "< 70 % ou récurrence d'une même NC"}, {"code": "KPI-H-13", "indicateur": "Respect du plan d'étalonnage", "formule": "Équipements étalonnés / vérifiés à l'échéance / équipements prévus × 100", "source": "REG-H-11", "frequence": "Mensuelle", "responsable": "Maintenance", "cible": "100 % pour les équipements CCP", "alerte": "Un équipement CCP échu"}, {"code": "KPI-H-14", "indicateur": "Taux de réalisation du plan de formation SDA", "formule": "Formations réalisées / formations prévues × 100", "source": "REG-H-05", "frequence": "Trimestrielle", "responsable": "RH / Responsable SDA", "cible": "≥ 90 %", "alerte": "< 75 % ou opérateur CCP non habilité au poste"}, {"code": "KPI-H-15", "indicateur": "Activité nuisibles", "formule": "Nombre de postes avec activité / nombre de postes contrôlés × 100", "source": "REG-H-10", "frequence": "Mensuelle", "responsable": "Responsable SDA", "cible": "À fixer après 3 mois de mesure ; zéro en zone produit", "alerte": "Toute activité en zone de production ou de stockage de produits finis"}, {"code": "KPI-H-16", "indicateur": "Fournisseurs critiques évalués à jour", "formule": "Fournisseurs critiques évalués dans les 12 mois / fournisseurs critiques × 100", "source": "REG-H-06", "frequence": "Trimestrielle", "responsable": "Achats", "cible": "100 %", "alerte": "< 90 %"}, {"code": "KPI-H-17", "indicateur": "Réalisation du programme d'audit interne", "formule": "Audits réalisés / audits programmés × 100", "source": "PLAN-H-03", "frequence": "Trimestrielle", "responsable": "Responsable SDA", "cible": "100 % sur l'année", "alerte": "Retard > 2 mois"}, {"code": "KPI-H-18", "indicateur": "Changements passés par l'équipe SDA avant mise en œuvre", "formule": "Changements évalués avant mise en œuvre / changements réalisés × 100", "source": "REG-H-16", "frequence": "Trimestrielle", "responsable": "Responsable de l'équipe SDA", "cible": "100 %", "alerte": "Un changement non évalué"}], "extras": {"diagnostic": [["Avez-vous une équipe HACCP nommée, pluridisciplinaire et formée ?", "Haute"], ["Vos diagrammes de fabrication ont-ils été vérifiés sur la ligne en marche, avec signatures ?", "Haute"], ["Chaque danger significatif a-t-il une mesure de maîtrise classée CCP ou PRPo avec justification ?", "Haute"], ["Vos limites critiques sont-elles chiffrées, justifiées et surveillées en temps réel ?", "Haute"], ["Pouvez-vous retrouver en moins de 4 heures les clients d'un lot et ses matières d'origine ?", "Haute"], ["Analysez-vous régulièrement vos produits pour les contaminants exigés par vos marchés (OTA, aflatoxines, pesticides, métaux) ?", "Haute"], ["Avez-vous simulé un retrait/rappel au cours des 12 derniers mois ?", "Moyenne"], ["La direction a-t-elle tenu une revue formelle du système SDA dans l'année ?", "Moyenne"]], "parcours": [["1. Diagnostic express", "45 minutes d'entretien, visite de ligne, décision commune : on continue ou on s'arrête."], ["2. Diagnostic complet", "Évaluation article par article (grille 0-1-2), rapport d'écart, plan d'action priorisé."], ["3. Cadrage et équipe SDA", "Domaine d'application, nomination du responsable et de l'équipe SDA, formation HACCP de base."], ["4. Programmes prérequis", "Remise à niveau des PRP selon ISO 22002 : locaux, eau, nettoyage, nuisibles, hygiène, allergènes, stockage."], ["5. Étapes préliminaires", "Fiches matières et produits, usage prévu, diagrammes vérifiés sur site."], ["6. Analyse des dangers et plan de maîtrise", "Cotation, catégorisation PRPo / CCP, limites, surveillance, validation."], ["7. Système de management", "Contexte, politique, objectifs, traçabilité, urgences, retrait/rappel, communication, documents."], ["8. Mise en œuvre et preuves", "3 mois minimum de fonctionnement réel avec enregistrements complets (durée à confirmer avec l'organisme certificateur)."], ["9. Audit interne et revue de direction", "Audit complet, actions correctives, revue de direction avec décisions."], ["10. Préparation et accompagnement d'audit", "Check-list J-30, audit à blanc, présence aux audits étape 1 et étape 2, traitement des écarts."]], "specifiques": [["Programmes prérequis (ISO 22002-x:2025)", "Les bonnes pratiques d'hygiène sont la fondation : sans PRP solides, aucun plan HACCP ne tient."], ["Analyse des dangers en équipe", "Dangers biologiques, chimiques (mycotoxines, pesticides, métaux), physiques et allergènes, étape par étape, avec niveaux acceptables justifiés."], ["PRPo et CCP", "ISO 22000 distingue deux types de mesures de maîtrise : les CCP à limites critiques mesurables, les PRPo à critères d'action."], ["Validation, surveillance, vérification", "Prouver que la mesure fonctionne, la contrôler en continu, puis confirmer après coup que tout a été fait."], ["Traçabilité et retrait/rappel", "Relier chaque lot à ses matières et à ses clients, et le prouver par des exercices réguliers."], ["Communication dans la chaîne alimentaire", "Échanger les informations de sécurité avec fournisseurs, clients, autorités et en interne avec l'équipe SDA."]], "profils": [["P1 · Exportateur-transformateur", "Usine de broyage ou de cajou orientée export", "Les acheteurs européens exigent un certificat reconnu et des résultats d'analyses contaminants solides.", "Diagnostic ciblé ISO 22000 / FSSC 22000 et revue du plan de surveillance analytique."], ["P2 · Agro-industriel local", "Boulangerie-pâtisserie industrielle ou biscuiterie", "Produits périssables, allergènes multiples, distribution en grandes surfaces.", "Matrice allergènes et vérification sur site des diagrammes."], ["P3 · Boissons", "Embouteilleur d'eau ou de jus à Abidjan", "Eau, hygiène des lignes et microbiologie sont au cœur du risque.", "Revue des PRP eau, nettoyage en place et plan de prélèvement microbiologique."], ["P4 · Logistique", "Entrepôt sous douane ou prestataire de stockage", "Le risque principal porte sur nuisibles, humidité, contaminations croisées et traçabilité des lots.", "Inspection PRP stockage et exercice de traçabilité sur un lot client."], ["P5 · Coopérative en montée en gamme", "Coopérative avec séchage, stockage ou première transformation", "Elle veut vendre plus cher et sécuriser ses lots face aux exigences des exportateurs.", "Diagnostic PRP de base (séchage, stockage, traçabilité) avant toute démarche ISO 22000."]], "objections": [["« Nous avons déjà un plan HACCP. »", "Très bien, c'est une base. ISO 22000 ajoute le système autour : PRP vérifiés, traçabilité testée, urgences, revue de direction, amélioration. Le diagnostic montre ce qui manque."], ["« ISO 22000 ou FSSC 22000 ? »", "FSSC 22000 inclut ISO 22000 plus des PRP sectoriels et des exigences additionnelles ; il est reconnu GFSI. Le choix dépend de vos clients : nous le vérifions avec eux avant de commencer."], ["« C'est trop cher pour nous. »", "Le vrai coût est souvent celui d'un conteneur refusé ou d'un client perdu. Nous chiffrons après diagnostic, par lots, et vous pouvez avancer étape par étape."], ["« Les analyses de laboratoire coûtent cher. »", "Un plan de surveillance analytique basé sur le risque cible les bons paramètres et la bonne fréquence, au lieu d'analyser tout, tout le temps."], ["« La norme va changer en 2027, attendons. »", "Les fondamentaux (PRP, HACCP, traçabilité) ne changent pas. Un système bien construit sur 2018 se met à jour ; les certifications restent délivrées sur l'édition en vigueur."], ["« Mon personnel ne sait pas lire les procédures. »", "Nous concevons des consignes visuelles, des fiches simples et des formations au poste, en langue comprise, et nous vérifions la compréhension sur le terrain."]], "livre": ["Un diagnostic article par article, une analyse des dangers construite avec votre équipe et des diagrammes vérifiés sur vos lignes", "Des PRP, un plan de maîtrise des dangers (CCP et PRPo) et des registres prêts à l'emploi, sur papier et sur la plateforme GEC-CI Pro", "Des formations, un audit interne, une revue de direction et une préparation à l'audit de certification, jusqu'au suivi des écarts"], "refuse": ["Promettre une date de certificat ou un délai garanti : seul l'organisme certificateur accrédité décide", "Fabriquer des enregistrements a posteriori ou préparer votre personnel à dire à l'auditeur ce qui n'est pas fait"], "premier_pas": "Un diagnostic express de 45 minutes avec le dirigeant et le responsable production, suivi d'une visite de ligne, pour mesurer l'écart et décider ensemble s'il faut continuer."}, "points": [["1", "Date de publication de la révision ISO 22000 et durée de transition", "ISO, CODINORM, IAF, organisme certificateur", ""], ["2", "Contenu et numérotation définitifs de la révision (culture, fraude, défense, réclamations, annexe)", "ISO / CODINORM", ""], ["3", "Date exacte de publication de FSSC 22000 v7 et règles d'audit non annoncé", "Fondation FSSC, organisme certificateur", ""], ["4", "Intitulé exact (norme ou TS) et liste des parties ISO 22002-x:2025", "ISO / CODINORM", ""], ["5", "Édition en vigueur d'ISO 22003-1", "ISO", ""], ["6", "Existence d'une loi-cadre ivoirienne sur la sécurité sanitaire des aliments", "Journal officiel, ministères compétents", ""], ["7", "Articles applicables de la loi n° 2020-995 aux ingrédients d'origine animale", "Ministère des Ressources animales et halieutiques", ""], ["8", "Dispositions de la loi n° 2016-412 sur retrait, rappel et étiquetage", "Ministère du Commerce", ""], ["9", "Autorités à informer en cas de rappel selon le produit", "Ministères compétents", ""], ["10", "Exigences pour l'eau conditionnée et les jus (autorisation, normes CODINORM)", "Ministère de la Santé, CODINORM", ""], ["11", "Exigences qualité du Conseil du Café-Cacao (humidité, grainage)", "Conseil du Café-Cacao", ""], ["12", "Accréditations ISO/IEC 17025 du LANADA et des laboratoires privés", "LANADA, SOAC", ""], ["13", "Organismes certificateurs accrédités ISO 22000 / FSSC 22000 en Côte d'Ivoire", "SOAC, organismes", ""], ["14", "Valeurs exactes des limites UE (cadmium, HAP, aflatoxines) et OTA poudre de cacao", "EUR-Lex", ""], ["15", "Références des codes Codex OTA cacao (CXC 72-2013) et allergènes (CXC 80-2020)", "Codex Alimentarius", ""], ["16", "Liste ivoirienne des allergènes à déclarer", "Ministère du Commerce, CODINORM", ""], ["17", "Durée légale de conservation des enregistrements", "Autorités compétentes", ""], ["18", "Prix de la norme et frais d'audit", "ISO / CODINORM, organismes certificateurs", ""]], "chapitres": {"4": "Contexte", "5": "Leadership", "6": "Planification", "7": "Support", "8": "Activités opérationnelles", "9": "Évaluation des performances", "10": "Amélioration"}};window.__LOGO="data:image/webp;base64,UklGRvw/AABXRUJQVlA4IPA/AABw4wCdASq8AsAAPmEqkUWkIqQUGh6MQAYEszdsgF23OaNIVAb+U7JDv/kP8j+2P9697O0P4D++/q7+2fuB8xu9rtDze+av+h/hfy4+cH+e/4n+Q91H9V/wn/U/wH76/QH+p/+//vX+W9t31Q/4L/t+oP+s/4z9zvd5/3n7Le7/+7f7X9tf9p8hH9K/2n/67E392/YY/cT//+vD+5Xw1/1n/kfud7Tv/t7PToz+zv9+/HD3z/G/3L/N/3L9qv3J8y/2j+K/u/7V+x/YT6mvyb7kfpP8J+3v+K/br5q/3f5VeePyp/zPUI/JP5r/gP7n+6P+R/czkapzvUC9g/nn+7/wH7yf5H0r/8X/Hep/2S/235qf5b7AP6D/V/97/e/3m/xvtU+DR6x7An89/wH/a/03+K/db6Z/7L/2f7j8vvcx+ef6b/1/7X4Df5r/av+l/iP3x/0vzy+0P94PZu/dlF6+t29DYhh19bwJyTJY/n9hrDveu5bxf72NBX/r19yUiHPNcIpUfbJ <script>/* IA GECI — Module Organisation, Personnel, Territoires, Preuves (commun à la console et à toutes les plateformes GEC-CI).
   Toutes les écritures passent par des fonctions serveur (geci_*) qui contrôlent les droits ; l'interface ne fait qu'afficher.
   Aucun employé n'est créé automatiquement. Aucune validation n'est faite par l'IA. */
window.GECI_ORG = (() => {
  const PROJ = { RA: 'Rainforest Alliance', FAIRTRADE: 'Fairtrade', ISO: 'Normes ISO', RSPO: 'RSPO — palmier à huile', HEVEA: 'Hévéas' };
  const PREFS = { RA: ['RAINFOREST_ALLIANCE'], FAIRTRADE: ['FAIRTRADE'], ISO: ['ISO_9001', 'ISO_14001', 'ISO_45001', 'ISO_22000'], RSPO: ['RSPO'], HEVEA: ['HEVEA'] };
  const FCT = { PILOTAGE: 'Responsable de pilotage', TECHNIQUE: 'Responsable technique', OPERATIONNEL: 'Responsable opérationnel' };
  const EV_L = { IMPORTEE: 'Importée', A_CLASSER: 'À classer', A_VERIFIER: 'À vérifier', VALIDEE: 'Validée', REJETEE: 'Rejetée', ARCHIVEE: 'Archivée' };
  const EV_K = { IMPORTEE: '', A_CLASSER: 'warn', A_VERIFIER: 'info', VALIDEE: 'ok', REJETEE: 'bad', ARCHIVEE: '' };
  const CATS = ['PHOTO', 'DOCUMENT', 'RAPPORT', 'FORMULAIRE', 'REGISTRE', 'VIDEO', 'AUDIO', 'CARTOGRAPHIE', 'FINANCIER', 'CONTRAT', 'AUTRE'];
  const ROLE_EQ = { CHEF_EQUIPE: 'Chef d’équipe', CONSULTANT: 'Consultant', AUDITEUR: 'Auditeur', FORMATEUR: 'Formateur', AGENT: 'Agent', CARTOGRAPHE: 'Cartographe', AUTRE: 'Autre' };
  const ACT_L = { PLANIFIEE: 'Planifiée', EN_COURS: 'En cours', REALISEE: 'Réalisée', ANNULEE: 'Annulée' };
  const MAXF = 52428800;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const dfr = (d) => d ? new Date(d).toLocaleDateString('fr-FR') : '—';
  const dtfr = (d) => d ? new Date(d).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
  const oct = (n) => { n = Number(n || 0); return n < 1024 ? n + ' o' : n < 1048576 ? (n / 1024).toFixed(1) + ' Ko' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' Mo' : (n / 1073741824).toFixed(2) + ' Go'; };
  const chip = (t, k = '') => `<span class="go-chip ${k}">${esc(t)}</span>`;
  const nz = (v) => (v === '' || v == null) ? null : v;
  const opt = (pairs, cur, empty) => (empty != null ? `<option value="">${esc(empty)}</option>` : '') + pairs.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(cur ?? '') ? 'selected' : ''}>${esc(l)}</option>`).join('');
  const fd = (f) => { const o = {}; new FormData(f).forEach((v, k) => { o[k] = typeof v === 'string' ? v.trim() : v; }); f.querySelectorAll('input[type=checkbox]').forEach(c => o[c.name] = c.checked); return o; };
  const clean = (m) => String(m || '').replace(/^GECI-ACCES-REFUSE : /, 'Accès refusé : ').replace(/^(GECI-[A-Z-]+) : /, '$1 · ').replace(/^ACCES-REFUSE/, 'Accès refusé');
  const catOf = (mime, name) => /^image\//.test(mime) ? 'PHOTO' : /^video\//.test(mime) ? 'VIDEO' : /^audio\//.test(mime) ? 'AUDIO' : /pdf|word|opendocument\.text/.test(mime) ? 'DOCUMENT' : /sheet|excel|csv/.test(mime) || /\.(xlsx?|csv|ods)$/i.test(name) ? 'REGISTRE' : /\.(kml|kmz|geojson|gpx|shp)$/i.test(name) ? 'CARTOGRAPHIE' : 'AUTRE';
  const safeName = (n) => n.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9._-]+/g, '_').replace(/_+/g, '_').slice(-80) || 'fichier';
  async function sha256Hex(buf) { const h = await crypto.subtle.digest('SHA-256', buf); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }

  const CSS = `.go{font-size:14px;line-height:1.5;color:#0F1B2D}.go *{box-sizing:border-box}
  .go-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.go-tabs button{border:1px solid #DCE3EC;background:#fff;color:#0A1628;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  .go-tabs button.on{background:#0A1628;color:#fff;border-color:#0A1628;box-shadow:inset 0 -3px 0 #C9A227}.go-tabs .n{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:9px;background:#C9A227;color:#0A1628;font-size:11px;font-weight:700}
  .go-sec{border:1px solid #DCE3EC;border-radius:8px;padding:14px 16px;margin:0 0 14px;background:#fff}.go-sec h3{margin:0 0 8px;font-size:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
  .go-sec h4{margin:12px 0 6px;font-size:14px}.go-note{color:#5A6B83;font-size:12.5px;margin:6px 0}.go-eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8A6B0E;font-weight:600}
  .go-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 14px}.go-tile{border:1px solid #DCE3EC;border-radius:8px;padding:10px 12px;background:#fff;border-top:3px solid #C9A227}.go-tile .v{font-size:22px;font-weight:700;color:#0A1628}.go-tile .l{font-size:12px;color:#5A6B83}.go-tile.alert{border-top-color:#B42318}
  .go-tw{overflow-x:auto}.go table{border-collapse:collapse;width:100%;font-size:13px}.go th{text-align:left;border-bottom:1px solid #DCE3EC;padding:6px 8px;font-size:11.5px;color:#5A6B83;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}.go td{padding:6px 8px;border-bottom:1px solid #EEF2F6;vertical-align:top}
  .go-chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;background:#EEF2F6;color:#0F1B2D;white-space:nowrap}.go-chip.ok{background:#E3F4EA;color:#14653A}.go-chip.warn{background:#FFF4D6;color:#7A5A00}.go-chip.bad{background:#FDE7E5;color:#B42318}.go-chip.info{background:#E4EEFA;color:#1D5FA8}
  .go-btn{border:1px solid #0A1628;background:#fff;color:#0A1628;border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;font-weight:600}.go-btn.p{background:#0A1628;color:#fff}.go-btn.g{background:#C9A227;border-color:#C9A227;color:#0A1628}.go-btn.sm{padding:3px 8px;font-size:12px}.go-btn:disabled{opacity:.5;cursor:default}.go-btn.bad{border-color:#B42318;color:#B42318}
  .go-f{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;align-items:end;margin:8px 0}.go-f label{display:grid;gap:3px;font-size:12px;color:#5A6B83}.go-f .w{grid-column:1/-1}
  .go-in{width:100%;padding:7px 9px;border:1px solid #CBD5E1;border-radius:6px;font:inherit;font-size:13px;background:#fff;color:#0F1B2D}
  .go details{border:1px dashed #CBD5E1;border-radius:8px;padding:8px 12px;margin:10px 0}.go summary{cursor:pointer;font-weight:600;color:#0A1628}
  .go-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.go-muted{color:#5A6B83}.go-mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .go-drop{border:2px dashed #C9A227;border-radius:10px;padding:22px;text-align:center;background:#FFFBEF;cursor:pointer}.go-drop.over{background:#FFF1C2}
  .go-bar{height:10px;border-radius:5px;background:#EEF2F6;overflow:hidden}.go-bar>i{display:block;height:100%;background:#C9A227;width:0;transition:width .2s}
  .go-gap{height:8px;border-radius:4px;background:#EEF2F6;overflow:hidden;min-width:80px}.go-gap>i{display:block;height:100%;background:#14653A}
  .go-tree ul{list-style:none;margin:0;padding-left:16px;border-left:1px dotted #CBD5E1}.go-tree li{margin:3px 0}
  .go-msg{padding:8px 12px;border-radius:6px;margin:0 0 10px;font-size:13px}.go-msg.bad{background:#FDE7E5;color:#B42318}.go-msg.ok{background:#E3F4EA;color:#14653A}
  @media (max-width:640px){.go-f{grid-template-columns:1fr}}`;

  function mount(el, sb, cfg = {}) {
    if (!document.getElementById('go-css')) { const s = document.createElement('style'); s.id = 'go-css'; s.textContent = CSS; document.head.appendChild(s); }
    const C = { project: cfg.project || null, lockProject: !!cfg.project, tab: cfg.tab || 'dash', toast: cfg.toast, consoleUrl: cfg.consoleUrl };
    const st = { uid: null, roles: new Set(), me: null, steer: [], zm: [], teams: [], areas: [], emps: [], cache: {} };
    const has = (...r) => r.some(x => st.roles.has(x));
    const isDir = () => has('SUPER_ADMIN', 'DIRECTEUR');
    const isRH = () => isDir() || has('RESPONSABLE_RH');
    const manages = (p) => isDir() || st.steer.some(s => s.project_code === p && ['PILOTAGE', 'OPERATIONNEL'].includes(s.fonction));
    const inSteer = (p) => isDir() || st.steer.some(s => s.project_code === p);
    const zmTeams = () => new Set(st.teams.filter(t => st.zm.some(z => z.id === t.zone_manager_id)).map(t => t.id));
    const say = (t, bad) => { if (C.toast) return C.toast(t, bad); const m = el.querySelector('#go-msg'); if (m) { m.className = 'go-msg ' + (bad ? 'bad' : 'ok'); m.textContent = t; m.hidden = false; setTimeout(() => m.hidden = true, bad ? 9000 : 4000); } };
    async function rpc(fn, args = {}, ok) { const { data, error } = await sb.rpc(fn, args); if (error) { say(clean(error.message), true); throw error; } if (ok) say(ok); return data; }
    async function sel(t, cols = '*', f = (q) => q) { const { data, error } = await f(sb.from(t).select(cols)); if (error) { say(clean(error.message), true); return []; } return data || []; }
    const empName = (id) => { const e = st.emps.find(x => x.id === id); return e ? `${e.prenoms} ${e.nom}` : '—'; };
    const areaName = (id) => st.areas.find(a => a.id === id)?.nom || '—';
    const areaOpts = (cur, empty = 'Choisir une zone') => opt(st.areas.filter(a => a.actif && a.type !== 'PAYS' && a.type !== 'GROUPE_OPERATIONNEL').sort((a, b) => a.nom.localeCompare(b.nom, 'fr')).map(a => [a.id, a.nom + (a.type === 'ZONE_INDUSTRIELLE' ? ' (ZI)' : a.type === 'VILLE' ? '' : ' · ' + a.type.toLowerCase().replace(/_/g, ' '))]), cur, empty);
    const empOpts = (cur, empty = 'Choisir un employé') => opt(st.emps.filter(e => e.statut === 'ACTIF').sort((a, b) => (a.nom + a.prenoms).localeCompare(b.nom + b.prenoms, 'fr')).map(e => [e.id, `${e.nom} ${e.prenoms} — ${e.fonction} (${e.matricule})`]), cur, empty);
    const projOpts = (cur) => opt(Object.entries(PROJ), cur);

    async function loadBase() {
      const { data: u } = await sb.auth.getUser(); st.uid = u?.user?.id || null;
      const { data: me } = await sb.rpc('geci_me'); st.me = me; st.roles = new Set((me?.roles || []).filter(r => !r.client_id).map(r => r.role));
      [st.emps, st.areas] = await Promise.all([sel('geci_employees', '*'), sel('geci_areas', '*')]);
      st.myEmp = st.emps.find(e => e.user_id === st.uid && e.statut === 'ACTIF') || null;
      const [sm, zms, teams] = await Promise.all([
        sel('geci_steering_members', 'id,fonction,employee_id,date_fin,date_debut,intitule,steering_id,geci_steering_teams(project_code)'),
        sel('geci_zone_managers', '*'), sel('geci_teams', '*')]);
      st.allSteer = sm.map(x => ({ ...x, project_code: x.geci_steering_teams?.project_code }));
      st.allZm = zms; st.teams = teams;
      st.steer = st.myEmp ? st.allSteer.filter(x => x.employee_id === st.myEmp.id && !x.date_fin) : [];
      st.zm = st.myEmp ? zms.filter(x => x.employee_id === st.myEmp.id && !x.date_fin) : [];
      const n = await sel('geci_notifications', 'id', q => q.eq('lu', false)); st.unread = n.length;
    }

    const TABS = () => [
      ['dash', 'Tableau de bord', true], ['org', 'Organisation', true], ['missions', 'Missions et activités', true], ['preuves', 'Preuves et import', true],
      ['personnel', 'Personnel (RH)', true], ['zones', 'Zones et sites', true], ['notifs', 'Notifications', true], ['stockage', 'Stockage', has('SUPER_ADMIN', 'DIRECTEUR', 'RESPONSABLE_INFORMATIQUE', 'GESTIONNAIRE_DOCUMENTAIRE')]];

    async function show(tab) {
      C.tab = tab;
      el.innerHTML = `<div class="go"><div id="go-msg" class="go-msg" hidden></div>
        <div class="go-row" style="justify-content:space-between;margin:0 0 10px"><div><div class="go-eyebrow">IA GECI — Organisation GEC-CI</div>
        <div class="go-muted" style="font-size:12.5px">${C.lockProject ? 'Projet ' + esc(PROJ[C.project]) : 'Tous les projets'} · ${st.myEmp ? 'Vous : ' + esc(st.myEmp.prenoms + ' ' + st.myEmp.nom) : 'Compte non relié à une fiche du personnel'}</div></div>
        ${C.lockProject ? '' : `<label class="go-row go-muted" style="font-size:12.5px">Projet <select class="go-in" id="go-proj" style="width:auto">${opt(Object.entries(PROJ), C.project, 'Tous les projets')}</select></label>`}</div>
        <nav class="go-tabs">${TABS().filter(t => t[2]).map(([k, l]) => `<button data-t="${k}" class="${k === tab ? 'on' : ''}">${l}${k === 'notifs' && st.unread ? `<span class="n">${st.unread}</span>` : ''}</button>`).join('')}</nav>
        <div id="go-body"><p class="go-muted">Chargement…</p></div></div>`;
      el.querySelector('.go-tabs').onclick = (e) => { const b = e.target.closest('button[data-t]'); if (b) show(b.dataset.t); };
      const ps = el.querySelector('#go-proj'); if (ps) ps.onchange = () => { C.project = ps.value || null; show(C.tab); };
      const body = el.querySelector('#go-body');
      try { await V[tab](body); } catch (e) { console.error(e); body.innerHTML = `<div class="go-sec"><b>Affichage impossible</b><p class="go-note">${esc(clean(e.message))}</p></div>`; }
    }
    function ask(title, withText, required = true) {
      return new Promise((res) => { const o = document.createElement('div');
        o.style.cssText = 'position:fixed;inset:0;background:rgba(10,22,40,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px';
        o.innerHTML = `<div class="go" style="background:#fff;border-radius:10px;max-width:440px;width:100%;padding:16px;border-top:4px solid #C9A227"><p style="margin:0 0 10px;font-weight:600">${esc(title)}</p>${withText ? '<textarea class="go-in" rows="3" id="ask-t"></textarea>' : ''}<div class="go-row" style="justify-content:flex-end;margin-top:10px"><button class="go-btn" id="ask-n">Annuler</button><button class="go-btn p" id="ask-y">Confirmer</button></div></div>`;
        document.body.appendChild(o); const t = o.querySelector('#ask-t'); if (t) t.focus();
        const end = (v) => { o.remove(); res(v); };
        o.querySelector('#ask-n').onclick = () => end(null);
        o.querySelector('#ask-y').onclick = () => { if (!withText) return end(true); const v = t.value.trim(); if (required && !v) { t.style.borderColor = '#B42318'; return; } end(v || ''); }; });
    }
    const reload = async () => { await loadBase(); show(C.tab); };
    const V = {};

    /* ---------- TABLEAU DE BORD (par niveau) ---------- */
    V.dash = async (b) => {
      if (!st.roles.size) { b.innerHTML = `<div class="go-sec"><b>Aucun rôle interne GEC-CI sur ce compte.</b><p class="go-note">L’organisation (équipes, zones, personnel, preuves internes) est réservée au personnel de GEC-CI. Demandez un rôle à la Direction${C.consoleUrl ? ` depuis la <a href="${C.consoleUrl}" target="_blank" rel="noopener">console IA GECI ↗</a>` : ''}.</p></div>`; return; }
      let d; try { d = await rpc('geci_org_dashboard', { p_project: C.project }); } catch (e) { b.innerHTML = `<div class="go-sec">${esc(clean(e.message))}</div>`; return; }
      const P = d.projets || [];
      const tot = (f) => P.reduce((a, p) => a + f(p), 0);
      const eqs = P.flatMap(p => p.equipes.map(t => ({ ...t, projet: p.projet })));
      const sous = eqs.filter(t => t.effectif < t.effectif_cible);
      const niveau = isDir() ? 'Direction générale' : st.steer.length ? 'Pilotage (siège)' : st.zm.length ? 'Responsable de zone' : st.myEmp ? 'Collaborateur' : 'Personnel';
      const myTeams = st.myEmp ? await sel('geci_team_members', 'id,team_id,role_equipe,statut,date_debut', q => q.eq('employee_id', st.myEmp.id).is('date_fin', null)) : [];
      const myActs = st.myEmp ? await sel('geci_activity_assignments', 'activity_id,role,geci_activities(titre,statut,date_prevue,service_code)', q => q.eq('employee_id', st.myEmp.id)) : [];
      b.innerHTML = `<div class="go-sec"><h3>Vue ${esc(niveau)} <span class="go-muted" style="font-size:12px;font-weight:400">Données réelles, filtrées par le serveur selon vos droits</span></h3>
        <div class="go-tiles">
          <div class="go-tile"><div class="v">${d.effectif_total}</div><div class="l">Personnel actif enregistré</div></div>
          <div class="go-tile"><div class="v">${d.disponibles}</div><div class="l">Disponibles sans équipe</div></div>
          <div class="go-tile ${tot(p => p.pilotage_postes_vacants) ? 'alert' : ''}"><div class="v">${tot(p => p.pilotage_postes_vacants)}</div><div class="l">Postes de pilotage vacants</div></div>
          <div class="go-tile"><div class="v">${eqs.length}</div><div class="l">Équipes opérationnelles</div></div>
          <div class="go-tile ${sous.length ? 'alert' : ''}"><div class="v">${sous.length}</div><div class="l">Équipes sous l’effectif cible</div></div>
          <div class="go-tile"><div class="v">${tot(p => p.missions.actives)}</div><div class="l">Missions actives</div></div>
          <div class="go-tile ${tot(p => p.missions.en_retard) ? 'alert' : ''}"><div class="v">${tot(p => p.missions.en_retard)}</div><div class="l">Missions en retard</div></div>
          <div class="go-tile ${tot(p => p.missions.sans_equipe) ? 'alert' : ''}"><div class="v">${tot(p => p.missions.sans_equipe)}</div><div class="l">Missions sans équipe</div></div>
          <div class="go-tile"><div class="v">${tot(p => p.preuves.A_VERIFIER || 0)}</div><div class="l">Preuves à vérifier</div></div>
          <div class="go-tile"><div class="v">${tot(p => p.preuves.A_CLASSER || 0)}</div><div class="l">Preuves à classer</div></div>
          <div class="go-tile"><div class="v">${d.zones_sans_equipe}</div><div class="l">Villes / ZI sans équipe</div></div>
          <div class="go-tile"><div class="v">${d.notifications_non_lues}</div><div class="l">Notifications non lues</div></div>
        </div>
        ${P.length ? `<div class="go-tw"><table><thead><tr><th>Projet</th><th>Pilotage (3)</th><th>Resp. de zone</th><th>Équipes</th><th>Effectif réel / cible</th><th>Missions actives</th><th>En retard</th><th>Preuves à vérifier</th></tr></thead><tbody>
        ${P.map(p => { const ef = p.equipes.reduce((a, t) => a + Number(t.effectif), 0), ci = p.equipes.reduce((a, t) => a + Number(t.effectif_cible), 0);
          return `<tr><td><b>${esc(p.nom)}</b></td><td>${3 - p.pilotage_postes_vacants} / 3 ${p.pilotage_postes_vacants ? chip(p.pilotage_postes_vacants + ' vacant(s)', 'warn') : chip('complet', 'ok')}</td><td>${p.responsables_zone.length}</td><td>${p.equipes.length}</td>
          <td>${ef} / ${ci || '—'} ${ci ? `<div class="go-gap"><i style="width:${Math.min(100, Math.round(ef / ci * 100))}%"></i></div>` : ''}</td><td>${p.missions.actives}</td><td>${p.missions.en_retard ? chip(p.missions.en_retard, 'bad') : 0}</td><td>${p.preuves.A_VERIFIER || 0}</td></tr>`; }).join('')}</tbody></table></div>` : '<p class="go-note">Aucun projet dans votre périmètre.</p>'}
        ${sous.length ? `<h4>Équipes à compléter</h4><p class="go-note">${sous.map(t => `${esc(t.code)} (${esc(t.zone)}) : ${t.effectif}/${t.effectif_cible}${t.propositions ? ' · ' + t.propositions + ' proposition(s) en attente' : ''}`).join(' · ')}</p>` : ''}
        <p class="go-note">L’effectif cible (13 par défaut) est un objectif d’organisation, pas une obligation : les écarts sont signalés, jamais comblés automatiquement.</p></div>
        ${st.myEmp ? `<div class="go-sec"><h3>Mes affectations</h3>
          <p>${st.steer.map(s => chip('Pilotage ' + s.project_code + ' · ' + FCT[s.fonction], 'info')).join(' ')} ${st.zm.map(z => chip('Responsable de zone ' + z.project_code + ' · ' + areaName(z.area_id), 'info')).join(' ')}
          ${myTeams.map(m => { const t = st.teams.find(x => x.id === m.team_id); return chip((t?.code || 'Équipe') + ' · ' + (ROLE_EQ[m.role_equipe] || m.role_equipe) + (m.statut === 'PROPOSEE' ? ' (proposée)' : ''), m.statut === 'VALIDEE' ? 'ok' : 'warn'); }).join(' ') || ''}
          ${!st.steer.length && !st.zm.length && !myTeams.length ? '<span class="go-muted">Aucune affectation active.</span>' : ''}</p>
          ${myActs.length ? `<div class="go-tw"><table><thead><tr><th>Activité</th><th>Prévue</th><th>Statut</th></tr></thead><tbody>${myActs.map(a => `<tr><td>${esc(a.geci_activities?.titre)}</td><td>${dfr(a.geci_activities?.date_prevue)}</td><td>${chip(ACT_L[a.geci_activities?.statut] || '', a.geci_activities?.statut === 'REALISEE' ? 'ok' : '')}</td></tr>`).join('')}</tbody></table></div>` : ''}</div>` : ''}`;
    };

    /* ---------- ORGANISATION : pilotage 3 → responsables de zone → équipes 13+ ---------- */
    V.org = async (b) => {
      const projs = C.project ? [C.project] : Object.keys(PROJ);
      const tm = await sel('geci_team_members', '*', q => q.is('date_fin', null).neq('statut', 'REFUSEE'));
      const html = projs.map(p => {
        const sm = st.allSteer.filter(x => x.project_code === p && !x.date_fin);
        const zms = st.allZm.filter(x => x.project_code === p && !x.date_fin);
        const tms = st.teams.filter(t => t.project_code === p && t.statut !== 'DISSOUTE');
        const can = manages(p);
        return `<div class="go-sec"><h3>${esc(PROJ[p])} <span class="go-row">${can ? `<button class="go-btn sm" data-rec="${p}">Recommandation d’affectation</button>` : ''}</span></h3>
        <h4>Équipe de pilotage au siège (3 fonctions)</h4>
        <div class="go-tw"><table><thead><tr><th>Fonction</th><th>Titulaire</th><th>Depuis</th>${isDir() ? '<th>Nommer / remplacer</th>' : ''}</tr></thead><tbody>
        ${Object.entries(FCT).map(([f, l]) => { const x = sm.find(s => s.fonction === f);
          return `<tr><td><b>${l}</b></td><td>${x ? esc(empName(x.employee_id)) : chip('Poste vacant', 'warn')}</td><td>${x ? dfr(x.date_debut) : '—'}</td>
          ${isDir() ? `<td><form class="go-row" data-steer="${p}|${f}"><select class="go-in" name="e" style="max-width:260px" required>${empOpts(null)}</select><button class="go-btn sm p">Nommer</button></form></td>` : ''}</tr>`; }).join('')}</tbody></table></div>
        <h4>Responsables de zone (rattachés au pilotage ${esc(p)})</h4>
        ${zms.length ? `<div class="go-tw"><table><thead><tr><th>Responsable</th><th>Zone</th><th>Depuis</th><th>Équipes</th>${can ? '<th></th>' : ''}</tr></thead><tbody>${zms.map(z => `<tr><td>${esc(empName(z.employee_id))}</td><td>${esc(areaName(z.area_id))}</td><td>${dfr(z.date_debut)}</td><td>${tms.filter(t => t.zone_manager_id === z.id).map(t => esc(t.code)).join(', ') || '—'}</td>${can ? `<td><button class="go-btn sm bad" data-zmend="${z.id}">Mettre fin</button></td>` : ''}</tr>`).join('')}</tbody></table></div>` : '<p class="go-note">Aucun responsable de zone nommé.</p>'}
        ${can ? `<details><summary>Nommer un responsable de zone</summary><form class="go-f" data-zm="${p}"><label>Employé<select class="go-in" name="e" required>${empOpts(null)}</select></label><label>Zone (ville ou zone industrielle)<select class="go-in" name="a" required>${areaOpts(null)}</select></label><label>Début<input class="go-in" type="date" name="d"></label><button class="go-btn p">Nommer</button></form></details>` : ''}
        <h4>Équipes opérationnelles (effectif cible configurable, 13 par défaut)</h4>

            ${zmOk && t.statut === 'ACTIVE' ? `<form class="go-f" data-add="${t.id}"><label>Ajouter un membre<select class="go-in" name="e" required>${empOpts(null)}</select></label><label>Rôle<select class="go-in" name="r">${opt(Object.entries(ROLE_EQ), 'AGENT')}</select></label><button class="go-btn p">${can ? 'Affecter (validé)' : 'Proposer au pilotage'}</button></form>` : ''}
            ${can ? `<details><summary>Modifier l’équipe</summary><form class="go-f" data-tupd="${t.id}"><label>Nom<input class="go-in" name="n" value="${esc(t.nom)}"></label><label>Zone<select class="go-in" name="a">${areaOpts(t.area_id)}</select></label>

              <label>Référent technique<select class="go-in" name="rt">${empOpts(t.referent_technique_id, 'Aucun')}</select></label><label>Statut<select class="go-in" name="s">${opt([['ACTIVE', 'Active'], ['SUSPENDUE', 'Suspendue'], ['DISSOUTE', 'Dissoute']], t.statut)}</select></label>
              <label class="w">Objectifs<input class="go-in" name="o" value="${esc(t.objectifs || '')}"></label><button class="go-btn p">Enregistrer</button></form></details>` : ''}

        ${can ? `<details><summary>Créer une équipe ${esc(p)}</summary><form class="go-f" data-tnew="${p}"><label>Nom<input class="go-in" name="n" required placeholder="Équipe ${esc(p)} Soubré 1"></label><label>Zone<select class="go-in" name="a" required>${areaOpts(null)}</select></label>

          <label class="w">Objectifs<input class="go-in" name="o"></label><button class="go-btn p">Créer l’équipe</button></form></details>` : ''}
        <div data-recout="${p}"></div></div>`; }).join('');
      b.innerHTML = (st.emps.length ? '' : `<div class="go-sec"><b>Aucun employé enregistré.</b><p class="go-note">Commencez par l’onglet « Personnel (RH) » : saisissez ou importez les fiches réelles du personnel de GEC-CI. Aucune fiche n’est créée automatiquement.</p></div>`) + html;
      b.querySelectorAll('form[data-steer]').forEach(f => f.onsubmit = async (e) => { e.preventDefault(); const [p, fc] = f.dataset.steer.split('|'); await rpc('geci_steering_set', { p_project: p, p_fonction: fc, p_employee: fd(f).e, p_intitule: FCT[fc] + ' ' + p }, 'Pilotage mis à jour (l’ancien titulaire reste dans l’historique)'); reload(); });
      b.querySelectorAll('form[data-zm]').forEach(f => f.onsubmit = async (e) => { e.preventDefault(); const d = fd(f); await rpc('geci_zone_manager_assign', { p_employee: d.e, p_project: f.dataset.zm, p_area: d.a, p_principal: true, p_debut: nz(d.d) }, 'Responsable de zone nommé'); reload(); });

    /* ---------- MISSIONS ET ACTIVITÉS ---------- */
    V.missions = async (b) => {
      const refs = C.project ? PREFS[C.project] : Object.values(PREFS).flat();
      const [ms, svc] = await Promise.all([sel('geci_missions', 'id,code,objet,statut,referentiel,date_fin_prevue,team_id,area_id,geci_clients(raison_sociale)', q => q.in('referentiel', refs).order('created_at', { ascending: false })), sel('geci_services', '*')]);
      const ids = ms.map(m => m.id);
      const acts = ids.length ? await sel('geci_activities', '*, geci_activity_assignments(employee_id,role)', q => q.in('mission_id', ids).order('created_at')) : [];
      const projOf = (r) => Object.keys(PREFS).find(k => PREFS[k].includes(r));
      b.innerHTML = `<div class="go-sec"><h3>${ms.length} mission(s) dans votre périmètre</h3><p class="go-note">Chaque mission est confiée à une équipe du même projet ; la zone est héritée de l’équipe. Les activités (prestations) sont planifiées puis affectées à des membres.</p>
      ${ms.length ? ms.map(m => { const p = projOf(m.referentiel); const t = st.teams.find(x => x.id === m.team_id); const A = acts.filter(a => a.mission_id === m.id);
        const canLink = manages(p) || (t && zmTeams().has(t.id)); const canAct = canLink || inSteer(p);
