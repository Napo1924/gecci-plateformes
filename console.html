:root{
  --navy:#0A1628; --navy2:#13284A; --gold:#C9A227; --gold-ink:#8A6B0E;
  --bg:#F1F4F8; --surface:#FFFFFF; --surface2:#F6F8FB; --fg:#0F1B2D; --muted:#5A6B83; --line:#DCE3EC;
  --accent:#1D5FA8; --accent-bg:#E6EFFA;
  --ok:#0E7A4C; --ok-bg:#E1F4EA; --warn:#9A5B00; --warn-bg:#FFF0D4; --bad:#B42318; --bad-bg:#FDE7E5;
  --rail-fg:#C8D4E5; --rail-muted:#7F91AD;
  --f-ui:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Century Schoolbook","GEC Schola",Georgia,serif;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111F; --surface:#0F1D33; --surface2:#132440; --fg:#E6ECF5; --muted:#93A4BD; --line:#22385A;
  --accent:#7DB3F0; --accent-bg:#16304F; --gold-ink:#E2C15A;
  --ok:#5CD39A; --ok-bg:#0E3326; --warn:#F1B957; --warn-bg:#3A2A0C; --bad:#FF8A80; --bad-bg:#3D1512; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111F; --surface:#0F1D33; --surface2:#132440; --fg:#E6ECF5; --muted:#93A4BD; --line:#22385A;
  --accent:#7DB3F0; --accent-bg:#16304F; --gold-ink:#E2C15A;
  --ok:#5CD39A; --ok-bg:#0E3326; --warn:#F1B957; --warn-bg:#3A2A0C; --bad:#FF8A80; --bad-bg:#3D1512; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.rail{background:var(--navy);color:var(--rail-fg);padding:16px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.rail img{width:100%;border-radius:6px}
.rail .who{font-size:12px;color:var(--rail-muted);border-top:1px solid #1E3354;padding-top:10px}
.rail .who b{color:#fff;display:block;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--rail-muted);margin:10px 8px 4px}
.nav button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.nav button:hover{background:#13284A}
.nav button.on{background:#13284A;color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav button:focus-visible{outline:2px solid var(--gold)}
.main{min-width:0;padding-block:22px 40px;padding-inline:28px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:22px;font-weight:600}
.top p{margin:4px 0 0;color:var(--muted);font-family:var(--f-read);font-size:15px;max-width:70ch}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px;min-width:0}
.sec>h2{font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .n{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted)}
.tile.alert{border-color:var(--bad)}
.tw{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.info{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.chip.gold{background:var(--navy);color:var(--gold);border-color:transparent}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .btn.primary{background:var(--gold);color:var(--navy);border-color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--gold);color:#0A1628;border-color:var(--gold)}}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;align-items:end}
form.f label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
form.f .wide{grid-column:1/-1}
.inp{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--surface);font-size:13.5px;color:var(--fg)}
textarea.inp{min-height:64px;resize:vertical}
.chk{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--fg)!important}
details.add{border:1px dashed var(--line);border-radius:6px;padding:8px 12px;margin-top:10px}
details.add summary{cursor:pointer;font-weight:500;color:var(--accent)}
details.add[open] summary{margin-bottom:10px}
.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:6px 0 14px}
.steps div{font-size:10.5px;text-align:center;padding:6px 2px;border-radius:4px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);overflow:hidden;text-overflow:ellipsis}
.steps div.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.steps div.cur{background:var(--navy);color:var(--gold);border-color:var(--navy);font-weight:600}
.gate{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.gate li{display:flex;gap:8px;font-size:13px}
.gate li .k{width:18px;flex:none;text-align:center;font-weight:700}
.gate li.y .k{color:var(--ok)} .gate li.n .k{color:var(--bad)}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(440px,calc(100% - 32px));background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.25);border-left:4px solid var(--gold)}
.toast.bad{border-left-color:#FF6B5E}
.note{font-family:var(--f-read);font-size:14px;color:var(--muted);margin:6px 0 0}
.auth{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:var(--navy)}
.auth .card{background:var(--surface);border-radius:12px;max-width:440px;width:100%;overflow:hidden}
.auth .card .brand{background:var(--navy);padding:18px 22px}
.auth .card .body{padding:20px 22px;display:grid;gap:12px}
.auth p.foot{color:var(--rail-muted);font-size:12px;text-align:center;max-width:440px;margin:14px auto 0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mobbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto}
  .rail .nav{display:none}
  .rail.open .nav{display:flex}
  .mobbar{display:flex}
  .main{padding-inline:16px}
  .steps{grid-template-columns:repeat(4,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rail img{max-width:240px}
  .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  const MAXF = 52428800;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const dfr = (d) => d ? new Date(d).toLocaleDateString('fr-FR') : '—';
  const dtfr = (d) => d ? new Date(d).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
  const oct = (n) => { n = Number(n || 0); return n < 1024 ? n + ' o' : n < 1048576 ? (n / 1024).toFixed(1) + ' Ko' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' Mo' : (n / 1073741824).toFixed(2) + ' Go'; };
  const chip = (t, k = '') => `<span class="go-chip ${k}">${esc(t)}</span>`;
  const nz = (v) => (v === '' || v == null) ? null : v;
  const opt = (pairs, cur, empty) => (empty != null ? `<option value="">${esc(empty)}</option>` : '') + pairs.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(cur ?? '') ? 'selected' : ''}>${esc(l)}</option>`).join('');
  const fd = (f) => { const o = {}; new FormData(f).forEach((v, k) => { o[k] = typeof v === 'string' ? v.trim() : v; }); f.querySelectorAll('input[type=checkbox]').forEach(c => o[c.name] = c.checked); return o; };
  const clean = (m) => String(m || '').replace(/^GECI-ACCES-REFUSE : /, 'Accès refusé : ').replace(/^(GECI-[A-Z-]+) : /, '$1 · ').replace(/^ACCES-REFUSE/, 'Accès refusé');
  const catOf = (mime, name) => /^image\//.test(mime) ? 'PHOTO' : /^video\//.test(mime) ? 'VIDEO' : /^audio\//.test(mime) ? 'AUDIO' : /pdf|word|opendocument\.text/.test(mime) ? 'DOCUMENT' : /sheet|excel|csv/.test(mime) || /\.(xlsx?|csv|ods)$/i.test(name) ? 'REGISTRE' : /\.(kml|kmz|geojson|gpx|shp)$/i.test(name) ? 'CARTOGRAPHIE' : 'AUTRE';
  const safeName = (n) => n.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9._-]+/g, '_').replace(/_+/g, '_').slice(-80) || 'fichier';
  async function sha256Hex(buf) { const h = await crypto.subtle.digest('SHA-256', buf); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }

  const CSS = `.go{font-size:14px;line-height:1.5;color:#0F1B2D}.go *{box-sizing:border-box}
  .go-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.go-tabs button{border:1px solid #DCE3EC;background:#fff;color:#0A1628;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  .go-tabs button.on{background:#0A1628;color:#fff;border-color:#0A1628;box-shadow:inset 0 -3px 0 #C9A227}.go-tabs .n{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:9px;background:#C9A227;color:#0A1628;font-size:11px;font-weight:700}
  .go-sec{border:1px solid #DCE3EC;border-radius:8px;padding:14px 16px;margin:0 0 14px;background:#fff}.go-sec h3{margin:0 0 8px;font-size:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
  .go-sec h4{margin:12px 0 6px;font-size:14px}.go-note{color:#5A6B83;font-size:12.5px;margin:6px 0}.go-eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8A6B0E;font-weight:600}
  .go-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 14px}.go-tile{border:1px solid #DCE3EC;border-radius:8px;padding:10px 12px;background:#fff;border-top:3px solid #C9A227}.go-tile .v{font-size:22px;font-weight:700;color:#0A1628}.go-tile .l{font-size:12px;color:#5A6B83}.go-tile.alert{border-top-color:#B42318}
  .go-tw{overflow-x:auto}.go table{border-collapse:collapse;width:100%;font-size:13px}.go th{text-align:left;border-bottom:1px solid #DCE3EC;padding:6px 8px;font-size:11.5px;color:#5A6B83;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}.go td{padding:6px 8px;border-bottom:1px solid #EEF2F6;vertical-align:top}
  .go-chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;background:#EEF2F6;color:#0F1B2D;white-space:nowrap}.go-chip.ok{background:#E3F4EA;color:#14653A}.go-chip.warn{background:#FFF4D6;color:#7A5A00}.go-chip.bad{background:#FDE7E5;color:#B42318}.go-chip.info{background:#E4EEFA;color:#1D5FA8}
  .go-btn{border:1px solid #0A1628;background:#fff;color:#0A1628;border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;font-weight:600}.go-btn.p{background:#0A1628;color:#fff}.go-btn.g{background:#C9A227;border-color:#C9A227;color:#0A1628}.go-btn.sm{padding:3px 8px;font-size:12px}.go-btn:disabled{opacity:.5;cursor:default}.go-btn.bad{border-color:#B42318;color:#B42318}
  .go-f{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;align-items:end;margin:8px 0}.go-f label{display:grid;gap:3px;font-size:12px;color:#5A6B83}.go-f .w{grid-column:1/-1}
  .go-in{width:100%;padding:7px 9px;border:1px solid #CBD5E1;border-radius:6px;font:inherit;font-size:13px;background:#fff;color:#0F1B2D}
  .go details{border:1px dashed #CBD5E1;border-radius:8px;padding:8px 12px;margin:10px 0}.go summary{cursor:pointer;font-weight:600;color:#0A1628}
  .go-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.go-muted{color:#5A6B83}.go-mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .go-drop{border:2px dashed #C9A227;border-radius:10px;padding:22px;text-align:center;background:#FFFBEF;cursor:pointer}.go-drop.over{background:#FFF1C2}
  .go-bar{height:10px;border-radius:5px;background:#EEF2F6;overflow:hidden}.go-bar>i{display:block;height:100%;background:#C9A227;width:0;transition:width .2s}
  .go-gap{height:8px;border-radius:4px;background:#EEF2F6;overflow:hidden;min-width:80px}.go-gap>i{display:block;height:100%;background:#14653A}
  .go-tree ul{list-style:none;margin:0;padding-left:16px;border-left:1px dotted #CBD5E1}.go-tree li{margin:3px 0}
  .go-msg{padding:8px 12px;border-radius:6px;margin:0 0 10px;font-size:13px}.go-msg.bad{background:#FDE7E5;color:#B42318}.go-msg.ok{background:#E3F4EA;color:#14653A}
  @media (max-width:640px){.go-f{grid-template-columns:1fr}}`;

  function mount(el, sb, cfg = {}) {
    if (!document.getElementById('go-css')) { const s = document.createElement('style'); s.id = 'go-css'; s.textContent = CSS; document.head.appendChild(s); }
    const C = { project: cfg.project || null, lockProject: !!cfg.project, tab: cfg.tab || 'dash', toast: cfg.toast, consoleUrl: cfg.consoleUrl };
    const st = { uid: null, roles: new Set(), me: null, steer: [], zm: [], teams: [], areas: [], emps: [], cache: {} };
    const has = (...r) => r.some(x => st.roles.has(x));
    const isDir = () => has('SUPER_ADMIN', 'DIRECTEUR');
    const isRH = () => isDir() || has('RESPONSABLE_RH');
    const manages = (p) => isDir() || st.steer.some(s => s.project_code === p && ['PILOTAGE', 'OPERATIONNEL'].includes(s.fonction));
    const inSteer = (p) => isDir() || st.steer.some(s => s.project_code === p);
    const zmTeams = () => new Set(st.teams.filter(t => st.zm.some(z => z.id === t.zone_manager_id)).map(t => t.id));
    const say = (t, bad) => { if (C.toast) return C.toast(t, bad); const m = el.querySelector('#go-msg'); if (m) { m.className = 'go-msg ' + (bad ? 'bad' : 'ok'); m.textContent = t; m.hidden = false; setTimeout(() => m.hidden = true, bad ? 9000 : 4000); } };
    async function rpc(fn, args = {}, ok) { const { data, error } = await sb.rpc(fn, args); if (error) { say(clean(error.message), true); throw error; } if (ok) say(ok); return data; }
    async function sel(t, cols = '*', f = (q) => q) { const { data, error } = await f(sb.from(t).select(cols)); if (error) { say(clean(error.message), true); return []; } return data || []; }
    const empName = (id) => { const e = st.emps.find(x => x.id === id); return e ? `${e.prenoms} ${e.nom}` : '—'; };
    const areaName = (id) => st.areas.find(a => a.id === id)?.nom || '—';
    const areaOpts = (cur, empty = 'Choisir une zone') => opt(st.areas.filter(a => a.actif && a.type !== 'PAYS' && a.type !== 'GROUPE_OPERATIONNEL').sort((a, b) => a.nom.localeCompare(b.nom, 'fr')).map(a => [a.id, a.nom + (a.type === 'ZONE_INDUSTRIELLE' ? ' (ZI)' : a.type === 'VILLE' ? '' : ' · ' + a.type.toLowerCase().replace(/_/g, ' '))]), cur, empty);
    const empOpts = (cur, empty = 'Choisir un employé') => opt(st.emps.filter(e => e.statut === 'ACTIF').sort((a, b) => (a.nom + a.prenoms).localeCompare(b.nom + b.prenoms, 'fr')).map(e => [e.id, `${e.nom} ${e.prenoms} — ${e.fonction} (${e.matricule})`]), cur, empty);
    const projOpts = (cur) => opt(Object.entries(PROJ), cur);

    async function loadBase() {
      const { data: u } = await sb.auth.getUser(); st.uid = u?.user?.id || null;
      const { data: me } = await sb.rpc('geci_me'); st.me = me; st.roles = new Set((me?.roles || []).filter(r => !r.client_id).map(r => r.role));
      [st.emps, st.areas] = await Promise.all([sel('geci_employees', '*'), sel('geci_areas', '*')]);
      st.myEmp = st.emps.find(e => e.user_id === st.uid && e.statut === 'ACTIF') || null;
      const [sm, zms, teams] = await Promise.all([
        sel('geci_steering_members', 'id,fonction,employee_id,date_fin,date_debut,intitule,steering_id,geci_steering_teams(project_code)'),
        sel('geci_zone_managers', '*'), sel('geci_teams', '*')]);
      st.allSteer = sm.map(x => ({ ...x, project_code: x.geci_steering_teams?.project_code }));
      st.allZm = zms; st.teams = teams;
      st.steer = st.myEmp ? st.allSteer.filter(x => x.employee_id === st.myEmp.id && !x.date_fin) : [];
      st.zm = st.myEmp ? zms.filter(x => x.employee_id === st.myEmp.id && !x.date_fin) : [];
      const n = await sel('geci_notifications', 'id', q => q.eq('lu', false)); st.unread = n.length;
    }

    const TABS = () => [
      ['dash', 'Tableau de bord', true], ['org', 'Organisation', true], ['missions', 'Missions et activités', true], ['preuves', 'Preuves et import', true],
      ['personnel', 'Personnel (RH)', true], ['zones', 'Zones et sites', true], ['notifs', 'Notifications', true], ['stockage', 'Stockage', has('SUPER_ADMIN', 'DIRECTEUR', 'RESPONSABLE_INFORMATIQUE', 'GESTIONNAIRE_DOCUMENTAIRE')]];

    async function show(tab) {
      C.tab = tab;
      el.innerHTML = `<div class="go"><div id="go-msg" class="go-msg" hidden></div>
        <div class="go-row" style="justify-content:space-between;margin:0 0 10px"><div><div class="go-eyebrow">IA GECI — Organisation GEC-CI</div>
        <div class="go-muted" style="font-size:12.5px">${C.lockProject ? 'Projet ' + esc(PROJ[C.project]) : 'Tous les projets'} · ${st.myEmp ? 'Vous : ' + esc(st.myEmp.prenoms + ' ' + st.myEmp.nom) : 'Compte non relié à une fiche du personnel'}</div></div>
        ${C.lockProject ? '' : `<label class="go-row go-muted" style="font-size:12.5px">Projet <select class="go-in" id="go-proj" style="width:auto">${opt(Object.entries(PROJ), C.project, 'Tous les projets')}</select></label>`}</div>
        <nav class="go-tabs">${TABS().filter(t => t[2]).map(([k, l]) => `<button data-t="${k}" class="${k === tab ? 'on' : ''}">${l}${k === 'notifs' && st.unread ? `<span class="n">${st.unread}</span>` : ''}</button>`).join('')}</nav>
        <div id="go-body"><p class="go-muted">Chargement…</p></div></div>`;
      el.querySelector('.go-tabs').onclick = (e) => { const b = e.target.closest('button[data-t]'); if (b) show(b.dataset.t); };
      const ps = el.querySelector('#go-proj'); if (ps) ps.onchange = () => { C.project = ps.value || null; show(C.tab); };
      const body = el.querySelector('#go-body');
      try { await V[tab](body); } catch (e) { console.error(e); body.innerHTML = `<div class="go-sec"><b>Affichage impossible</b><p class="go-note">${esc(clean(e.message))}</p></div>`; }
    }
    function ask(title, withText, required = true) {
      return new Promise((res) => { const o = document.createElement('div');
        o.style.cssText = 'position:fixed;inset:0;background:rgba(10,22,40,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px';
        o.innerHTML = `<div class="go" style="background:#fff;border-radius:10px;max-width:440px;width:100%;padding:16px;border-top:4px solid #C9A227"><p style="margin:0 0 10px;font-weight:600">${esc(title)}</p>${withText ? '<textarea class="go-in" rows="3" id="ask-t"></textarea>' : ''}<div class="go-row" style="justify-content:flex-end;margin-top:10px"><button class="go-btn" id="ask-n">Annuler</button><button class="go-btn p" id="ask-y">Confirmer</button></div></div>`;
        document.body.appendChild(o); const t = o.querySelector('#ask-t'); if (t) t.focus();
        const end = (v) => { o.remove(); res(v); };
        o.querySelector('#ask-n').onclick = () => end(null);
        o.querySelector('#ask-y').onclick = () => { if (!withText) return end(true); const v = t.value.trim(); if (required && !v) { t.style.borderColor = '#B42318'; return; } end(v || ''); }; });
    }
    const reload = async () => { await loadBase(); show(C.tab); };
    const V = {};

    /* ---------- TABLEAU DE BORD (par niveau) ---------- */
    V.dash = async (b) => {
      if (!st.roles.size) { b.innerHTML = `<div class="go-sec"><b>Aucun rôle interne GEC-CI sur ce compte.</b><p class="go-note">L’organisation (équipes, zones, personnel, preuves internes) est réservée au personnel de GEC-CI. Demandez un rôle à la Direction${C.consoleUrl ? ` depuis la <a href="${C.consoleUrl}" target="_blank" rel="noopener">console IA GECI ↗</a>` : ''}.</p></div>`; return; }
      let d; try { d = await rpc('geci_org_dashboard', { p_project: C.project }); } catch (e) { b.innerHTML = `<div class="go-sec">${esc(clean(e.message))}</div>`; return; }
      const P = d.projets || [];
      const tot = (f) => P.reduce((a, p) => a + f(p), 0);
      const eqs = P.flatMap(p => p.equipes.map(t => ({ ...t, projet: p.projet })));
      const sous = eqs.filter(t => t.effectif < t.effectif_cible);
      const niveau = isDir() ? 'Direction générale' : st.steer.length ? 'Pilotage (siège)' : st.zm.length ? 'Responsable de zone' : st.myEmp ? 'Collaborateur' : 'Personnel';
      const myTeams = st.myEmp ? await sel('geci_team_members', 'id,team_id,role_equipe,statut,date_debut', q => q.eq('employee_id', st.myEmp.id).is('date_fin', null)) : [];
      const myActs = st.myEmp ? await sel('geci_activity_assignments', 'activity_id,role,geci_activities(titre,statut,date_prevue,service_code)', q => q.eq('employee_id', st.myEmp.id)) : [];
      b.innerHTML = `<div class="go-sec"><h3>Vue ${esc(niveau)} <span class="go-muted" style="font-size:12px;font-weight:400">Données réelles, filtrées par le serveur selon vos droits</span></h3>
        <div class="go-tiles">
          <div class="go-tile"><div class="v">${d.effectif_total}</div><div class="l">Personnel actif enregistré</div></div>
          <div class="go-tile"><div class="v">${d.disponibles}</div><div class="l">Disponibles sans équipe</div></div>
          <div class="go-tile ${tot(p => p.pilotage_postes_vacants) ? 'alert' : ''}"><div class="v">${tot(p => p.pilotage_postes_vacants)}</div><div class="l">Postes de pilotage vacants</div></div>
          <div class="go-tile"><div class="v">${eqs.length}</div><div class="l">Équipes opérationnelles</div></div>
          <div class="go-tile ${sous.length ? 'alert' : ''}"><div class="v">${sous.length}</div><div class="l">Équipes sous l’effectif cible</div></div>
          <div class="go-tile"><div class="v">${tot(p => p.missions.actives)}</div><div class="l">Missions actives</div></div>
          <div class="go-tile ${tot(p => p.missions.en_retard) ? 'alert' : ''}"><div class="v">${tot(p => p.missions.en_retard)}</div><div class="l">Missions en retard</div></div>
          <div class="go-tile ${tot(p => p.missions.sans_equipe) ? 'alert' : ''}"><div class="v">${tot(p => p.missions.sans_equipe)}</div><div class="l">Missions sans équipe</div></div>
          <div class="go-tile"><div class="v">${tot(p => p.preuves.A_VERIFIER || 0)}</div><div class="l">Preuves à vérifier</div></div>
          <div class="go-tile"><div class="v">${tot(p => p.preuves.A_CLASSER || 0)}</div><div class="l">Preuves à classer</div></div>
          <div class="go-tile"><div class="v">${d.zones_sans_equipe}</div><div class="l">Villes / ZI sans équipe</div></div>
          <div class="go-tile"><div class="v">${d.notifications_non_lues}</div><div class="l">Notifications non lues</div></div>
        </div>
        ${P.length ? `<div class="go-tw"><table><thead><tr><th>Projet</th><th>Pilotage (3)</th><th>Resp. de zone</th><th>Équipes</th><th>Effectif réel / cible</th><th>Missions actives</th><th>En retard</th><th>Preuves à vérifier</th></tr></thead><tbody>
        ${P.map(p => { const ef = p.equipes.reduce((a, t) => a + Number(t.effectif), 0), ci = p.equipes.reduce((a, t) => a + Number(t.effectif_cible), 0);
          return `<tr><td><b>${esc(p.nom)}</b></td><td>${3 - p.pilotage_postes_vacants} / 3 ${p.pilotage_postes_vacants ? chip(p.pilotage_postes_vacants + ' vacant(s)', 'warn') : chip('complet', 'ok')}</td><td>${p.responsables_zone.length}</td><td>${p.equipes.length}</td>
          <td>${ef} / ${ci || '—'} ${ci ? `<div class="go-gap"><i style="width:${Math.min(100, Math.round(ef / ci * 100))}%"></i></div>` : ''}</td><td>${p.missions.actives}</td><td>${p.missions.en_retard ? chip(p.missions.en_retard, 'bad') : 0}</td><td>${p.preuves.A_VERIFIER || 0}</td></tr>`; }).join('')}</tbody></table></div>` : '<p class="go-note">Aucun projet dans votre périmètre.</p>'}
        ${sous.length ? `<h4>Équipes à compléter</h4><p class="go-note">${sous.map(t => `${esc(t.code)} (${esc(t.zone)}) : ${t.effectif}/${t.effectif_cible}${t.propositions ? ' · ' + t.propositions + ' proposition(s) en attente' : ''}`).join(' · ')}</p>` : ''}
        <p class="go-note">L’effectif cible (13 par défaut) est un objectif d’organisation, pas une obligation : les écarts sont signalés, jamais comblés automatiquement.</p></div>
        ${st.myEmp ? `<div class="go-sec"><h3>Mes affectations</h3>
          <p>${st.steer.map(s => chip('Pilotage ' + s.project_code + ' · ' + FCT[s.fonction], 'info')).join(' ')} ${st.zm.map(z => chip('Responsable de zone ' + z.project_code + ' · ' + areaName(z.area_id), 'info')).join(' ')}
          ${myTeams.map(m => { const t = st.teams.find(x => x.id === m.team_id); return chip((t?.code || 'Équipe') + ' · ' + (ROLE_EQ[m.role_equipe] || m.role_equipe) + (m.statut === 'PROPOSEE' ? ' (proposée)' : ''), m.statut === 'VALIDEE' ? 'ok' : 'warn'); }).join(' ') || ''}
          ${!st.steer.length && !st.zm.length && !myTeams.length ? '<span class="go-muted">Aucune affectation active.</span>' : ''}</p>
          ${myActs.length ? `<div class="go-tw"><table><thead><tr><th>Activité</th><th>Prévue</th><th>Statut</th></tr></thead><tbody>${myActs.map(a => `<tr><td>${esc(a.geci_activities?.titre)}</td><td>${dfr(a.geci_activities?.date_prevue)}</td><td>${chip(ACT_L[a.geci_activities?.statut] || '', a.geci_activities?.statut === 'REALISEE' ? 'ok' : '')}</td></tr>`).join('')}</tbody></table></div>` : ''}</div>` : ''}`;
    };

    /* ---------- ORGANISATION : pilotage 3 → responsables de zone → équipes 13+ ---------- */
    V.org = async (b) => {
      const projs = C.project ? [C.project] : Object.keys(PROJ);
      const tm = await sel('geci_team_members', '*', q => q.is('date_fin', null).neq('statut', 'REFUSEE'));
      const html = projs.map(p => {
        const sm = st.allSteer.filter(x => x.project_code === p && !x.date_fin);
        const zms = st.allZm.filter(x => x.project_code === p && !x.date_fin);
        const tms = st.teams.filter(t => t.project_code === p && t.statut !== 'DISSOUTE');
        const can = manages(p);
        return `<div class="go-sec"><h3>${esc(PROJ[p])} <span class="go-row">${can ? `<button class="go-btn sm" data-rec="${p}">Recommandation d’affectation</button>` : ''}</span></h3>
        <h4>Équipe de pilotage au siège (3 fonctions)</h4>
        <div class="go-tw"><table><thead><tr><th>Fonction</th><th>Titulaire</th><th>Depuis</th>${isDir() ? '<th>Nommer / remplacer</th>' : ''}</tr></thead><tbody>
        ${Object.entries(FCT).map(([f, l]) => { const x = sm.find(s => s.fonction === f);
          return `<tr><td><b>${l}</b></td><td>${x ? esc(empName(x.employee_id)) : chip('Poste vacant', 'warn')}</td><td>${x ? dfr(x.date_debut) : '—'}</td>

            ${zmOk && t.statut === 'ACTIVE' ? `<form class="go-f" data-add="${t.id}"><label>Ajouter un membre<select class="go-in" name="e" required>${empOpts(null)}</select></label><label>Rôle<select class="go-in" name="r">${opt(Object.entries(ROLE_EQ), 'AGENT')}</select></label><button class="go-btn p">${can ? 'Affecter (validé)' : 'Proposer au pilotage'}</button></form>` : ''}
            ${can ? `<details><summary>Modifier l’équipe</summary><form class="go-f" data-tupd="${t.id}"><label>Nom<input class="go-in" name="n" value="${esc(t.nom)}"></label><label>Zone<select class="go-in" name="a">${areaOpts(t.area_id)}</select></label>
              <label>Responsable de zone<select class="go-in" name="z">${opt(zms.map(z => [z.id, empName(z.employee_id) + ' — ' + areaName(z.area_id)]), t.zone_manager_id, 'Aucun')}</select></label><label>Effectif cible<input class="go-in" type="number" min="1" name="c" value="${t.effectif_cible}"></label>
              <label>Référent technique<select class="go-in" name="rt">${empOpts(t.referent_technique_id, 'Aucun')}</select></label><label>Statut<select class="go-in" name="s">${opt([['ACTIVE', 'Active'], ['SUSPENDUE', 'Suspendue'], ['DISSOUTE', 'Dissoute']], t.statut)}</select></label>
              <label class="w">Objectifs<input class="go-in" name="o" value="${esc(t.objectifs || '')}"></label><button class="go-btn p">Enregistrer</button></form></details>` : ''}
          </details>`; }).join('') : '<p class="go-note">Aucune équipe pour ce projet.</p>'}
        ${can ? `<details><summary>Créer une équipe ${esc(p)}</summary><form class="go-f" data-tnew="${p}"><label>Nom<input class="go-in" name="n" required placeholder="Équipe ${esc(p)} Soubré 1"></label><label>Zone<select class="go-in" name="a" required>${areaOpts(null)}</select></label>
          <label>Responsable de zone<select class="go-in" name="z">${opt(zms.map(z => [z.id, empName(z.employee_id) + ' — ' + areaName(z.area_id)]), null, 'À désigner')}</select></label><label>Effectif cible<input class="go-in" type="number" min="1" name="c" value="13"></label>
          <label class="w">Objectifs<input class="go-in" name="o"></label><button class="go-btn p">Créer l’équipe</button></form></details>` : ''}

      b.innerHTML = (st.emps.length ? '' : `<div class="go-sec"><b>Aucun employé enregistré.</b><p class="go-note">Commencez par l’onglet « Personnel (RH) » : saisissez ou importez les fiches réelles du personnel de GEC-CI. Aucune fiche n’est créée automatiquement.</p></div>`) + html;
      b.querySelectorAll('form[data-steer]').forEach(f => f.onsubmit = async (e) => { e.preventDefault(); const [p, fc] = f.dataset.steer.split('|'); await rpc('geci_steering_set', { p_project: p, p_fonction: fc, p_employee: fd(f).e, p_intitule: FCT[fc] + ' ' + p }, 'Pilotage mis à jour (l’ancien titulaire reste dans l’historique)'); reload(); });

    };

    /* ---------- MISSIONS ET ACTIVITÉS ---------- */
    V.missions = async (b) => {
      const refs = C.project ? PREFS[C.project] : Object.values(PREFS).flat();
      const [ms, svc] = await Promise.all([sel('geci_missions', 'id,code,objet,statut,referentiel,date_fin_prevue,team_id,area_id,geci_clients(raison_sociale)', q => q.in('referentiel', refs).order('created_at', { ascending: false })), sel('geci_services', '*')]);
      const ids = ms.map(m => m.id);
      const acts = ids.length ? await sel('geci_activities', '*, geci_activity_assignments(employee_id,role)', q => q.in('mission_id', ids).order('created_at')) : [];
      const projOf = (r) => Object.keys(PREFS).find(k => PREFS[k].includes(r));
      b.innerHTML = `<div class="go-sec"><h3>${ms.length} mission(s) dans votre périmètre</h3><p class="go-note">Chaque mission est confiée à une équipe du même projet ; la zone est héritée de l’équipe. Les activités (prestations) sont planifiées puis affectées à des membres.</p>
      ${ms.length ? ms.map(m => { const p = projOf(m.referentiel); const t = st.teams.find(x => x.id === m.team_id); const A = acts.filter(a => a.mission_id === m.id);

        return `<details><summary><span class="go-mono">${esc(m.code)}</span> · ${esc(m.geci_clients?.raison_sociale || '')} · ${esc(m.objet)} · ${t ? chip(t.code, 'info') : chip('sans équipe', 'warn')} ${chip(m.statut)}</summary>
          <p class="go-note">Zone : ${esc(areaName(m.area_id))} · Fin prévue : ${dfr(m.date_fin_prevue)}</p>
          ${canLink ? `<form class="go-f" data-link="${m.id}"><label>Équipe responsable<select class="go-in" name="t">${opt(st.teams.filter(x => x.project_code === p && x.statut === 'ACTIVE').map(x => [x.id, x.code + ' — ' + x.nom + ' (' + areaName(x.area_id) + ')']), m.team_id, 'Aucune')}</select></label><button class="go-btn p">Confier la mission</button></form>` : ''}
          <h4>Activités (${A.length})</h4>
          ${A.length ? `<div class="go-tw"><table><thead><tr><th>Prestation</th><th>Activité</th><th>Prévue</th><th>Affectés</th><th>Statut</th><th></th></tr></thead><tbody>${A.map(a => `<tr><td>${esc(svc.find(s => s.code === a.service_code)?.libelle || a.service_code)}</td><td>${esc(a.titre)}</td><td>${dfr(a.date_prevue)}</td>
            <td>${(a.geci_activity_assignments || []).map(x => esc(empName(x.employee_id))).join(', ') || '—'}${canAct ? `<form class="go-row" data-aass="${a.id}" style="margin-top:4px"><select class="go-in" name="e" style="max-width:200px">${empOpts(null)}</select><button class="go-btn sm">Affecter</button></form>` : ''}</td>
            <td>${chip(ACT_L[a.statut], a.statut === 'REALISEE' ? 'ok' : a.statut === 'ANNULEE' ? 'bad' : '')}</td>
            <td><select class="go-in" data-ast="${a.id}" style="width:auto">${opt(Object.entries(ACT_L), a.statut)}</select></td></tr>`).join('')}</tbody></table></div>` : '<p class="go-note">Aucune activité.</p>'}
          ${canAct && !['CLOTUREE', 'ANNULEE'].includes(m.statut) ? `<form class="go-f" data-anew="${m.id}"><label>Prestation<select class="go-in" name="s">${opt(svc.filter(s => s.projets.includes(p)).map(s => [s.code, s.libelle]))}</select></label><label>Activité<input class="go-in" name="t" required placeholder="Inspection interne de 20 exploitations"></label><label>Date prévue<input class="go-in" type="date" name="d"></label><button class="go-btn p">Planifier</button></form>` : ''}
        </details>`; }).join('') : '<p class="go-note">Aucune mission. Les missions se créent dans la console IA GECI (clients → missions), puis se confient ici à une équipe.</p>'}</div>`;
      b.querySelectorAll('form[data-link]').forEach(f => f.onsubmit = async (e) => { e.preventDefault(); await rpc('geci_mission_link', { p_mission: f.dataset.link, p_team: nz(fd(f).t), p_area: null, p_site: null }, 'Mission confiée'); show('missions'); });

        try { await rpc('geci_activity_status', { p_activity: s.dataset.ast, p_statut: s.value, p_motif: m }, 'Statut mis à jour'); } catch (e) { } show('missions'); });
    };

    /* ---------- PREUVES : import individuel et groupé ---------- */
    V.preuves = async (b) => {
      const P = C.project || st.cache.evP || 'RA';
      const refs = PREFS[P];
      const [ms, evs, batches] = await Promise.all([
        sel('geci_missions', 'id,code,objet,referentiel,team_id', q => q.in('referentiel', refs).not('statut', 'in', '(CLOTUREE,ANNULEE)')),
        sel('geci_evidence_records', '*, geci_files(path,nom_original,mime,taille,sha256)', q => q.eq('project_code', P).order('created_at', { ascending: false }).limit(500)),

      const tms = st.teams.filter(t => t.project_code === P && t.statut === 'ACTIVE');

          <label>Collaborateur concerné<select class="go-in" name="e">${empOpts(null, 'Aucun')}</select></label>

          <label>Date de la preuve<input class="go-in" type="date" name="d"></label>
          <label>Catégorie<select class="go-in" name="c">${opt([['', 'Automatique (selon le type de fichier)'], ...CATS.map(c => [c, c])])}</select></label>

        </form>
        <div class="go-drop" id="ev-drop" tabindex="0" role="button">Déposez les fichiers ici ou <b>cliquez pour choisir</b> (sélection multiple, dossiers d’images acceptés)<input type="file" id="ev-in" multiple hidden></div>
        <div id="ev-q" style="margin-top:10px"></div></div>
        <div class="go-sec"><h3>Registre des preuves (${evs.length}) <span class="go-row"><select class="go-in" id="ev-f" style="width:auto">${opt(Object.entries(EV_L), filt, 'Tous les statuts')}</select><select class="go-in" id="ev-b" style="width:auto">${opt(batches.map(x => [x.id, x.titre]), st.cache.evB, 'Tous les lots')}</select></span></h3>
        <p class="go-note">Cycle : Importée → À classer (projet seul) → À vérifier (exigence renseignée) → Validée / Rejetée (décision humaine, jamais par l’auteur ni par l’IA) → Archivée. Une suggestion de l’IA n’est jamais appliquée automatiquement.</p>
        <div class="go-row" style="margin:6px 0"><button class="go-btn sm" id="ev-all">Tout sélectionner</button><span class="go-muted" id="ev-n">0 sélectionnée(s)</span></div>
        <form class="go-f" id="ev-bulk"><label>Exigence / article<input class="go-in" name="x"></label><label>Mission<select class="go-in" name="m">${opt(ms.map(m => [m.id, m.code]), null, '—')}</select></label><label>Équipe<select class="go-in" name="t">${opt(tms.map(t => [t.id, t.code]), null, '—')}</select></label><label>Catégorie<select class="go-in" name="c">${opt(CATS.map(c => [c, c]), null, '—')}</select></label><label>Date<input class="go-in" type="date" name="d"></label><button class="go-btn p">Compléter la sélection</button></form>
        <div class="go-tw"><table><thead><tr><th></th><th>Code</th><th>Titre</th><th>Fichier</th><th>Exigence</th><th>Rattachement</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="ev-t">
        ${evs.filter(r => (!filt || r.statut === filt) && (!st.cache.evB || r.batch_id === st.cache.evB)).map(r => { const mine = r.created_by === st.uid; return `<tr><td>${['VALIDEE', 'ARCHIVEE'].includes(r.statut) ? '' : `<input type="checkbox" data-sel="${r.id}">`}</td><td class="go-mono">${esc(r.code)}</td><td>${esc(r.titre)}<div class="go-muted" style="font-size:11.5px">${esc(r.categorie)}${r.suggestion_ia ? ' · suggestion IA : ' + esc(JSON.stringify(r.suggestion_ia)) : ''}</div></td>
          <td>${esc(r.geci_files?.nom_original)}<div class="go-muted go-mono">${oct(r.geci_files?.taille)} · ${esc((r.geci_files?.sha256 || '').slice(0, 10))}…</div></td><td>${esc(r.exigence_ref || '—')}</td>
          <td style="font-size:12px">${r.mission_id ? esc(ms.find(m => m.id === r.mission_id)?.code || 'mission') : ''} ${r.team_id ? esc(st.teams.find(t => t.id === r.team_id)?.code || '') : ''} ${r.area_id ? esc(areaName(r.area_id)) : ''}</td>

    async function runImport(P, files) {
      if (!files.length) return;
      const q = el.querySelector('#ev-q'); const meta = fd(el.querySelector('#ev-meta'));
      const rows = files.map((f, i) => ({ i, f, st: f.size > MAXF ? 'ERREUR' : 'EN ATTENTE', msg: f.size > MAXF ? 'Fichier supérieur à 50 Mo : le compresser ou le scinder' : '' }));
      let done = 0;
      const paint = () => { const ok = rows.filter(r => r.st === 'IMPORTÉE').length, du = rows.filter(r => r.st === 'DOUBLON').length, er = rows.filter(r => r.st === 'ERREUR').length;
        q.innerHTML = `<div class="go-row" style="justify-content:space-between"><b>${done}/${rows.length} traité(s)</b><span class="go-muted">${ok} importée(s) · ${du} doublon(s) · ${er} échec(s)</span></div><div class="go-bar"><i style="width:${Math.round(done / rows.length * 100)}%"></i></div>
        <div class="go-tw" style="max-height:280px;overflow:auto;margin-top:8px"><table><thead><tr><th>Fichier</th><th>Taille</th><th>État</th><th>Détail</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.f.name)}</td><td>${oct(r.f.size)}</td><td>${chip(r.st, r.st === 'IMPORTÉE' ? 'ok' : r.st === 'ERREUR' ? 'bad' : r.st === 'DOUBLON' ? 'warn' : 'info')}</td><td style="font-size:12px">${esc(r.msg)}</td></tr>`).join('')}</tbody></table></div>
        ${done === rows.length && er ? '<button class="go-btn sm" id="ev-retry" style="margin-top:8px">Relancer les fichiers en échec</button>' : ''}${done === rows.length ? ' <button class="go-btn sm p" id="ev-see" style="margin-top:8px">Voir le registre</button>' : ''}`;
        const rt = q.querySelector('#ev-retry'); if (rt) rt.onclick = () => runImport(P, rows.filter(r => r.st === 'ERREUR' && r.f.size <= MAXF).map(r => r.f));
        const se = q.querySelector('#ev-see'); if (se) se.onclick = () => show('preuves'); };
      done = rows.filter(r => r.st === 'ERREUR').length; paint();
      let batch = null;
      if (meta.lot || rows.length > 1) { try { batch = await rpc('geci_evidence_batch_create', { p_project: P, p_titre: meta.lot || ('Import du ' + new Date().toLocaleString('fr-FR')), p_mission: nz(meta.m) }); } catch (e) { rows.forEach(r => { if (r.st === 'EN ATTENTE') { r.st = 'ERREUR'; r.msg = clean(e.message); } }); done = rows.length; return paint(); } }
      const now = new Date(); const yy = now.getFullYear(), mm = String(now.getMonth() + 1).padStart(2, '0');
      const work = rows.filter(r => r.st === 'EN ATTENTE');
      const one = async (r) => {
        try {
          r.st = 'EMPREINTE'; paint(); const sha = await sha256Hex(await r.f.arrayBuffer());
          const path = `${P}/${yy}/${mm}/${sha}__${safeName(r.f.name)}`;
          r.st = 'ENVOI'; paint();
          const up = await sb.storage.from('geci-preuves').upload(path, r.f, { upsert: false, contentType: r.f.type || 'application/octet-stream' });
          let existed = false;
          if (up.error) { if (/exist|duplicate|409/i.test(up.error.message + (up.error.statusCode || ''))) existed = true; else throw up.error; }
          r.st = 'ENREGISTREMENT'; paint();
          const reg = await sb.rpc('geci_file_register', { p_path: path, p_nom: r.f.name, p_mime: r.f.type || null, p_taille: r.f.size, p_sha256: sha, p_project: P });
          if (reg.error) throw reg.error;
          const dup = reg.data.doublon_de || (existed ? reg.data.file_id : null);
          if (dup && !meta.dup) { r.st = 'DOUBLON'; r.msg = 'Contenu identique déjà importé dans ce projet : preuve non recréée'; return; }
          const ev = await sb.rpc('geci_evidence_create', { p_file: reg.data.file_id, p_titre: r.f.name.replace(/\.[^.]+$/, ''), p_categorie: meta.c || catOf(r.f.type || '', r.f.name), p_description: null,
            p_batch: batch, p_mission: nz(meta.m), p_team: nz(meta.t), p_employee: nz(meta.e), p_area: nz(meta.a), p_exigence: nz(meta.x), p_date: nz(meta.d), p_referentiel: nz(meta.r), p_suggestion: null });
          if (ev.error) throw ev.error;
          r.st = 'IMPORTÉE'; r.msg = meta.x ? 'À vérifier' : 'À classer (exigence à renseigner)';
        } catch (e) { r.st = 'ERREUR'; r.msg = clean(e.message || String(e)); }
        finally { done++; paint(); }
      };
      const pool = 3; let k = 0;
      await Promise.all(Array.from({ length: Math.min(pool, work.length) }, async () => { while (k < work.length) await one(work[k++]); }));
      say(`Import terminé : ${rows.filter(r => r.st === 'IMPORTÉE').length} importée(s), ${rows.filter(r => r.st === 'DOUBLON').length} doublon(s), ${rows.filter(r => r.st === 'ERREUR').length} échec(s)`, rows.some(r => r.st === 'ERREUR'));
    }

        ${rh || self ? `<h4>Données personnelles (accès restreint)</h4><form class="go-f" id="ed-p"><label>Téléphone personnel<input class="go-in" name="t" value="${esc(pv.telephone_perso || '')}" ${rh ? '' : 'disabled'}></label><label>E-mail personnel<input class="go-in" name="e" value="${esc(pv.email_perso || '')}" ${rh ? '' : 'disabled'}></label><label>Adresse<input class="go-in" name="a" value="${esc(pv.adresse || '')}" ${rh ? '' : 'disabled'}></label><label>Référence pièce d’identité<input class="go-in" name="p" value="${esc(pv.piece_identite_ref || '')}" ${rh ? '' : 'disabled'}></label><label>Contact d’urgence<input class="go-in" name="u" value="${esc(pv.contact_urgence || '')}" ${rh ? '' : 'disabled'}></label>${rh ? `<label class="w">Notes RH<input class="go-in" name="n" value="${esc(pv.notes_rh || '')}"></label><button class="go-btn">Enregistrer</button>` : ''}</form><p class="go-note">Ne collecter que les données nécessaires (principe de minimisation) — déclaration ARTCI : À CONFIRMER AUPRÈS DE L’ORGANISME COMPÉTENT AVANT MISE EN ŒUVRE OU AUDIT.</p>` : ''}</div>`;
      box.scrollIntoView({ behavior: 'smooth', block: 'start' });
      const reopen = async () => { const esk2 = await sel('geci_employee_skills', '*'); empDetail(box, id, sk, esk2, ez); };
      box.querySelector('#ed-x').onclick = () => box.innerHTML = '';
      bindEmpForm(box);
      const f1 = box.querySelector('#ed-sk'); if (f1) f1.onsubmit = async (ev) => { ev.preventDefault(); const d = fd(f1); await rpc('geci_skill_set', { p_employee: id, p_skill: d.s, p_niveau: Number(d.n), p_justificatif: nz(d.j) }, 'Compétence déclarée'); reopen(); };
      box.querySelectorAll('[data-skv]').forEach(x => x.onclick = async () => { await rpc('geci_skill_verify', { p_id: x.dataset.skv }, 'Compétence vérifiée'); reopen(); });
      const f2 = box.querySelector('#ed-z'); if (f2) f2.onsubmit = async (ev) => { ev.preventDefault(); const d = fd(f2); await rpc('geci_employee_zone_assign', { p_employee: id, p_area: d.a, p_project: nz(d.p), p_principal: !!d.pr, p_debut: null }, 'Affectation géographique enregistrée'); reopen(); };
      box.querySelectorAll('[data-zend]').forEach(x => x.onclick = async () => { const m = await ask('Motif de fin d’affectation :', true, false); await rpc('geci_employee_zone_end', { p_id: x.dataset.zend, p_fin: null, p_motif: m }, 'Affectation close'); reopen(); });
      const f3 = box.querySelector('#ed-r'); if (f3) f3.onsubmit = async (ev) => { ev.preventDefault(); const d = fd(f3); const file = f3.querySelector('input[type=file]').files[0]; let fid = null;
        if (file) { if (file.size > MAXF) return say('Fichier supérieur à 50 Mo.', true); const sha = await sha256Hex(await file.arrayBuffer()); const n = new Date();
          const path = `RH/${n.getFullYear()}/${String(n.getMonth() + 1).padStart(2, '0')}/${sha}__${safeName(file.name)}`;
          const up = await sb.storage.from('geci-preuves').upload(path, file, { upsert: false, contentType: file.type || 'application/octet-stream' }); if (up.error && !/exist|duplicate/i.test(up.error.message)) return say(clean(up.error.message), true);
          fid = (await rpc('geci_file_register', { p_path: path, p_nom: file.name, p_mime: file.type || null, p_taille: file.size, p_sha256: sha, p_project: null })).file_id; }
        await rpc('geci_employee_record_add', { p_employee: id, p_type: d.t, p_titre: d.ti, p_organisme: nz(d.o), p_debut: nz(d.d1), p_fin: nz(d.d2), p_file: fid, p_confidentiel: !!d.c || ['CONTRAT', 'DOCUMENT_ADMINISTRATIF'].includes(d.t) }, 'Élément ajouté au dossier'); reopen(); };
      box.querySelectorAll('[data-rf]').forEach(x => x.onclick = async () => { const [f] = await sel('geci_files', 'path', q => q.eq('id', x.dataset.rf)); if (!f) return; const { data, error } = await sb.storage.from('geci-preuves').createSignedUrl(f.path, 120); if (error) return say(clean(error.message), true); window.open(data.signedUrl, '_blank', 'noopener'); });
      const f4 = box.querySelector('#ed-p'); if (f4 && rh) f4.onsubmit = async (ev) => { ev.preventDefault(); const d = fd(f4); await rpc('geci_employee_private_set', { p_employee: id, p_tel: nz(d.t), p_email: nz(d.e), p_adresse: nz(d.a), p_piece: nz(d.p), p_urgence: nz(d.u), p_notes: nz(d.n) }, 'Données personnelles enregistrées'); };
    }
    function parseCSV(txt) {
      const first = txt.split(/\r?\n/)[0] || ''; const sep = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
      const rows = []; let row = [], cur = '', q = false;
      for (let i = 0; i < txt.length; i++) { const c = txt[i];
        if (q) { if (c === '"') { if (txt[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
        else if (c === '"') q = true; else if (c === sep) { row.push(cur); cur = ''; } else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; } else if (c !== '\r') cur += c; }
      if (cur || row.length) { row.push(cur); rows.push(row); }
      return rows.filter(r => r.some(x => x.trim()));
    }
    const isoDate = (s) => { s = (s || '').trim(); if (!s) return null; let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/); if (m) return s; m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; return 'X'; };
    async function csvImport(file, out) {
      if (!file) return; const rows = parseCSV((await file.text()).replace(/^﻿/, ''));
      if (rows.length < 2) { out.innerHTML = '<p class="go-msg bad">Fichier vide ou sans ligne de données.</p>'; return; }
      const h = rows[0].map(x => x.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z_]/g, ''));
      const need = ['matricule', 'nom', 'prenoms', 'fonction']; const miss = need.filter(n => !h.includes(n));
      if (miss.length) { out.innerHTML = `<p class="go-msg bad">Colonnes obligatoires absentes : ${miss.join(', ')}</p>`; return; }
      const data = rows.slice(1).map((r, i) => { const o = { _l: i + 2 }; h.forEach((k, j) => o[k] = (r[j] || '').trim()); const pb = [];
        need.forEach(n => { if (!o[n]) pb.push(n + ' manquant'); }); if (isoDate(o.date_entree) === 'X') pb.push('date illisible');
        if (o.type_contrat && !['CDI', 'CDD', 'STAGE', 'PRESTATAIRE', 'CONSULTANT_EXTERNE', 'AUTRE'].includes(o.type_contrat.toUpperCase())) pb.push('type de contrat inconnu');
        o._pb = pb; o._dup = st.emps.find(e => e.matricule === o.matricule); return o; });
      const ok = data.filter(o => !o._pb.length);
      out.innerHTML = `<p class="go-note">${data.length} ligne(s) · ${ok.length} valide(s) · ${data.length - ok.length} à corriger · ${ok.filter(o => o._dup).length} mise(s) à jour de fiches existantes</p>
        <div class="go-tw" style="max-height:260px;overflow:auto"><table><thead><tr><th>Ligne</th><th>Matricule</th><th>Nom</th><th>Fonction</th><th>Contrôle</th></tr></thead><tbody>${data.map(o => `<tr><td>${o._l}</td><td class="go-mono">${esc(o.matricule)}</td><td>${esc(o.nom + ' ' + o.prenoms)}</td><td>${esc(o.fonction)}</td><td>${o._pb.length ? chip(o._pb.join(', '), 'bad') : o._dup ? chip('mise à jour', 'info') : chip('nouvelle fiche', 'ok')}</td></tr>`).join('')}</tbody></table></div>
        ${ok.length ? `<button class="go-btn p" id="csv-go" style="margin-top:8px">Importer les ${ok.length} ligne(s) valide(s)</button>` : ''}<div id="csv-res"></div>`;
      const g = out.querySelector('#csv-go'); if (g) g.onclick = async () => { g.disabled = true; let n = 0; const errs = [];
        for (const o of ok) { const { error } = await sb.rpc('geci_employee_upsert', { p_id: o._dup?.id || null, p_matricule: o.matricule, p_nom: o.nom, p_prenoms: o.prenoms, p_fonction: o.fonction, p_departement: nz(o.departement), p_type_contrat: o.type_contrat ? o.type_contrat.toUpperCase() : (o._dup?.type_contrat || null), p_date_entree: isoDate(o.date_entree), p_email_pro: nz(o.email_pro), p_tel_pro: nz(o.telephone_pro), p_responsable: o._dup?.responsable_id || null, p_statut: o._dup?.statut || 'ACTIF', p_disponibilite: o._dup?.disponibilite || 'DISPONIBLE', p_user_email: nz(o.email_compte) });
          if (error) errs.push(`Ligne ${o._l} : ${clean(error.message)}`); else n++; out.querySelector('#csv-res').textContent = `${n}/${ok.length} importée(s)…`; }
        out.querySelector('#csv-res').innerHTML = `<p class="go-msg ${errs.length ? 'bad' : 'ok'}">${n} fiche(s) importée(s).${errs.length ? '<br>' + errs.map(esc).join('<br>') : ''}</p>`; await loadBase(); };
    }

    /* ---------- ZONES ET SITES ---------- */
    V.zones = async (b) => {

    };

    /* ---------- NOTIFICATIONS ---------- */
    V.notifs = async (b) => {
      const ns = await sel('geci_notifications', '*', q => q.order('created_at', { ascending: false }).limit(200));
      b.innerHTML = `<div class="go-sec"><h3>Notifications (${ns.filter(n => !n.lu).length} non lue(s)) ${ns.some(n => !n.lu) ? '<button class="go-btn sm" id="nt-all">Tout marquer comme lu</button>' : ''}</h3>

    };

    return (async () => { el.innerHTML = '<div class="go"><p class="go-muted">Chargement de l’organisation GEC-CI…</p></div>'; try { await loadBase(); } catch (e) { el.innerHTML = `<div class="go"><div class="go-sec">${esc(clean(e.message))}</div></div>`; return; } await show(C.tab); return { show, reload }; })();
  }
  return { mount, PROJ, PREFS };
})();

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtD = (d) => d ? new Date(d).toLocaleDateString('fr-FR') : '—';
const fmtDT = (d) => d ? new Date(d).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const fcfa = (n) => n == null ? '—' : Number(n).toLocaleString('fr-FR') + ' F CFA';
let sb, S = { user: null, me: null, roles: new Set(), clientRoles: [], page: 'dash', arg: null, profiles: {} };
const has = (...r) => r.some(x => S.roles.has(x));
const staff = () => has('SUPER_ADMIN','DIRECTEUR','RESPONSABLE_CERTIFICATION','CONSULTANT','AUDITEUR_INTERNE','AGENT_TERRAIN','RESPONSABLE_FINANCE','RESPONSABLE_RH','RESPONSABLE_PILOTAGE','RESPONSABLE_TECHNIQUE','RESPONSABLE_OPERATIONNEL','RESPONSABLE_ZONE','CHEF_EQUIPE','GESTIONNAIRE_DOCUMENTAIRE','RESPONSABLE_INFORMATIQUE');

function toast(t, bad) { const el = $('#toast'); el.textContent = t; el.className = 'toast' + (bad ? ' bad' : ''); el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, bad ? 9000 : 4000); }
const clean = (m) => String(m || '').replace(/^GECI-ACCES-REFUSE : /, 'Accès refusé : ').replace(/^(GECI-[A-Z-]+) : /, '$1 · ');
async function rpc(fn, args = {}, okMsg) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) { toast(clean(error.message), true); throw error; }
  if (okMsg) toast(okMsg); return data;
}
async function sel(table, cols = '*', f = (q) => q) {
  const { data, error } = await f(sb.from(table).select(cols));
  if (error) { toast(clean(error.message), true); return []; }
  return data || [];
}
const name = (id) => id ? (S.profiles[id]?.nom || id.slice(0, 8)) : '—';
async function loadProfiles() { if (!staff()) return; (await sel('geci_profiles', 'user_id,nom,fonction,actif,est_compte_ia')).forEach(p => S.profiles[p.user_id] = p); }
function formData(f) { const o = {}; new FormData(f).forEach((v, k) => { o[k] = typeof v === 'string' ? v.trim() : v; }); f.querySelectorAll('input[type=checkbox]').forEach(c => o[c.name] = c.checked); return o; }
const nz = (v) => (v === '' || v == null) ? null : v;

const STAT = ['CREEE','QUALIFIEE','AUTORISEE','EN_COURS','EN_REVUE','VALIDEE','LIVREE','CLOTUREE'];
const STAT_L = { CREEE: 'Créée', QUALIFIEE: 'Qualifiée', AUTORISEE: 'Autorisée', EN_COURS: 'En cours', EN_REVUE: 'En revue', VALIDEE: 'Validée', LIVREE: 'Livrée', CLOTUREE: 'Clôturée', ANNULEE: 'Annulée' };
const chipStat = (s) => `<span class="chip ${s === 'CLOTUREE' || s === 'LIVREE' ? 'ok' : s === 'ANNULEE' ? 'bad' : s === 'EN_REVUE' || s === 'VALIDEE' ? 'info' : s === 'CREEE' ? '' : 'warn'}">${STAT_L[s] || s}</span>`;
const chip = (t, k = '') => `<span class="chip ${k}">${esc(t)}</span>`;
const REF = { RAINFOREST_ALLIANCE: 'Rainforest Alliance', FAIRTRADE: 'Fairtrade', RSPO: 'RSPO', HEVEA: 'Hévéa', ISO_9001: 'ISO 9001', ISO_14001: 'ISO 14001', ISO_45001: 'ISO 45001', ISO_22000: 'ISO 22000', PME: 'PME', JURIDIQUE: 'Juridique', FORMATION: 'Formation', AUTRE: 'Autre' };
const PARC = { A_COOPERATIVE: 'A · Coopérative', B_INDUSTRIE: 'B · Industrie', C_PME: 'C · PME / artisan', INTERNE: 'Interne GEC-CI' };
const opts = (o, cur) => Object.entries(o).map(([k, v]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${esc(v)}</option>`).join('');
const ROLES = { SUPER_ADMIN: 'Super administrateur', DIRECTEUR: 'Direction', RESPONSABLE_CERTIFICATION: 'Responsable certification', CONSULTANT: 'Consultant', AUDITEUR_INTERNE: 'Auditeur interne', AGENT_TERRAIN: 'Agent de terrain', RESPONSABLE_FINANCE: 'Finance', RESPONSABLE_RH: 'RH', RESPONSABLE_PILOTAGE: 'Responsable de pilotage', RESPONSABLE_TECHNIQUE: 'Responsable technique', RESPONSABLE_OPERATIONNEL: 'Responsable opérationnel', RESPONSABLE_ZONE: 'Responsable de zone', CHEF_EQUIPE: 'Chef d’équipe', GESTIONNAIRE_DOCUMENTAIRE: 'Gestionnaire documentaire', RESPONSABLE_INFORMATIQUE: 'Responsable informatique', CLIENT: 'Client / coopérative', PRESTATAIRE: 'Prestataire' };

/* ---------------- Authentification ---------------- */
function authShell(inner) {
  $('#app').innerHTML = `<div class="auth"><div><div class="card"><div class="brand"><img src="${LOGO}" alt="GEC-CI"></div><div class="body">${inner}</div></div>
  <p class="foot">IA GECI · Enterprise OS · GROUPE EXPERTISE CONSULTING-CI · « La satisfaction, notre priorité »<br>Accès réservé aux comptes autorisés. Toute action est journalisée.</p></div></div>`;
}
function loginView() {
  authShell(`<h1 style="font-size:19px">Connexion</h1><p class="note">Clients, missions, contrats, preuves et validations de GEC-CI.</p>
  <form id="lf" class="f" style="grid-template-columns:1fr"><label>Adresse e-mail<input class="inp" type="email" id="l-email" name="email" autocomplete="email" required></label>
  <label>Mot de passe<input class="inp" type="password" id="l-pass" name="password" minlength="8" autocomplete="current-password" required></label>
  <div id="lmsg" class="small muted"></div>
  <button class="btn primary" type="submit">Se connecter</button>
  <button class="btn" type="button" id="l-up">Créer un compte</button>
  <button class="btn sm" type="button" id="l-reset">Mot de passe oublié</button></form>`);
  const v = () => ({ email: $('#l-email').value.trim(), password: $('#l-pass').value });
  const m = (t) => $('#lmsg').textContent = t;
  $('#lf').onsubmit = async (e) => { e.preventDefault(); m('Connexion…'); const { error } = await sb.auth.signInWithPassword(v());
    if (error) m(/confirm/i.test(error.message) ? 'Adresse non confirmée : ouvrez le lien reçu par e-mail.' : /fetch|network|load failed/i.test(error.message) ? 'Serveur IA GECI injoignable depuis cette page : ouvrez la console depuis le site des plateformes GEC-CI ou vérifiez Internet.' : 'E-mail ou mot de passe incorrect.'); else boot(); };
  $('#l-up').onclick = async () => { const x = v(); if (!x.email || x.password.length < 8) return m('Saisissez un e-mail et un mot de passe de 8 caractères minimum.');
    const o = /^https?:/.test(location.protocol) ? { emailRedirectTo: location.href.split('#')[0] } : {};
    const { data, error } = await sb.auth.signUp({ ...x, options: o });
    if (error) return m(/registered/i.test(error.message) ? 'Ce compte existe déjà : connectez-vous.' : 'Création impossible : ' + error.message);
    if (data.session) boot(); else m('Compte créé. Confirmez votre adresse via le lien reçu par e-mail, puis connectez-vous. Un rôle doit ensuite vous être attribué par la Direction.'); };
  $('#l-reset').onclick = async () => { const x = v(); if (!x.email) return m('Saisissez d’abord votre e-mail.');
    const o = /^https?:/.test(location.protocol) ? { redirectTo: location.href.split('#')[0] } : {};
    await sb.auth.resetPasswordForEmail(x.email, o); m('Si ce compte existe, un e-mail de réinitialisation a été envoyé.'); };
}
function noRoleView() {

  authShell(`<h1 style="font-size:19px">Compte sans rôle</h1>
  <p class="note">Connecté : <b>${esc(S.user.email)}</b>. Aucun rôle ne vous est encore attribué : vous ne voyez aucune donnée. Transmettez cette adresse au SUPER_ADMIN ou à la Direction de GEC-CI.</p>

  <form id="bf" class="f" style="grid-template-columns:1fr"><label>Code à usage unique<input class="inp mono" id="b-code" name="code" placeholder="GECI-XXXXXX-XXXXXX-XXXXXX-XXXXXX" required></label>

const NAV = () => [
  ['Pilotage', [['dash', 'Tableau de bord', true]]],
  ['Activité', [['clients', 'Clients', true], ['missions', 'Missions', true], ['docs', 'Documents (GED)', true], ['incidents', 'Incidents et réclamations', true]]],
  ['Organisation GEC-CI', [['o_dash', 'Tableau de bord par niveau', staff()], ['o_org', 'Pilotage, zones et équipes', staff()], ['o_missions', 'Missions et activités (équipes)', staff()], ['o_preuves', 'Preuves et import', staff()], ['o_personnel', 'Personnel (RH)', staff()], ['o_zones', 'Zones et sites', staff()], ['o_notifs', 'Notifications', staff()], ['o_stockage', 'Stockage', has('SUPER_ADMIN','DIRECTEUR','RESPONSABLE_INFORMATIQUE','GESTIONNAIRE_DOCUMENTAIRE')]]],
  ['Conformité GEC-CI', [['regl', 'Registre réglementaire', staff()], ['recette', 'Recette du système', has('DIRECTEUR','SUPER_ADMIN')]]],
  ['Plateformes GEC-CI', [['plateformes', 'Portail, plateformes et sites', true]]],
  ['Sécurité', [['users', 'Utilisateurs et rôles', has('DIRECTEUR','SUPER_ADMIN')], ['journal', 'Journal d’audit', has('DIRECTEUR','SUPER_ADMIN')], ['backup', 'Sauvegardes', has('DIRECTEUR','SUPER_ADMIN')], ['profil', 'Mon profil', true]]],
];
function shell() {
  const roleTxt = [...S.roles].map(r => ROLES[r]).join(' · ') + (S.clientRoles.length ? (S.roles.size ? ' · ' : '') + S.clientRoles.map(r => ROLES[r.role]).join(' · ') : '');
  $('#app').innerHTML = `<div class="app"><aside class="rail" id="rail"><img src="${LOGO}" alt="GEC-CI — Groupe Expertise Consulting-CI">
  <div class="row mobbar" style="justify-content:space-between"><span class="small">IA GECI</span><button class="btn sm" id="menu">Menu</button></div>
  <nav class="nav" id="nav">${NAV().map(([g, items]) => { const vis = items.filter(i => i[2]); return vis.length ? `<div class="grp">${g}</div>` + vis.map(([k, l]) => `<button data-p="${k}" class="${S.page === k ? 'on' : ''}">${l}</button>`).join('') : ''; }).join('')}</nav>
  <div class="who"><b>${esc(S.me?.profil?.nom || S.user.email)}</b>${esc(roleTxt)}<div class="row" style="margin-top:8px"><button class="btn sm" id="out">Déconnexion</button></div><p class="small" style="margin:10px 0 0"><a href="https://claude.ai/artifact/UGZh5c7UgKHHGZRWnxewzr" target="_blank" rel="noopener">Portail GEC-CI PRO ↗</a></p></div></aside>
  <main class="main" id="main"></main></div>`;
  $('#nav').onclick = (e) => { const b = e.target.closest('button[data-p]'); if (b) go(b.dataset.p); };
  $('#menu').onclick = () => $('#rail').classList.toggle('open');
  $('#out').onclick = async () => { await sb.auth.signOut(); location.reload(); };
}
async function go(p, arg = null) {
  S.page = p; S.arg = arg; try { localStorage.setItem('geci-page', p); } catch (e) { }
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  $('#rail').classList.remove('open');
  const m = $('#main'); m.innerHTML = '<p class="muted">Chargement…</p>';
  try { await (PAGES[p] || PAGES.dash)(m, arg); } catch (e) { console.error(e); if (!m.innerHTML || m.innerHTML.includes('Chargement')) m.innerHTML = `<div class="sec"><b>Affichage impossible</b><p class="note">${esc(clean(e.message))}</p></div>`; }
  window.scrollTo(0, 0);
}
const head = (eb, t, p, right = '') => `<div class="top"><div><div class="eyebrow">${eb}</div><h1>${t}</h1>${p ? `<p>${p}</p>` : ''}</div><div class="row">${right}</div></div>`;

/* ---------------- Pages ---------------- */
const PAGES = {};

PAGES.dash = async (m) => {
  const d = await rpc('geci_dashboard');
  const ms = await sel('geci_missions', 'id,code,objet,statut,referentiel,date_fin_prevue,client_id,geci_clients(raison_sociale)', q => q.order('updated_at', { ascending: false }).limit(8));
  const ecart = Number(d.contractuel_signe_ht) - Number(d.encaisse_ht);
  m.innerHTML = head('Pilotage', 'Tableau de bord', 'Chiffres calculés en direct dans votre périmètre d’accès. Le chiffre d’affaires signé, facturé et encaissé sont distincts.') +
  `<div class="tiles">
    <div class="tile"><div class="n">${d.clients}</div><div class="l">Clients visibles</div></div>
    <div class="tile"><div class="n">${Object.entries(d.missions_par_statut).filter(([k]) => !['CLOTUREE','ANNULEE'].includes(k)).reduce((a, [, v]) => a + v, 0)}</div><div class="l">Missions actives</div></div>
    <div class="tile ${d.missions_en_retard ? 'alert' : ''}"><div class="n">${d.missions_en_retard}</div><div class="l">Missions en retard</div></div>
    <div class="tile"><div class="n">${d.livrables_a_valider}</div><div class="l">Livrables à valider</div></div>
    <div class="tile"><div class="n">${d.preuves_a_revoir}</div><div class="l">Preuves à revoir</div></div>
    <div class="tile ${d.incidents_ouverts ? 'alert' : ''}"><div class="n">${d.incidents_ouverts}</div><div class="l">Incidents ouverts</div></div>
    <div class="tile ${d.factures_echues ? 'alert' : ''}"><div class="n">${d.factures_echues}</div><div class="l">Factures échues</div></div>
    <div class="tile"><div class="n">${d.reglementaire_a_confirmer}</div><div class="l">Obligations « à confirmer »</div></div>
  </div>
  ${has('DIRECTEUR','RESPONSABLE_FINANCE') ? `<div class="sec"><h2>Finances (HT)</h2><div class="kv"><dt>Signé (contrats)</dt><dd>${fcfa(d.contractuel_signe_ht)}</dd><dt>Facturé</dt><dd>${fcfa(d.facture_ht)}</dd><dt>Encaissé</dt><dd>${fcfa(d.encaisse_ht)}</dd><dt>Reste à encaisser</dt><dd>${fcfa(ecart)}</dd></dl><p class="note">Un acompte encaissé n’est pas un bénéfice : il finance les prestations encore dues.</p></div>` : ''}
  <div class="sec"><h2>Missions par statut</h2><div class="steps">${STAT.map(s => `<div title="${STAT_L[s]}">${STAT_L[s]}<br><b>${d.missions_par_statut[s] || 0}</b></div>`).join('')}</div></div>
  <div class="sec"><h2>Dernières missions <button class="btn sm" data-go="missions">Toutes les missions</button></h2>${missionTable(ms)}</div>`;
  m.querySelector('[data-go]').onclick = () => go('missions');
  bindMissionRows(m);
};

function missionTable(ms) {
  if (!ms.length) return `<p class="note">Aucune mission visible. ${has('DIRECTEUR','RESPONSABLE_CERTIFICATION','CONSULTANT') ? 'Créez d’abord un client, puis une mission depuis la page Missions.' : 'Les missions apparaissent ici dès qu’on vous y affecte.'}</p>`;
  return `<div class="tw"><table><thead><tr><th>Code</th><th>Client</th><th>Référentiel</th><th>Objet</th><th>Fin prévue</th><th>Statut</th></tr></thead><tbody>${ms.map(x => `<tr class="click" data-m="${x.id}"><td class="mono">${esc(x.code)}</td><td>${esc(x.geci_clients?.raison_sociale || '')}</td><td>${REF[x.referentiel]}</td><td>${esc(x.objet)}</td><td>${fmtD(x.date_fin_prevue)}</td><td>${chipStat(x.statut)}</td></tr>`).join('')}</tbody></table></div>`;
}
const bindMissionRows = (m) => m.querySelectorAll('tr[data-m]').forEach(tr => tr.onclick = () => go('mission', tr.dataset.m));

PAGES.clients = async (m) => {
  const cs = await sel('geci_clients', '*', q => q.order('created_at', { ascending: false }));
  const can = has('DIRECTEUR','RESPONSABLE_CERTIFICATION','CONSULTANT');
  m.innerHTML = head('Activité', 'Clients', 'Fiche maître unique par entité. Un client ne passe au statut « Validé » qu’avec son identification complète (forme juridique, immatriculation, localisation, contact).') +
  `<div class="sec"><h2>${cs.length} client(s)</h2>${cs.length ? `<div class="tw"><table><thead><tr><th>Code</th><th>Raison sociale</th><th>Type</th><th>Filière</th><th>Localisation</th><th>Statut</th></tr></thead><tbody>${cs.map(c => `<tr class="click" data-c="${c.id}"><td class="mono">${esc(c.code)}</td><td>${esc(c.raison_sociale)}</td><td>${esc(c.type_entite)}</td><td>${esc(c.filiere || '')}</td><td>${esc(c.localisation || '')}</td><td>${chip(c.statut, c.statut === 'VALIDE' || c.statut === 'ACTIF' ? 'ok' : c.statut === 'CLOS' ? '' : 'warn')}</td></tr>`).join('')}</tbody></table></div>` : '<p class="note">Aucun client dans votre périmètre.</p>'}
  ${can ? `<details class="add"><summary>Nouveau client ou prospect</summary><form id="cf" class="f">
    <label>Raison sociale<input class="inp" id="c-rs" name="raison" required></label>
    <label>Type<select class="inp" id="c-type" name="type"><option value="COOPERATIVE">Coopérative</option><option value="INDUSTRIE">Industrie</option><option value="PME">PME / artisan</option><option value="AUTRE">Autre</option></select></label>
    <label>Filière / activité<input class="inp" id="c-fil" name="filiere" placeholder="Cacao, hévéa, agroalimentaire…"></label>
    <label>Localisation<input class="inp" id="c-loc" name="loc" placeholder="Divo, Soubré…"></label>
    <label>Contact<input class="inp" id="c-cn" name="cn"></label><label>Téléphone<input class="inp" id="c-ct" name="ct" placeholder="+225…"></label>
    <label>E-mail<input class="inp" id="c-ce" name="ce" type="email"></label>
    <button class="btn primary">Créer le client</button></form></details>` : ''}</div>`;
  m.querySelectorAll('tr[data-c]').forEach(tr => tr.onclick = () => go('client', tr.dataset.c));
  const f = $('#cf'); if (f) f.onsubmit = async (e) => { e.preventDefault(); const d = formData(f);
    const id = await rpc('geci_create_client', { p_raison: d.raison, p_type: d.type, p_filiere: nz(d.filiere), p_localisation: nz(d.loc), p_contact_nom: nz(d.cn), p_contact_tel: nz(d.ct), p_contact_email: nz(d.ce) }, 'Client créé');
    go('client', id); };
};

PAGES.client = async (m, id) => {
  const [c] = await sel('geci_clients', '*', q => q.eq('id', id));
  if (!c) { m.innerHTML = '<div class="sec">Client introuvable ou hors de votre périmètre.</div>'; return; }
  const ms = await sel('geci_missions', 'id,code,objet,statut,referentiel,date_fin_prevue,geci_clients(raison_sociale)', q => q.eq('client_id', id).order('created_at', { ascending: false }));
  const can = staff() && (has('DIRECTEUR') || c.resp_commercial === S.user.id || c.created_by === S.user.id);
  const F = (k, l, t = 'text') => `<label>${l}<input class="inp" id="e-${k}" name="${k}" type="${t}" value="${esc(c[k] || '')}" ${can ? '' : 'disabled'}></label>`;
  m.innerHTML = head(`Client · <span class="mono">${esc(c.code)}</span>`, esc(c.raison_sociale), `${esc(c.type_entite)} · ${esc(c.filiere || '')} · ${esc(c.localisation || '')}`, chip(c.statut, c.statut === 'VALIDE' || c.statut === 'ACTIF' ? 'ok' : 'warn') + ` <button class="btn sm" id="back">Retour</button>`) +
  `<div class="sec"><h2>Identification</h2><form id="ef" class="f">${F('raison_sociale', 'Raison sociale')}${F('forme_juridique', 'Forme juridique (SCOOPS, COOP-CA, SA, SARL…)')}${F('rccm', 'Immatriculation (RCCM / registre des coopératives)')}${F('localisation', 'Localisation')}${F('filiere', 'Filière')}${F('contact_nom', 'Contact')}${F('contact_tel', 'Téléphone')}${F('contact_email', 'E-mail', 'email')}
  ${can ? `<label>Statut<select class="inp" id="e-statut" name="statut">${['PROSPECT','QUALIFIE','VALIDE','ACTIF','CLOS'].map(s => `<option ${s === c.statut ? 'selected' : ''}>${s}</option>`).join('')}</select></label><button class="btn primary">Enregistrer</button>` : ''}</form>
  <p class="note">Le passage à « VALIDE » est refusé par le serveur tant que l’identification est incomplète.</p></div>
  <div class="sec"><h2>Missions du client</h2>${missionTable(ms)}</div>`;
  $('#back').onclick = () => go('clients'); bindMissionRows(m);
  const f = $('#ef'); if (can) f.onsubmit = async (e) => { e.preventDefault(); await rpc('geci_update_client', { p_id: id, p: formData(f) }, 'Client mis à jour'); go('client', id); };
};

   <label>Début prévu<input class="inp" type="date" id="m-deb" name="deb"></label><label>Fin prévue<input class="inp" type="date" id="m-fin" name="fin"></label>
   <label class="chk"><input type="checkbox" id="m-reg" name="reg"> Activité réglementée (agrément ou habilitation requis)</label>

    const id = await rpc('geci_create_mission', { p_client: d.client, p_referentiel: d.ref, p_parcours: d.par, p_objet: d.objet, p_perimetre: nz(d.perimetre), p_reglementee: d.reg, p_debut: nz(d.deb), p_fin: nz(d.fin) }, 'Mission créée');
    go('mission', id); };

/* ---------- Dossier de mission ---------- */
PAGES.mission = async (m, id) => {
  const [x] = await sel('geci_missions', '*, geci_clients(id,code,raison_sociale,statut)', q => q.eq('id', id));
  if (!x) { m.innerHTML = '<div class="sec">Mission introuvable ou hors de votre périmètre.</div>'; return; }
  const [mem, regs, ctrs, invs, docs, evs, incs, hist, vals, trs] = await Promise.all([
