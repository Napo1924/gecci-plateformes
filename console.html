function docBlock(d, x, steer, valOf, trs) {
  const vs = (d.geci_document_versions || []).sort((a, b) => a.created_at < b.created_at ? 1 : -1);
  const cur = vs.find(v => v.id === d.version_courante);
  const v = cur && valOf ? valOf(cur.id) : null;
  const t = cur && trs ? trs.find(t => t.document_version_id === cur.id) : null;
  const canVal = x && (has('DIRECTEUR') || (has('RESPONSABLE_CERTIFICATION','CONSULTANT','AUDITEUR_INTERNE') && steer !== undefined));
  return `<div class="sec" style="background:var(--surface2);margin-bottom:10px" data-doc="${d.id}"><h2><span><span class="mono">${esc(d.code)}</span> · ${esc(d.titre)}</span><span class="row">${d.est_livrable ? chip('livrable', 'gold') : ''}${chip(d.confidentialite)}${chip(d.statut, d.statut === 'APPROUVE' ? 'ok' : d.statut === 'EN_REVUE' ? 'info' : 'warn')}${d.publie_client ? chip('publié au client', 'ok') : ''}</span></h2>
   ${vs.length ? `<div class="tw"><table><thead><tr><th>Version</th><th>Déposée</th><th>Auteur</th><th>Empreinte SHA-256</th><th>Note</th><th></th></tr></thead><tbody>${vs.map(v => `<tr><td><b>${esc(v.version)}</b>${v.id === d.version_courante ? ' ' + chip('courante', 'info') : ''}</td><td>${fmtDT(v.created_at)}</td><td>${esc(name(v.auteur))}</td><td class="mono">${esc((v.sha256 || '').slice(0, 16))}…</td><td>${esc(v.note_modification || '')}</td><td>${v.storage_path ? `<button class="btn sm" data-dl="${esc(v.storage_path)}" data-did="${d.id}" data-cli="${d.client_id || ''}">Ouvrir</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<p class="note small">Aucune version déposée.</p>'}
   ${cur && v ? `<p class="small">Dernière décision : ${chip(v.decision, v.decision === 'REJETE' ? 'bad' : 'ok')} par ${esc(name(v.valideur_id))} (${esc(v.valideur_fonction)}) le ${fmtDT(v.at)}${v.commentaire ? ' — ' + esc(v.commentaire) : ''}</p>` : ''}
   ${t ? `<p class="small">Transmis le ${fmtDT(t.at)} par ${t.canal} à ${esc(t.destinataire)} · preuve : ${esc(t.preuve)}</p>` : ''}
   ${staff() && x && !['CLOTUREE','ANNULEE','LIVREE','VALIDEE'].includes(x.statut) || staff() && !x ? `<div class="row" style="margin-top:8px">
     ${d.statut !== 'ARCHIVE' && d.statut !== 'REMPLACE' ? `<label class="btn sm" style="display:inline-flex;gap:6px;align-items:center">Déposer une version<input type="file" data-up="${d.id}" data-cli="${d.client_id || 'interne'}" hidden></label>` : ''}
     ${d.statut === 'PROJET' && cur ? `<button class="btn sm" data-rev="${d.id}">Soumettre à la revue</button>` : ''}
     ${d.statut === 'EN_REVUE' && cur && canVal && cur.auteur !== S.user.id ? `<button class="btn sm" data-val="${cur.id}" data-d="APPROUVE">Approuver</button><button class="btn sm" data-val="${cur.id}" data-d="APPROUVE_AVEC_RESERVES">Approuver avec réserves</button><button class="btn sm danger" data-val="${cur.id}" data-d="REJETE">Rejeter</button>` : ''}
     ${d.statut === 'EN_REVUE' && cur && cur.auteur === S.user.id ? '<span class="small muted">Vous êtes l’auteur de cette version : une autre personne habilitée doit la valider.</span>' : ''}
   </div>` : ''}
   ${x && d.statut === 'APPROUVE' && cur && steer && ['VALIDEE','EN_REVUE','LIVREE'].includes(x.statut) ? `<div class="row" style="margin-top:8px">${!t ? `<button class="btn sm" data-tr="${cur.id}">Enregistrer la transmission</button>` : ''}${d.confidentialite === 'PUBLIC_CLIENT' ? `<button class="btn sm" data-pub="${d.id}" data-v="${d.publie_client ? 0 : 1}">${d.publie_client ? 'Retirer de l’espace client' : 'Publier dans l’espace client'}</button>` : ''}</div>` : ''}
   <div class="docbox"></div></div>`;
}
async function sha256Hex(buf) { const h = await crypto.subtle.digest('SHA-256', buf); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }
function bindDocActions(m, re) {
  m.querySelectorAll('input[data-up]').forEach(inp => inp.onchange = async () => {
    const file = inp.files[0]; if (!file) return; const box = inp.closest('[data-doc]').querySelector('.docbox');
    box.innerHTML = `<form class="f" style="margin-top:8px"><label>Numéro de version<input class="inp" required placeholder="1.0"></label><label class="wide">Note de modification<input class="inp" placeholder="Version initiale"></label><button class="btn primary">Envoyer ${esc(file.name)}</button></form>`;
    box.querySelector('form').onsubmit = async (e) => { e.preventDefault(); const [ver, note] = [...e.target.querySelectorAll('input')].map(i => i.value.trim());
      toast('Calcul de l’empreinte et envoi…'); const hash = await sha256Hex(await file.arrayBuffer());
      const path = `${inp.dataset.cli}/${inp.dataset.up}/${ver.replace(/[^\w.-]/g, '_')}__${file.name.replace(/[^\w.-]/g, '_')}`;
      const { error } = await sb.storage.from('geci-ged').upload(path, file, { upsert: false });
      if (error) return toast('Envoi refusé : ' + clean(error.message), true);
      await rpc('geci_add_document_version', { p_document: inp.dataset.up, p_version: ver, p_storage_path: path, p_sha256: hash, p_note: nz(note) }, 'Version ' + ver + ' déposée'); re(); };
  });
  m.querySelectorAll('[data-dl]').forEach(b => b.onclick = async () => {
    const { data, error } = await sb.storage.from('geci-ged').createSignedUrl(b.dataset.dl, 120);
    if (error) return toast('Fichier indisponible : ' + clean(error.message), true);
    try { await sb.rpc('geci_log_access', { p_action: 'TELECHARGEMENT', p_objet_type: 'geci_documents', p_objet_id: b.dataset.did, p_client: b.dataset.cli || null }); } catch (e) { }
    const box = b.closest('[data-doc]').querySelector('.docbox'); box.innerHTML = `<p class="small">Lien valable 2 minutes : <a href="${data.signedUrl}" target="_blank" rel="noopener">ouvrir le fichier</a> (consultation journalisée).</p>`; });
  m.querySelectorAll('[data-rev]').forEach(b => b.onclick = async () => { await rpc('geci_submit_document_for_review', { p_document: b.dataset.rev }, 'Document soumis à la revue'); re(); });
  m.querySelectorAll('[data-val]').forEach(b => b.onclick = async () => {
    if (b.dataset.d === 'APPROUVE') { await rpc('geci_validate_document', { p_version: b.dataset.val, p_decision: 'APPROUVE' }, 'Version approuvée'); return re(); }
    const box = b.closest('[data-doc]').querySelector('.docbox'); box.innerHTML = `<form class="row" style="margin-top:8px"><input class="inp" required placeholder="Commentaire obligatoire" style="flex:1;min-width:200px"><button class="btn sm ${b.dataset.d === 'REJETE' ? 'danger' : ''}">Confirmer : ${b.dataset.d === 'REJETE' ? 'rejeter' : 'approuver avec réserves'}</button></form>`;
    box.querySelector('form').onsubmit = async (e) => { e.preventDefault(); await rpc('geci_validate_document', { p_version: b.dataset.val, p_decision: b.dataset.d, p_commentaire: e.target.querySelector('input').value }, 'Décision enregistrée'); re(); }; });
  m.querySelectorAll('[data-tr]').forEach(b => b.onclick = () => { const box = b.closest('[data-doc]').querySelector('.docbox');
    box.innerHTML = `<form class="f" style="margin-top:8px"><label>Canal<select class="inp"><option>EMAIL</option><option>REMISE_MAIN_PROPRE</option><option>PLATEFORME</option><option>COURRIER</option><option>WHATSAPP_PRO</option></select></label><label>Destinataire<input class="inp" required></label><label class="wide">Preuve (accusé de réception, décharge signée, capture)<input class="inp" required></label><button class="btn primary">Enregistrer</button></form>`;
    box.querySelector('form').onsubmit = async (e) => { e.preventDefault(); const [c, dd, p] = [...e.target.querySelectorAll('select,input')].map(i => i.value.trim());
      await rpc('geci_record_transmission', { p_version: b.dataset.tr, p_canal: c, p_destinataire: dd, p_preuve: p }, 'Transmission enregistrée'); re(); }; });
  m.querySelectorAll('[data-pub]').forEach(b => b.onclick = async () => { await rpc('geci_publish_to_client', { p_document: b.dataset.pub, p_publie: b.dataset.v === '1' }, b.dataset.v === '1' ? 'Publié dans l’espace client' : 'Retiré de l’espace client'); re(); });
}

function incTable(incs) {

function incForm(p) { return `<form id="${p}-if" class="f"><label>Type<select class="inp" id="${p}-t" name="t">${opts(staff() ? INC_T : { RECLAMATION_CLIENT: INC_T.RECLAMATION_CLIENT, QUALITE_LIVRABLE: INC_T.QUALITE_LIVRABLE })}</select></label><label>Gravité<select class="inp" id="${p}-g" name="g"><option>MINEURE</option><option>MAJEURE</option><option>CRITIQUE</option></select></label><label class="wide">Description factuelle<textarea class="inp" id="${p}-d" name="d" required></textarea></label><label class="wide">Mesure immédiate<input class="inp" id="${p}-m" name="m"></label><button class="btn primary">Déclarer</button></form>`; }
function bindIncForm(p, extra, re) { const f = $(`#${p}-if`); if (f) f.onsubmit = async (e) => { e.preventDefault(); const d = formData(f); await rpc('geci_report_incident', { p_type: d.t, p_gravite: d.g, p_description: d.d, p_mesure: nz(d.m), ...extra }, 'Incident déclaré'); re(); }; }
function bindIncActions(m, re) {

}

/* ---------------- Démarrage ---------------- */
async function boot() {
  const { data } = await sb.auth.getUser(); S.user = data.user;
  if (!S.user) return loginView();
  S.me = await rpc('geci_me');
  S.roles = new Set(S.me.roles.filter(r => !r.client_id).map(r => r.role));
  S.clientRoles = S.me.roles.filter(r => r.client_id).map(r => ({ role: r.role, client: r.client_id }));
  if (!S.roles.size && !S.clientRoles.length) return noRoleView();
  if (!S.me.profil?.actif && S.me.profil) return authShell('<h1 style="font-size:19px">Compte désactivé</h1><p class="note">Contactez le SUPER_ADMIN de GEC-CI.</p>');
  await loadProfiles();
  let p = 'dash'; try { p = localStorage.getItem('geci-page') || 'dash'; } catch (e) { }
  if (['mission','client'].includes(p) || !PAGES[p]) p = 'dash';
  S.page = p; shell(); go(p);
}
if (!window.supabase?.createClient) { authShell('<b>Connexion Internet requise</b><p class="note">La bibliothèque de connexion n’a pas pu être chargée. Vérifiez la connexion puis rechargez la page.</p>'); return; }
sb = window.supabase.createClient(URL_, KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
sb.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY') { authShell(`<b>Nouveau mot de passe</b><form id="np" class="f" style="grid-template-columns:1fr"><input class="inp" type="password" id="np-p" minlength="8" required><button class="btn primary">Enregistrer</button></form>`); $('#np').onsubmit = async (e) => { e.preventDefault(); await sb.auth.updateUser({ password: $('#np-p').value }); boot(); }; } });
boot().catch(e => { console.error(e); loginView(); });
})();
</script>
